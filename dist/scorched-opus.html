    amount = Math.max(1, Math.round(amount * Battle.multNow()));
    this.left = amount; this.t = 0; this.dur = 0.1;
    this.per = Math.max(1, Math.ceil(amount / (this.dur * 60)));
    const W = World.W;
    let x0 = clamp(Math.floor(x), 0, W - 1), y0 = Math.floor(y);
    while (y0 > World.top && World.isLand(x0, y0)) y0--;
    this.heap = []; this.seen = new Set(); this.n = 0;
    this.push(x0, y0);
    Sound.pos(x).dirt();
  }
  // max-heap on depth (y), first come first served among equals
  push(x, y) {
    const W = World.W;
    if (x < 0 || x >= W || y < World.top || y >= World.H) return;
    const i = y * W + x;
    if (this.seen.has(i) || World.land[i]) return;
    this.seen.add(i);
    const h = this.heap, e = { x, y, k: this.n++ };
    h.push(e);
    let c = h.length - 1;
    while (c > 0) { const p = (c - 1) >> 1; if (this.above(h[p], h[c])) break; [h[p], h[c]] = [h[c], h[p]]; c = p; }
  }
  above(a, b) { return a.y > b.y || (a.y === b.y && a.k < b.k); }
  pop() {
    const h = this.heap, top = h[0], last = h.pop();
    if (h.length) {
      h[0] = last;
      let c = 0;
      for (;;) {
        const l = c * 2 + 1, r = l + 1;
        let m = c;
        if (l < h.length && this.above(h[l], h[m])) m = l;
        if (r < h.length && this.above(h[r], h[m])) m = r;
        if (m === c) break;
        [h[m], h[c]] = [h[c], h[m]]; c = m;
      }
    }
    return top;
  }
  update(dt) {
    this.t += dt;
    const W = World.W;
    for (let k = 0; k < this.per && this.left > 0 && this.heap.length; k++) {
      const c = this.pop();
      const i = c.y * W + c.x;
      if (World.land[i]) continue;
      World.setPixel(i, World.dirtIndex(c.x, c.y));
      this.left--;
      this.push(c.x, c.y + 1); this.push(c.x - 1, c.y); this.push(c.x + 1, c.y); this.push(c.x, c.y - 1);
    }
    if (this.left <= 0 || !this.heap.length) { Battle.terrainChanged(); return false; }
    return true;
  }
  draw() {}
}

/* ------------------------------ liquids: napalm & liquid dirt ------------------------------ */
class Liquid {
  constructor(x, y, o) {
    const M = Battle.multNow();
    if (M !== 1) o = Object.assign({}, o, { amount: Math.max(1, Math.round(o.amount * M)) });
    this.o = o; this.owner = o.owner;
    this.napalm = o.napalm;
    this.parts = [];
    this.occ = new Set();
    this.toSpawn = o.amount;
    this.x = clamp(Math.floor(x), 0, World.W - 1);
    // start just above the ground where it hit
    let yy = Math.floor(y);
    while (yy > World.top && World.isLand(this.x, yy)) yy--;
    this.y = yy;
    this.phase = 'flow'; this.t = 0; this.burnT = 0;
    this.burnDur = o.napalm ? (o.hot ? 1.45 : 1.25) : 0;
    // 1.5: napalm runs downhill and fills the hollows at once (a tenth of a second), lowest first
    this.cells = o.napalm ? waterFill(this.x, this.y, o.amount) : null;
    this.seed = sirand(1, 1e9);
    this.spawnRate = o.napalm ? 400 : 700;
    this.vx = o.vx || 0;
    Sound.pos(this.x);
    if (o.napalm) Sound.crunch(0.5, 1800, 300, 0.5); else Sound.dirt();
  }
  free(x, y) {
    if (x < 0 || x >= World.W || y >= World.H) return false;
    if (y < World.top) return true;
    if (World.land[y * World.W + x]) return false;
    return !this.occ.has(y * World.W + x);
  }
  spawn(n) {
    for (let i = 0; i < n && this.toSpawn > 0; i++) {
      const splash = this.napalm ? 0.6 : 0.4;
      const p = {
        x: this.x + srand(-1, 1), y: this.y - srand(0, 2), fx: 0,
        vx: srand(-40, 40) * splash * World.W / 360 + this.vx * 0.1, vy: -srand(20, 60) * splash * World.ay,
        fly: true, side: 0, stuck: 0, dir: schance(0.5) ? 1 : -1, done: false, cx: 0, cy: 0
      };
      this.parts.push(p);
      this.toSpawn--;
    }
  }
  update(dt) {
    this.t += dt;
    if (this.phase === 'flow' && this.cells) {
      const per = Math.max(1, Math.ceil(this.cells.length / 6));
      for (let k = 0; k < per && this.cells.length; k++) {
        const c = this.cells.shift();
        this.parts.push({ x: c.x, y: c.y, cx: c.x, cy: c.y, fly: false, done: true, side: 0, stuck: 0, dir: 1 });
        this.occ.add(c.y * World.W + c.x);
      }
      this.toSpawn = 0;
      if (!this.cells.length) { this.phase = 'burn'; Sound.pos(this.x).crunch(this.burnDur * 0.8, 2600, 700, 0.35); }
      return true;
    }
    if (this.phase === 'flow') {
      if (this.toSpawn > 0) this.spawn(Math.ceil(this.spawnRate * dt));
      const g = Phys.g();
      let active = 0;
      for (const p of this.parts) {
        if (p.done) continue;
        if (p.fly) {
          p.vy += g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
          const ix = Math.floor(p.x), iy = Math.floor(p.y);
          if (ix < 0 || ix >= World.W) { p.done = true; p.gone = true; continue; }
          if (iy >= World.H - 1 || (iy >= World.top && !this.free(ix, iy))) {
            // land: settle into the nearest free cell above
            let yy = Math.min(iy, World.H - 1);
            while (yy > 0 && !this.free(ix, yy)) yy--;
            p.fly = false; p.cx = ix; p.cy = yy; this.occ.add(yy * World.W + ix);
          }
          active++;
          continue;
        }
        // cellular flow: down, diagonal, then sideways (limited) so pools form in hollows
        const W = World.W;
        const tryMove = (nx, ny) => {
          if (this.free(nx, ny)) {
            this.occ.delete(p.cy * W + p.cx); p.cx = nx; p.cy = ny; this.occ.add(ny * W + nx); return true;
          }
          return false;
        };
        let movedAny = false;
        const maxSide = this.napalm ? 30 : 60;
        for (let step = 0; step < 3; step++) {
          let moved = false;
          if (tryMove(p.cx, p.cy + 1)) moved = true;
          else if (tryMove(p.cx + p.dir, p.cy + 1)) moved = true;
          else if (tryMove(p.cx - p.dir, p.cy + 1)) { p.dir = -p.dir; moved = true; }
          else if (p.side < maxSide && tryMove(p.cx + p.dir, p.cy)) { p.side++; moved = true; }
          else if (p.side < maxSide && tryMove(p.cx - p.dir, p.cy)) { p.dir = -p.dir; p.side++; moved = true; }
          if (!moved) break;
          movedAny = true;
        }
        // a drop only comes to rest after it has been stuck for a while (others may move out of its way)
        if (movedAny) { p.stuck = 0; active++; }
        else if (++p.stuck > 25) p.done = true;
        else active++;
      }
      if (this.toSpawn <= 0 && (active === 0 || this.t > 6)) {
        if (this.napalm) { this.phase = 'burn'; Sound.pos(this.x).crunch(this.burnDur * 0.8, 2600, 700, 0.35); }
        else { this.solidify(); return false; }
      }
    } else if (this.phase === 'burn') {
      this.burnT += dt;
      // heat damage: deep pools next to a tank burn hottest
      const heat = this.o.heat;
      for (const t of Battle.tanks) {
        if (!t.alive) continue;
        let n = 0;
        for (const p of this.parts) {
          if (p.gone) continue;
          const dx = Math.abs(p.cx - t.x), dy = (t.y - p.cy) / World.ay;
          if (dx < t.w / 2 + 3 && dy > -4 && dy < t.hh / World.ay + 5) n++;
        }
        if (n > 0) Battle.damage(t, n * heat * 0.55 * dt, this.owner, { secondary: true, burn: true });
      }
      if (this.burnT >= this.burnDur) {
        for (const p of this.parts) if (!p.gone && chance(0.35)) World.scorch(p.cx, p.cy + 1, 1.5, 0.55);
        return false;
      }
    }
    return true;
  }
  solidify() {
    for (const p of this.parts) {
      if (p.gone) continue;
      const x = p.fly ? Math.floor(p.x) : p.cx, y = p.fly ? Math.floor(p.y) : p.cy;
      World.addPixel(x, y);
    }
    Battle.terrainChanged();
  }
  draw(s) {
    const burning = this.phase === 'burn';
    const tt = Math.floor(performance.now() / 70);
    const hot = this.o.hot;
    for (const p of this.parts) {
      if (p.gone) continue;
      const x = Math.floor(p.fly ? p.x : p.cx), y = Math.floor(p.fly ? p.y : p.cy);
      if (!this.napalm) { s.pset(x, y, vga(38, 24, 10)); continue; }
      if (!burning) { s.pset(x, y, vga(63, 12, 8)); continue; }   // 1.5: a red film the moment it lands
      s.pset(x, y, vga(63, 12, 8));
      if (hash2(x >> 2, y >> 2, this.seed) > 0.55) continue;
      // a flickering tongue of flame above the burning patches
      const life = clamp(1 - this.burnT / this.burnDur, 0, 1);
      const hgt = Math.max(1, Math.floor((2 + hash2(x, tt, 7) * (hot ? 10 : 7)) * (0.3 + 0.7 * life) * World.ay));
      for (let k = 0; k < hgt; k++) {
        const f = k / hgt;
        let idx = 7 - Math.floor(f * 6.5) - (hash2(x, k, tt) < 0.3 ? 1 : 0);
        if (!hot) idx = Math.min(idx, 6);
        const jx = f > 0.6 && hash2(x, tt, k) < 0.4 ? (hash2(k, x, tt) < 0.5 ? -1 : 1) : 0;
        s.pset(x + jx, y - k, FIRE[clamp(idx, 1, 7)]);
      }
    }
  }
}

/* ------------------------------ dirt charge spray ------------------------------ */
// Dirt Charge (1.5, measured from a recording): an upside-down cone of loose dirt opens upward
// from where it lands - about 41 degrees each side of vertical, half its cells filled - then hangs
// a moment and falls as ordinary dirt
class DirtSpray {
  constructor(x, y, r, spread, mult) {
    r *= Math.sqrt(Battle.multNow());
    this.x = Math.round(x); this.y = Math.floor(World.isLand(x, y) ? y - World.ay : y);
    this.h = r;                                   // height, in columns
    this.slope = Math.tan(spread * DEG);          // half-width per column of height
    this.dens = mult > 1 ? 0.7 : 0.48;
    this.seed = sirand(1, 1e9);
    this.t = 0; this.grow = 0.55; this.hold = 0.4; this.released = false;
    Sound.pos(x).crunch(0.6, 500, 100, 0.7);
  }
  // is there dirt in the cone's cell (x, y)?
  cell(x, y) { return hash2(x, y, this.seed) < this.dens && !World.isLand(x, y); }
  // rows of the cone shown so far (0..1)
  frac() { return clamp(this.t / this.grow, 0, 1); }
  each(fn) {
    const ay = World.ay, rows = Math.floor(this.h * ay * this.frac());
    for (let dy = 0; dy <= rows; dy++) {
      const y = this.y - dy;
      if (y < World.top) break;
      const hw = Math.floor(dy / ay * this.slope);
      for (let x = Math.max(0, this.x - hw); x <= Math.min(World.W - 1, this.x + hw); x++) if (this.cell(x, y)) fn(x, y);
    }
  }
  update(dt) {
    this.t += dt;
    if (!this.released && this.t >= this.grow + this.hold) {
      this.released = true;
      // the cone becomes loose dirt, and falls like any other
      this.each((x, y) => World.addPixel(x, y));
      Battle.terrainChanged();
      return false;
    }
    return true;
  }
  draw(s) {
    const W = World.W;
    this.each((x, y) => s.pset(x, y, World.pal[World.dirtIndex(x, y)]));
  }
}

/* ------------------------------ riot charge / blast ------------------------------ */
// Riot Charge / Blast (a wedge from the tank) and Riot Bombs (a full circle), as 1.5 does them
// (measured from recordings): a dark red field spreads out to full size, then a hole opens from
// the middle and sweeps outward, dissolving the dirt as it passes and leaving loose specks that
// fall once it has gone. Both stages take time in proportion to the area they cover.
class RiotWedge {
  constructor(x, y, r, a0, a1) {
    r *= Math.sqrt(Battle.multNow());
    this.x = x; this.y = y; this.r = r; this.a0 = a0; this.a1 = a1;
    this.full = a1 - a0 >= 359;
    const area = r * r * (this.full ? 360 : a1 - a0);
    this.growT = Math.max(0.08, area / 1.45e6);
    this.sweepT = Math.max(0.12, area / 0.95e6);
    this.t = 0; this.done = 0; this.seed = sirand(1, 1e9);
    Sound.pos(this.x).crunch(0.45 + this.growT * 0.5, 1600, 300, 0.7);
  }
  outer() { return this.r * clamp(this.t / this.growT, 0, 1); }
  inner() { return this.r * clamp((this.t - this.growT) / this.sweepT, 0, 1); }
  update(dt) {
    this.t += dt;
    const rr = this.inner();
    if (rr > this.done + 0.5 || (rr >= this.r && this.done < this.r)) {
      World.carveSector(this.x, this.y, rr, this.a0, this.a1, Math.max(0, this.done - 1), true, 0.06, this.seed, this.full);
      this.done = rr;
    }
    if (this.t >= this.growT + this.sweepT) {
      World.markUnstable(this.x - this.r - 1, this.x + this.r + 1);
      Battle.terrainChanged();
      return false;
    }
    return true;
  }
  inside(x, y) {
    const dx = x - this.x, dy = (this.y - y) / World.ay, d = Math.hypot(dx, dy);
    if (d > this.outer() || d < this.inner()) return -1;
    if (!this.full && !angleIn(Math.atan2(dy, dx) / DEG, this.a0, this.a1)) return -1;
    return d;
  }
  draw(s) {
    const R = this.outer(), ay = World.ay;
    if (R < 0.5) return;
    const x0 = Math.max(0, Math.floor(this.x - R)), x1 = Math.min(World.W - 1, Math.ceil(this.x + R));
    const y0 = Math.max(0, Math.floor(this.y - R * ay)), y1 = Math.min(World.H - 1, Math.ceil(this.y + R * ay));
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const d = this.inside(x, y);
        if (d < 0) continue;
        // dark red, combed with darker arcs
        const dark = (Math.floor(d * 1.3) % 3 === 0) && hash2(x, y, this.seed) < 0.55;
        s.buf[y * s.w + x] = dark ? vga(22, 7, 9) : vga(39, 14, 15);
      }
    }
  }
}

/* ------------------------------ energy weapons ------------------------------ */
class LaserBeam {
  constructor(tank, batteries) {
    this.tank = tank; this.b = batteries; this.t = 0; this.dur = 0.7 + batteries * 0.05;
    const m = tank.muzzle(0);
    this.x0 = m.x; this.y0 = m.y;
    const a = tank.angle * DEG, dx = Math.cos(a), dy = -Math.sin(a) * World.ay;
    // trace the beam until it leaves the screen or hits a Super Mag
    let x = m.x, y = m.y, stop = null;
    this.hitTanks = [];
    for (let i = 0; i < 4000; i++) {
      x += dx * 0.7; y += dy * 0.7;
      if (x < 0 || x >= World.W || y < 0 || y >= World.H) break;
      for (const t of Battle.tanks) {
        if (!t.alive || t === tank) continue;
        if (t.shield && t.shield.it.laserProof && t.inShield(x, y)) { stop = t; break; }
        if (t.contains(x, y, 1) && !this.hitTanks.includes(t)) this.hitTanks.push(t);
      }
      if (stop) break;
    }
    this.x1 = x; this.y1 = y;
    this.width = 1 + Math.floor(batteries / 3);
    this.cut = false;
    Sound.pos(this.x0).laser();
  }
  update(dt) {
    this.t += dt;
    if (!this.cut && this.t > 0.15) {
      this.cut = true;
      const n = Math.ceil(Math.hypot(this.x1 - this.x0, (this.y1 - this.y0) / World.ay));
      for (let i = 0; i <= n; i++) {
        const x = lerp(this.x0, this.x1, i / n), y = lerp(this.y0, this.y1, i / n);
        World.carveEllipse(x, y, this.width / 2 + 0.4, (this.width / 2 + 0.4) * World.ay);
      }
      const dmg = 12 + this.b * 11;
      for (const t of this.hitTanks) Battle.damage(t, dmg, this.tank, { primary: true, laser: true });
      Battle.terrainChanged();
    }
    return this.t < this.dur;
  }
  draw(s) {
    const flick = Math.floor(this.t * 30) & 1;
    const n = Math.ceil(Math.hypot(this.x1 - this.x0, this.y1 - this.y0));
    const w = this.width + 1;
    for (let i = 0; i <= n; i++) {
      const x = lerp(this.x0, this.x1, i / n), y = lerp(this.y0, this.y1, i / n);
      for (let k = -w; k <= w; k++) {
        const c = Math.abs(k) <= this.width / 2 ? vga(63, 63, 63) : (flick ? vga(63, 10, 10) : vga(63, 30, 50));
        if (Math.abs(Math.cos(this.tank.angle * DEG)) > 0.7) s.pset(x, y + k, c); else s.pset(x + k, y, c);
      }
    }
  }
}
// Plasma Blast (1.5, measured from a recording): a solid red disc swells around the tank behind the
// land - about 21 pixels of radius with no batteries at Normal scale, more with each one - fading bright to
// black and back as it grows, then pulsing quickly before it vanishes. Tanks it reaches are hit.
class PlasmaBlast {
  constructor(tank, batteries) {
    this.tank = tank; this.b = batteries; this.t = 0;
    this.R = (21 + batteries * 4) * scaleFactor();
    this.dmg = 35 + batteries * 18;
    this.grow = 3.7; this.dur = this.grow + 2.2;
    this.x = tank.cx; this.y = tank.cy;
    this.hit = new Set();
    Sound.pos(this.x).plasma();
  }
  radius() { return this.R * Math.pow(clamp(this.t / this.grow, 0, 1), 0.47); }
  // brightness 0..1: up, down to black and slowly back while it grows; then fast pulses
  bright() {
    const t = this.t;
    if (t < 0.3) return t / 0.3;
    if (t < 1.4) return 1 - (t - 0.3) / 1.1;
    if (t < this.grow) return (t - 1.4) / (this.grow - 1.4);
    const p = ((t - this.grow) / 0.66) % 1;
    return p < 0.5 ? 1 - p * 2 : (p - 0.5) * 2;
  }
  update(dt) {
    this.t += dt;
    const r = this.radius();
    for (const t of Battle.tanks) {
      if (!t.alive || t === this.tank || this.hit.has(t)) continue;
      const d = adist(this.x, this.y, t.cx, t.cy);
      if (d < r + t.w / 2) {
        this.hit.add(t);
        Battle.damage(t, this.dmg * (1 - d / (this.R + t.w / 2) * 0.6), this.tank, { primary: true });
      }
    }
    return this.t < this.dur;
  }
  draw(s) {
    const r = this.radius(), v = this.bright(), c = vga(63 * v, 0, 4 * v);
    const W = World.W, land = World.land, ay = World.ay;
    const y0 = Math.max(0, Math.floor(this.y - r * ay)), y1 = Math.min(World.H - 1, Math.ceil(this.y + r * ay));
    for (let y = y0; y <= y1; y++) {
      const dy = (y - this.y) / ay, q = r * r - dy * dy;
      if (q < 0) continue;
      const hw = Math.sqrt(q);
      const xa = Math.max(0, Math.round(this.x - hw)), xb = Math.min(W - 1, Math.round(this.x + hw));
      for (let x = xa; x <= xb; x++) if (!land[y * W + x]) s.pset(x, y, c);
    }
  }
}

/* ------------------------------ misc effects ------------------------------ */
class Spark {
  constructor(x, y, c) { this.x = x; this.y = y; this.c = c; this.t = 0; }
  update(dt) { this.t += dt; return this.t < 0.3; }
  draw(s) {
    const r = this.t * 20;
    for (let a = 0; a < 360; a += 45) s.pset(this.x + Math.cos(a * DEG) * r, this.y - Math.sin(a * DEG) * r * World.ay, this.c);
  }
}
class Ring {
  constructor(x, y, c) { this.x = x; this.y = y; this.c = c; this.t = 0; }
  update(dt) { this.t += dt; return this.t < 0.8; }
  draw(s) { const r = this.t * World.W * 0.4; s.ellipse(this.x, this.y, r, r * World.ay, this.c); }
}
class Lightning {
  constructor(tx, owner) {
    this.t = 0;
    const gy = World.surfaceY(clamp(Math.floor(tx), 0, World.W - 1));
    const target = Battle.tanks.find(t => t.alive && Math.abs(t.x - tx) < t.w / 2 + 1);
    const endY = target ? target.cy : gy;
    // (cosmetic randomness only: where it strikes came from the host)
    const zig = (x, y, toX, toY) => {
      const pts = [[x, y]];
      while (y < toY - 3) {
        y = Math.min(toY, y + rand(5, 12) * World.ay);
        x += rand(-5, 5) + (toX - x) * 0.18;
        pts.push([x, y]);
      }
      pts.push([toX, toY]);
      return pts;
    };
    const ph = World.H - World.top, y0 = Math.min(endY - 30 * World.ay, World.top + ph * rand(0.18, 0.45));
    const trunk = zig(tx + rand(-20, 20), y0, tx + rand(-3, 3), endY);
    this.strands = [trunk];
    for (let i = 0, n = irand(2, 5); i < n; i++) {
      const p = trunk[Math.floor(trunk.length * rand(0.25, 0.75))];
      this.strands.push(zig(p[0], p[1], tx + rand(-24, 24), endY + rand(-2, 2)));
    }
    this.pts = trunk;
    this.tx = tx; this.ty = endY; this.target = target; this.done = false;
    if (Gfx.modern) { Screen.flash = 0.7; Screen.flashColor = vga(50, 50, 63); }
    Battle.skyFlash = 0.35;
    Sound.pos(tx).thunder();
  }
  update(dt) {
    this.t += dt;
    if (!this.done && this.t > 0.08) {
      this.done = true;
      const dmg = Cfg.hostileEnvironment ? 35 : 0;
      Battle.spawn(new Explosion(this.tx, this.ty, 7, { dmg, owner: null, type: 'normal' }));
    }
    return this.t < 0.45;
  }
  draw(s) {
    if (this.t > 0.22 || (Math.floor(this.t * 25) & 1)) return;
    const c = vga(63, 63, 11);
    for (const pts of this.strands) for (let i = 1; i < pts.length; i++) s.line(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1], c);
  }

}
class Meteor {
  // x and vx come from the host's weather roll so every peer sees the same rock
  constructor(x, vx) {
    this.x = x; this.y = 0; this.t = 0;
    this.vx = vx; this.vy = World.H * 0.7;
    Toast.show('Incoming meteor!');
    Sound.pos(x).meteor();
  }
  update(dt) {
    this.t += dt;
    const n = 6;
    for (let i = 0; i < n; i++) {
      this.x += this.vx * dt / n; this.y += this.vy * dt / n;
      if (this.y >= World.H - 1 || World.isLand(this.x, this.y) || Battle.tanks.some(t => t.alive && t.contains(this.x, this.y))) {
        Battle.spawn(new Explosion(this.x, Math.min(this.y, World.H - 1), 12, { dmg: Cfg.hostileEnvironment ? 45 : 0, owner: null }));
        return false;
      }
      if (this.x < 0 || this.x >= World.W) return false;
    }
    return true;
  }
  draw(s) {
    for (let k = 0; k < 10; k++) s.pset(this.x - this.vx * k * 0.004, this.y - this.vy * k * 0.004, FIRE[7 - Math.min(7, k)]);
  }
}
// emergency helicopter (model G.N.A.T.) for retreating tanks
class Chopper {
  constructor(tank) {
    this.tank = tank; this.t = 0; this.side = tank.x < World.W / 2 ? -1 : 1;
    this.x = this.side < 0 ? -20 : World.W + 20; this.y = tank.top - 30 * World.ay;
    this.phase = 0; this.blown = false;
    Sound.pos(tank.x).chopper();
  }
  update(dt) {
    this.t += dt;
    const t = this.tank;
    if (this.phase === 0) {
      this.x += (t.x - this.x) * Math.min(1, dt * 2.5);
      this.y += ((t.top - 14 * World.ay) - this.y) * Math.min(1, dt * 2.5);
      if (Math.abs(this.x - t.x) < 1.5 && this.t > 0.6) { this.phase = 1; this.t = 0; }
    } else if (this.phase === 1) {
      if (this.t > 0.5) { this.phase = 2; this.t = 0; t.retreated = true; Sound.pos(t.x).chopper(); }
    } else {
      this.y -= 90 * World.ay * dt; this.x -= this.side * 80 * dt;
      if (!this.blown && this.t > 0.5) { this.blown = true; Battle.killTank(t, null, { retreat: true }); }
      if (this.y < -40) return false;
    }
    return true;
  }
  draw(s) {
    const spr = Icons.sprites.heli;
    s.blit(spr, this.x - 6, this.y - 8, { flip: this.side > 0, sy: Math.max(1, Math.round(World.ay)) });
    if (this.phase >= 1) s.vline(this.x, this.y, this.tank.top, vga(50, 50, 50));
  }
}

/* ---------- js/gates.js ---------- */
'use strict';
/* =====================================================================
   Sky Gates (Remastered, Landscape > Sky Gates): frames hung in the air
   between the tanks. A shell that flies through one is changed by it,
   once per gate:
     x2 / x3 / x5   the shell becomes 2, 3 or 5 shells, fanned out a little
                    (at most 15 from one shot, however many gates it meets)
     /2             half the damage and blast area (its bomblets, warheads
                    and hops inherit it)
     boost / brake  1.5x or half the speed
     portal         one way: in the blue frame, out of the orange one,
                    same heading and speed
   Gates are laid out at the start of a round from the shared seeded
   random numbers (so every machine agrees); with Gates Move: SHUFFLE the
   host lays them out again at each turn and sends them to everyone.
   ===================================================================== */

const GATE_KINDS = {
  x2: { m: 2, label: '×2', tag: 'X2', col: [96, 232, 128] },
  x3: { m: 3, label: '×3', tag: 'X3', col: [72, 214, 255] },
  x5: { m: 5, label: '×5', tag: 'X5', col: [255, 206, 64] },
  half: { m: 0.5, label: '÷2', tag: '/2', col: [255, 86, 86] },
  boost: { v: 1.5, label: 'BOOST', tag: 'FAST', col: [190, 120, 255] },
  brake: { v: 0.5, label: 'BRAKE', tag: 'SLOW', col: [255, 150, 60] },
  pin: { label: 'IN', tag: 'IN', col: [80, 150, 255] },
  pout: { label: 'OUT', tag: 'OUT', col: [255, 150, 40] },
  pg: { label: 'PORTAL', tag: 'PORT', col: [200, 200, 255] }   // Portal Gun ends (drawn in their owner's colour)
};
// how often each kind is picked (x2 and x3 are the common ones)
const GATE_WEIGHTS = [['x2', 30], ['x3', 30], ['x5', 5], ['half', 12], ['boost', 10], ['brake', 8], ['portal', 9]];

const Gates = {
  // rng(a, b): a uniform number in [a, b) - srand for the shared layout, rand on the host for shuffles
  place(rng) {
    const W = World.W, ay = World.ay;
    const picks = Cfg.skyGates === 'MANY' ? 6 : Cfg.skyGates === 'FEW' ? 3 : 0;
    if (!picks) return [];
    const tanks = Battle.tanks.filter(t => t.alive && !t.dying);
    let x0 = 30, x1 = W - 30;
    if (tanks.length >= 2) {
      const xs = tanks.map(t => t.x);
      const a = Math.min(...xs), b = Math.max(...xs);
      if (b - a > 90) { x0 = a + 20; x1 = b - 20; }
    }
    const out = [];
    let id = 1;
    const spot = h => {
      for (let tries = 0; tries < 60; tries++) {
        const x = Math.round(rng(x0, x1));
        if (tanks.some(t => Math.abs(t.x - x) < 24) || out.some(g => Math.abs(g.x - x) < 30)) continue;
        let ground = World.H;
        for (let dx = -6; dx <= 6; dx += 3) ground = Math.min(ground, World.surfaceY(clamp(x + dx, 0, W - 1)));
        const lo = World.top + h + 14 * ay, hi = ground - h - 16 * ay;
        if (hi <= lo) continue;
        const y = Math.round(rng(lo, hi));
        // never hung in rock (a cavern roof, an overhang)
        let clear = true;
        for (let yy = y - h; yy <= y + h && clear; yy += 2) for (const dx of [-3, 0, 3]) if (World.isLand(x + dx, yy)) { clear = false; break; }
        if (clear) return { x, y };
      }
      return null;
    };
    const weightSum = GATE_WEIGHTS.reduce((s, w) => s + w[1], 0);
    for (let n = 0; n < picks; n++) {
      let r = rng(0, weightSum), kind = 'x2';
      for (const [k, w] of GATE_WEIGHTS) { if ((r -= w) < 0) { kind = k; break; } }
      const h = Math.round(rng(13, 20) * ay);
      if (kind === 'portal') {
        const a = spot(h);
        if (!a) continue;
        out.push({ id: id++, k: 'pin', x: a.x, y: a.y, h });
        const inG = out[out.length - 1];
        let b = null;
        for (let tries = 0; tries < 8 && !b; tries++) { const s = spot(h); if (s && Math.abs(s.x - a.x) >= 70) b = s; }
        if (!b) { out.pop(); continue; }
        out.push({ id: id++, k: 'pout', x: b.x, y: b.y, h });
        inG.to = id - 1;
        continue;
      }
      const s = spot(h);
      if (s) out.push({ id: id++, k: kind, x: s.x, y: s.y, h });
    }
    return out;
  },
  // Portal Gun: a two-way pair, one end standing up at the top of the shot's arc (facing the way it
  // flew), the other lying flat just above where it came down (facing up). Through either end and
  // out of the other along that end's facing, at the same speed. One pair per player.
  portalShot(shot, x, y) {
    if (!shot.top) return;
    const ay = World.ay, owner = shot.owner, idx = owner && owner.p ? owner.p.idx : 0;
    let ax = clamp(shot.top.x, 8, World.W - 8), ayy = Math.max(shot.top.y, World.top + 18 * ay);
    while (ayy > World.top + 18 * ay && World.isLand(ax, ayy)) ayy -= 2;
    let gy = Math.floor(y);
    const bx = clamp(Math.round(x), 14, World.W - 14);
    while (gy > World.top && World.isLand(bx, gy)) gy--;
    const by = Math.max(World.top + 12 * ay, gy - 7 * ay);
    const col = [cR(owner.color), cG(owner.color), cB(owner.color)];
    const A = { id: 100 + idx * 2, k: 'pg', owner: idx, col, x: Math.round(ax), y: Math.round(ayy), h: Math.round(16 * ay), fx: shot.top.dir, fy: 0 };
    const B = { id: 101 + idx * 2, k: 'pg', owner: idx, col, x: bx, y: Math.round(by), w: 12, hz: true, fx: 0, fy: -1 };
    A.to = B.id; B.to = A.id;
    Battle.portals = (Battle.portals || []).filter(p => p.owner !== idx).concat([A, B]);
    A.flash = B.flash = performance.now();
    Sound.pos(x).beep(520, 0.12, 0.5); Sound.pos(x).beep(780, 0.12, 0.4, 0.1);
  },
  cleanPortals(list) {
    if (!Array.isArray(list)) return [];
    return list.slice(0, 32).filter(g => g && g.k === 'pg').map(g => ({
      id: g.id | 0, k: 'pg', owner: g.owner | 0, to: g.to | 0, x: +g.x || 0, y: +g.y || 0,
      h: clamp(+g.h || 20, 4, 80), w: clamp(+g.w || 12, 4, 40), hz: !!g.hz,
      fx: clamp(+g.fx || 0, -1, 1), fy: clamp(+g.fy || 0, -1, 1),
      col: Array.isArray(g.col) ? g.col.slice(0, 3).map(v => clamp(v | 0, 0, 255)) : [200, 200, 255]
    }));
  },
  // gates arriving from the host: keep only well-formed ones
  clean(list) {
    if (!Array.isArray(list)) return [];
    return list.slice(0, 16).filter(g => g && GATE_KINDS[g.k] && g.k !== 'pg').map(g => {
      const o = { id: g.id | 0, k: g.k, x: +g.x || 0, y: +g.y || 0, h: clamp(+g.h || 20, 4, 80) };
      if (g.k === 'pin') o.to = g.to | 0;
      return o;
    });
  },
  // a projectile moved from (ox, oy) to (p.x, p.y): did it fly through a gate?
  cross(p, ox, oy) {
    const gates = Battle.gates || [], portals = Battle.portals || [];
    if (!gates.length && !portals.length) return;
    const list = portals.length ? gates.concat(portals) : gates;
    for (const g of list) {
      // inside the frame as drawn? (steps are under a pixel, so nothing slips through)
      const hx = g.hz ? g.w : 3.5, hy = g.hz ? 2.5 * World.ay : g.h;
      if (Math.abs(p.x - g.x) > hx || Math.abs(p.y - g.y) > hy) continue;
      if (p.used && p.used.has(g.id)) continue;
      const along = g.hz ? p.x - g.x : p.y - g.y;   // where along the gate it came through
      const yc = g.y + (g.hz ? 0 : along);
      if (!p.used) p.used = new Set();
      p.used.add(g.id);
      g.flash = performance.now();   // (cosmetic)
      const K = GATE_KINDS[g.k];
      // (cosmetic) a pop over the gate saying what just happened
      if (K.m || K.v) g.pop = { t: g.flash, text: K.m ? (K.m < 1 ? K.label : K.label + '!') : K.label };
      if (K.m && K.m < 1) p.mult = clamp((p.mult || 1) * K.m, 0.25, 1);
      else if (K.m) Gates.split(p, K.m);
      if (K.v) { p.vx *= K.v; p.vy *= K.v; }
      if (g.k === 'pg') {
        // Portal Gun: out of the other end along its facing, at the same speed
        const to = list.find(o => o.id === g.to);
        if (to) {
          p.used.add(to.id); to.flash = g.flash;
          const sp = Math.hypot(p.vx, p.vy / World.ay);
          const k = to.hz ? clamp(along / g.h * to.w, -to.w, to.w) : clamp(along / (g.w || g.h) * to.h, -to.h, to.h);
          p.x = to.x + (to.hz ? k : 0) + to.fx * 1.5;
          p.y = to.y + (to.hz ? 0 : k) + to.fy * 1.5 * World.ay;
          p.vx = to.fx * sp; p.vy = to.fy * sp * World.ay;
          p.warps = (p.warps || 0) + 1;
        }
      }
      if (g.k === 'pin') {
        const to = list.find(o => o.id === g.to);
        if (to) {
          p.used.add(to.id); to.flash = g.flash;
          p.x = to.x + (p.vx >= 0 ? 1.2 : -1.2);
          p.y = to.y + clamp(yc - g.y, -to.h, to.h);
          p.warps = (p.warps || 0) + 1;
        }
      }
      Sound.pos(g.x).beep(g.k === 'half' || g.k === 'brake' ? 300 : g.k === 'x5' ? 1400 : g.k === 'pin' ? 600 : 950, 0.09, 0.5);
      return;   // one gate per step (a portal has just moved it)
    }
  },
  // x2 / x3 / x5: the projectile becomes n of itself, fanned a few degrees around its heading.
  // Copies have used this gate already; one shot's family stops growing at 15.
  split(p, n) {
    if (!p.clone || (p.wp && p.wp.kind === 'portalgun')) return;
    const fam = p.family || (p.family = { n: 1 });
    const extra = Math.min(n - 1, Math.max(0, 15 - fam.n));
    if (!extra) return;
    const ay = World.ay, sp = Math.hypot(p.vx, p.vy / ay), a = Math.atan2(-p.vy / ay, p.vx);
    const step = (n >= 5 ? 6 : 7) * DEG, total = extra + 1;
    const head = i => { const b = a + (i - (total - 1) / 2) * step; return [Math.cos(b) * sp, -Math.sin(b) * sp * ay]; };
    [p.vx, p.vy] = head(0);
    for (let i = 1; i < total; i++) {
      const c = p.clone();
      [c.vx, c.vy] = head(i);
      c.family = fam; fam.n++;
      c.used = new Set(p.used);
      if (p.mult) c.mult = p.mult;
      Battle.spawn(c);
    }
  },
  // classic look: pixel frames with a tag over them
  drawClassic(s) {
    const now = performance.now();
    for (const g of Battle.portals || []) {
      const lit = g.flash && now - g.flash < 400;
      const c = lit ? vga(63, 63, 63) : rgb(g.col[0], g.col[1], g.col[2]);
      if (g.hz) s.ellipse(g.x, g.y, g.w, 2.5 * World.ay, c);
      else s.ellipse(g.x, g.y, 3, g.h, c);
    }
    const list = Battle.gates;
    if (!list || !list.length) return;
    for (const g of list) {
      const K = GATE_KINDS[g.k];
      const lit = g.flash && now - g.flash < 400;
      const c = lit ? vga(63, 63, 63) : vga(K.col[0] / 4, K.col[1] / 4, K.col[2] / 4);
      const x0 = Math.round(g.x - 3), x1 = Math.round(g.x + 3), y0 = Math.round(g.y - g.h), y1 = Math.round(g.y + g.h);
      s.vline(x0, y0, y1, c); s.vline(x1, y0, y1, c);
      s.hline(x0, x1, y0, c); s.hline(x0, x1, y1, c);
      Font.center(s, K.tag, Math.round(g.x), y0 - 9, c);
    }
  }
};

/* ---------- js/arsenal.js ---------- */
'use strict';
/* =====================================================================
   Extended arsenal (Remastered): five new weapons on top of the original
   33. Like everything that touches the battlefield they only use the
   seeded RNG, so network games stay in step. Weapons > Extended Arsenal
   turns them off for a purely classic shop.
     Air Strike     - a flare that calls in a stick of bombs
     Teleporter     - moves your tank to wherever the shot lands
     Tesla Coil     - lightning that jumps between up to three tanks
     Bunker Buster  - drills through dirt, then detonates
     EMP Blast      - knocks out shields and drains batteries nearby
   ===================================================================== */

// the bombs an air strike drops (not sold in the shop)
const AIR_BOMB = { id: 'airBomb', name: 'Air Strike', kind: 'missile', cat: 'W', r: 16, dmg: 80, airBomb: true };

const Arsenal = {
  // Shot.impact() hands the new kinds over here
  impact(shot, x, y, hitTank) {
    const wp = shot.wp, o = shot.owner, sc = scaleFactor();
    switch (wp.kind) {
      case 'airstrike': Battle.spawn(new AirStrike(o, wp, x, y)); break;
      case 'teleport': Battle.spawn(new Teleport(o, x, y)); break;
      case 'tesla':
        Battle.spawn(new Explosion(x, y, 7 * sc, { dmg: 22, owner: o, primary: true, type: 'riot', zap: true }));
        Battle.spawn(new TeslaArc(o, wp, x, y));
        break;
      case 'buster':
        if (hitTank) Battle.spawn(new Explosion(x, y, wp.r * sc, { dmg: wp.dmg, owner: o, primary: true }));
        else Battle.spawn(new Driller(o, wp, x, y, shot.vx, shot.vy));
        break;
      case 'emp': Battle.spawn(new EmpPulse(o, wp, x, y)); break;
    }
  }
};

class AirStrike {
  constructor(owner, wp, x, y) {
    this.owner = owner; this.wp = wp; this.t = 0; this.dropped = 0; this.n = wp.n;
    this.x = clamp(x, 0, World.W - 1); this.y = y;
    this.dir = schance(0.5) ? 1 : -1;
    const sc = scaleFactor();
    this.xs = [];
    for (let i = 0; i < this.n; i++) this.xs.push(clamp(this.x + (i - (this.n - 1) / 2) * 9 * sc + srand(-2, 2), 1, World.W - 2));
    if (this.dir < 0) this.xs.reverse();
    Sound.pos(this.x).seq([[880, 0.12], [660, 0.12], [880, 0.12], [660, 0.12]], 0.35);
  }
  update(dt) {
    this.t += dt;
    const sc = scaleFactor();
    while (this.dropped < this.n && this.t >= 0.8 + this.dropped * 0.13) {
      const bx = this.xs[this.dropped];
      Battle.spawn(new Shot({
        owner: this.owner, wp: AIR_BOMB, x: bx, y: this.altitude(bx),
        vx: this.dir * 10, vy: 30 * World.ay, r: AIR_BOMB.r * sc, dmg: AIR_BOMB.dmg
      }));
      this.dropped++;
    }
    return this.dropped < this.n || this.t < 0.8 + this.n * 0.13 + 0.4;
  }
  // bombs leave the plane below the status line (and under a cavern's roof)
  altitude(x) {
    const y = World.top + 16 * World.ay;
    return World.cavern ? Math.max(y, World.ceil[clamp(Math.floor(x), 0, World.W - 1)] + 3 * World.ay) : y;
  }
  draw(s) {
    // the flare smoke marking the target
    if (this.t < 1.6 && (Math.floor(this.t * 10) & 1)) s.pset(this.x, this.y - 2, vga(63, 10, 10));
  }
}

class Teleport {
  constructor(owner, x, y) {
    this.owner = owner; this.t = 0; this.done = false;
    this.fromX = owner.x; this.fromY = owner.cy;
    const half = Math.ceil(owner.w / 2) + 2;
    let tx = clamp(Math.round(x), half, World.W - half - 1);
    // don't land on top of another tank
    const clear = c => Battle.tanks.every(o => o === owner || !o.alive || Math.abs(o.x - c) >= (o.w + owner.w) / 2 + 1);
    for (let k = 1; k < 60 && !clear(tx); k++) {
      const c = clamp(Math.round(x) + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 2, half, World.W - half - 1);
      if (clear(c)) { tx = c; break; }
    }
    this.tx = tx;
    this.ty = this.landing(tx);
    Sound.pos(owner.x).sweep(300, 2400, 0.35, 0.5);
  }
  landing(x) {
    let y = World.H;
    for (let c = x - 3; c <= x + 3; c++) y = Math.min(y, World.surfaceY(clamp(c, 0, World.W - 1)));
    return y;
  }
  update(dt) {
    this.t += dt;
    if (!this.done && this.t >= 0.35) {
      this.done = true;
      const t = this.owner;
      if (t.alive && !t.dying) {
        t.x = this.tx;
        t.y = this.landing(this.tx);
        t.falling = false;
        Sound.pos(this.tx).sweep(2400, 400, 0.25, 0.5);
      }
    }
    return this.t < 0.9;
  }
  draw(s) {
    const c = vga(40, 63, 63);
    for (let k = 0; k < 6; k++) {
      const a = this.t * 12 + k;
      if (!this.done) s.pset(this.fromX + Math.cos(a) * 6, this.fromY - Math.abs(Math.sin(a)) * 10 * World.ay, c);
      s.pset(this.tx + Math.cos(a) * 6, this.ty - 4 * World.ay - Math.abs(Math.sin(a)) * 10 * World.ay, c);
    }
  }
}

class TeslaArc {
  constructor(owner, wp, x, y) {
    this.owner = owner; this.wp = wp; this.x = x; this.y = y; this.t = 0;
    this.chain = [];
    const R = wp.r * scaleFactor(), hit = new Set();
    let fx = x, fy = y;
    for (let i = 0; i < wp.dmgs.length; i++) {
      let best = null, bd = Infinity;
      for (const t of Battle.tanks) {
        if (!t.alive || t.dying || t === owner || hit.has(t)) continue;
        const d = adist(fx, fy, t.cx, t.cy);
        if (d < (i === 0 ? R : R * 0.85) && d < bd) { bd = d; best = t; }
      }
      if (!best) break;
      hit.add(best);
      this.chain.push({ tank: best, fx, fy, tx: best.cx, ty: best.cy, dmg: wp.dmgs[i], at: 0.1 + i * 0.22, done: false });
      fx = best.cx; fy = best.cy;
    }
    this.end = this.chain.length ? this.chain[this.chain.length - 1].at + 0.35 : 0.45;
    Sound.pos(x).zap();
  }
  update(dt) {
    this.t += dt;
    for (const c of this.chain) {
      if (c.done || this.t < c.at) continue;
      c.done = true;
      if (c.tank.alive && !c.tank.dying) { Battle.damage(c.tank, c.dmg, this.owner, { primary: true }); Sound.pos(c.tank.x).zap(); }
    }
    return this.t < this.end;
  }
  draw(s) {
    for (const c of this.chain) {
      if (this.t < c.at - 0.06 || this.t > c.at + 0.25) continue;
      const n = 8;
      let px = c.fx, py = c.fy;
      for (let i = 1; i <= n; i++) {
        const k = i / n;
        const x = lerp(c.fx, c.tx, k) + (i < n ? (hash2(i, Math.floor(this.t * 30), 3) - 0.5) * 8 : 0);
        const y = lerp(c.fy, c.ty, k) + (i < n ? (hash2(i, Math.floor(this.t * 30), 9) - 0.5) * 8 * World.ay : 0);
        s.line(px, py, x, y, vga(40, 50, 63));
        px = x; py = y;
      }
    }
  }
}

class Driller {
  constructor(owner, wp, x, y, vx, vy) {
    this.owner = owner; this.wp = wp; this.x = x; this.y = y; this.t = 0;
    let dx = vx, dy = vy / World.ay;
    const sp = Math.hypot(dx, dy) || 1;
    dx /= sp; dy /= sp;
    if (dy < 0.4) { dy = 0.4; const k = Math.hypot(dx, dy); dx /= k; dy /= k; }   // always heads into the ground
    this.dx = dx; this.dy = dy;
    this.dist = 0; this.len = wp.len * scaleFactor();
    this.speed = 70 * World.W / 360;
    Sound.pos(x).crunch(0.5, 420, 90, 0.6);
  }
  update(dt) {
    this.t += dt;
    let move = this.speed * dt;
    while (move > 0) {
      const st = Math.min(1, move); move -= st;
      this.x += this.dx * st; this.y += this.dy * st * World.ay;
      this.dist += st;
      if (this.x < 0 || this.x >= World.W || this.y >= World.H - 1) return this.boom();
      for (const t of Battle.tanks) if (t.alive && t !== this.owner && t.contains(this.x, this.y, 1)) return this.boom();
      World.carveEllipse(this.x, this.y, 1.3, 1.3 * World.ay);
      if (this.dist >= this.len) return this.boom();
    }
    return true;
  }
  boom() {
    this.y = Math.min(this.y, World.H - 1);
    Battle.spawn(new Explosion(this.x, this.y, this.wp.r * scaleFactor(), { dmg: this.wp.dmg, owner: this.owner, primary: true }));
    Battle.terrainChanged();
    return false;
  }
  draw(s) { s.pset(this.x, this.y, vga(63, 50, 20)); }
}

class EmpPulse {
  constructor(owner, wp, x, y) {
    this.owner = owner; this.x = x; this.y = y; this.t = 0; this.hit = false;
    this.r = wp.r * scaleFactor(); this.victims = [];
    Sound.pos(x).plasma();
  }
  update(dt) {
    this.t += dt;
    if (!this.hit && this.t >= 0.25) {
      this.hit = true;
      for (const t of Battle.tanks) {
        if (!t.alive || t.dying) continue;
        if (adist(this.x, this.y, t.cx, t.cy) > this.r + t.w / 2) continue;
        let hurt = false;
        if (t.shield) { this.victims.push({ tank: t, color: t.shield.it.color }); t.shield = null; hurt = true; }
        const b = t.p.inv.battery || 0;
        if (b > 0) { t.p.inv.battery = Math.max(0, b - 2); hurt = true; }
        if (hurt) t.fx = { k: 'dark', t: 0.4 };
      }
      Sound.pos(this.x).sweep(1400, 90, 0.45, 0.6);
    }
    return this.t < 0.9;
  }
  draw(s) {
    const r = this.r * clamp(this.t / 0.3, 0, 1);
    if (this.t < 0.6) s.ellipse(this.x, this.y, r, r * World.ay, vga(20, 40, 63));
  }
}

/* ---------- js/ai.js ---------- */
'use strict';
/* =====================================================================
   Computer players.
     Moron     - picks an angle and power and shoots
     Shooter   - deadly with a straight line of fire
     Poolshark - banks shots off rebounding walls
     Tosser    - starts rough, refines aim shot after shot
     Chooser   - picks whichever of the above looks best
     Spoiler   - near-perfect shots with wind and gravity (not viscosity)
     Cyborg    - Spoiler aim, nasty target selection
     Unknown   - one of the above, secretly
   ===================================================================== */

const AI = {
  personality(p) {
    if (p.ai !== 'Unknown') return p.ai;
    if (!p.aiHidden) p.aiHidden = pick(['Moron', 'Shooter', 'Poolshark', 'Tosser', 'Chooser', 'Spoiler', 'Cyborg']);
    return p.aiHidden;
  },

  enemies(tank) { return Battle.tanks.filter(t => t.alive && !t.dying && t !== tank && !Battle.sameTeam(t, tank)); },

  chooseTarget(tank) {
    const type = this.personality(tank.p), en = this.enemies(tank);
    if (!en.length) return null;
    const mem = tank.p.aiMem;
    if (type === 'Tosser' && mem.target && mem.target.alive && en.includes(mem.target)) return mem.target;
    if (type === 'Cyborg') {
      let best = null, bs = -Infinity;
      for (const t of en) {
        let s = (100 - t.energy) * 1.2 + (t.p.score - tank.p.score) / 400 + (tank.attackers[t.p.idx] || 0) * 1.5;
        if (t.shield) s -= 25;
        s -= Math.abs(t.x - tank.x) / World.W * 30;
        s += rand(0, 15);
        if (s > bs) { bs = s; best = t; }
      }
      return best;
    }
    if (type === 'Moron') return pick(en);
    // others: favour nearer tanks
    const sorted = en.slice().sort((a, b) => Math.abs(a.x - tank.x) - Math.abs(b.x - tank.x));
    return chance(0.65) ? sorted[0] : pick(sorted);
  },

  // defensive housekeeping at the start of a turn (host only; issued as commands so everyone sees it)
  prepare(tank) {
    const p = tank.p, type = this.personality(p), idx = p.idx;
    if (type === 'Moron') { if (!tank.shield && chance(0.3)) this.engageBestShield(tank); return; }
    // top up with batteries when hurt
    let guard = 0;
    while (tank.energy < 70 && (p.inv.battery || 0) > 0 && !this.hasEnergyWeapon(p, 3) && guard++ < 10) {
      Battle.act({ c: 'batt', tank: idx });
    }
    if (!tank.shield || tank.shield.energy < tank.shield.it.strength * 0.25) this.engageBestShield(tank);
    if (!p.para.deployed && (p.inv.parachute || 0) > 0) Battle.act({ c: 'para', tank: idx, on: true });
  },
  hasEnergyWeapon(p, minBatt) {
    return ((p.inv.laser || 0) + (p.inv.plasmaBlast || 0)) > 0 && (p.inv.battery || 0) <= minBatt;
  },
  engageBestShield(tank) {
    const p = tank.p;
    for (const id of ['superMag', 'heavyShield', 'forceShield', 'shield', 'magDeflector']) {
      if ((p.inv[id] || 0) > 0) {
        if (tank.shield && tank.shield.it.id === id && tank.shield.energy > tank.shield.it.strength * 0.5) return;
        Battle.act({ c: 'shield', tank: p.idx, id }); return;
      }
    }
  },

  targetPoint(t) {
    if (this.aimAt && this.aimAt.tank === t) return { x: this.aimAt.x, y: this.aimAt.y };
    return { x: t.x, y: Math.round(t.y - t.hh / 2) };
  },
  // shields swallow direct hits, so smarter players land the blast right beside them
  besideShield(tank, target) {
    const side = tank.x < target.x ? -1 : 1;
    const x = clamp(Math.round(target.x + side * (target.shieldRx() + 3)), 1, World.W - 2);
    return { tank: target, x, y: Math.min(World.surfaceY(x), World.H - 1) - 1 };
  },

  // --------------------------------------------------------------- aiming
  plan(tank) {
    const type = this.personality(tank.p), mem = tank.p.aiMem;
    const target = this.chooseTarget(tank);
    mem.target = target;
    if (!target) return { angle: tank.angle, power: tank.power, weapon: 'babyMissile' };
    // the same target still unhurt after our last few shots: we're stuck in a rut
    const hp = target.energy + (target.shield ? target.shield.energy : 0);
    mem.stale = mem.last && mem.last.target === target && Math.abs(mem.last.hp - hp) < 0.5 ? (mem.stale || 0) + 1 : 0;
    mem.last = { target, hp };
    const rut = mem.stale >= 3;
    if (rut && type === 'Tosser') mem.tossTarget = null;
    let method = type;
    if (type === 'Chooser') method = this.chooseMethod(tank, target);
    if (type === 'Cyborg') method = 'Cyborg';
    this.aimAt = null;
    const shielded = target.shield && !target.shield.it.deflect && type !== 'Moron' && type !== 'Shooter';
    if (shielded && !rut && (type === 'Cyborg' || type === 'Spoiler' || type === 'Chooser' || chance(0.5))) this.aimAt = this.besideShield(tank, target);
    let plan;
    switch (method) {
      case 'Moron': plan = this.aimMoron(tank, target); break;
      case 'Shooter': plan = this.aimShooter(tank, target); break;
      case 'Poolshark': plan = this.aimPoolshark(tank, target); break;
      case 'Tosser': plan = this.aimTosser(tank, target); break;
      case 'Spoiler': plan = this.aimSpoiler(tank, target, false); break;
      default: plan = this.aimSpoiler(tank, target, true); break;
    }
    plan.target = target;
    if (rut) {
      // shake it up: the longer the rut, the wilder the change
      const k = Math.min(mem.stale - 2, 5);
      plan.angle += rand(-4, 4) * k;
      plan.power *= 1 + rand(-0.06, 0.06) * k;
    }
    this.pickWeapon(tank, target, plan, type);
    plan.angle = clamp(Math.round(plan.angle), 0, 180);
    plan.power = clamp(Math.round(plan.power), 0, tank.maxPower);
    return plan;
  },

  chooseMethod(tank, target) {
    const w = Battle.walls;
    if (w === 'RUBBER' || w === 'SPRING' || w === 'PADDED') { if (!this.lineOfSight(tank, target)) return 'Poolshark'; }
    if (this.lineOfSight(tank, target)) return 'Shooter';
    return chance(0.5) ? 'Spoiler' : 'Tosser';
  },

  lineOfSight(tank, target) {
    const m = tank.muzzle(0, target.x > tank.x ? 30 : 150);
    const tp = this.targetPoint(target);
    const n = Math.ceil(Math.hypot(tp.x - m.x, tp.y - m.y));
    for (let i = 2; i < n - 3; i++) {
      const x = lerp(m.x, tp.x, i / n), y = lerp(m.y, tp.y, i / n);
      if (World.isLand(x, y)) return false;
    }
    return true;
  },

  side(tank, target) { return target.x >= tank.x ? 1 : -1; },
  angleToward(dir, a) { return dir > 0 ? a : 180 - a; },

  aimMoron(tank, target) {
    const dir = this.side(tank, target);
    // wild, but always at least toward the enemy (a shot flying off the other way looked like a bug)
    const angle = Math.round(this.angleToward(dir, chance(0.25) ? rand(12, 88) : rand(25, 80)));
    return { angle, power: rand(150, Math.min(950, tank.maxPower)) };
  },

  aimShooter(tank, target) {
    const tp = this.targetPoint(target), dir = this.side(tank, target);
    const dx = Math.abs(tp.x - tank.x), dy = (tank.cy - tp.y) / World.ay;
    const base = Math.atan2(dy, dx) / DEG;
    for (const elev of [8, 14, 20, 28, 36, 45, 55]) {
      const a = Math.round(this.angleToward(dir, clamp(base + elev, 2, 88)));
      const m = tank.muzzle(0, a);
      const p = Ballistics.solvePower(m, a, tp.x, tp.y, tank.maxPower, { wind: Battle.wind });
      if (p !== null) return { angle: a, power: p * (1 + rand(-0.015, 0.015)) };
    }
    return this.aimMoron(tank, target);
  },

  aimPoolshark(tank, target) {
    const w = Battle.walls;
    if (!(w === 'RUBBER' || w === 'SPRING' || w === 'PADDED')) return this.aimShooter(tank, target);
    const tp = this.targetPoint(target);
    let best = null, be = Infinity;
    for (let a = 10; a <= 170; a += 8) {
      for (let pw = 150; pw <= tank.maxPower; pw += 50) {
        const m = tank.muzzle(0, a), v = Phys.launch(a, pw);
        const r = Ballistics.sim(m.x, m.y, v.vx, v.vy, { land: true, tanks: true, owner: tank, walls: w, drag: true, maxT: 12 });
        if (!r.bounced) continue;
        const e = r.tank === target ? 0 : Math.hypot(r.x - tp.x, (r.y - tp.y) / World.ay);
        if (r.tank === tank) continue;
        if (e < be) { be = e; best = { angle: a, power: pw }; }
      }
    }
    if (best && be < 25) return best;
    return this.aimShooter(tank, target);
  },

  aimTosser(tank, target) {
    const mem = tank.p.aiMem, tp = this.targetPoint(target), dir = this.side(tank, target);
    if (mem.tossTarget === target && mem.lastImpactX !== undefined && mem.tossAngle !== undefined) {
      const want = (tp.x - tank.x) * dir, got = (mem.lastImpactX - tank.x) * dir;
      let power = mem.tossPower;
      if (Math.abs(want - got) > 3) {
        const ratio = clamp((want + 5) / Math.max(5, got + 5), 0.5, 1.8);
        power = mem.tossPower * Math.sqrt(ratio) * (1 + rand(-0.03, 0.03));
      }
      mem.lastImpactX = undefined;
      mem.tossPower = clamp(power, 50, tank.maxPower);
      return { angle: mem.tossAngle, power: mem.tossPower };
    }
    const angle = Math.round(this.angleToward(dir, rand(40, 65)));
    const dist = Math.abs(tp.x - tank.x);
    const est = Math.sqrt(dist / (World.W * 1.2)) * 1000 * rand(0.75, 1.3);
    mem.tossTarget = target; mem.tossAngle = angle; mem.tossPower = clamp(est, 100, tank.maxPower);
    mem.lastImpactX = undefined;
    return { angle, power: mem.tossPower };
  },

  // exact ballistic solution (Spoiler ignores terrain; Cyborg checks the path)
  aimSpoiler(tank, target, careful) {
    const tp = this.targetPoint(target), dir = this.side(tank, target);
    const angles = careful ? [45, 52, 60, 67, 74, 80, 38, 30, 85] : [shuffle([50, 55, 60, 65])[0], 45, 70, 75, 80];
    // "a perfect shot almost every time"
    const miss = () => careful ? (chance(0.1) ? rand(-0.035, 0.035) : 0) : (chance(0.15) ? rand(-0.05, 0.05) : rand(-0.006, 0.006));
    let fallback = null;
    for (const a0 of angles) {
      const a = this.angleToward(dir, a0);
      const m = tank.muzzle(0, a);
      const p = Ballistics.solvePower(m, a, tp.x, tp.y, tank.maxPower, { wind: Battle.wind });
      if (p === null) continue;
      if (!fallback) fallback = { angle: a, power: p };
      if (!careful) break;
      // make sure nothing is in the way
      const v = Phys.launch(a, p);
      const r = Ballistics.sim(m.x, m.y, v.vx, v.vy, { land: true, tanks: true, owner: tank, walls: Battle.walls, drag: false });
      if (r.tank === target || (!r.tank && Math.hypot(r.x - tp.x, (r.y - tp.y) / World.ay) < 6)) return { angle: a, power: p * (1 + miss()) };
    }
    if (!fallback) return this.aimShooter(tank, target);
    return { angle: fallback.angle, power: fallback.power * (1 + miss()) };
  },

  // --------------------------------------------------------------- weapons
  pickWeapon(tank, target, plan, type) {
    const p = tank.p, inv = p.inv;
    const has = id => id === 'babyMissile' || (inv[id] || 0) > 0;
    const dist = Math.abs(target.x - tank.x);
    plan.weapon = 'babyMissile';
    // buried? dig out first
    if (Battle.buried(tank) && type !== 'Moron') {
      for (const id of ['riotBlast', 'riotCharge', 'babyDigger', 'digger']) {
        if (has(id)) { plan.weapon = id; plan.angle = 90; plan.power = 300; return; }
      }
    }
    const sc = scaleFactor();
    const reach = { airStrike: 40, teslaCoil: 10, empBlast: 64, teleporter: 0 };
    const safe = id => { const it = Data.byId[id]; const r = (reach[id] !== undefined ? reach[id] : (it.r || (it.subR ? it.subR * 2.2 : 20))) * sc; return dist > r + 18; };
    if (type === 'Moron') {
      const owned = Data.weapons.filter(w => has(w.id) && !['tracer', 'smokeTracer', 'earthDisrupter'].includes(w.id));
      plan.weapon = pick(owned).id;
    } else {
      // energy weapons at close range / clear line
      const batt = inv.battery || 0;
      if (has('plasmaBlast') && batt >= 3 && dist < (18 + batt * 4) * scaleFactor()) { plan.weapon = 'plasmaBlast'; plan.batteries = Math.min(9, batt); return; }
      if (has('laser') && batt >= 2 && this.laserLine(tank, target)) {
        // lasers cut straight through shields: aim at the tank itself
        plan.weapon = 'laser'; plan.batteries = Math.min(9, batt);
        const m = tank.muzzle(0, target.x > tank.x ? 20 : 160);
        plan.angle = Math.atan2((m.y - target.cy) / World.ay, target.x - m.x) / DEG;
        return;
      }
      // extended arsenal: knock out a strong shield, or chain lightning through a crowd
      if (Cfg.extendedArsenal) {
        if (target.shield && target.shield.energy > 70 && has('empBlast') && safe('empBlast') && chance(0.55)) { plan.weapon = 'empBlast'; return; }
        const crowd = this.enemies(tank).filter(e => e !== target && adist(e.cx, e.cy, target.cx, target.cy) < 60).length;
        if (has('teslaCoil') && (crowd > 0 || chance(0.3))) { plan.weapon = 'teslaCoil'; return; }
      }
      const prefs = target.shield
        ? ['hotNapalm', 'deathsHead', 'nuke', 'bunkerBuster', 'leapFrog', 'funkyBomb', 'airStrike', 'napalm', 'heavySandhog', 'mirv', 'babyNuke', 'sandhog', 'heavyRoller', 'missile']
        : ['deathsHead', 'nuke', 'bunkerBuster', 'funkyBomb', 'airStrike', 'babyNuke', 'mirv', 'hotNapalm', 'leapFrog', 'heavyRoller', 'napalm', 'missile', 'roller', 'babySandhog', 'babyRoller'];
      const pickable = prefs.filter(id => has(id) && safe(id));
      if (pickable.length) {
        // save the big stuff sometimes
        plan.weapon = (pickable.length > 1 && chance(0.25)) ? pickable[1] : pickable[0];
      }
      // MIRVs need a real arc to split
      if ((plan.weapon === 'mirv' || plan.weapon === 'deathsHead')) {
        const a = plan.angle > 90 ? 180 - plan.angle : plan.angle;
        if (a < 35) plan.weapon = has('missile') && safe('missile') ? 'missile' : 'babyMissile';
      }
    }
    // guidance (smart ones only)
    if ((type === 'Cyborg' || type === 'Chooser' || type === 'Spoiler') && !Data.noGuidance[plan.weapon]) {
      for (const id of ['lazyBoy', 'ballisticGuidance', 'heatGuidance']) {
        if ((inv[id] || 0) > 0 && chance(0.6)) { plan.guidance = id; break; }
      }
    }
  },
  laserLine(tank, target) {
    const m = tank.muzzle(0, target.x > tank.x ? 20 : 160);
    const a = Math.atan2((m.y - target.cy) / World.ay, target.x - m.x) / DEG;
    if (a < 0 || a > 180) return false;
    if (target.shield && target.shield.it.laserProof) return false;
    return true;
  },

  // --------------------------------------------------------------- shopping
  shop(p) {
    const type = this.personality(p);
    const buy = id => Shop.buy(p, Data.byId[id], true);
    const avail = it => Shop.visible(p, it) && Shop.price(p, it) <= Game.cashOf(p);
    let guard = 0;
    const budget = () => Game.cashOf(p) * (type === 'Moron' ? 0.95 : 0.8);
    if (type === 'Moron') {
      while (guard++ < 30) {
        const opts = Data.items.filter(it => it.id !== 'babyMissile' && avail(it) && Shop.price(p, it) <= budget());
        if (!opts.length) break;
        if (!buy(pick(opts).id)) break;
      }
      return;
    }
    const plan = [];
    const cash = Game.cashOf(p);
    if (cash > 60000) plan.push('heavyShield', 'superMag');
    if (cash > 35000) plan.push('forceShield', 'shield');
    if (cash > 25000 && Cfg.tanksFall) plan.push('parachute');
    if ((p.inv.plasmaBlast || p.inv.laser) && (p.inv.battery || 0) < 6) plan.push('battery');
    plan.push('deathsHead', 'nuke', 'babyNuke', 'funkyBomb', 'hotNapalm', 'mirv', 'bunkerBuster', 'teslaCoil', 'airStrike', 'leapFrog', 'heavyRoller', 'missile', 'napalm', 'riotCharge');
    if (type === 'Cyborg' || type === 'Chooser' || type === 'Spoiler') plan.push('empBlast');
    if (type === 'Cyborg' || type === 'Chooser') plan.unshift('lazyBoy', 'ballisticGuidance');
    if (type === 'Cyborg' && cash > 50000) plan.push('plasmaBlast', 'battery', 'laser');
    for (const id of plan) {
      const it = Data.byId[id];
      if (!it || !avail(it)) continue;
      if (it.kind === 'shield' && (p.inv[id] || 0) >= 2) continue;
      if (id === 'parachute' && (p.inv.parachute || 0) >= 4) continue;
      if (Shop.price(p, it) > budget()) continue;
      buy(id);
      if (guard++ > 40) break;
    }
    // spend a little more on missiles if rich
    while (guard++ < 60 && Game.cashOf(p) > 30000 && avail(Data.byId.missile) && (p.inv.missile || 0) < 20) buy('missile');
  }
};

/* ---------- js/battle.js ---------- */
'use strict';
/* =====================================================================
   Battle: one round of play.

   The battlefield is a deterministic simulation advanced in fixed ticks
   (simTick). Everything that changes it is a command, applied by exec().
   The turn logic (control) runs on the host - or on the only machine when
   playing offline - and issues commands through act(); in a network game
   every peer replays the same command stream, so every screen shows the
   same battle. Aiming (turret and power) is local until the shot is fired;
   other players see it live through presence.
   ===================================================================== */

const TICK = 1 / 60;
const KEY_CCW = 1, KEY_CW = 2, KEY_UP = 4, KEY_DOWN = 8;
const ONLINE_KEYS = { ccw: 'arrowleft', cw: 'arrowright', up: 'arrowup', down: 'arrowdown', fire: 'space', weapon: 'tab' };
const WALL_COLORS = {
  NONE: vga(32, 32, 32), CONCRETE: vga(63, 63, 63), PADDED: vga(10, 50, 10),
  RUBBER: vga(56, 8, 8), SPRING: vga(10, 54, 60), WRAP: vga(60, 60, 10)
};
const WALL_TYPES = ['NONE', 'CONCRETE', 'PADDED', 'RUBBER', 'SPRING', 'WRAP'];
const SCORE = {
  STANDARD: { dmg: 30, kill: 2000, survive: 5000 },
  GREEDY: { dmg: 30, kill: 2000, survive: 5000 },
  BASIC: { dmg: 0, kill: 5000, survive: 5000 }
};

const Battle = {
  tanks: [], entities: [], balloons: [], deaths: [], dyingNow: null,
  wind: 0, walls: 'NONE', mode: 'SEQUENTIAL', state: 'idle', t: 0,
  order: [], turnIdx: -1, cur: null, plan: null, statusH: 12, hud: [],
  lastShooter: null, massKilled: false, hold: null, keyHold: {},
  syncWait: new Set(), syncShots: [], adWait: new Set(), turnCount: 0,
  tick: 0, acc: 0, params: null, waitHost: false, pendingMass: false, pendingTurn: null,
  deferred: [], pendingAI: [], localKeys: {}, keySentT: {}, aiT: 0, aiThink: 0, yourTurnT: 0,

  /* =================================================== round setup */
  // the host's (or solo player's) decisions for a new round
  makeParams() {
    let sky = Cfg.sky;
    if (sky === 'RANDOM') sky = pick(['PLAIN', 'STORMY', 'STARS', 'SHADED', 'SUNSET', 'CAVERN', 'SHADED', 'STARS']);
    const walls = (Cfg.effectOfWalls === 'RANDOM' || Cfg.effectOfWalls === 'ERRATIC') ? pick(WALL_TYPES) : Cfg.effectOfWalls;
    return { seed: irand(1, 0x7ffffff0), sky, walls, wind: this.rollWind(null) };
  },
  rollWind(prev) {
    const mx = Cfg.maxWind;
    if (mx === 0) return 0;
    if (prev === null) {
      const r = Math.random();
      return Math.round((chance(0.5) ? 1 : -1) * r * r * mx * (chance(0.1) ? 0 : 1));
    }
    if (!Cfg.changingWind) return prev;
    return Math.round(clamp(prev + rand(-1, 1) * Math.max(3, mx * 0.12), -mx, mx));
  },
  rollWeather() {
    if (!Cfg.hostileEnvironment) return null;
    if (World.skyType === 'STORMY' && chance(0.3)) {
      const al = this.alive();
      const tgt = chance(0.4) && al.length ? pick(al) : null;
      return { kind: 'lightning', x: Math.round(tgt ? tgt.x : rand(10, World.W - 10)) };
    }
    if (World.skyType === 'STARS' && chance(0.06)) {
      return { kind: 'meteor', x: Math.round(rand(0, World.W)), vx: Math.round(rand(-1, 1) * World.W * 0.15) };
    }
    return null;
  },
  start(params) {
    params = params || this.makeParams();
    UI.clear();
    this.params = params;
    this.mode = Cfg.mode;
    this.statusH = Cfg.statusBar ? 23 : 12;
    SR.seed(params.seed);
    World.init(Screen.W, Screen.H, this.statusH * Screen.UY);
    World.generate(params.sky);
    this.walls = params.walls;
    this.wind = params.wind;
    this.entities = []; this.balloons = []; this.deaths = []; this.dyingNow = null;
    this.tanks = Game.players.map(p => new Tank(p));
    this.placeTanks();
    // Sky Gates: laid out from the shared seeded numbers, so every machine agrees
    this.gates = Cfg.skyGates !== 'OFF' ? Gates.place(srand) : [];
    this.portals = [];   // Portal Gun pairs (one per player)
    this.orderTanks();
    this.turnIdx = -1; this.cur = null; this.plan = null; this.pendingTurn = null;
    this.syncWait = new Set(); this.syncShots = []; this.adWait = new Set(); this.hold = null;
    this.lastShooter = null; this.massKilled = false; this.turnCount = 0; this.pendingMass = false;
    this.deferred = []; this.pendingAI = []; this.localKeys = {}; this.keySentT = {};
    this.waitHost = false; this.acc = 0; this.yourTurnT = 0;
    this.state = 'intro'; this.t = 0.5;
    this.slowmo = 0; this.slowmoDone = false;
    for (const t of this.tanks) {
      t.angle = t.x < World.W / 2 ? sirand(40, 70) : sirand(110, 140);
      t.power = Math.min(t.maxPower, t.p.lastPower || 200);   // 1.5 starts at 200
      if (!Game.has(t.p, t.p.weapon)) t.p.weapon = 'babyMissile';
      if (t.p.aiMem) { t.p.aiMem.simPlan = null; t.p.aiMem.simWait = undefined; }
    }
    Sound.flightStop();
  },

  placeTanks() {
    const n = this.tanks.length, W = World.W, margin = 10;
    const slot = (W - margin * 2) / n;
    const order = sshuffle(this.tanks.slice());
    order.forEach((t, i) => {
      let x = margin + (i + 0.5) * slot + srand(-0.22, 0.22) * slot;
      x = Math.round(clamp(x, t.w / 2 + 2, W - t.w / 2 - 3));
      t.x = x;
      this.flattenUnder(t);
    });
  },
  flattenUnder(t) {
    const W = World.W, half = Math.ceil(t.w / 2) + 1;
    let y0 = World.surfaceY(t.x);
    // average the footprint so tanks don't perch on needles
    let sum = 0, k = 0;
    for (let c = t.x - half; c <= t.x + half; c++) { if (c >= 0 && c < W) { sum += World.surfaceY(c); k++; } }
    y0 = Math.round((y0 + sum / Math.max(1, k)) / 2);
    y0 = clamp(y0, World.top + t.hh + 4, World.H - 1);
    for (let c = t.x - half; c <= t.x + half; c++) {
      if (c < 0 || c >= W) continue;
      for (let y = y0 - t.hh - 3; y < y0; y++) if (y >= World.top) World.clearPixel(y * W + c);
      for (let y = y0; y < World.H; y++) {
        const i = y * W + c;
        if (World.land[i]) break;
        World.setPixel(i, World.scanned ? World.scannedIndex(c, y, y0, 0, -1) : World.dirtIndex(c, y));
      }
    }
    t.y = y0;
  },
  orderTanks() {
    const ts = this.tanks.slice();
    switch (Cfg.playOrder) {
      case 'LOSERS-FIRST': ts.sort((a, b) => Game.rankValue(a.p) - Game.rankValue(b.p)); break;
      case 'WINNERS-FIRST': ts.sort((a, b) => Game.rankValue(b.p) - Game.rankValue(a.p)); break;
      case 'ROUND-ROBIN': {
        ts.sort((a, b) => a.p.idx - b.p.idx);
        const k = (Game.round - 1) % ts.length;
        this.order = ts.slice(k).concat(ts.slice(0, k));
        return;
      }
      default: sshuffle(ts);
    }
    this.order = ts;
  },

  /* =================================================== helpers */
  alive() { return this.tanks.filter(t => t.alive && !t.dying); },
  teamsOn() { return Cfg.teams !== 'NONE'; },
  freeForAll() {
    if (!this.teamsOn()) return true;
    if (Cfg.teams !== 'VICIOUS') return false;
    const teams = new Set(this.alive().map(t => t.p.team));
    return teams.size <= 1;
  },
  sameTeam(a, b) {
    if (a === b) return true;
    if (!this.teamsOn() || this.freeForAll()) return false;
    return a.p.team === b.p.team;
  },
  humansAlive() { return this.tanks.some(t => t.alive && !t.p.ai); },
  speed() {
    const base = (Cfg.fastComputers && !this.humansAlive()) ? 3 : 1;
    return this.slowmo > 0 ? base * 0.3 : base;   // Remastered: the round-deciding blast in slow motion
  },
  timeScale() {
    const d = Cfg.firingDelay;
    return clamp(130 / Math.max(4, d), 0.25, 30);
  },
  spawn(e) {
    // whatever a projectile spawns (bomblets, warheads, hops, its blast) carries its Sky Gate multiplier
    const p = this.curEnt;
    if (p && p !== e) {
      if (p.mult && p.mult !== 1 && e.mult === undefined) e.mult = p.mult;
      if (p.used && !e.used && (e instanceof Shot || e instanceof Bomblet)) e.used = new Set(p.used);
    }
    this.entities.push(e); EventLog.spawned(e); return e;
  },
  // the Sky Gate multiplier for things being made right now
  multNow() { return (this.curEnt && this.curEnt.mult) || 1; },
  terrainChanged() { /* dirt settles and tanks fall in simTick() */ },
  buried(t) {
    for (const a of [45, 90, 135]) {
      const m = t.muzzle(0, a);
      if (!World.isLand(m.x, m.y)) return false;
    }
    return true;
  },
  tanksByX() { return this.alive().sort((a, b) => a.x - b.x); },
  projectileBusy(t) {
    return this.entities.some(e => e.owner === t && (e instanceof Shot || e instanceof Bomblet || e instanceof Roller || e instanceof Tunneler || e instanceof Liquid || e instanceof DirtSpray));
  },
  settled() {
    return this.entities.length === 0 && !World.needsSettle() && !this.tanks.some(t => t.falling && t.alive && !t.dying) && this.deaths.length === 0 && !this.dyingNow;
  },
  // is this tank steered from this machine?
  isLocal(t) { return !!t && !t.p.ai && (!Net.online || t.p.owner === Net.me); },
  canControl(t, peer) {
    if (!t || t.p.ai) return false;
    return Net.online ? t.p.owner === peer : true;
  },
  keysFor(t) { return Net.online ? ONLINE_KEYS : (t.p.keys || {}); },
  // the tank this machine is aiming right now, if any
  aimTank() {
    if (this.mode === 'SYNCHRONOUS') {
      if (this.state !== 'syncaim') return null;
      for (const t of this.order) if (t.alive && !t.dying && this.syncWait.has(t.p.idx) && this.isLocal(t)) return t;
      return null;
    }
    if (this.mode === 'SIMULTANEOUS') return null;
    const t = this.cur;
    return (this.state === 'human' && this.isLocal(t) && t.alive && !t.dying) ? t : null;
  },
  hudTank() {
    if (this.mode === 'SYNCHRONOUS' && this.state === 'syncaim') return this.aimTank();
    return this.cur;
  },
  nextOwned(list, cur) {
    const i = list.indexOf(cur);
    return list[(i + 1) % list.length];
  },
  nextShieldId(t) { return this.nextOwned([null].concat(Data.shields.filter(s => (t.p.inv[s.id] || 0) > 0).map(s => s.id)), t.selShield); },
  nextGuidId(t) { return this.nextOwned([null].concat(Data.guidances.filter(g => (t.p.inv[g.id] || 0) > 0).map(g => g.id)), t.guidance); },
  nextWeaponId(t, dir) {
    const owned = Data.weapons.filter(w => Game.has(t.p, w.id));
    let i = owned.findIndex(w => w.id === t.p.weapon);
    i = (i + dir + owned.length) % owned.length;
    return owned[i].id;
  },

  /* =================================================== damage & scoring */
  award(p, pts) {
    if (!pts) return;
    p.score += pts; p.roundPts += pts;
    Game.addCash(p, pts);
  },
  scoreDamage(attacker, victim, amount) {
    if (!attacker || !attacker.p) return;
    const sc = SCORE[Cfg.scoringMode] || SCORE.STANDARD;
    if (!sc.dmg) return;
    if (attacker === victim) return;                 // only suicide itself costs you
    // paid per whole point of damage, as in 1.5 ($30 steps); fractions (a burn, a glancing
    // blast) carry over to the next hit
    const p = attacker.p, team = this.sameTeam(attacker, victim), key = team ? 'dmgCarryTeam' : 'dmgCarry';
    const total = (p[key] || 0) + amount, whole = Math.floor(total + 1e-9);
    p[key] = total - whole;
    if (whole) this.award(p, (team ? -whole : whole) * sc.dmg);
  },
  shieldHit(t, amount, attacker) {
    if (!t.shield) return;
    const dealt = Math.min(amount, Math.max(0, t.shield.energy));
    t.shield.energy -= amount;
    this.scoreDamage(attacker, t, dealt * 0.5);
    if (t.shield.energy <= 0.5) this.dropShield(t);
  },
  dropShield(t) {
    t.shield = null;
    Sound.sweep(1200, 200, 0.25, 0.6);
  },
  damage(t, amount, attacker, o) {
    o = o || {};
    if (!t.alive || t.dying || !(amount > 0)) return;
    this.noteDamage(t, amount, attacker);
    let rem = amount;
    const ownShot = attacker === t && o.primary;
    if (t.shield && !o.laser && !ownShot && !o.fall) {
      const it = t.shield.it;
      const absorb = Math.min(t.shield.energy, rem);
      t.shield.energy -= absorb; rem -= absorb;
      this.scoreDamage(attacker, t, absorb * 0.8);
      const frac = t.shield.energy / it.strength;
      if (t.shield.energy <= 0.5) this.dropShield(t);
      else if (!it.noFail && !o.burn && schance(0.02 + 0.12 * (1 - frac))) {
        this.dropShield(t);
        this.say(t, 'Shields failing!', 1.5);
      }
    }
    if (rem <= 0) return;
    const dealt = Math.min(rem, t.energy);           // overkill isn't paid for
    t.energy = Math.max(0, t.energy - rem);
    t.hitFlash = 0.25;
    if (attacker && attacker.p && attacker !== t) t.attackers[attacker.p.idx] = (t.attackers[attacker.p.idx] || 0) + dealt;
    this.scoreDamage(attacker, t, dealt);
    if (t.power > t.maxPower) t.power = t.maxPower;
    if (t.energy <= 0.5) this.killTank(t, attacker, o);
    else if (this.mode === 'SIMULTANEOUS' && t.energy < 91 && (t.p.inv.battery || 0) > 0) {
      while (t.energy < 91 && (t.p.inv.battery || 0) > 0) this.useBattery(t, true);
      t.fx = { k: 'green', t: 0.3 };
    }
  },
  noteDamage(t, amount, attacker) {
    const st = attacker && attacker.p && attacker.p.stats;
    if (!st) return;
    const dealt = Math.min(amount, t.energy + (t.shield ? t.shield.energy : 0));
    if (attacker === t) { st.selfDmg += dealt; return; }
    st.dmg += dealt;
    st.bestHit = Math.max(st.bestHit, dealt);
    if (attacker.hitSeq !== attacker.shotSeq) { attacker.hitSeq = attacker.shotSeq; st.hits++; }
  },
  // explosion damage to every tank in range
  blast(x, y, r, dmg, owner, o) {
    for (const t of this.tanks) {
      if (!t.alive || t.dying) continue;
      const d = adist(x, y, t.cx, t.cy);
      const reach = r + t.w / 2;
      if (d >= reach) continue;
      const f = 1 - d / reach;
      this.damage(t, dmg * (0.25 + 0.75 * f) * f, owner, o);
    }
  },
  killTank(t, killer, o) {
    o = o || {};
    if (!t.alive || t.dying) return;
    t.dying = true;
    t.energy = 0;
    t.killer = killer;
    t.falling = false; t.chute = false;   // blown up in mid-air: it goes up where it is
    const sc = SCORE[Cfg.scoringMode] || SCORE.STANDARD;
    if (!o.retreat && !o.mass) {
      if (killer && killer.p) {
        if (killer === t) { this.award(t.p, -sc.kill * 1.5); }
        else if (this.sameTeam(killer, t)) this.award(killer.p, -sc.kill);
        else {
          this.award(killer.p, sc.kill); killer.p.kills++;
          if (killer.p.stats) { killer.p.stats.kills++; killer.p.stats.longest = Math.max(killer.p.stats.longest, adist(killer.x, killer.y, t.x, t.y)); }
        }
      }
    }
    t.p.deaths++;
    // the last enemy falls: savour it (display speed only, never the outcome)
    if (Gfx.modern && Cfg.slowMotion && !o.mass && !o.retreat && !this.slowmoDone && this.checkRoundOver()) { this.slowmo = 1.6; this.slowmoDone = true; }
    if (o.retreat) { this.deaths.unshift(t); t.silent = true; }
    else this.deaths.push(t);
  },
  processDeaths(dt) {
    if (this.dyingNow) {
      const d = this.dyingNow;
      d.t -= dt;
      d.tank.flash = 1;
      if (d.t <= 0) {
        const t = d.tank;
        t.alive = false;
        this.dyingNow = null;
        this.deathBlast(t);
      }
      return;
    }
    if (!this.deaths.length) return;
    // let the current blast finish before the next tank goes up
    if (this.entities.some(e => e instanceof Explosion && !e.carved)) return;
    const t = this.deaths.shift();
    if (!t.silent) this.talk(t, 'die');
    this.dyingNow = { tank: t, t: t.silent ? 0.05 : 0.9 };
  },

  // as in 1.5, a tank goes out with a random bang: usually a plain blast, sometimes a big one,
  // a blast and then a bigger one, a funky bomb, a beam of light, a geyser of dirt or a burst
  // of flame (all from the shared generator, so every peer agrees)
  // the classic look's ground color for this round (cosmetic: from the terrain seed)
  flatLand() { return World.scanned ? vga(40, 26, 12) : World.cavern ? vga(53, 53, 47) : (World.seed >>> 3) & 1 ? vga(20, 63, 20) : vga(9, 35, 9); },
  deathBlast(t) {
    const sc = scaleFactor(), owner = t.killer && t.killer !== t ? t.killer : null;
    const roll = t.silent ? 0 : srand(0, 1);
    Sound.pos(t.x).bigBoom();
    if (roll < 0.44) {
      const r = srand(15, 32) * sc;
      this.spawn(new Explosion(t.cx, t.cy, r, { dmg: t.silent ? 20 : r * 2.4, owner, type: 'tank' }));
    } else if (roll < 0.56) {
      const r = srand(40, 55) * sc;
      this.spawn(new Explosion(t.cx, t.cy, r, { dmg: r * 2, owner, type: 'tank' }));
    } else if (roll < 0.64) {
      // a blast, then a second, bigger fireball
      const r = srand(15, 25) * sc, r2 = srand(38, 46) * sc, x = t.cx, y = t.cy;
      this.spawn(new Explosion(x, y, r, { dmg: r * 2.4, owner, type: 'tank' }));
      this.spawn(new Delayed(0.6, () => { this.spawn(new Explosion(x, y, r2, { dmg: r2 * 2, owner, type: 'tank' })); Sound.pos(x).bigBoom(); }));
    } else if (roll < 0.74) {
      const R = 80 * sc, n = sirand(6, 10);
      this.spawn(new Explosion(t.cx, t.cy, 14 * sc, { dmg: 45, owner, type: 'funky', color: vgaq(hsl(srand(0, 360), 1, 0.55)) }));
      for (let i = 0; i < n; i++) {
        const ang = srand(20, 160) * DEG, v = Phys.vmax() * srand(0.12, 0.3) * Math.sqrt(R / 80);
        this.spawn(new Bomblet(owner, t.cx, t.cy - 2 * World.ay, Math.cos(ang) * v, -Math.sin(ang) * v * World.ay, srand(12, 20) * sc, 80, t.cx, R));
      }
    } else if (roll < 0.83) {
      // a beam of light straight up
      this.spawn(new Explosion(t.cx, t.cy, 8 * sc, { dmg: 0, owner, type: 'tank' }));
      this.spawn(new DeathBeam(t.x, t.y - 1));
    } else if (roll < 0.92) {
      // a geyser of dirt that rains back down
      this.spawn(new Explosion(t.cx, t.cy, 10 * sc, { dmg: 25, owner, type: 'tank' }));
      this.spawn(new DirtGeyser(t.x, t.y - 2, Math.round(520 * sc)));
    } else {
      this.spawn(new Explosion(t.cx, t.cy, 12 * sc, { dmg: 30, owner, type: 'tank' }));
      this.spawn(new Liquid(t.x, t.y - 1, { owner, napalm: true, amount: 70, heat: 1, hot: false, vx: 0 }));
    }
  },

  /* =================================================== falling tanks */
  fallDamage(dist) { return Math.max(0, dist - 3) * 0.9; },
  restingOnTank(t) {
    for (const o of this.tanks) {
      if (o === t || !o.alive || o.falling) continue;
      if (Math.abs(o.top - t.y) <= 1 && Math.abs(o.x - t.x) < (o.w + t.w) / 2 - 3) return o;
    }
    return null;
  },
  updateFalling(dt) {
    if (!Cfg.tanksFall) return;
    const d = Cfg.fallingDelay;
    const base = d <= 0 ? 1e5 : (1100 / d) * (World.H / 480);
    for (const t of this.tanks) {
      if (!t.alive || t.dying) continue;
      if (!t.falling) {
        if (t.supported() || this.restingOnTank(t)) continue;
        t.falling = true; t.fallFrom = t.y; t.fallAcc = 0; t.chute = false;
        const dist = (t.landingY() - t.y) / World.ay;
        const pred = this.fallDamage(dist);
        const p = t.p;
        if ((p.para.deployed || this.mode === 'SIMULTANEOUS') && (p.inv.parachute || 0) > 0 && pred > p.para.threshold) {
          t.chute = true; p.inv.parachute--; Sound.pos(t.x).parachute();
        }
      }
      t.fallAcc += (t.chute ? base * 0.28 : base) * dt;
      while (t.fallAcc >= 1 && t.falling) {
        t.fallAcc -= 1;
        const on = this.restingOnTank(t);
        if (t.supported() || on) { this.landTank(t, on); break; }
        t.y += 1;
        if (!Cfg.impactDamage && !t.chute) {
          const dd = this.fallDamage((t.y - t.fallFrom) / World.ay) - this.fallDamage((t.y - 1 - t.fallFrom) / World.ay);
          if (dd > 0) this.damage(t, dd, this.lastShooter, { fall: true });
        }
        if (t.y >= World.H) { t.y = World.H; this.landTank(t, null); break; }
      }
    }
  },
  landTank(t, onTank) {
    t.falling = false;
    const dist = (t.y - t.fallFrom) / World.ay;
    let dmg = t.chute ? 0 : this.fallDamage(dist);
    if (onTank) { dmg += 10 + dist * 0.3; this.damage(onTank, 10 + dist * 0.4, this.lastShooter, { fall: true }); }
    t.chute = false;
    if (dmg > 0 && Cfg.impactDamage) { this.damage(t, dmg, this.lastShooter === t ? t : this.lastShooter, { fall: true }); Sound.crunch(0.15, 300, 80, 0.5); }
  },

  /* =================================================== tank state changes (called from exec) */
  useBattery(t, silent) {
    const p = t.p;
    if ((p.inv.battery || 0) <= 0 || t.energy >= 100) { if (!silent) Sound.error(); return false; }
    p.inv.battery--;
    t.energy = Math.min(100, t.energy + 10);
    if (!silent) Sound.charge();
    return true;
  },
  engageShield(t) {
    const p = t.p;
    if (!t.selShield) {
      if (t.shield) { t.shield = null; Sound.sweep(800, 200, 0.2, 0.5); }
      return;
    }
    const it = Data.byId[t.selShield];
    if (!it || it.kind !== 'shield' || (p.inv[it.id] || 0) <= 0) return;
    if (t.shield && t.shield.it === it && t.shield.energy >= it.strength - 0.5) return;
    p.inv[it.id]--;
    t.shield = { it, energy: it.strength };
    Sound.sweep(300, 1500, 0.25, 0.5);
    if (this.isLocal(t) && !t.p.ai) Toast.show(it.name + ' up');
  },

  /* =================================================== firing */
  fire(t, o) {
    o = o || {};
    const p = t.p;
    let wp = Data.byId[o.weapon || p.weapon];
    if (!wp || wp.cat !== 'W' || !Game.has(p, wp.id)) wp = Data.byId.babyMissile;
    Game.consume(p, wp.id, 1);
    p.lastPower = t.power;
    this.lastShooter = t;
    if (p.stats) p.stats.shots++;
    t.shotSeq = (t.shotSeq || 0) + 1;
    // suspended dirt: rolled once per shot
    World.suspended = Cfg.suspendDirt > 0 && schance(Cfg.suspendDirt / 100);
    let guid = null;
    const gid = o.guidance !== undefined ? o.guidance : t.guidance;
    if (gid && !Data.noGuidance[wp.id] && (p.inv[gid] || 0) > 0 && this.mode !== 'SIMULTANEOUS') {
      guid = Data.byId[gid];
      p.inv[gid]--;
    }
    t.guidance = null;
    let trig = false;
    if (t.triggers && (p.inv.contactTrigger || 0) > 0 && this.mode !== 'SIMULTANEOUS') {
      trig = true; p.inv.contactTrigger--;
      if (p.inv.contactTrigger <= 0) t.triggers = false;
    }
    this.talk(t, 'attack');
    t.lastShot = { angle: t.angle, power: t.power, weapon: wp.id };
    const sc = scaleFactor();
    if (wp.kind === 'riot') { const pv = t.pivot(0); this.spawn(new RiotWedge(pv.x, pv.y, wp.r * sc, t.angle - wp.spread, t.angle + wp.spread)); return; }
