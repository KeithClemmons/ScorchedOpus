      const s = this.state(e);
      s.trail = [];
      if (e.main && e.owner && e.age < 0.05 && e.delay <= 0) {
        const m = e.owner.muzzle ? e.owner.muzzle(0) : { x: e.x, y: e.y };
        this.add({ k: 'glow', x: m.x, y: m.y, vx: 0, vy: 0, life: 0.18, size: 3, grow: 2, c: [255, 210, 140], alpha: 0.9, front: 1 });
        for (let i = 0, n = this.n(5); i < n; i++) {
          const a = Math.atan2(e.vy / World.ay, e.vx) + rand(-0.4, 0.4), v = rand(20, 60);
          this.add({ k: 'smoke', x: m.x, y: m.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * World.ay, life: rand(0.5, 1.1), size: 0.8, grow: 3, c: [150, 150, 150], alpha: 0.35, drag: 2.5, windy: 0.3 });
        }
      }
    } else if (e instanceof Spark) {
      const col = c3(e.c);
      for (let i = 0, n = this.n(10); i < n; i++) {
        const a = rand(0, TAU), v = rand(30, 90);
        this.add({ k: 'spark', x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * World.ay, life: rand(0.2, 0.45), size: 0.35, c: mix3(col, WHITE3, 0.4), drag: 2, len: 0.04, front: 1 });
      }
    } else if (e instanceof Ring) {
      this.add({ k: 'ring', x: e.x, y: e.y, vx: 0, vy: 0, life: 0.8, size: 2, grow: World.W * 0.33, c: c3(e.c), alpha: 0.9, width: 1.5, front: 1 });
      this.shock(0.25);
    } else if (e instanceof Lightning) {
      this.shock(0.35);
    } else if (e instanceof LaserBeam) {
      this.shock(0.1);
    } else if (e instanceof PlasmaBlast) {
      this.shock(0.2);
    } else if (e instanceof Liquid && e.napalm) {
      this.burst(e.x, e.y, 6, { col: [255, 150, 60], smoke: false });
    }

  /* ------------------------------------------------ lights for the terrain shader */

      for (const t of B.tanks) if (t.alive) this.drawTank(ctx, t);

  // rain for stormy skies: screen-space streaks slanted by the wind

  // Sky Gates: glowing frames with their effect on a tag; portals are rings, blue in and orange out

  /* ------------------------------------------------ tanks */
  palette(t) {

      const p = t.pivot(i), m = t.muzzle(i, t.angle + spread);
      const x0 = Gfx.X(p.x), y0 = Gfx.Y(p.y), x1 = Gfx.X(m.x), y1 = Gfx.Y(m.y);
      const bw = Math.max(2, colW * (t.icon.triple ? 1.0 : 1.25));
      ctx.lineCap = 'round';
      ctx.strokeStyle = rgba(P.deep, 1); ctx.lineWidth = bw + Math.max(1.5, Gfx.dpr * 1.5);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.strokeStyle = rgba(mix3(P.steelHi, P.base, 0.25), 1); ctx.lineWidth = bw;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = Math.max(1, bw * 0.3);
      ctx.beginPath(); ctx.moveTo(x0, y0 - bw * 0.15); ctx.lineTo(x1, y1 - bw * 0.15); ctx.stroke();
    }
    // the art is drawn on the full-size design's grid; fit it to the battle tank's box
    const art = t.icon.rows, kx = t.w * colW / art[0].length, ky = t.hh * Gfx.sy / art.length;
    ctx.save();
    ctx.translate(Gfx.X(t.left), Gfx.Y(t.top));
    ctx.scale(kx, ky);
    ctx.lineJoin = 'round';
    (TANK_ART[t.iconIdx] || TANK_ART[0])(ctx, P, 1 / Math.min(kx, ky));
    ctx.restore();
  },
  drawShield(ctx, t) {
    const sh = t.shield, it = sh.it;
    const X = Gfx.X(t.cx), Y = Gfx.Y(t.cy), R = t.shieldRx() * Gfx.sx;
    const frac = clamp(sh.energy / it.strength, 0, 1);
    const col = c3(it.color);
    const s = this.state(t);
    if (s.shE !== undefined && sh.energy < s.shE - 0.1) s.shHit = 0.35;
    s.shE = sh.energy;
    s.shHit = Math.max(0, (s.shHit || 0) - 1 / 60);
    if (it.mag) { this.drawMagField(ctx, t, X, Gfx.Y(t.top), R, col, frac, s.shHit, it.mag); return; }
    const pulse = 0.85 + 0.15 * Math.sin(Gfx.t * 3 + t.x);
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(X, Y, R * 0.55, X, Y, R);
    g.addColorStop(0, rgba(col, 0));
    g.addColorStop(0.82, rgba(col, (0.08 + 0.12 * frac) * pulse));
    g.addColorStop(1, rgba(col, (0.28 + 0.4 * frac) * pulse + s.shHit));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(X, Y, R, 0, TAU); ctx.fill();
    ctx.lineWidth = Math.max(1, Gfx.dpr * (it.id === 'heavyShield' ? 2.2 : 1.2));
    if (it.mag) {
      const n = it.mag === 2 ? 2 : 1;
      for (let k = 0; k < n; k++) {
        ctx.setLineDash([R * 0.35, R * 0.22]);
        ctx.lineDashOffset = (Gfx.t * (k ? -40 : 30) * Gfx.dpr) % 1000;
        ctx.strokeStyle = rgba(mix3(col, WHITE3, 0.3), 0.55 + 0.35 * frac);
        ctx.beginPath(); ctx.arc(X, Y, R * (1 + k * 0.12), 0, TAU); ctx.stroke();
      }
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = rgba(mix3(col, WHITE3, 0.35), 0.35 + 0.45 * frac + s.shHit);
      ctx.beginPath(); ctx.arc(X, Y, R, 0, TAU); ctx.stroke();
      if (it.deflect) {
        ctx.strokeStyle = rgba(col, 0.25 * frac);
        for (let k = 0; k < 6; k++) {
          const a = k / 6 * TAU + Gfx.t * 0.6;
          ctx.beginPath(); ctx.arc(X, Y, R * 0.93, a, a + 0.5); ctx.stroke();
        }
      }
    }
    // glint
    ctx.fillStyle = 'rgba(255,255,255,' + (0.12 + 0.12 * frac) + ')';
    ctx.beginPath(); ctx.ellipse(X - R * 0.35, Y - R * 0.45, R * 0.28, R * 0.12, -0.6, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  },
  // mag deflector / super mag: field lines arching over the tank (as 1.5 draws them), flowing outward
  drawMagField(ctx, t, X, top, R, col, frac, hit, n) {
    const lines = n === 2 ? 3 : 2, yc = top + R * 0.25;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (let k = 0; k < lines; k++) {
      const rx = R * (0.62 + k * 0.3), ry = rx * 0.62;
      const a = (0.5 + 0.4 * frac) * (1 - k * 0.18) + hit;
      // soft glow, then the line itself with dashes that drift away from the tank
      ctx.strokeStyle = rgba(col, a * 0.28); ctx.lineWidth = Math.max(2, 4.2 * Gfx.dpr);
      ctx.beginPath(); ctx.ellipse(X, yc, rx, ry, 0, Math.PI * 1.06, Math.PI * 1.94); ctx.stroke();
      ctx.strokeStyle = rgba(mix3(col, WHITE3, 0.35), a); ctx.lineWidth = Math.max(1, 1.5 * Gfx.dpr);
      ctx.setLineDash([rx * 0.32, rx * 0.12]);
      ctx.lineDashOffset = -(Gfx.t * (18 + k * 6) * Gfx.dpr) % 1000;
      ctx.beginPath(); ctx.ellipse(X, yc, rx, ry, 0, Math.PI * 1.06, Math.PI * 1.5); ctx.stroke();
      ctx.lineDashOffset = (Gfx.t * (18 + k * 6) * Gfx.dpr) % 1000;
      ctx.beginPath(); ctx.ellipse(X, yc, rx, ry, 0, Math.PI * 1.94, Math.PI * 1.5, true); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  },
  // health bars and names over the tanks
  drawLabels(ctx, B) {
    const mode = Cfg.tankLabels;
    const aim = typeof Hud !== 'undefined' ? B.hudTank() : null;
    for (const t of B.tanks) {
      if (!t.alive) continue;
      if (t.ready && (B.mode === 'SYNCHRONOUS')) this.drawReady(ctx, t);
      if (t.falling && t.chute) this.drawChute(ctx, t);
      if (mode === 'OFF') continue;
      const X = Gfx.X(t.x), Y = Gfx.Y(t.top) - Math.max(10, 7 * Gfx.sy);
      const bw = Math.max(28 * Gfx.dpr, t.w * Gfx.sx * 1.05), bh = Math.max(3, 2.6 * Gfx.dpr);
      const e = clamp(t.energy / 100, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(X - bw / 2 - 1, Y - 1, bw + 2, bh + 2);
      ctx.fillStyle = e > 0.6 ? '#6fe38a' : e > 0.3 ? '#ffd257' : '#ff5a5a';
      ctx.fillRect(X - bw / 2, Y, bw * e, bh);
      if (t.shield) {
        const f = clamp(t.shield.energy / t.shield.it.strength, 0, 1);
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(X - bw / 2 - 1, Y + bh + 1, bw + 2, bh * 0.7 + 2);
        ctx.fillStyle = rgba(mix3(c3(t.shield.it.color), WHITE3, 0.2), 1);
        ctx.fillRect(X - bw / 2, Y + bh + 2, bw * f, bh * 0.7);
      }
      if (mode === 'NAMES' || t === aim) {
        ctx.font = '600 ' + Math.round(worldFont(0.9)) + 'px ' + FONT_UI;
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillText(t.p.name, X + Gfx.dpr, Y - 2 * Gfx.dpr + Gfx.dpr);
        ctx.fillStyle = rgba(mix3(c3(t.color), WHITE3, 0.35), 1);
        ctx.fillText(t.p.name, X, Y - 2 * Gfx.dpr);
        ctx.textAlign = 'left';
      }
    }
  },
  drawReady(ctx, t) {
    const X = Gfx.X(t.x), Y = Gfx.Y(t.top) - 18 * Gfx.dpr - Math.sin(Gfx.t * 5) * 2 * Gfx.dpr, s = 5 * Gfx.dpr;
    ctx.fillStyle = rgba(c3(t.color), 1);
    ctx.beginPath(); ctx.moveTo(X - s, Y - s); ctx.lineTo(X + s, Y - s); ctx.lineTo(X, Y + s * 0.6); ctx.closePath(); ctx.fill();
  },
  drawChute(ctx, t) {
    const X = Gfx.X(t.x), top = Gfx.Y(t.top), cy = top - 12 * World.ay * Gfx.sy, rx = 9 * Gfx.sx, ry = 6 * World.ay * Gfx.sy;
    const col = c3(t.color);
    ctx.strokeStyle = 'rgba(230,230,230,0.8)'; ctx.lineWidth = Math.max(1, Gfx.dpr);
    ctx.beginPath();
    for (const f of [-1, -0.33, 0.33, 1]) { ctx.moveTo(X + f * rx, cy); ctx.lineTo(X + f * t.w * Gfx.sx * 0.4, top); }
    ctx.stroke();
    for (let k = 0; k < 6; k++) {
      ctx.fillStyle = k & 1 ? '#f2f2f2' : rgba(col, 1);
      ctx.beginPath(); ctx.moveTo(X, cy);
      ctx.ellipse(X, cy, rx, ry, 0, Math.PI + k / 6 * Math.PI, Math.PI + (k + 1) / 6 * Math.PI);
      ctx.closePath(); ctx.fill();
    }
  },
  drawBalloons(ctx, B) {
    for (const b of B.balloons) {
      const t = b.tank;
      const fs = worldFont(0.95);
      ctx.font = '600 ' + fs.toFixed(1) + 'px ' + FONT_UI;
      const lines = Font.wrap(b.text, 24);
      const lw = Math.max(...lines.map(l => ctx.measureText(l).width));
      const pad = fs * 0.55, lh = fs * 1.2;
      const w = lw + pad * 2, h = lines.length * lh + pad * 1.2;
      let x = Gfx.X(t.x) - w / 2, y = Gfx.Y(t.top) - h - 16 * Gfx.dpr;
      x = clamp(x, Gfx.pf.x + 4, Gfx.pf.x + Gfx.pf.w - w - 4);
      const below = y < Gfx.Y(Battle.statusH * Screen.UY + 4);
      if (below) y = Gfx.Y(t.y) + 10 * Gfx.dpr;
      const a = clamp(b.t * 4, 0, 1);
      ctx.globalAlpha = a;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 10 * Gfx.dpr; ctx.shadowOffsetY = 3 * Gfx.dpr;
      VUI.rr(x, y, w, h, fs * 0.5);
      ctx.fillStyle = 'rgba(248,250,255,0.96)'; ctx.fill();
      ctx.restore();
      const tx = clamp(Gfx.X(t.x), x + 10, x + w - 10);
      ctx.fillStyle = 'rgba(248,250,255,0.96)';
      ctx.beginPath();
      if (!below) { ctx.moveTo(tx - 6 * Gfx.dpr, y + h - 1); ctx.lineTo(tx + 6 * Gfx.dpr, y + h - 1); ctx.lineTo(tx, y + h + 8 * Gfx.dpr); }
      else { ctx.moveTo(tx - 6 * Gfx.dpr, y + 1); ctx.lineTo(tx + 6 * Gfx.dpr, y + 1); ctx.lineTo(tx, y - 8 * Gfx.dpr); }
      ctx.fill();
      ctx.fillStyle = '#141824'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
      lines.forEach((l, i) => ctx.fillText(l, x + pad, y + pad * 0.7 + i * lh));
      ctx.fillStyle = rgba(c3(t.color), 1);
      ctx.fillRect(x + fs * 0.5, y, w - fs, Math.max(2, 2 * Gfx.dpr));
      ctx.globalAlpha = 1;
    }
  },

  /* ------------------------------------------------ damage numbers + kill feed */
  newRound(B) {
    this.tanksRef = B.tanks;
    this.tankInfo = new Map();
    this.parts = []; this.floaters = []; this.feed = [];
    for (const t of B.tanks) this.tankInfo.set(t, { e: t.energy, s: t.shield ? t.shield.energy : 0, alive: t.alive, dying: t.dying, acc: 0, accS: 0, accT: 0 });
  },
  watchTanks(B, dt) {
    for (const t of B.tanks) {
      // a badly damaged tank smokes (and sparks when nearly done)
      if (dt && t.alive && !t.dying && t.energy < 40 && Math.random() < dt * (40 - t.energy) * 0.25 * quality().spawn) {
        const dark = 30 + Math.random() * 30;
        this.add({ k: 'smoke', x: t.x + rand(-3, 3), y: t.top, vx: rand(-3, 3), vy: -rand(10, 22) * World.ay, life: rand(1.2, 2.2), size: 0.8, grow: 4, c: [dark, dark, dark + 4], alpha: 0.35, drag: 0.5, windy: 0.6 });
        if (t.energy < 15 && Math.random() < 0.3) this.add({ k: 'spark', x: t.x + rand(-4, 4), y: t.top + 2, vx: rand(-30, 30), vy: -rand(20, 60), life: 0.35, size: 0.3, c: [255, 200, 120], grav: 0.4, len: 0.03, front: 1 });
      }
      let info = this.tankInfo.get(t);
      if (!info) { info = { e: t.energy, s: t.shield ? t.shield.energy : 0, alive: t.alive, dying: t.dying, acc: 0, accS: 0, accT: 0 }; this.tankInfo.set(t, info); }
      const s = t.shield ? t.shield.energy : 0;
      const de = info.e - t.energy, ds = (t.shield && info.s > 0) ? info.s - s : 0;
      if (de > 0.05) { info.acc += de; info.accT = 0.25; }
      if (ds > 0.05) { info.accS += ds; info.accT = 0.25; }
      if (de < -0.5) this.floater(t, '+' + Math.round(-de), [111, 227, 138]);
      info.e = t.energy; info.s = s;
      if (info.accT > 0) {
        info.accT -= dt;
        if (info.accT <= 0) {
          if (info.acc >= 0.5) this.floater(t, '-' + Math.round(info.acc), info.acc >= 50 ? [255, 90, 70] : [255, 190, 90], info.acc >= 50);
          if (info.accS >= 0.5) this.floater(t, '-' + Math.round(info.accS), [120, 200, 255], false, true);
          info.acc = info.accS = 0;
        }
      }
      if ((t.dying || !t.alive) && !info.dying) {
        info.dying = true;
        this.killed(t);
      }
    }
  },
  floater(t, text, col, big, shield) {
    if (!Cfg.damageNumbers) return;
    this.floaters.push({ x: t.x + (shield ? t.w * 0.6 : rand(-2, 2)), y: t.top, text, col, big: !!big, t: 0, dur: 1.4 });
  },
  drawFloaters(ctx) {
    for (const f of this.floaters) {
      const k = f.t / f.dur;
      const X = Gfx.X(f.x), Y = Gfx.Y(f.y) - (14 + 36 * Math.sqrt(k)) * Gfx.dpr;
      const fs = worldFont(f.big ? 1.6 : 1.2) * (k < 0.12 ? 0.7 + k / 0.12 * 0.3 : 1);
      ctx.font = '700 ' + fs.toFixed(1) + 'px ' + FONT_DISPLAY;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
      ctx.lineWidth = Math.max(2, fs * 0.16); ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.strokeText(f.text, X, Y);
      ctx.fillStyle = rgba(f.col, 1);
      ctx.fillText(f.text, X, Y);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  },
  killed(t) {
    const k = t.killer;
    let text;
    if (t.retreated) text = t.p.name + ' retreated';
    else if (Battle.massKilled) text = t.p.name + ' was mass killed';
    else if (!k || !k.p) text = t.p.name + ' was destroyed';
    else if (k === t) text = t.p.name + ' self-destructed';
    else {
      const w = k.lastShot && Data.byId[k.lastShot.weapon];
      text = k.p.name + '  ▸  ' + t.p.name + (w ? '   ' + w.name : '');
    }
    this.feed.push({ text, col: k && k.p && k !== t ? c3(k.color) : c3(t.color), t: 0 });
    if (this.feed.length > 5) this.feed.shift();
  },
  // top-right list, in device pixels (called by the HUD)
  drawFeed(ctx, x, y) {
    if (!Cfg.killFeed) return;
    const fs = worldFont(0.85);
    ctx.font = '600 ' + fs.toFixed(1) + 'px ' + FONT_UI;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
    this.feed.forEach((f, i) => {
      const a = f.t < 0.2 ? f.t / 0.2 : f.t > 6 ? 7 - f.t : 1;
      const tw = ctx.measureText(f.text).width, h = fs * 1.55, yy = y + i * (h + 3 * Gfx.dpr);
      ctx.globalAlpha = a * 0.85;
      ctx.fillStyle = 'rgba(8,11,20,0.78)';
      VUI.rr(x - tw - fs * 1.4, yy, tw + fs * 1.4, h, h * 0.3); ctx.fill();
      ctx.fillStyle = rgba(f.col, 1); ctx.fillRect(x - tw - fs * 1.4, yy + h * 0.2, Math.max(2, 2 * Gfx.dpr), h * 0.6);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#e6eaf2';
      ctx.fillText(f.text, x - fs * 0.6, yy + h / 2);
    });
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  },

  /* ------------------------------------------------ weapons in flight */
  drawEntity(ctx, e) {
    const tr = e.trail && e instanceof Bomblet ? e.trail : e.o && e.o.trail;
    if (tr && tr.length > 3) {
      ctx.strokeStyle = 'rgba(170,180,255,0.45)'; ctx.lineWidth = Math.max(1, Gfx.dpr);
      ctx.beginPath(); ctx.moveTo(Gfx.X(tr[0] + 0.5), Gfx.Y(tr[1] + 0.5));
      for (let i = 2; i < tr.length; i += 2) ctx.lineTo(Gfx.X(tr[i] + 0.5), Gfx.Y(tr[i + 1] + 0.5));
      ctx.stroke();
    }
    if (e instanceof Shot) return this.drawShot(ctx, e);
    if (e instanceof Explosion) return this.drawExplosion(ctx, e);
    if (e instanceof Bomblet) return this.drawOrb(ctx, e.x, e.y, 1.4, c3(e.color), e.delay > 0);
    if (e instanceof Roller) return this.drawRoller(ctx, e);
    if (e instanceof Tunneler) { if (e.delay <= 0) this.drawOrb(ctx, e.x, e.y, 1.1, e.wp.kind === 'sandhog' ? [255, 90, 50] : [255, 240, 170]); return; }
    if (e instanceof Liquid) return this.drawLiquid(ctx, e);
    if (e instanceof DirtSpray) return this.drawDirtSpray(ctx, e);
    if (e instanceof RiotWedge) return this.drawRiot(ctx, e);
    if (e instanceof LaserBeam) return this.drawLaser(ctx, e);
    if (e instanceof PlasmaBlast) return this.drawPlasma(ctx, e);
    if (e instanceof Lightning) return this.drawLightning(ctx, e);
    if (e instanceof Meteor) return this.drawMeteor(ctx, e);
    if (e instanceof Chopper) return this.drawChopper(ctx, e);
    if (typeof NewFx !== 'undefined') NewFx.draw(ctx, e);
  },
  drawOrb(ctx, x, y, r, col, hidden) {
    if (hidden) return;
    const X = Gfx.X(x), Y = Gfx.Y(y), R = r * Gfx.sx;
    ctx.globalCompositeOperation = 'lighter';
    this.drawGlow(ctx, X, Y, R * 3.2, col, 0.7);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = rgba(mix3(col, WHITE3, 0.55), 1);
    ctx.beginPath(); ctx.arc(X, Y, R * 0.6, 0, TAU); ctx.fill();
  },
  shotLook(e) {
    const k = e.wp.kind, id = e.wp.id;
    if (e.color) return { col: c3(e.color), size: 1.1, glow: 1 };
    if (e.wp.airBomb) return { col: [255, 200, 150], size: 1.1, missile: true, dark: true };
    switch (k) {
      case 'missile': return { col: [255, 235, 200], size: id === 'babyMissile' ? 0.9 : 1.2, missile: true };
      case 'nuke': return { col: [255, 230, 90], size: id === 'nuke' ? 1.8 : 1.4, glow: 1.6, pulse: true };
      case 'mirv': return { col: id === 'deathsHead' ? [255, 80, 80] : [255, 160, 110], size: e.sub ? 0.9 : 1.4, missile: !e.sub };
      case 'leapfrog': return { col: [120, 255, 140], size: 1.2, glow: 1 };
      case 'funky': return { col: c3(hsl((Gfx.t * 360) % 360, 1, 0.6)), size: 1.4, glow: 1.2 };
      case 'napalm': return { col: [255, 140, 40], size: 1.3, glow: 1.3 };
      case 'tracer': return { col: e.wp.smoke ? [255, 255, 255] : [210, 225, 255], size: 0.55, glow: 0.6, thin: true };
      case 'roller': return { col: [170, 170, 180], size: 1.3, glow: 0.3 };
      case 'riotbomb': return { col: [120, 190, 255], size: 1.3, glow: 1.2 };
      case 'digger': case 'sandhog': return { col: [255, 210, 120], size: 1.1, glow: 0.8 };
      case 'dirt': case 'liquiddirt': case 'dirtcharge': return { col: [170, 120, 70], size: 1.3, glow: 0.2 };
      case 'disrupter': return { col: [110, 220, 255], size: 1.2, glow: 1.2, pulse: true };
      case 'airstrike': return { col: [255, 70, 50], size: 1.0, glow: 1.3, pulse: true };
      case 'teleport': return { col: [120, 240, 255], size: 1.1, glow: 1.5, pulse: true };
      case 'tesla': return { col: [150, 190, 255], size: 1.2, glow: 1.6, pulse: true };
      case 'buster': return { col: [255, 210, 160], size: 1.35, missile: true, dark: true };
      case 'emp': return { col: [90, 160, 255], size: 1.2, glow: 1.6, pulse: true };
      default: return { col: [255, 235, 200], size: 1.1, glow: 1 };
    }
  },
  drawShot(ctx, e) {
    if (e.delay > 0) return;
    const bi = Cfg.bombIcon;
    if (bi === 'INVISIBLE') return;
    const L = this.shotLook(e), s = this.state(e);
    const X = Gfx.X(e.x), Y = Gfx.Y(e.y);
    // glowing trail
    const tr = s.trail || [];
    if (tr.length >= 4) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      const n = tr.length / 2;
      for (let i = 1; i < n; i++) {
        const a = i / n;
        const x0 = tr[(i - 1) * 2], y0 = tr[(i - 1) * 2 + 1], x1 = tr[i * 2], y1 = tr[i * 2 + 1];
        if (Math.abs(x1 - x0) > World.W * 0.5) continue;   // wrapped around
        ctx.strokeStyle = rgba(L.col, 0.55 * a * a);
        ctx.lineWidth = Math.max(1, Gfx.sx * (L.thin ? 0.35 : 0.8) * a);
        ctx.beginPath(); ctx.moveTo(Gfx.X(x0), Gfx.Y(y0)); ctx.lineTo(Gfx.X(x1), Gfx.Y(y1)); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    const sz = (bi === 'SMALL' ? 0.6 : 1) * L.size * Gfx.sx;
    if (L.missile) {
      ctx.save(); ctx.translate(X, Y); ctx.rotate(Math.atan2(e.vy * Gfx.sy, e.vx * Gfx.sx));

'use strict';
/* =====================================================================
   The landscape behind the menus: a sunset valley with two tanks
   trading the odd (harmless, cosmetic) shot.
   ===================================================================== */

const Title = {
  world: null, tanks: [], shots: [], next: 1.5, turn: 0,
  build() {
    const saved = SR.s;
    SR.seed(19910501);
    const tw = Object.create(World);
    tw.init(Screen.W, Screen.H, Math.round(12 * Screen.UY));
    tw.seed = 5150; tw.skyType = 'SUNSET'; tw.cavern = false; tw.scanned = false;
    tw.genSky('SUNSET');
    const bump = Cfg.bumpiness, slope = Cfg.slope, rl = Cfg.randomLand, fl = Cfg.flattenPeaks;
    Cfg.bumpiness = 35; Cfg.slope = 45; Cfg.randomLand = false; Cfg.flattenPeaks = false;
    tw.genHeights();
    Cfg.bumpiness = bump; Cfg.slope = slope; Cfg.randomLand = rl; Cfg.flattenPeaks = fl;
    tw.buildPalette();
    // a warm, sunset-friendly land scheme
    const stops = [vga(60, 30, 16), vga(40, 14, 16), vga(18, 5, 12)];
    for (let i = 1; i < 256; i++) {
      const t = (i - 1) / 254, f = t * (stops.length - 1), k = Math.min(stops.length - 2, Math.floor(f));
      tw.pal[i] = mixc(stops[k], stops[k + 1], f - k);
    }
    tw.palVer = (tw.palVer || 0) + 1;
    tw.fillLand();
    tw.ver = (tw.ver || 0) + 1;
    SR.s = saved;
    this.world = tw;
    const mk = (i, x, icon) => {
      const t = new Tank({ icon, color: Data.playerColors[i], name: '' });
      t.x = Math.round(x);
      // level a pad under the tank, as a battle does, so it sits on the ground instead of over a slope
      const W = tw.W, half = Math.ceil(t.w / 2) + 1;
      let sum = 0, k = 0;
      for (let c = t.x - half; c <= t.x + half; c++) { sum += tw.surfaceY(c); k++; }
      const y0 = clamp(Math.round(sum / k), tw.top + t.hh + 4, tw.H - 1);
      for (let c = Math.max(0, t.x - half); c <= Math.min(W - 1, t.x + half); c++) {
        for (let y = y0 - t.hh - 3; y < y0; y++) if (y >= tw.top) tw.clearPixel(y * W + c);
        for (let y = y0; y < tw.H; y++) { const i = y * W + c; if (tw.land[i]) break; tw.setPixel(i, tw.dirtIndex(c, y)); }
      }
      tw.ver++;
      t.y = y0;
      t.angle = x < tw.W / 2 ? 55 : 125;
      return t;
    };
    this.tanks = [mk(0, tw.W * 0.44, 0), mk(1, tw.W * 0.86, 2)];
    this.shots = [];
  },
  update(dt) {
    const tw = this.world;
    this.next -= dt;
    const g = 0.278 * tw.W * tw.ay * 0.9;
    if (this.next <= 0) {
      this.next = rand(2.5, 4.5);
      const from = this.tanks[this.turn % 2], to = this.tanks[(this.turn + 1) % 2];
      this.turn++;
      from.target = { a: from.x < to.x ? rand(48, 66) : 180 - rand(48, 66) };
      from.fireAt = 0.6;
      from.shotTo = to;
    }
    for (const t of this.tanks) {
      if (t.target) t.angle += (t.target.a - t.angle) * Math.min(1, dt * 4);
      if (t.fireAt !== undefined) {
        t.fireAt -= dt;
        if (t.fireAt <= 0) {
          delete t.fireAt;
          // solve a simple arc that lands near the other tank
          const m = t.muzzle(0), to = t.shotTo, a = t.angle * DEG;
          const dx = (to.x + rand(-10, 10)) - m.x, dy = (to.top - m.y) / tw.ay;
          const c = Math.cos(a), s = Math.sin(a);
          const denom = 2 * c * c * (dx * Math.tan(a) - dy);
          const v = denom > 0 ? Math.sqrt(g / tw.ay * dx * dx / denom) : 200;
          this.shots.push({ x: m.x, y: m.y, vx: c * v, vy: -s * v * tw.ay, trail: [], t: 0 });
          Fx.add({ k: 'glow', x: m.x, y: m.y, vx: 0, vy: 0, life: 0.2, size: 3, grow: 2, c: [255, 210, 140], alpha: 0.9, front: 1 });
        }
      }
    }
    for (const s of this.shots) {
      s.t += dt;
      const n = 6;
      for (let i = 0; i < n && !s.done; i++) {
        s.vy += g * dt / n; s.x += s.vx * dt / n; s.y += s.vy * dt / n;
        if (s.y >= tw.H - 1 || (s.y > tw.top && tw.isLand(s.x, s.y)) || s.x < -20 || s.x > tw.W + 20) {
          s.done = true;
          const r = 16;
          Fx.burst(s.x, s.y, r, { col: [255, 190, 90] });
          Fx.add({ k: 'glow', x: s.x, y: s.y, vx: 0, vy: 0, life: 0.6, size: r * 0.8, grow: r * 0.8, c: [255, 190, 110], alpha: 0.8, front: 1 });
        }
      }
      s.trail.push(s.x, s.y);
      if (s.trail.length > 40) s.trail.splice(0, 2);
    }
    this.shots = this.shots.filter(s => !s.done);
  },
  draw(ctx, dt, kind) {
    if (!this.world || this.world.W !== Screen.W || this.world.H !== Screen.H) this.build();
    const tw = this.world;
    this.update(dt);
    Fx.update(dt);
    Gfx.updateShake(0);
    const q = quality().gl;
    const gw = Math.max(2, Math.round(Gfx.cw * q)), gh = Math.max(2, Math.round(Gfx.ch * q));
    const pf = { x: Gfx.pf.x * q, y: Gfx.pf.y * q, w: Gfx.pf.w * q, h: Gfx.pf.h * q };
    const lights = Fx.collectLights([]);
    for (const s of this.shots) lights.push({ x: s.x, y: s.y, r: 14, i: 0.6, c: [1, 0.75, 0.4] });
    if (Terra.render(tw, gw, gh, { pf, sky: 'SUNSET', sun: tw.sun, wind: 40, lights, time: Gfx.t })) ctx.drawImage(Terra.canvas, 0, 0, gw, gh, 0, 0, Gfx.cw, Gfx.ch);
    Fx.drawParts(ctx, 0);
    for (const t of this.tanks) Fx.drawTank(ctx, t);
    ctx.globalCompositeOperation = 'lighter';
    for (const s of this.shots) {
      for (let i = 2; i < s.trail.length; i += 2) {
        const a = i / s.trail.length;
        ctx.strokeStyle = 'rgba(255,220,170,' + 0.5 * a + ')';
        ctx.lineWidth = Math.max(1, Gfx.sx * 0.7 * a);
        ctx.beginPath(); ctx.moveTo(Gfx.X(s.trail[i - 2]), Gfx.Y(s.trail[i - 1])); ctx.lineTo(Gfx.X(s.trail[i]), Gfx.Y(s.trail[i + 1])); ctx.stroke();
      }
      Fx.drawGlow(ctx, Gfx.X(s.x), Gfx.Y(s.y), Gfx.sx * 3.5, [255, 230, 180], 0.9);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    Fx.drawParts(ctx, 1);
    Fx.vignette(ctx, kind === 'title' ? 0.08 : kind === 'menu' ? 0.5 : 0.3);
  }
};

/* ---------- js/hud.js ---------- */
'use strict';
/* =====================================================================
   Remastered battle HUD: player panel, power / angle gauges, weapon card,
   wind, status items, kill feed, banners, the aim guide, drag-to-aim and
   on-screen touch controls. Hit regions go into Battle.hud (UI units) so
   clicks work exactly like the original status line.
   ===================================================================== */

const Hud = {
  touch: false, drag: null, btns: [], held: null, heldT: 0,

  // item icon at (x, y) device px, h device px tall: the vector art (pixel sprite as a fallback)
  icon(ctx, id, x, y, h, gray) {
    if (ItemArt.has(id)) {
      const w = 12 * h / 10 * (Gfx.ux / Gfx.uy), sz = h * 1.12;
      ItemArt.draw(ctx, id, x + (w - sz) / 2, y + (h - sz) / 2, sz, { gray });
      return;
    }
    const spr = Icons.sprites[id];
    if (!spr) return;
    const img = spriteCanvas(spr, gray ? { tint: c => { const v = (cR(c) + cG(c) + cB(c)) / 3; return rgb(v * 0.5 + 60, v * 0.5 + 60, v * 0.5 + 60); } } : null);
    const k = h / 10;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, x, y + (10 - spr.h) / 2 * k, spr.w * k * (Gfx.ux / Gfx.uy), spr.h * k);
    ctx.imageSmoothingEnabled = true;
  },
  pill(ctx, x, y, w, h, o) {
    o = o || {};
    VUI.rr.call({ ctx }, x, y, w, h, Math.min(h * 0.32, 10 * Gfx.dpr));
    ctx.fillStyle = o.fill || 'rgba(9,12,21,0.72)'; ctx.fill();
    ctx.lineWidth = Math.max(1, Gfx.dpr);
    ctx.strokeStyle = o.edge || 'rgba(170,190,235,0.16)'; ctx.stroke();
    if (o.accent) { ctx.fillStyle = o.accent; ctx.fillRect(x + h * 0.3, y, w - h * 0.6, Math.max(2, 2 * Gfx.dpr)); }
  },
  txt(ctx, s, x, y, size, col, o) {
    o = o || {};
    ctx.font = (o.weight || 600) + ' ' + size.toFixed(1) + 'px ' + (o.display ? FONT_DISPLAY : FONT_UI);
    ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'middle';
    if (o.shadow) { ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(s, x + Gfx.dpr, y + Gfx.dpr); }
    ctx.fillStyle = col; ctx.fillText(s, x, y);
    const w = ctx.measureText(s).width;
    ctx.textAlign = 'left';
    return w;
  },
  reg(id, x, y, w, h) { Battle.hud.push({ id, x: (x - Gfx.pf.x) / Gfx.ux, y: (y - Gfx.pf.y) / Gfx.uy, w: w / Gfx.ux, h: h / Gfx.uy }); },

  /* ------------------------------------------------ per frame */
  update(dt) {
    // drag-to-aim
    const t = Battle.aimTank();
    if (this.drag) {
      const d = this.drag;
      if (!t || t !== d.tank || Battle.waitHost || !(Input.buttons & 1)) { this.drag = null; Gfx.canvas.style.cursor = 'default'; }
      else {
        // a plain click (or the first half of a double-click) doesn't re-aim; a drag does
        if (!d.moved && Math.hypot(Input.x - d.x, (Input.y - d.y) / World.ay) > World.W * 0.015) d.moved = true;
        const p = t.pivot(0);
        const dx = Input.x - p.x, dy = (p.y - Input.y) / World.ay;
        if (d.moved && Math.hypot(dx, dy) > 3) {
          let a = Math.atan2(Math.max(0, dy), dx) / DEG;
          if (dy < 0) a = dx >= 0 ? 0 : 180;
          t.angle = clamp(Math.round(a), 0, 180);
          const pw = Math.hypot(dx, dy) / (World.W * 0.45) * 1000;
          t.power = clamp(Math.round(pw), 0, t.maxPower);
        }
      }
    }
    // held touch buttons repeat
    if (this.held) {
      if (!(Input.buttons & 1)) this.held = null;
      else {
        this.heldT -= dt;
        if (this.heldT <= 0) { this.heldT = 0.045; this.press(this.held, true); }
      }
    }
  },
  mouse(ev) {
    if (ev.kind === 'down' && ev.pointer === 'touch') this.touch = true;
    // on-screen buttons
    if (this.touchOn() && (ev.kind === 'down' || ev.kind === 'up')) {
      const dx = Gfx.UXp(ev.ux), dy = Gfx.UYp(ev.uy);
      for (const b of this.btns) {
        if (dx >= b.x && dx < b.x + b.w && dy >= b.y && dy < b.y + b.h) {
          if (ev.kind === 'down') {
            Sound.click();
            this.press(b.id, false);
            if (b.repeat) { this.held = b.id; this.heldT = 0.35; }
          }
          return true;
        }
      }
    }
    if (ev.kind === 'up') {
      if (this.drag) {
        const d = this.drag; this.drag = null; Gfx.canvas.style.cursor = 'default';
        if (!d.moved) { const tk = Battle.tankAt(ev.x, ev.y); if (tk && tk !== d.tank) Panels.tankInfo(tk); }
        return true;
      }
      return false;
    }
    if (ev.kind !== 'down' || ev.button !== 0) return false;
    const t = Battle.aimTank();
    if (!t || Battle.waitHost || UI.top()) return false;
    // HUD regions keep their classic behavior
    for (const r of Battle.hud) if (ev.ux >= r.x && ev.ux < r.x + r.w && ev.uy >= r.y && ev.uy < r.y + r.h) return false;
    if (ev.uy <= Battle.statusH + 1 || ev.ux < 0 || ev.ux > Screen.UW || ev.uy > Screen.UH) return false;
    if (Cfg.dragAim === false) return false;
    this.drag = { tank: t, moved: false, x: ev.x, y: ev.y };
    Gfx.canvas.style.cursor = 'crosshair';
    return true;
  },
  press(id, repeat) {
    const t = Battle.aimTank();
    if (Battle.mode === 'SIMULTANEOUS') {
      const mine = Battle.tanks.find(tk => tk.alive && !tk.dying && Battle.isLocal(tk));
      if (!mine) return;
      const i = mine.p.idx;
      if (id === 'fire') { if (!mine.busy) Battle.request({ c: 'sfire', tank: i }); }
      else if (id === 'weapon') Battle.request({ c: 'swpn', tank: i });
      else if (id === 'angL') Battle.request({ c: 'nudge', tank: i, a: 1 });
      else if (id === 'angR') Battle.request({ c: 'nudge', tank: i, a: -1 });
      else if (id === 'powU') Battle.request({ c: 'nudge', tank: i, p: 5 });
      else if (id === 'powD') Battle.request({ c: 'nudge', tank: i, p: -5 });
      return;
    }
    if (!t || Battle.waitHost) return;
    switch (id) {
      case 'fire': if (!repeat) Battle.humanFire(); break;
      case 'weapon': if (!repeat) { t.p.weapon = Battle.nextWeaponId(t, 1); } break;
      case 'angL': t.angle = clamp(t.angle + 1, 0, 180); break;
      case 'angR': t.angle = clamp(t.angle - 1, 0, 180); break;
      case 'powU': t.power = clamp(t.power + (repeat ? 6 : 2), 0, t.maxPower); break;
      case 'powD': t.power = clamp(t.power - (repeat ? 6 : 2), 0, t.maxPower); break;
      case 'tank': if (!repeat) Panels.tankControl(t); break;
      case 'chat': break;   // opened from the tap itself (see chatTapped)
    }
  },
  // the chat button is handled inside the tap itself so the phone keyboard can open
  chatTapped(ux, uy) {
    if (!this.touchOn()) return false;
    const dx = Gfx.UXp(ux), dy = Gfx.UYp(uy);
    return this.btns.some(b => b.id === 'chat' && dx >= b.x && dx < b.x + b.w && dy >= b.y && dy < b.y + b.h);
  },
  touchOn() { return Cfg.touchControls === 'ON' || (Cfg.touchControls !== 'OFF' && this.touch); },

  /* ------------------------------------------------ drawing */
  draw(ctx) {
    Battle.hud = [];
    const B = Battle;
    if (B.mode === 'SIMULTANEOUS') this.drawSimul(ctx);
    else this.drawTop(ctx);
    // kill feed under the wind readout, right side
    Fx.drawFeed(ctx, Gfx.pf.x + Gfx.pf.w - 6 * Gfx.dpr, this.bottomY + 4 * Gfx.dpr);
    this.drawBanner(ctx);
    if (this.touchOn()) this.drawTouch(ctx);
    else this.btns = [];
  },
  // where the top panels go: one row across the top of the playfield or, on tall screens
  // with room to spare above it (phones held upright), two bigger rows in that space
  layoutTop() {
    const d = Gfx.dpr, pf = Gfx.pf, gap = 6 * d;
    if (pf.y > 2 * 44 * d + 3 * gap) {
      const H = clamp((pf.y - 3 * gap) / 2, 40 * d, 60 * d);
      const x0 = 8 * d, W = Gfx.cw - 16 * d, y1 = pf.y - 2 * H - 2 * gap, y2 = y1 + H + gap;
      const half = (W - gap) / 2, pw = W * 0.58;
      return {
        H, below: pf.y + 6 * d,
        rects: { name: [x0, y1, half, H], weapon: [x0 + half + gap, y1, half, H], power: [x0, y2, pw - gap / 2, H], angle: [x0 + pw + gap / 2, y2, W - pw - gap / 2, H] }
      };
    }
    const H = clamp(pf.h * 0.062, 30 * d, 64 * d);
    const x0 = pf.x + 6 * d, W = pf.w - 12 * d, top = pf.y + 3 * d;
    const w1 = W * 0.27, w2 = W * 0.26, w3 = W * 0.17, w4 = W - w1 - w2 - w3 - 3 * gap;
    return {
      H, below: top + H + 5 * d,
      rects: { name: [x0, top, w1, H], power: [x0 + w1 + gap, top, w2, H], angle: [x0 + w1 + w2 + 2 * gap, top, w3, H], weapon: [x0 + w1 + w2 + w3 + 3 * gap, top, w4, H] }
    };
  },
  drawTop(ctx) {
    const t = Battle.hudTank(), L = this.layoutTop(), d = Gfx.dpr;
    let y = L.below;
    const wh = this.drawWind(ctx, y);
    y += wh + 5 * d;
    const wl = this.drawWallsTag(ctx, y);
    if (wl) y += wl + 5 * d;
    if (t && Cfg.statusBar) { this.drawStatus(ctx, t, y, L.H * 0.72); y += L.H * 0.72 + 5 * d; }
    this.bottomY = y;
    if (!t) return;
    const R = L.rects;
    this.drawName(ctx, t, R.name);
    this.drawPower(ctx, t, R.power);
    this.drawAngle(ctx, t, R.angle);
    this.drawWeapon(ctx, t, R.weapon);
  },
  drawName(ctx, t, [x, top, pw, H]) {
    const col = c3(t.color), big = H * 0.5;
    this.pill(ctx, x, top, pw, H, { accent: rgba(col, 1) });
    ctx.fillStyle = rgba(col, 1);
    ctx.beginPath(); ctx.arc(x + H * 0.36, top + H * 0.42, H * 0.15, 0, TAU); ctx.fill();
    const name = t.p.name.length > 14 ? t.p.name.slice(0, 13) + '…' : t.p.name;
    this.txt(ctx, name, x + H * 0.62, top + H * 0.4, big * 0.78, '#eef2f8', { weight: 700 });
    const e = clamp(t.energy / 100, 0, 1), bx = x + H * 0.62, bw = pw - H * 0.62 - H * 0.3, by = top + H * 0.72;
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(bx, by, bw, Math.max(2, H * 0.09));
    ctx.fillStyle = e > 0.6 ? '#6fe38a' : e > 0.3 ? '#ffd257' : '#ff5a5a'; ctx.fillRect(bx, by, bw * e, Math.max(2, H * 0.09));
    if (t.shield) {
      const sc = rgba(mix3(c3(t.shield.it.color), WHITE3, 0.35), 1), f = clamp(t.shield.energy / t.shield.it.strength, 0, 1);
      ctx.fillStyle = sc; ctx.fillRect(bx, by + H * 0.12, bw * f, Math.max(1, H * 0.05));
      this.txt(ctx, 'SHIELD ' + Math.round(f * 100) + '%', x + pw - H * 0.3, top + H * 0.4, big * 0.5, sc, { weight: 700, align: 'right' });
    }
    this.reg('name', x, top, pw, H);
  },
  drawPower(ctx, t, [x, top, pww, H]) {
    const col = c3(t.color), colCss = rgba(mix3(col, WHITE3, 0.2), 1), fs = H * 0.27, big = H * 0.5;
    this.pill(ctx, x, top, pww, H);
    this.txt(ctx, 'POWER', x + H * 0.3, top + H * 0.3, fs, '#8f9bb5', { weight: 700 });
    this.txt(ctx, String(Math.round(t.power)), x + pww - H * 0.3, top + H * 0.34, big, colCss, { align: 'right', display: true });
    const gx = x + H * 0.3, gw = pww - H * 0.6, gy = top + H * 0.68, gh = Math.max(3, H * 0.13);
    ctx.fillStyle = 'rgba(255,255,255,0.09)'; ctx.fillRect(gx, gy, gw, gh);
    const pg = ctx.createLinearGradient(gx, 0, gx + gw, 0);
    pg.addColorStop(0, rgba(mix3(col, [0, 0, 0], 0.3), 1)); pg.addColorStop(1, rgba(mix3(col, WHITE3, 0.4), 1));
    ctx.fillStyle = pg; ctx.fillRect(gx, gy, gw * clamp(t.power / 1000, 0, 1), gh);
    ctx.fillStyle = '#ff5a5a'; ctx.fillRect(gx + gw * clamp(t.maxPower / 1000, 0, 1) - Gfx.dpr, gy - gh * 0.4, Math.max(2, 2 * Gfx.dpr), gh * 1.8);
    this.reg('power', x, top, pww, H);
  },
  drawAngle(ctx, t, [x, top, aw, H]) {
    const colCss = rgba(mix3(c3(t.color), WHITE3, 0.2), 1), fs = H * 0.27, big = H * 0.5;
    this.pill(ctx, x, top, aw, H);
    const disp = t.angle <= 90 ? t.angle : 180 - t.angle;
    this.txt(ctx, 'ANGLE', x + H * 0.3, top + H * 0.3, fs, '#8f9bb5', { weight: 700 });
    this.txt(ctx, Math.round(disp) + '°', x + H * 0.3, top + H * 0.68, big * 0.9, colCss, { display: true });
    const dcx = x + aw - H * 0.55, dcy = top + H * 0.72, dr = H * 0.38;
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = Math.max(1, Gfx.dpr);
    ctx.beginPath(); ctx.arc(dcx, dcy, dr, Math.PI, TAU); ctx.stroke();
    ctx.strokeStyle = colCss; ctx.lineWidth = Math.max(2, 2 * Gfx.dpr); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(dcx, dcy); ctx.lineTo(dcx + Math.cos(t.angle * DEG) * dr, dcy - Math.sin(t.angle * DEG) * dr); ctx.stroke();
    this.reg('angle', x, top, aw, H);
  },
  drawWeapon(ctx, t, [x, top, ww, H]) {
    const fs = H * 0.27, big = H * 0.5;
    const wp = Data.byId[t.p.weapon];
    const cnt = wp.id === 'babyMissile' ? '∞' : String(t.p.inv[wp.id] || 0);
    this.pill(ctx, x, top, ww, H);
    this.icon(ctx, wp.id, x + H * 0.25, top + H * 0.18, H * 0.64);
    const nx = x + H * 0.25 + 13 * Gfx.ux * (H * 0.064);
    // long names shrink to fit the card
    let size = big * 0.62;
    ctx.font = '700 ' + size.toFixed(1) + 'px ' + FONT_UI;
    const room = x + ww - H * 0.25 - nx, tw = ctx.measureText(wp.name).width;
    if (tw > room) size = Math.max(size * 0.55, size * room / tw);
    this.txt(ctx, wp.name, nx, top + H * 0.36, size, '#eef2f8', { weight: 700 });
    this.txt(ctx, '× ' + cnt, nx, top + H * 0.72, fs * 1.05, '#ffb640', { weight: 700 });
    this.txt(ctx, '◀ ▶', x + ww - H * 0.3, top + H * 0.72, fs * 0.9, 'rgba(160,175,205,0.7)', { align: 'right' });
    this.reg('weapon', x, top, ww, H);
  },
  drawStatus(ctx, t, y, h) {
    const p = t.p;
    let x = Gfx.pf.x + 6 * Gfx.dpr;
    const fs = h * 0.42;
    const item = (id, icon, count, on, extra) => {
      const label = String(count) + (extra ? '  ' + extra : '');
      ctx.font = '700 ' + fs.toFixed(1) + 'px ' + FONT_UI;
      const w = h * 1.5 + ctx.measureText(label).width + h * 0.3;
      this.pill(ctx, x, y, w, h, { fill: on ? 'rgba(40,52,80,0.8)' : 'rgba(9,12,21,0.65)', edge: on ? 'rgba(255,182,64,0.55)' : undefined });
      this.icon(ctx, icon, x + h * 0.2, y + h * 0.12, h * 0.76, !on);
      this.txt(ctx, label, x + h * 1.45, y + h * 0.52, fs, on ? '#eef2f8' : '#8f9bb5', { weight: 700 });
      this.reg(id, x, y, w, h);
      x += w + 4 * Gfx.dpr;
    };
    item('batt', 'battery', p.inv.battery || 0, (p.inv.battery || 0) > 0 && t.energy < 100);
    item('para', 'parachute', p.inv.parachute || 0, p.para.deployed && (p.inv.parachute || 0) > 0);
    const shId = t.selShield || (t.shield ? t.shield.it.id : null);
    const pct = t.shield ? Math.round(t.shield.energy / t.shield.it.strength * 100) + '%' : '0%';
    item('shld', shId || 'none', shId ? (p.inv[shId] || 0) : 0, !!t.shield, pct);
    item('guid', t.guidance || 'none', t.guidance ? (p.inv[t.guidance] || 0) : 0, !!t.guidance);
    item('trig', 'contactTrigger', p.inv.contactTrigger || 0, t.triggers);
    if (t.icon.mobile) item('fuel', 'fuelTank', Math.ceil((p.fuel || 0) / 10), (p.fuel || 0) > 0);
    // max power
    this.txt(ctx, 'MAX ' + t.maxPower, x + 4 * Gfx.dpr, y + h * 0.52, fs, '#8f9bb5', { weight: 700 });
  },
  drawWind(ctx, y) {
    const w = Battle.wind;
    const h = clamp(Gfx.pf.h * 0.03, 16 * Gfx.dpr, 30 * Gfx.dpr), fs = h * 0.56;
    const label = w === 0 ? 'CALM' : 'WIND ' + Math.abs(w);
    ctx.font = '700 ' + fs.toFixed(1) + 'px ' + FONT_UI;
    const tw = ctx.measureText(label).width, aw = w === 0 ? 0 : h * 1.6;
    const W = tw + aw + h * 0.9, x = Gfx.pf.x + Gfx.pf.w - 6 * Gfx.dpr - W;
    this.windH = h;
    this.pill(ctx, x, y, W, h);
    this.txt(ctx, label, x + h * 0.45, y + h * 0.53, fs, '#7fe0ff', { weight: 700 });
    if (w !== 0) {
      const ax = x + h * 0.45 + tw + h * 0.35, cy = y + h / 2, len = aw * 0.9, dir = w > 0 ? 1 : -1;
      const x0 = dir > 0 ? ax : ax + len, x1 = dir > 0 ? ax + len : ax;
      ctx.strokeStyle = '#7fe0ff'; ctx.lineWidth = Math.max(1.5, 1.5 * Gfx.dpr); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x1, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x1, cy); ctx.lineTo(x1 - dir * h * 0.28, cy - h * 0.22); ctx.moveTo(x1, cy); ctx.lineTo(x1 - dir * h * 0.28, cy + h * 0.22); ctx.stroke();
      // moving streak shows strength
      const k = (Gfx.t * (0.4 + Math.abs(w) / 120)) % 1;
      ctx.fillStyle = 'rgba(200,245,255,0.8)';
      ctx.fillRect(x0 + (x1 - x0) * k - Gfx.dpr, cy - h * 0.12, 2 * Gfx.dpr, h * 0.24);
    }
    return h;
  },
  // what the lines at the battlefield's edges mean
  drawWallsTag(ctx, y) {
    const w = Battle.walls;
    const info = { CONCRETE: ['WALLS: CONCRETE', '#c8c8d2'], PADDED: ['WALLS: PADDED', '#8ab8ff'], RUBBER: ['WALLS: RUBBER', '#6fe38a'],
      SPRING: ['WALLS: SPRING', '#ffd257'], WRAP: ['WALLS: WRAP \u21C4', '#c89bff'] }[w];
    if (!info) return 0;
    const h = clamp(Gfx.pf.h * 0.026, 14 * Gfx.dpr, 26 * Gfx.dpr), fs = h * 0.56;
    ctx.font = '700 ' + fs.toFixed(1) + 'px ' + FONT_UI;
    const W = ctx.measureText(info[0]).width + h * 0.9, x = Gfx.pf.x + Gfx.pf.w - 6 * Gfx.dpr - W;
    this.pill(ctx, x, y, W, h);
    this.txt(ctx, info[0], x + h * 0.45, y + h * 0.53, fs, info[1], { weight: 700 });
    return h;
  },
  drawSimul(ctx) {
    const B = Battle, n = B.tanks.length;
    const top = Gfx.pf.y + 3 * Gfx.dpr, W = Gfx.pf.w - 12 * Gfx.dpr, gap = 4 * Gfx.dpr;
    const cw = (W - gap * (n - 1)) / n, H = clamp(Gfx.pf.h * 0.055, 26 * Gfx.dpr, 56 * Gfx.dpr);
    B.tanks.forEach((t, i) => {
      const x = Gfx.pf.x + 6 * Gfx.dpr + i * (cw + gap);
      const col = c3(t.color);
      this.pill(ctx, x, top, cw, H, { accent: t.alive ? rgba(col, 1) : 'rgba(80,80,90,1)', fill: t.alive ? undefined : 'rgba(9,12,21,0.45)' });
      if (!t.alive) { this.txt(ctx, t.p.name.slice(0, 8), x + cw / 2, top + H / 2, H * 0.3, '#5d6477', { align: 'center' }); return; }
      this.icon(ctx, t.p.weapon, x + H * 0.15, top + H * 0.2, H * 0.55);
      this.txt(ctx, String(Math.round(t.power)), x + cw - H * 0.2, top + H * 0.38, H * 0.36, rgba(mix3(col, WHITE3, 0.25), 1), { align: 'right', display: true });
      const e = clamp(t.energy / 100, 0, 1);
      ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(x + H * 0.15, top + H * 0.8, cw - H * 0.3, Math.max(2, H * 0.08));
      ctx.fillStyle = e > 0.6 ? '#6fe38a' : e > 0.3 ? '#ffd257' : '#ff5a5a'; ctx.fillRect(x + H * 0.15, top + H * 0.8, (cw - H * 0.3) * e, Math.max(2, H * 0.08));
    });
    const wh = this.drawWind(ctx, top + H + 5 * Gfx.dpr);
    this.bottomY = top + H + 10 * Gfx.dpr + wh;
  },
  drawBanner(ctx) {
    const B = Battle;
    let msg = null, col = '#ffffff', pulse = false;
    if (B.mode === 'SYNCHRONOUS' && B.state === 'syncaim') {
      const t = B.aimTank();
      if (t && !B.waitHost) { msg = t.p.name + ', aim your weapon'; col = rgba(mix3(c3(t.color), WHITE3, 0.3), 1); }
      else msg = 'Waiting for ' + B.syncWait.size + ' player' + (B.syncWait.size === 1 ? '' : 's') + ' to aim…';
    } else if (Net.online && B.mode === 'SEQUENTIAL' && B.cur && (B.state === 'human' || B.state === 'remote')) {
      if (!B.isLocal(B.cur) && !B.cur.p.ai) { msg = 'Waiting for ' + B.cur.p.name + '…'; col = rgba(mix3(c3(B.cur.color), WHITE3, 0.3), 1); }
      else if (B.isLocal(B.cur) && B.yourTurnT > 0) { msg = 'Your turn!'; col = rgba(mix3(c3(B.cur.color), WHITE3, 0.3), 1); pulse = true; }
    }
    if (!msg) return;
    const fs = worldFont(pulse ? 1.7 : 1.1);
    const y = Math.max(this.bottomY || 0, Gfx.pf.y) + fs * 1.6;
    ctx.globalAlpha = pulse ? 0.75 + 0.25 * Math.sin(Gfx.t * 10) : 1;
    ctx.font = (pulse ? '400 ' : '600 ') + fs.toFixed(1) + 'px ' + (pulse ? FONT_DISPLAY : FONT_UI);
    const w = ctx.measureText(msg).width + fs * 1.6;
    this.pill(ctx, Gfx.pf.x + (Gfx.pf.w - w) / 2, y - fs * 0.85, w, fs * 1.7);
    this.txt(ctx, msg, Gfx.pf.x + Gfx.pf.w / 2, y, fs, col, { align: 'center', weight: pulse ? 400 : 600, display: pulse });
    ctx.globalAlpha = 1;
  },

  /* ------------------------------------------------ aim guide */
  drawAimGuide(ctx) {
    const mode = Cfg.aimGuide;
    if (!mode || mode === 'OFF') return;
    const B = Battle;
    const list = [];
    if (B.mode === 'SIMULTANEOUS') { if (B.state === 'play') for (const t of B.tanks) if (t.alive && !t.dying && B.isLocal(t)) list.push(t); }
    else { const t = B.aimTank(); if (t && !B.waitHost) list.push(t); }
    for (const t of list) {
      const m = t.muzzle(0), v = Phys.launch(t.angle, Math.min(t.power, t.maxPower));
      const full = mode === 'FULL';
      const g = Phys.g(), wa = full ? Phys.windAcc(B.wind) : 0, drag = full ? Phys.drag() : 0;
      let x = m.x, y = m.y, vx = v.vx, vy = v.vy;
      const h = 1 / 120, maxT = full ? 12 : 0.5;
      const pts = [];
      let hit = null;
      for (let s = 0, time = 0; time < maxT; s++, time += h) {
        vx += (wa - drag * vx) * h; vy += (g - drag * vy) * h;
        x += vx * h; y += vy * h;
        if (full) {
          const o = { x, y, vx, vy };
          const r = applyWalls(o, B.walls);
          x = o.x; y = o.y; vx = o.vx; vy = o.vy;
          if (r !== 'ok' || y >= World.H) { hit = { x, y }; break; }
          if (y >= World.top && x >= 0 && x < World.W && World.isLand(x, y)) { hit = { x, y }; break; }
          let th = null;
          for (const tk of B.tanks) if (tk.alive && tk !== t && tk.contains(x, y)) th = tk;
          if (th) { hit = { x, y, tank: th }; break; }
        }
        if (s % 5 === 0) pts.push(x, y, time);
      }
      const col = rgba(mix3(c3(t.color), WHITE3, 0.45), 1);
      ctx.fillStyle = col;
      for (let i = 0; i < pts.length; i += 3) {
        const a = full ? 0.75 : 0.85 * (1 - pts[i + 2] / maxT);
        if (pts[i] < -World.W * 0.2 || pts[i] > World.W * 1.2) continue;
        ctx.globalAlpha = Math.max(0.08, a);
        ctx.beginPath(); ctx.arc(Gfx.X(pts[i]), Gfx.Y(pts[i + 1]), Math.max(1.2, Gfx.sx * 0.38), 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (hit) {
        const X = Gfx.X(hit.x), Y = Gfx.Y(hit.y), r = 5 * Gfx.dpr + Math.sin(Gfx.t * 6) * Gfx.dpr;
        ctx.strokeStyle = hit.tank ? '#ff6060' : col; ctx.lineWidth = Math.max(1.5, 1.5 * Gfx.dpr);
        ctx.beginPath(); ctx.arc(X, Y, r, 0, TAU); ctx.moveTo(X - r * 1.6, Y); ctx.lineTo(X - r * 0.5, Y); ctx.moveTo(X + r * 0.5, Y); ctx.lineTo(X + r * 1.6, Y); ctx.stroke();
      }
      if (this.drag && this.drag.tank === t) {
        const p = t.pivot(0);
        ctx.setLineDash([4 * Gfx.dpr, 4 * Gfx.dpr]);
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = Math.max(1, Gfx.dpr);
        ctx.beginPath(); ctx.moveTo(Gfx.X(p.x), Gfx.Y(p.y)); ctx.lineTo(Gfx.X(Input.x), Gfx.Y(Input.y)); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  },

  /* ------------------------------------------------ touch controls */
  drawTouch(ctx) {
    const B = Battle;
    const mine = B.mode === 'SIMULTANEOUS' ? B.tanks.find(tk => tk.alive && !tk.dying && B.isLocal(tk) && B.state === 'play') : B.aimTank();
    this.btns = [];
    const aiming = mine && !B.waitHost;
    if (!aiming && !Net.online) return;
    const s = Math.round(clamp(Math.min(Gfx.cw, Gfx.ch) * 0.11, 44 * Gfx.dpr, 76 * Gfx.dpr));
    const gap = s * 0.18;
    const below = Gfx.ch - (Gfx.pf.y + Gfx.pf.h) > s * 2.4;
    const by = below ? Gfx.pf.y + Gfx.pf.h + (Gfx.ch - Gfx.pf.y - Gfx.pf.h - s * 2 - gap) / 2 : Gfx.ch - s * 2 - gap - 10 * Gfx.dpr;
    const lx = 10 * Gfx.dpr + (below ? 0 : 0), rx = Gfx.cw - 10 * Gfx.dpr;
    const add = (id, x, y, w, h, label, o) => {
      o = o || {};
      this.btns.push({ id, x, y, w, h, repeat: !!o.repeat });
      ctx.globalAlpha = 0.9;
      VUI.rr.call({ ctx }, x, y, w, h, Math.min(w, h) * 0.28);
      ctx.fillStyle = o.fill || 'rgba(12,16,28,0.72)'; ctx.fill();
      ctx.lineWidth = Math.max(1, Gfx.dpr); ctx.strokeStyle = o.edge || 'rgba(170,190,235,0.3)'; ctx.stroke();
      ctx.globalAlpha = 1;
      this.txt(ctx, label, x + w / 2, y + h / 2, (o.size || 0.38) * Math.min(w, h * 1.3), o.col || '#eef2f8', { align: 'center', weight: 700, display: !!o.display });
    };
    const fw = s * 1.9;
    if (Net.online) add('chat', rx - fw, by + s * 0.35 - s * 0.62 - gap, fw, s * 0.62, 'CHAT', { size: 0.34 });
    if (!aiming) return;
    // left cluster: angle and power
    add('angL', lx, by + s + gap, s, s, '⟲', { repeat: true, size: 0.5 });
    add('angR', lx + (s + gap) * 2, by + s + gap, s, s, '⟳', { repeat: true, size: 0.5 });
    add('powU', lx + s + gap, by, s, s, '▲', { repeat: true });
    add('powD', lx + s + gap, by + s + gap, s, s, '▼', { repeat: true });
    // right cluster: weapon, tank panel, fire
    add('fire', rx - fw, by + s * 0.35, fw, s * 1.65, 'FIRE', { fill: 'rgba(200,60,40,0.85)', edge: 'rgba(255,190,150,0.7)', size: 0.3, display: true });
    add('weapon', rx - fw - gap - s, by, s, s, '↻', { size: 0.5 });
    if (B.mode !== 'SIMULTANEOUS') add('tank', rx - fw - gap - s, by + s + gap, s, s, '⚙', { size: 0.5 });
  }
};

/* ---------- js/game.js ---------- */
'use strict';
/* =====================================================================
   Game flow (players, rounds, shopping, interest, save/restore), the
   network game flow the host drives, the scene manager / main loop, and
   boot.
   ===================================================================== */

const DEFAULT_KEYS = [
  { ccw: 'a', cw: 'd', up: 'w', down: 's', fire: 'space', weapon: 'tab' },
  { ccw: 'arrowleft', cw: 'arrowright', up: 'arrowup', down: 'arrowdown', fire: 'enter', weapon: 'shift' },
  { ccw: 'j', cw: 'l', up: 'i', down: 'k', fire: 'u', weapon: 'o' },
  { ccw: '4', cw: '6', up: '8', down: '5', fire: '0', weapon: '.' }
];

// per-game numbers behind the end-of-game awards (updated by the shared simulation)
function newStats() { return { shots: 0, hits: 0, dmg: 0, kills: 0, selfDmg: 0, bestHit: 0, longest: 0, survived: 0, spent: 0 }; }

const Game = {
  players: [], round: 0, rounds: 10, active: false, online: false, finished: false, seed: 1,
  teamCash: {}, teamBank: {}, shopPlayer: null, interestTotal: 0, shopWait: null, netWaitList: [],

  newPlayer(idx) {
    const prev = (Cfg.lastPlayers && Cfg.lastPlayers[idx]) || {};
    const ai = prev.ai !== undefined ? prev.ai : (idx === 0 ? null : 'Moron');
    return {
      idx, name: prev.name || '', color: Data.playerColors[idx], ai, aiHidden: null, owner: null,
      icon: prev.icon !== undefined ? clamp(prev.icon, 0, TankIcons.length - 1) : 0,
      team: prev.team !== undefined ? prev.team : idx % 2,
      cash: 0, score: 0, roundPts: 0, kills: 0, deaths: 0, wins: 0,
      inv: {}, fuel: 0, para: { deployed: true, threshold: 5 }, autoDefense: false,
      keys: Object.assign({}, DEFAULT_KEYS[idx % 4], prev.keys || {}),
      weapon: 'babyMissile', lastPower: 200, aiMem: {}, bank: 0, interest: 0, interestTotal: 0,
      humanName: prev.ai ? '' : (prev.name || ''), stats: newStats()
    };
  },
  computerName(p) {
    const used = new Set(this.players.filter(q => q !== p).map(q => q.name));
    const avail = Data.computerNames.filter(n => !used.has(n));
    return pick(avail.length ? avail : Data.computerNames);
  },
  maxTeams() { return clamp(Math.ceil(this.players.length / 2), 2, 5); },

  /* ---------------- flow (offline) ---------------- */
  start() {
    UI.clear();
    this.players = []; this.rounds = Cfg.rounds; this.round = 0; this.seed = irand(1, 1e6);
    this.online = false; this.finished = false;
    const n = Cfg.players;
    let i = 0;
    const next = () => {
      if (i >= n) { this.saveRoster(); this.begin(); return; }
      const p = this.newPlayer(i);
      if (p.ai && (!p.name || this.players.some(q => q.name === p.name))) p.name = this.computerName(p);
      this.players.push(p);
      App.set(new PlayerSetupScene(i++, p, next));
    };
    next();
  },
  saveRoster() {
    Cfg.lastPlayers = this.players.map(p => ({ name: p.name, ai: p.ai, icon: p.icon, team: p.team, keys: p.keys }));
    Store.set('scorch.cfg', Object.assign({}, Store.get('scorch.cfg', {}), { lastPlayers: Cfg.lastPlayers }));
  },
  begin() {
    if (!Net.online) applyGraphicsMode();   // FIT SCREEN: fit the window as it is now
    this.active = true; this.round = 1; this.teamCash = {}; this.interestTotal = 0;
    for (const p of this.players) { p.cash = Cfg.cashAtStart; p.inv = {}; p.fuel = 0; p.stats = newStats(); }
    if (Cfg.teams === 'CORPORATE') for (const p of this.players) this.teamCash[p.team] = (this.teamCash[p.team] || 0) + Cfg.cashAtStart;
    if (Cfg.cashAtStart > 0) this.shopPhase(() => this.battle());
    else this.battle();
  },
  shopPhase(then) {
    const queue = this.players.slice();
    const next = () => {
      const p = queue.shift();
      if (!p) { this.shopPlayer = null; Market.settle(); then(); return; }
      if (p.ai) { if (Cfg.computersBuy) AI.shop(p); next(); return; }
      if (!this.canShop(p)) { next(); return; }
      this.shopPlayer = p;
      App.set(new ShopScene(p, next));
    };
    next();
  },
  canShop(p) {
    return this.cashOf(p) > 0 || Data.items.some(it => it.id !== 'babyMissile' && (p.inv[it.id] || 0) > 0);
  },
  battle() {
    for (const p of this.players) { p.bank = this.cashOf(p); p.roundPts = 0; p.dmgCarry = 0; p.dmgCarryTeam = 0; }
    this.teamBank = Object.assign({}, this.teamCash);
    if (Net.isHost()) { this.roundOnline(); return; }
    Battle.start(Battle.makeParams());
    App.set(BattleScene);
  },
  // called by the battle when a round ends (offline or on the host); winners are player indexes
  roundFinished(winners, mass) {
    if (Net.isHost()) {
      Net.hostCommand({ c: 'roundover', winners, mass, players: this.players.map(p => this.netPlayer(p)), teamCash: this.teamCash });
      return;
    }
    App.lastBattleFrame = World.comp.slice();
    App.set(new StandingsScene({ winners: winners.map(i => this.players[i]).filter(Boolean), mass, onContinue: () => this.afterRound() }));
  },
  afterRound() {
    if (this.round >= this.rounds) {
      if (Net.isHost()) { Net.hostCommand({ c: 'gameover', players: this.players.map(p => this.netPlayer(p)) }); return; }
      this.finished = true;
      App.set(new StandingsScene({ final: true, winners: [], onContinue: () => this.toMainMenu() }));
      return;
    }
    // interest on the money that sat in the bank through the round
    const r = Cfg.interestRate;
    if (Cfg.teams === 'CORPORATE') {
      for (const tm in this.teamBank) {
        const i = Math.floor(this.teamBank[tm] * r);
        this.teamCash[tm] = (this.teamCash[tm] || 0) + i;
        for (const p of this.players) if (String(p.team) === String(tm)) { p.interest = i; p.interestTotal += i; }
      }
    } else {
      for (const p of this.players) { const i = Math.floor(p.bank * r); p.cash += i; p.interest = i; p.interestTotal += i; }
    }
    this.round++;
    if (Net.isHost()) this.shopOnline();
    else this.shopPhase(() => this.battle());
  },
  toMainMenu() {
    if (Net.online) { Net.leave(); return; }
    this.active = false;
    UI.clear();
    Sound.flightStop();
    App.set(new MainMenuScene());
  },

  /* ---------------- network game: the host drives, everyone follows ---------------- */
  netPlayer(p) {
    return {
      idx: p.idx, name: p.name, ai: p.ai, icon: p.icon, team: p.team, owner: p.owner || null,
      cash: p.cash, score: p.score, roundPts: p.roundPts, kills: p.kills, deaths: p.deaths, wins: p.wins,
      dmgCarry: p.dmgCarry || 0, dmgCarryTeam: p.dmgCarryTeam || 0,
      inv: Object.assign({}, p.inv), fuel: p.fuel, para: Object.assign({}, p.para), autoDefense: p.autoDefense,
      weapon: p.weapon, lastPower: p.lastPower, interest: p.interest, interestTotal: p.interestTotal,
      stats: Object.assign(newStats(), p.stats)
    };
  },
  // update players in place: tanks keep references to them
  applyNetPlayers(list) {
    for (const q of list || []) {
      const p = this.players[q.idx];
      if (!p) continue;
      const mine = Net.isClient() && p.owner === Net.me && App.scene === BattleScene && Battle.aimTank() && Battle.aimTank().p === p;
      const w = p.weapon;
      Object.assign(p, q);
      if (mine && Game.has(p, w)) p.weapon = w;   // don't yank the weapon you're aiming with
    }
  },
  netState() {
    return { round: this.round, rounds: this.rounds, seed: this.seed, teamCash: this.teamCash, players: this.players.map(p => this.netPlayer(p)) };
  },
  applyNetState(s) {
    this.round = s.round; this.rounds = s.rounds; this.seed = s.seed; this.teamCash = s.teamCash || {};
    this.applyNetPlayers(s.players);
  },
  exec(c) {
    switch (c.c) {
      case 'start': this.netStart(c); break;
      case 'shop': this.netShop(c); break;
      case 'shopwait': this.netShopWait(c); break;
      case 'round':
        this.round = c.round;
        this.applyNetPlayers(c.players); this.teamCash = c.teamCash || {};
        Battle.start(c.params);
        App.set(BattleScene);
        break;
      case 'roundover':
        this.applyNetPlayers(c.players); this.teamCash = c.teamCash || {};
        App.lastBattleFrame = World.comp.slice();
        App.set(new StandingsScene({
          winners: (c.winners || []).map(i => this.players[i]).filter(Boolean), mass: c.mass, online: true,
          onContinue: () => { if (Net.isHost()) this.afterRound(); }
        }));
        break;
      case 'gameover':
        this.applyNetPlayers(c.players);
        this.finished = true;
        App.set(new StandingsScene({ final: true, online: true, winners: [], onContinue: () => Net.leave() }));
        break;
      case 'setai': {
        const p = this.players[c.idx];
        if (p) { p.ai = c.ai; p.owner = null; p.aiMem = p.aiMem || {}; }
        break;
      }
      case 'msg': Toast.show(String(c.text || '')); break;
    }
  },
  netStart(c) {
    Net.saveCfg();
    for (const k of SYNC_KEYS) if (c.cfg && c.cfg[k] !== undefined) Cfg[k] = c.cfg[k];
    applyGraphicsMode();
    this.players = c.players.map(q => {
      const p = this.newPlayer(q.idx);
      Object.assign(p, q);
      p.color = Data.playerColors[q.idx]; p.aiMem = {}; p.aiHidden = null;
      return p;
    });
    this.rounds = Cfg.rounds; this.seed = c.seed; this.round = 0;
    this.active = true; this.online = true; this.finished = false;
    this.teamCash = {}; this.interestTotal = 0; this.shopWait = null;
    if (Cfg.teams === 'CORPORATE') for (const p of this.players) this.teamCash[p.team] = (this.teamCash[p.team] || 0) + Cfg.cashAtStart;
    if (Net.isHost()) { this.round = 1; if (Cfg.cashAtStart > 0) this.shopOnline(); else this.battle(); }
    else App.set(new WaitScene(['Starting the game...']));
  },
  // host: computers shop at once; people shop in parallel on their own screens
  shopOnline() {
    for (const p of this.players) if (p.ai && Cfg.computersBuy) AI.shop(p);
    const wait = this.players.filter(p => !p.ai && p.owner && this.canShop(p)).map(p => p.idx);
    this.shopWait = new Set(wait);
    Net.hostCommand({
      c: 'shop', round: this.round, wait, players: this.players.map(p => this.netPlayer(p)),
      teamCash: this.teamCash, market: Cfg.freeMarket ? Object.assign({}, Market.mult) : null
    });
    if (!this.shopWait.size) this.shopsDone();
  },
  netShop(c) {
    this.round = c.round;
    this.applyNetPlayers(c.players); this.teamCash = c.teamCash || {};
    if (!Net.isHost()) Market.override = c.market || null;
    this.netWaitList = (c.wait || []).slice();
    const me = Net.myPlayer();
    const waitScene = () => new WaitScene(['Waiting for the other players', 'to finish shopping...'], () => this.shopWaitNames());
    if (me && this.netWaitList.includes(me.idx)) {
      this.shopPlayer = me;
      App.set(new ShopScene(me, tx => {
        this.shopPlayer = null;
        App.set(waitScene());
        if (Net.isHost()) this.onShopDone(Net.me, { tx });
        else Net.request({ c: 'shopdone', tx }, true);
      }));
    } else App.set(waitScene());
  },
  netShopWait(c) {
    this.netWaitList = (c.list || []).slice();
    const me = Net.myPlayer();
    if (Net.pendingReq && Net.pendingReq.m.c.c === 'shopdone' && (!me || !this.netWaitList.includes(me.idx))) Net.pendingReq = null;
  },
  shopWaitNames() {
    const names = this.netWaitList.map(i => this.players[i] && this.players[i].name).filter(Boolean);
    return names.length ? ['Still shopping: ' + names.join(', ')] : [];
  },
  onShopDone(peer, c) {
    const p = this.players.find(q => !q.ai && q.owner === peer);
    if (!p || !this.shopWait || !this.shopWait.has(p.idx)) return;
    if (peer !== Net.me) this.applyTx(p, c.tx);   // the host's own screen already applied its purchases
    this.shopWait.delete(p.idx);
    Net.hostCommand({ c: 'shopwait', list: [...this.shopWait] });
    if (!this.shopWait.size) this.shopsDone();
  },
  applyTx(p, tx) {
    if (!Array.isArray(tx)) return;
    for (const t of tx.slice(0, 600)) {
      const it = t && typeof t.id === 'string' ? Data.byId[t.id] : null;
      if (!it || it.id === 'babyMissile') continue;
      if (t.op === 'b') { if (Shop.visible(p, it)) Shop.buy(p, it, true); }
      else if (t.op === 's') Shop.sell(p, it, clamp(t.q | 0, 1, 99), true);
    }
  },
  shopsDone() {
    this.shopWait = null;
    Market.settle();
    this.battle();
  },
  roundOnline() {
    const params = Battle.makeParams();
    Net.hostCommand({ c: 'round', round: this.round, params, players: this.players.map(p => this.netPlayer(p)), teamCash: this.teamCash });
  },
  // host: someone disconnected mid-game - a computer takes over their tank
  onPlayerLeft(p) {
    Net.hostCommand({ c: 'msg', text: p.name + ' left - a computer takes over.' });
    if (App.scene === BattleScene) { Battle.pendingAI.push(p.idx); return; }
    Net.hostCommand({ c: 'setai', idx: p.idx, ai: 'Chooser' });
    if (this.shopWait && this.shopWait.has(p.idx)) {
      this.shopWait.delete(p.idx);
      Net.hostCommand({ c: 'shopwait', list: [...this.shopWait] });
      if (!this.shopWait.size) this.shopsDone();
    }
  },

  /* ---------------- inventory & money ---------------- */
  has(p, id) { return id === 'babyMissile' || (p.inv[id] || 0) > 0; },
  consume(p, id, n) { if (id !== 'babyMissile') p.inv[id] = Math.max(0, (p.inv[id] || 0) - n); },
  cashOf(p) { return Cfg.teams === 'CORPORATE' ? (this.teamCash[p.team] || 0) : p.cash; },
  addCash(p, a) {
    if (Cfg.teams === 'CORPORATE') this.teamCash[p.team] = Math.max(0, (this.teamCash[p.team] || 0) + a);
    else p.cash = Math.max(0, p.cash + a);
  },
  netWorth(p) {
    let w = this.cashOf(p);
    for (const id in p.inv) {
      const it = Data.byId[id];
      if (it && id !== 'babyMissile') w += (p.inv[id] || 0) * it.cost / it.bundle * 0.5;
    }
    w += (p.fuel || 0) / 10 * 1000 * 0.5;
    return Math.round(w);
  },
  rankValue(p) { return Cfg.scoringMode === 'GREEDY' ? this.netWorth(p) : p.score; },

  /* ---------------- saved games ---------------- */
  serialize() {
    return {
      v: 1, round: this.round, rounds: this.rounds, seed: this.seed, teamCash: this.teamCash,
      players: this.players.map(p => ({
        idx: p.idx, name: p.name, ai: p.ai, aiHidden: p.aiHidden, icon: p.icon, team: p.team, cash: p.cash,
        score: p.score, kills: p.kills, deaths: p.deaths, wins: p.wins, inv: p.inv, fuel: p.fuel, para: p.para,
        autoDefense: p.autoDefense, keys: p.keys, weapon: p.weapon, lastPower: p.lastPower, interestTotal: p.interestTotal,
        stats: p.stats
      }))
    };
  },
  restore(d) {
    try {
      this.players = d.players.map(q => Object.assign(this.newPlayer(q.idx), q, { color: Data.playerColors[q.idx], aiMem: {}, owner: null }));
      this.round = d.round; this.rounds = d.rounds; this.seed = d.seed || 1;
      this.teamCash = d.teamCash || {};
      Cfg.players = this.players.length; Cfg.rounds = this.rounds;
      this.active = true; this.online = false; this.finished = false;
      UI.clear();
      Sound.flightStop();
      this.shopPhase(() => this.battle());
    } catch (e) {
      messageBox(['That saved game could not be read.']);
    }
  }
};

const BattleScene = {
  enter() { /* Battle.start() is called by whoever opens a round */ },
  update(dt) { Battle.update(dt); },
  draw() { Battle.draw(); },
  drawModern(dt) {
    Hud.update(dt);
    Fx.drawWorld(Gfx.ctx, dt, { world: World, battle: Battle });
    Hud.draw(Gfx.ctx);
  },
  key(ev) { Battle.key(ev); },
  mouse(ev) { Battle.mouse(ev); }
};
Battle.wheel = function (ev) {
  const t = this.aimTank();
  if (!t || this.waitHost) return;
  t.power = clamp(t.power - ev.dy * 5, 0, t.maxPower);
};

/* ---------------- main loop ---------------- */
const App = {
  scene: null, last: 0, lastBattleFrame: null,
  set(s) {
    Screen.flash = 0;
    if (s !== BattleScene) { Sound.flightStop(); Sound.ambience(0); }
    this.scene = s;
    if (s.enter) s.enter();
  },
  dispatch(ev) {
    if (ev.type === 'key' && ev.k === 'f2' && !ev.repeat) { Gfx.setModern(!Gfx.modern); Sound.click(); return; }
    if (ev.type === 'key' && ev.k === 'f9' && !ev.repeat) { EventLog.on = !EventLog.on; return; }
    if (ev.type === 'key' && ev.k === 'y' && !ev.repeat && Net.online && !UI.top() && Net.gid) { Chat.open(); return; }
    if (ev.type === 'key') {
      if ((ev.k === 'f1' || (ev.alt && ev.k === 's')) && Game.active && !UI.stack.some(d => d.isSystem)) { Menus.systemMenu(); return; }
      if (UI.top()) UI.key(ev); else if (this.scene.key) this.scene.key(ev);
    } else if (ev.type === 'mouse') {
      if (Volume.mouse(ev)) return;
      if (UI.top()) UI.mouse(ev); else if (this.scene.mouse) this.scene.mouse(ev);
    } else if (ev.type === 'wheel') {
      if (!UI.top() && this.scene === BattleScene) Battle.wheel(ev);
    }
  },
  // everything but drawing: also run from a timer while the tab is hidden in a network game
  step(dt) {
    Input.poll(dt);
    for (const ev of Input.take()) this.dispatch(ev);
    Net.update(dt);
    UI.update(dt);
    if (this.scene.update) this.scene.update(dt);
    if (this.scene === BattleScene) EventLog.watch();
    Toast.update(dt);
    Chat.update(dt);
    Volume.update();
    Music.update();
    if (Input.kb && document.activeElement === Input.kb && !UI.stack.some(d => d.focus)) Input.hideKeyboard();
  },
  frame(ts) {
    let dt = (ts - this.last) / 1000;
    this.last = ts;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;
    try {
      this.step(dt);
      this.render(dt);
    } catch (e) {
      console.error(e);
    }
    requestAnimationFrame(t => this.frame(t));
  },
  // draw one frame with whichever renderer is active
  render(dt) {
    if (Gfx.modern) { Gfx.frame(dt); return; }
    Screen.ui.clear(0);
    this.scene.draw();
    UI.draw(Screen.ui);
    Toast.draw(Screen.ui);
    Chat.draw(Screen.ui);
    Net.drawOverlay(Screen.ui);
    EventLog.draw(Screen.ui);
    Volume.draw();
    if (Cfg.pointer === 'Joystick' && Input.x >= 0) drawSoftCursor(Screen.ui, Input.ux, Input.uy);
    Screen.present();
  }
};

const CURSOR = [
  'X...........',
  'XX..........',
  'XwX.........',
  'XwwX........',
  'XwwwX.......',
  'XwwwwX......',
  'XwwwwwX.....',
  'XwwwwwwX....',
  'XwwwwwwwX...',
  'XwwwwwXXXX..',
  'XwwXwwX.....',
  'XwX.XwwX....',
  'XX..XwwX....',
  'X....XwwX...',
  '.....XwwX...',
  '......XX....'
];
function drawSoftCursor(s, x, y) {
  const spr = makeSprite(CURSOR, { X: vga(0, 0, 0), w: vga(63, 63, 63) });
  s.blit(spr, Math.floor(x), Math.floor(y));
}
function installCursor(canvas) {
  try {
    const c = document.createElement('canvas'), k = 2;
    c.width = 12 * k; c.height = 16 * k;
    const g = c.getContext('2d');
    CURSOR.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === '.') return;
      g.fillStyle = ch === 'X' ? '#000' : '#fff';
      g.fillRect(x * k, y * k, k, k);
    }));
    canvas.style.cursor = 'url(' + c.toDataURL() + ') 0 0, default';
  } catch (e) { /* default cursor */ }
}

function applyGraphicsMode() {
  const AY = 16 / 9;   // 360x480's pixel shape
  let w, h, aspect;
  if (Cfg.graphicsMode === 'FIT SCREEN') {
    const a = clamp(window.innerWidth / Math.max(1, window.innerHeight), 4 / 3, 2.6);
    h = 480; w = Math.round(h * a / AY); aspect = w * AY / h;
  } else {
    // 'WxH', 'WxH WIDE' (16:9) or 'WxH FIT' (a host's FIT SCREEN, sent to everyone in a network game)
    const m = /^(\d+)x(\d+)( WIDE| FIT)?$/.exec(Cfg.graphicsMode) || [0, '360', '480', ''];
    w = +m[1]; h = +m[2]; aspect = m[3] === ' WIDE' ? 16 / 9 : m[3] === ' FIT' ? w * AY / h : 4 / 3;
  }
  if (!Screen.main || Screen.W !== w || Screen.H !== h || Math.abs(Screen.aspect - aspect) > 1e-9) Screen.setMode(w, h, aspect);
}

function boot() {
  const canvas = document.getElementById('screen');
  Screen.init(canvas);
  if (!Data.graphicsModes.includes(Cfg.graphicsMode)) Cfg.graphicsMode = Data.defaults.graphicsMode;
  // first visit: a battlefield that fills the window, whatever its shape
  if (!(Store.get('scorch.cfg', {}) || {}).graphicsMode) Cfg.graphicsMode = 'FIT SCREEN';
  // FIT SCREEN follows the window between games (never mid-game: everyone's battlefield must match)
  let fitT = 0;
  window.addEventListener('resize', () => {
    clearTimeout(fitT);
    fitT = setTimeout(() => { if (Cfg.graphicsMode === 'FIT SCREEN' && !Game.active && !Net.online) applyGraphicsMode(); }, 250);
  });
  applyGraphicsMode();
  Input.init(canvas);
  installCursor(canvas);
  Gfx.init(canvas);
  canvas.addEventListener('pointerdown', () => { try { canvas.focus(); } catch (e) { /* ignore */ } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) Sound.flightStop(); });
  // a hidden tab gets no animation frames; keep a network game moving anyway
  setInterval(() => {
    if (!document.hidden || !Net.online) return;
    const now = performance.now();
    const dt = Math.min(1.5, Math.max(0, (now - App.last) / 1000));
    App.last = now;
    try { App.step(dt); } catch (e) { console.error(e); }
  }, 500);
  // drop a text file on the game to use it as a talk file (one comment per line)
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    if (f.size > 256 * 1024) { messageBox(['That file is too big for a talk file.']); return; }
    const r = new FileReader();
    r.onload = () => {
      const lines = String(r.result).split(/\r?\n/).map(s => s.replace(/\s+$/, '').slice(0, 60)).slice(0, 3000);
      while (lines.length && lines[lines.length - 1] === '') lines.pop();
      const name = f.name.toLowerCase();
      Data.talkFiles[name] = lines;
      Store.set('scorch.talk.' + name, lines);
      messageBox(['Loaded talk file "' + f.name.replace(/&/g, '&&') + '"', lines.filter(Boolean).length + ' comments.', 'Set it as the Attack File or', 'Die File under Play Options.']);
    };
    r.readAsText(f);
  });
  window.addEventListener('beforeunload', () => { if (Net.online) { try { Net.leave(true); } catch (e) { /* ignore */ } } });
  App.set(new MainMenuScene());
  requestAnimationFrame(t => { App.last = t; App.frame(t); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
</body>
