    }
  }
  return { w, h, data };
}

/* ---------- Screen: main framebuffer + low-res UI layer ---------- */
const Screen = {
  canvas: null, ctx: null, img: null,
  W: 360, H: 480, ay: 1,
  main: null,          // full-resolution battlefield buffer
  ui: null,            // low-resolution UI layer (0 = transparent)
  UX: 1, UY: 1, UW: 360, UH: 240, aspect: 4 / 3,   // aspect: the screen's shape (4:3, or 16:9 for WIDE modes)
  flash: 0, flashColor: 0,

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    window.addEventListener('resize', () => this.fit());
  },
  setMode(w, h, aspect) {
    this.W = w; this.H = h; this.aspect = aspect || 4 / 3;
    const modern = typeof Gfx !== 'undefined' && Gfx.modern;
    if (!modern) { this.canvas.width = w; this.canvas.height = h; }
    this.img = this.ctx.createImageData(w, h);
    this.main = new Surface(w, h, new Uint32Array(this.img.data.buffer));
    // pixel aspect: how many rows cover the same on-screen distance as one column
    this.ay = (h * this.aspect) / w;
    this.UX = Math.max(1, Math.floor(w / 320));
    this.UY = Math.max(1, Math.round(this.UX * this.ay));
    this.UW = Math.floor(w / this.UX);
    this.UH = Math.floor(h / this.UY);
    this.ui = this.pixelUi = new Surface(this.UW, this.UH);
    this.fit();
  },
  fit() {
    if (!this.canvas) return;
    if (typeof Gfx !== 'undefined' && Gfx.modern) { Gfx.resize(); return; }
    const ww = window.innerWidth, wh = window.innerHeight;
    let cw = ww, ch = ww / this.aspect;
    if (ch > wh) { ch = wh; cw = wh * this.aspect; }
    this.canvas.style.width = Math.floor(cw) + 'px';
    this.canvas.style.height = Math.floor(ch) + 'px';
  },
  present() {
    const u = this.ui.buf, m = this.main.buf;
    const UW = this.UW, UH = this.UH, UX = this.UX, UY = this.UY, W = this.W;
    for (let y = 0; y < UH; y++) {
      const ur = y * UW;
      for (let x = 0; x < UW; x++) {
        const c = u[ur + x];
        if (c === 0) continue;
        if (UX === 1 && UY === 1) { m[y * W + x] = c; continue; }
        for (let sy = 0; sy < UY; sy++) {
          const o = (y * UY + sy) * W + x * UX;
          for (let sx = 0; sx < UX; sx++) m[o + sx] = c;
        }
      }
    }
    if (this.flash > 0) {
      // full-screen flash (lightning, nukes) - cheap additive tint
      const a = Math.min(1, this.flash), fc = this.flashColor;
      const fr = cR(fc) * a, fg = cG(fc) * a, fb = cB(fc) * a;
      for (let i = 0; i < m.length; i += 1) {
        const c = m[i];
        m[i] = rgb(cR(c) + fr, cG(c) + fg, cB(c) + fb);
      }
    }
    this.ctx.putImageData(this.img, 0, 0);
  },
  // client (CSS) coordinates -> internal pixel coordinates
  toInternal(cx, cy) {
    if (typeof Gfx !== 'undefined' && Gfx.modern) return Gfx.toInternal(cx, cy);
    const r = this.canvas.getBoundingClientRect();
    return { x: (cx - r.left) / r.width * this.W, y: (cy - r.top) / r.height * this.H };
  }
};

    '°': '.##..|#..#.|.##..',                          // degree
    '•': '.....|.....|.###.|.###.|.###.|.....|.....'    // bullet
  };

  const CW = 6, CH = 10, GW = 5, GH = 9;
  const glyphs = {};
  for (const k in G) {
    const rows = G[k].split('|');
    const bits = [];
    for (let r = 0; r < GH; r++) {
      const s = rows[r] || '';
      let m = 0;
      for (let c = 0; c < GW; c++) if (s[c] === '#') m |= (1 << c);
      bits.push(m);
    }
    glyphs[k] = bits;
  }
  const unknown = glyphs['?'];

  function glyph(ch) { return glyphs[ch] || unknown; }

  // strip hotkey markers: returns {text, hot: index or -1}
  function parse(label) {
    let text = '', hot = -1;
    for (let i = 0; i < label.length; i++) {
      const ch = label[i];
      if (ch === '&' && i + 1 < label.length) {
        if (label[i + 1] === '&') { text += '&'; i++; continue; }
        hot = text.length; continue;
      }
      text += ch;
    }
    return { text, hot };
  }

  function width(str, opt) {
    if (typeof Gfx !== 'undefined' && Gfx.modern) return VUI.width(str, opt);
    const p = parse(String(str));
    return p.text.length * CW * ((opt && opt.scale) || 1) + ((opt && opt.bold) ? 1 : 0);
  }

  function drawGlyph(s, ch, x, y, c, sc, bold) {
    const g = glyph(ch);
    for (let r = 0; r < GH; r++) {
      const m = g[r];
      if (!m) continue;
      for (let col = 0; col < GW; col++) {
        if (!(m & (1 << col))) continue;
        if (sc === 1) {
          s.pset(x + col, y + r, c);
          if (bold) s.pset(x + col + 1, y + r, c);
        } else {
          s.fillRect(x + col * sc, y + r * sc, sc + (bold ? sc : 0), sc, c);
        }
      }
    }
  }

  // opt: {shadow: color, bold, scale, hotColor, underline}
  function draw(s, str, x, y, c, opt) {
    if (s.vector) return s.text(str, x, y, c, opt);
    opt = opt || {};
    const sc = opt.scale || 1;
    const p = parse(String(str));
    const text = p.text;
    x = Math.floor(x); y = Math.floor(y);
    if (opt.shadow !== undefined) {
      for (let i = 0; i < text.length; i++) drawGlyph(s, text[i], x + i * CW * sc + sc, y + sc, opt.shadow, sc, opt.bold);
    }
    for (let i = 0; i < text.length; i++) {
      const col = (i === p.hot && opt.hotColor !== undefined) ? opt.hotColor : c;
      drawGlyph(s, text[i], x + i * CW * sc, y, col, sc, opt.bold);
    }
    if (p.hot >= 0 && opt.underline !== false) {
      const hx = x + p.hot * CW * sc;
      const uc = opt.hotColor !== undefined ? opt.hotColor : c;
      s.fillRect(hx, y + 8 * sc, GW * sc, sc, uc);
    }
    return text.length * CW * sc;
  }

  function center(s, str, cx, y, c, opt) {
    const w = width(str, opt);
    draw(s, str, s.vector ? cx - w / 2 : Math.floor(cx - w / 2), y, c, opt);
  }
  function right(s, str, rx, y, c, opt) {
    const w = width(str, opt);
    draw(s, str, rx - w, y, c, opt);
  }

  // word-wrap text into lines of at most maxChars
  function wrap(str, maxChars) {
    const words = String(str).split(/\s+/);
    const lines = [];
    let cur = '';
    for (const w of words) {
      if (!w) continue;
      if (cur.length === 0) cur = w;
      else if (cur.length + 1 + w.length <= maxChars) cur += ' ' + w;
      else { lines.push(cur); cur = w; }
      while (cur.length > maxChars) { lines.push(cur.slice(0, maxChars)); cur = cur.slice(maxChars); }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function hotkeyOf(label) {
    const p = parse(label);
    return p.hot >= 0 ? p.text[p.hot].toLowerCase() : null;
  }

  return { CW, CH, GW, GH, draw, center, right, width, parse, wrap, hotkeyOf, glyph };
})();

    anim.deathsHead = [sprites.deathsHead, makeSprite(D.deathsHead.map((row, y) => y === 3 || y === 4 ? row.replace(/k/g, 'r') : row), P)];
    for (const id of ['babyRoller', 'roller', 'heavyRoller']) {
      const rows = D[id], ground = rows[rows.length - 1], ball = rows.slice(0, -1);
      const flipH = r => r.split('').reverse().join('');

  }

  function draw(s, name, x, y, opt) {
    // Remastered: the vector art, centred in the 12 x 10 slot
    if (s.vector && typeof ItemArt !== 'undefined' && ItemArt.has(name)) {
      const sz = Math.min(12 * Gfx.ux, 10 * Gfx.uy) * 1.3;
      ItemArt.draw(s.ctx, name, s.X(x) + (12 * Gfx.ux - sz) / 2, s.Y(y) + (10 * Gfx.uy - sz) / 2, sz, { gray: opt && opt.gray });
      return;
    }
    const frames = anim[name];
    const spr = frames ? frames[Math.floor(performance.now() / 140) % frames.length] : sprites[name];
    if (!spr) return;
    let o = opt;
    if (opt && opt.gray) {
      o = Object.assign({}, opt, {
        tint: c => { const v = (cR(c) + cG(c) + cB(c)) / 3; return rgb(v * 0.5 + 60, v * 0.5 + 60, v * 0.5 + 60); }
      });
    }
    // center icons vertically in a 10-row slot
    s.blit(spr, x, y + Math.floor((10 - spr.h) / 2), o);
  }
  return { draw, sprites, P, W: 12, H: 10 };
})();

/* ---------- js/itemart.js ---------- */
'use strict';
/* =====================================================================
   Remastered item icons: every weapon and accessory drawn as vector art
   in the same style as the vector tanks (rounded forms, soft gradients,
   a dark outline, a highlight), instead of the 1.5 pixel icons the
   classic look keeps. Each icon is drawn in a 24 x 24 box and scaled to
   wherever it's shown: shop, inventory, panels, HUD. A few are animated,
   like their 1.5 counterparts (funky bomb, death's head, rollers).
   ===================================================================== */

const ItemArt = (() => {
  const C = {
    ink: 'rgba(6,8,14,0.92)',
    steel: ['#f1f4fa', '#a9b2c3', '#566074', '#2a303c'],
    red: ['#ffb4a6', '#ff5a46', '#a8231a'],
    amber: ['#ffe2a1', '#ffb640', '#b06d10'],
    yellow: ['#fff3b0', '#ffd64a', '#a9821a'],
    green: ['#c6f7c1', '#56d36a', '#1f7a35'],
    cyan: ['#d4f1ff', '#6ac2ff', '#1f5d9c'],
    violet: ['#ead7ff', '#b06cff', '#5a2a9c'],
    dirt: ['#e0b27e', '#a8723f', '#5a3518']
  };
  const t = () => performance.now() / 1000;

  // ---------- drawing helpers (24 x 24 design space)
  const lin = (ctx, x0, y0, x1, y1, stops) => { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
  const ink = (ctx, w) => { ctx.lineWidth = w || 1.1; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); };
  const rr = (ctx, x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); };
  function ball(ctx, cx, cy, r, pal) {
    const g = ctx.createRadialGradient(cx - r * 0.4, cy - r * 0.45, r * 0.08, cx, cy, r * 1.05);
    g.addColorStop(0, pal[0]); g.addColorStop(0.45, pal[1]); g.addColorStop(1, pal[2]);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fillStyle = g; ctx.fill(); ink(ctx);
  }
  function glow(ctx, cx, cy, r, rgb, a) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  }
  function shine(ctx, x, y, w, h) {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.ellipse(x, y, w, h, -0.5, 0, TAU); ctx.fill();
  }
  // a missile lying along +x, centred on the origin
  function missile(ctx, L, R, body, nose, fins) {
    const x0 = -L / 2, xn = L / 2 - R * 1.9;
    // fins
    ctx.beginPath();
    ctx.moveTo(x0 + 0.5, -R); ctx.lineTo(x0 - R * 0.6, -R * 2.1); ctx.lineTo(x0 + R * 1.6, -R * 2.0); ctx.lineTo(x0 + R * 2.8, -R); ctx.closePath();
    ctx.moveTo(x0 + 0.5, R); ctx.lineTo(x0 - R * 0.6, R * 2.1); ctx.lineTo(x0 + R * 1.6, R * 2.0); ctx.lineTo(x0 + R * 2.8, R); ctx.closePath();
    ctx.fillStyle = lin(ctx, 0, -R * 2, 0, R * 2, [[0, fins[0]], [0.5, fins[1]], [1, fins[2]]]); ctx.fill(); ink(ctx, 0.9);
    // body
    rr(ctx, x0, -R, xn - x0 + 0.6, R * 2, R * 0.45);
    ctx.fillStyle = lin(ctx, 0, -R, 0, R, [[0, body[0]], [0.45, body[1]], [1, body[2]]]); ctx.fill(); ink(ctx);
    // nose cone
    ctx.beginPath(); ctx.moveTo(xn, -R); ctx.quadraticCurveTo(L / 2 + 0.3, -R * 0.35, L / 2 + 0.6, 0); ctx.quadraticCurveTo(L / 2 + 0.3, R * 0.35, xn, R); ctx.closePath();
    ctx.fillStyle = lin(ctx, 0, -R, 0, R, [[0, nose[0]], [0.5, nose[1]], [1, nose[2]]]); ctx.fill(); ink(ctx);
    // a band and a glint
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(x0 + R * 1.2, -R + 0.4, 0.9, R * 2 - 0.8);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(x0 + R * 2.6, -R * 0.62, (xn - x0) * 0.55, R * 0.32);
  }
  const tilt = (ctx, a, fn) => { ctx.save(); ctx.translate(12, 12); ctx.rotate(a); fn(); ctx.restore(); };
  function trefoil(ctx, cx, cy, r) {
    ctx.fillStyle = '#141414';
    for (let k = 0; k < 3; k++) {
      const a = -Math.PI / 2 + k * TAU / 3;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a - 0.5, a + 0.5); ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.22, 0, TAU); ctx.fill();
  }
  function bomb(ctx, cx, cy, r, pal, fuse) {
    if (fuse) {
      ctx.beginPath(); ctx.moveTo(cx + r * 0.5, cy - r * 0.8); ctx.quadraticCurveTo(cx + r * 0.9, cy - r * 1.5, cx + r * 1.3, cy - r * 1.35);
      ink(ctx, 1.3); ctx.strokeStyle = '#c9b48a'; ctx.lineWidth = 0.7; ctx.stroke();
      const s = 0.8 + 0.3 * Math.sin(t() * 14);
      glow(ctx, cx + r * 1.35, cy - r * 1.4, 2.6 * s, '255,210,90', 0.95);
    }
    ball(ctx, cx, cy, r, pal);
  }
  function flame(ctx, cx, base, w, h, hot) {
    const f = 0.9 + 0.1 * Math.sin(t() * 9 + cx);
    ctx.beginPath();
    ctx.moveTo(cx - w, base);
    ctx.bezierCurveTo(cx - w * 1.1, base - h * 0.5, cx - w * 0.2, base - h * 0.55, cx, base - h * f);
    ctx.bezierCurveTo(cx + w * 0.3, base - h * 0.6, cx + w * 1.15, base - h * 0.45, cx + w, base);
    ctx.closePath();
    ctx.fillStyle = lin(ctx, 0, base - h, 0, base, hot ? [[0, '#f4fbff'], [0.4, '#8fd8ff'], [1, '#3a6dff']] : [[0, '#fff1a8'], [0.45, '#ffa632'], [1, '#e8401c']]);
    ctx.fill(); ink(ctx, 0.9);
  }
  function arrow(ctx, x0, y0, x1, y1, col, both) {
    const a = Math.atan2(y1 - y0, x1 - x0), h = 5.5;
    const head = (x, y, ang) => { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(ang - 0.55) * h, y - Math.sin(ang - 0.55) * h); ctx.lineTo(x - Math.cos(ang + 0.55) * h, y - Math.sin(ang + 0.55) * h); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ink(ctx, 0.8); };
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ink(ctx, 4.6); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
    head(x1, y1, a); if (both) head(x0, y0, a + Math.PI);
  }
  function bubble(ctx, rgb, thick, hex) {
    const g = ctx.createRadialGradient(12, 12, 4, 12, 12, 10.5);
    g.addColorStop(0, 'rgba(' + rgb + ',0.06)'); g.addColorStop(0.75, 'rgba(' + rgb + ',0.28)'); g.addColorStop(1, 'rgba(' + rgb + ',0.75)');
    ctx.beginPath(); ctx.arc(12, 12, 10, 0, TAU); ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = thick; ctx.strokeStyle = hex; ctx.stroke(); ink(ctx, 0.8);
    shine(ctx, 8.2, 7.6, 2.6, 1.3);
  }
  function magnet(ctx, pal, rings) {
    ctx.beginPath(); ctx.arc(12, 11, 6.5, Math.PI, 0); ctx.lineTo(18.5, 19); ctx.lineTo(14.5, 19); ctx.lineTo(14.5, 11); ctx.arc(12, 11, 2.5, 0, Math.PI, true); ctx.lineTo(9.5, 19); ctx.lineTo(5.5, 19); ctx.closePath();
    ctx.fillStyle = lin(ctx, 5, 4, 19, 19, [[0, pal[0]], [0.5, pal[1]], [1, pal[2]]]); ctx.fill(); ink(ctx);
    ctx.fillStyle = '#e8edf5'; ctx.fillRect(5.6, 16, 3.8, 2.9); ctx.fillRect(14.6, 16, 3.8, 2.9);
    ctx.strokeStyle = 'rgba(255,230,140,0.85)'; ctx.lineWidth = 0.9;
    for (let k = 0; k < rings; k++) { ctx.beginPath(); ctx.arc(12, 12, 9 + k * 2, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke(); }
  }
  function drill(ctx, scale, pal) {
    tilt(ctx, 0.75, () => {
      const L = 9 * scale, R = 3.4 * scale;
      ctx.beginPath(); ctx.moveTo(-L * 0.55, -R); ctx.lineTo(L * 0.25, -R); ctx.lineTo(L * 0.8, 0); ctx.lineTo(L * 0.25, R); ctx.lineTo(-L * 0.55, R); ctx.closePath();
      ctx.fillStyle = lin(ctx, 0, -R, 0, R, [[0, pal[0]], [0.5, pal[1]], [1, pal[2]]]); ctx.fill(); ink(ctx);
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 0.9;
      for (let k = 0; k < 4; k++) { const x = -L * 0.45 + k * L * 0.22; ctx.beginPath(); ctx.moveTo(x, -R); ctx.lineTo(x + R * 0.9, R); ctx.stroke(); }
      rr(ctx, -L * 0.85, -R * 0.6, L * 0.32, R * 1.2, 0.8); ctx.fillStyle = lin(ctx, 0, -R, 0, R, [[0, C.steel[0]], [1, C.steel[2]]]); ctx.fill(); ink(ctx, 0.9);
    });
  }
  function dirtBall(ctx, cx, cy, r) {

      ctx.strokeStyle = '#ff5a46'; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.moveTo(20, 17); ctx.bezierCurveTo(23, 17, 22, 21, 23.5, 22); ctx.stroke();

    box: ctx => {
      rr(ctx, 4, 7, 16, 13, 1.4); ctx.fillStyle = lin(ctx, 4, 7, 20, 20, [[0, '#e0b27e'], [1, '#8a5a32']]); ctx.fill(); ink(ctx);

    },
    human: ctx => {
      ball(ctx, 12, 7, 3.6, ['#ffe1c4', '#e8b48a', '#9a6a44']);
      ctx.beginPath(); ctx.moveTo(5, 21); ctx.bezierCurveTo(5, 13, 19, 13, 19, 21); ctx.closePath();
      ctx.fillStyle = lin(ctx, 0, 12, 0, 21, [[0, '#8fd6ff'], [1, '#2a5fa8']]); ctx.fill(); ink(ctx);
    },

      ctx.strokeStyle = C.ink; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(3, 5); ctx.lineTo(19, 5); ctx.moveTo(11, 5); ctx.lineTo(11, 8); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(10, 12, 6.5, 4, 0, 0, TAU); ctx.fillStyle = lin(ctx, 0, 8, 0, 16, [[0, C.green[0]], [1, C.green[2]]]); ctx.fill(); ink(ctx);
      ctx.beginPath(); ctx.moveTo(16, 11); ctx.lineTo(22, 10); ctx.lineTo(22, 13); ctx.lineTo(16, 13.5); ctx.closePath(); ctx.fillStyle = C.green[2]; ctx.fill(); ink(ctx, 0.9);

    }
  };

  return {
    has: id => !!A[id],
    // draw icon `id` into a size x size box at (x, y) in canvas pixels
    draw(ctx, id, x, y, size, o) {
      const f = A[id];
      if (!f) return false;
      o = o || {};
      ctx.save();
      ctx.translate(x, y); ctx.scale(size / 24, size / 24);
      if (o.gray) { ctx.globalAlpha *= 0.5; if ('filter' in ctx) ctx.filter = 'grayscale(1)'; }
      try { f(ctx); } catch (e) { /* never let an icon break a frame */ }
      ctx.restore();
      return true;
    }
  };
})();

/* ---------- js/sound.js ---------- */
'use strict';
/* =====================================================================
   PC-speaker style sound: square waves and "random square" crunches.
   ===================================================================== */

const Sound = {
  ctx: null, out: null, flight: null, flightGain: null,
  muted: false,   // set while a network peer fast-forwards to catch up

  unlock() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.out = this.ctx.createGain();
        this.out.gain.value = 0.12;
        this.out.connect(Volume.sfx());   // effects volume (music.js)
      } catch (e) { this.ctx = null; return; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  ok() { return Cfg.sound && !this.muted && this.ctx && this.ctx.state === 'running'; },

  beep(freq, dur, vol, when) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime + (when || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol == null ? 1 : vol, t);
    g.gain.setValueAtTime(0, t + dur);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + dur + 0.02);
  },
  seq(notes, vol) {
    let t = 0;
    for (const [f, d] of notes) { if (f) this.beep(f, d * 0.95, vol, t); t += d; }
  },
  sweep(f0, f1, dur, vol, when) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime + (when || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(Math.max(20, f0), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol == null ? 1 : vol, t);
    g.gain.setValueAtTime(0, t + dur);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + dur + 0.02);
  },
  // random-frequency square wave: the classic PC speaker explosion
  crunch(dur, fHi, fLo, vol, when) {
    if (!this.ok()) return;
    const sr = this.ctx.sampleRate, n = Math.floor(sr * dur);
    const buf = this.ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
    let i = 0, v = 1;
    while (i < n) {
      const p = i / n;
      const hi = fHi * (1 - p * 0.7), lo = Math.max(20, fLo * (1 - p * 0.8));
      const f = lo + Math.random() * (hi - lo);
      const half = Math.max(1, Math.floor(sr / (2 * f)));
      for (let k = 0; k < half && i < n; k++) d[i++] = v;
      v = -v;
    }
    const src = this.ctx.createBufferSource(), g = this.ctx.createGain();
    src.buffer = buf;
    const t = this.ctx.currentTime + (when || 0);
    g.gain.setValueAtTime(vol == null ? 1 : vol, t);
    g.gain.linearRampToValueAtTime(0.0, t + dur);
    src.connect(g); g.connect(this.out);
    src.start(t);
  },

  click() { this.beep(1200, 0.012, 0.5); },
  error() { this.beep(220, 0.12, 0.8); },
  buy() { this.seq([[880, 0.04], [1320, 0.05]], 0.6); },
  fire() { this.sweep(900, 120, 0.12, 0.8); },
  explosion(r) {
    const dur = clamp(0.25 + r / 60, 0.25, 1.6);
    this.crunch(dur, 900, 120, 1);
  },
  nuke(r) { this.crunch(clamp(0.8 + r / 50, 1, 2.4), 700, 60, 1); },
  bigBoom() { this.crunch(1.2, 600, 50, 1); },
  laser() { this.sweep(2400, 600, 0.35, 0.7); this.sweep(1800, 400, 0.35, 0.4, 0.05); },
  plasma() { this.sweep(200, 1600, 0.5, 0.7); },
  thunder() { this.crunch(0.9, 400, 40, 1); },
  meteor() { this.sweep(1800, 250, 1.1, 0.35); },
  zap() { this.sweep(3000, 200, 0.15, 0.6); },
  dirt() { this.crunch(0.25, 300, 80, 0.6); },
  sizzle() { this.crunch(0.15, 2400, 1200, 0.25); },
  shieldHit() { this.sweep(1600, 2400, 0.08, 0.6); },
  bounce() { this.beep(700, 0.03, 0.6); },
  parachute() { this.sweep(1400, 700, 0.3, 0.4); },
  chopper() { for (let i = 0; i < 12; i++) this.beep(90, 0.03, 0.8, i * 0.08); },
  roundOver() { this.seq([[523, 0.12], [659, 0.12], [784, 0.12], [1047, 0.3]], 0.5); },
  gameOver() { this.seq([[392, 0.2], [330, 0.2], [262, 0.2], [196, 0.5]], 0.5); },
  charge() { this.sweep(300, 1200, 0.25, 0.5); },

  // continuous flight sound: frequency follows height (POS) or velocity (VEL)
  flightSet(freq) {
    if (!this.ok() || Cfg.flightSounds === 'OFF') { this.flightStop(); return; }
    if (!this.flight) {
      this.flight = this.ctx.createOscillator();
      this.flightGain = this.ctx.createGain();
      this.flight.type = 'square';
      this.flightGain.gain.value = 0.35;
      this.flight.connect(this.flightGain); this.flightGain.connect(this.out);
      this.flight.start();
    }
    this.flight.frequency.setTargetAtTime(clamp(freq, 40, 4000), this.ctx.currentTime, 0.01);
  },
  flightStop() {
    if (this.flight) {
      try { this.flight.stop(); } catch (e) { /* ignore */ }
      this.flight.disconnect(); this.flightGain.disconnect();
      this.flight = null; this.flightGain = null;
    }
  }
};

/* ---------- js/audio.js ---------- */
'use strict';
/* =====================================================================
   Remastered sound: the same events as the PC-speaker set in sound.js,
   voiced with layered synthesis instead - filtered noise, sub-bass
   booms, a little reverb, and stereo placement by where things happen
   on the battlefield. Sound > Sound Style switches between the two.
   Nothing is loaded from files.
   ===================================================================== */

const SoundClassic = {};
for (const k of Object.keys(Sound)) if (typeof Sound[k] === 'function') SoundClassic[k] = Sound[k];

const SoundModern = {
  bus: null, verb: null, noise: null, brown: null, wind: null, windGain: null,
  setup() {
    const ctx = Sound.ctx;
    if (this.bus || !ctx) return !!this.bus;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 5; comp.attack.value = 0.004; comp.release.value = 0.25;
    const master = ctx.createGain(); master.gain.value = 0.55;
    master.connect(comp); comp.connect(Volume.sfx());
    this.bus = master;
    // a small hall: decaying stereo noise as the impulse response
    const len = Math.floor(ctx.sampleRate * 1.9), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    const conv = ctx.createConvolver(); conv.buffer = ir;
    const vg = ctx.createGain(); vg.gain.value = 0.32;
    conv.connect(vg); vg.connect(master);
    this.verb = conv;
    // noise sources
    const n = ctx.sampleRate * 2;
    this.noise = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.brown = ctx.createBuffer(1, n, ctx.sampleRate);
    const b = this.brown.getChannelData(0);
    let last = 0;
    for (let i = 0; i < n; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; b[i] = last * 3.5; }
    Booms.warm(Cfg.boomStyle === 'ARCADE' ? 'ARCADE' : 'FILM');
    return true;
  },
  ok() { return Sound.ok() && this.setup(); },
  pan() {
    const x = Sound.px;
    Sound.px = null;
    if (x === null || x === undefined || !World.W) return 0;
    return clamp((x / World.W) * 2 - 1, -1, 1) * 0.75;
  },
  // an output with stereo placement and a reverb send
  out(vol, pan, wet) {
    const ctx = Sound.ctx, g = ctx.createGain();
    g.gain.value = vol;
    let node = g;
    if (ctx.createStereoPanner && pan) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); node = p; }
    node.connect(this.bus);
    if (wet) { const s = ctx.createGain(); s.gain.value = wet; node.connect(s); s.connect(this.verb); }
    return g;
  },
  env(g, t, a, peak, dur, curve) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + dur * (curve || 1));
  },
  noiseHit(dest, t, dur, type, f0, f1, peak, q, brown) {
    const ctx = Sound.ctx, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = brown ? this.brown : this.noise; src.loop = true;
    src.playbackRate.value = 0.8 + Math.random() * 0.4;
    f.type = type; f.Q.value = q || 0.7;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    this.env(g, t, 0.004, peak, dur);
    src.connect(f); f.connect(g); g.connect(dest);
    src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.1);
  },
  tone(dest, t, type, f0, f1, dur, peak, attack) {
    const ctx = Sound.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(20, f0), t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    this.env(g, t, attack || 0.005, peak, dur);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + dur + 0.1);
  },

  /* ---------------- the game's sound events ---------------- */
  beep(freq, dur, vol, when) {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime + (when || 0);
    this.tone(this.out(0.28 * (vol == null ? 1 : vol), this.pan(), 0.1), t, 'triangle', freq, freq, Math.max(0.03, dur), 1, 0.004);
  },
  seq(notes, vol) {
    let t = 0;
    const px = Sound.px;
    for (const [f, d] of notes) { if (f) { Sound.px = px; this.beep(f, d * 0.95, vol, t); } t += d; }
    Sound.px = null;
  },
  sweep(f0, f1, dur, vol, when) {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime + (when || 0);
    this.tone(this.out(0.22 * (vol == null ? 1 : vol), this.pan(), 0.15), t, 'sine', f0, f1, dur, 1, 0.01);
  },
  crunch(dur, fHi, fLo, vol, when) {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime + (when || 0);
    this.noiseHit(this.out(0.5 * (vol == null ? 1 : vol), this.pan(), 0.2), t, dur, 'lowpass', fHi * 2.5, Math.max(60, fLo), 1, 0.8);
  },
  click() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.16, 0, 0);
    this.tone(d, t, 'triangle', 2200, 1400, 0.025, 1, 0.001);
  },
  error() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.22, 0, 0.05);
    this.tone(d, t, 'triangle', 240, 200, 0.09, 1); this.tone(d, t + 0.1, 'triangle', 180, 150, 0.12, 1);
  },
  buy() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.2, 0, 0.25);
    this.tone(d, t, 'sine', 988, 988, 0.12, 1); this.tone(d, t + 0.07, 'sine', 1319, 1319, 0.2, 1);
    this.tone(d, t, 'triangle', 494, 494, 0.18, 0.4);
  },
  fire() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.6, this.pan(), 0.3);
    this.tone(d, t, 'sine', 140, 48, 0.22, 1, 0.003);
    this.noiseHit(d, t, 0.28, 'bandpass', 2200, 500, 0.8, 0.9);
  },
  // explosions play pre-rendered booms (see Booms below); tier 0 small .. 3 nuke
  boom(tier, level, pan) {
    const arcade = Cfg.boomStyle === 'ARCADE';
    const src = Sound.ctx.createBufferSource();
    src.buffer = Booms.get(arcade ? 'ARCADE' : 'FILM', tier);
    src.playbackRate.value = 0.94 + Math.random() * 0.12;
    let node = src;
    if (!arcade) {
      // a low shelf for extra weight
      const sh = Sound.ctx.createBiquadFilter();
      sh.type = 'lowshelf'; sh.frequency.value = 160; sh.gain.value = 6;
      src.connect(sh); node = sh;
    }
    node.connect(this.out(level, pan, arcade ? 0.04 : 0.1));
    src.start();
  },
  explosion(r) {
    if (!this.ok()) return;
    this.boom(r < 18 ? 0 : r < 45 ? 1 : 2, 0.95, this.pan());
  },
  nuke() {
    if (!this.ok()) return;
    this.boom(3, 1, this.pan());
  },
  bigBoom() {
    if (!this.ok()) return;
    this.boom(2, 0.9, this.pan());
  },
  laser() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.6, this.pan(), 0.35);
    this.tone(d, t, 'sawtooth', 2600, 420, 0.5, 0.6, 0.004);
    this.tone(d, t, 'square', 1300, 210, 0.5, 0.25, 0.004);
    this.noiseHit(d, t, 0.45, 'highpass', 5000, 2500, 0.35, 0.7);
  },
  plasma() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.65, this.pan(), 0.5);
    this.tone(d, t, 'sawtooth', 110, 1400, 0.6, 0.5, 0.02);
    this.tone(d, t, 'sine', 220, 2600, 0.6, 0.4, 0.02);
    this.noiseHit(d, t + 0.3, 0.5, 'bandpass', 3000, 600, 0.4, 2);
  },
  // a falling rock: a rushing whoosh and a whistle, both dropping as it comes down
  meteor() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.45, this.pan(), 0.25);
    this.noiseHit(d, t, 1.25, 'bandpass', 3000, 350, 0.7, 1.4);
    this.tone(d, t, 'sine', 1500, 260, 1.2, 0.18, 0.15);
  },
  thunder() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.9, this.pan(), 0.6);
    this.noiseHit(d, t, 0.25, 'highpass', 5000, 1800, 0.8, 0.7);
    this.noiseHit(d, t + 0.05, 2.6, 'lowpass', 700, 50, 1, 0.5, true);
  },
  zap() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.5, this.pan(), 0.25);
    const ctx = Sound.ctx, o = ctx.createOscillator(), lfo = ctx.createOscillator(), lg = ctx.createGain(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = 900;
    lfo.type = 'sawtooth'; lfo.frequency.value = 57; lg.gain.value = 700;
    lfo.connect(lg); lg.connect(o.frequency);
    this.env(g, t, 0.003, 0.7, 0.22);
    o.connect(g); g.connect(d);
    o.start(t); lfo.start(t); o.stop(t + 0.3); lfo.stop(t + 0.3);
    this.noiseHit(d, t, 0.2, 'highpass', 7000, 3000, 0.4, 0.7);
  },
  dirt() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.9, this.pan(), 0.25);
    this.noiseHit(d, t, 0.35, 'lowpass', 900, 120, 1, 0.8, true);
    this.noiseHit(d, t, 0.15, 'bandpass', 1400, 600, 0.35, 1.5);
  },
  sizzle() {
    if (!this.ok()) return;
    this.noiseHit(this.out(0.25, this.pan(), 0.1), Sound.ctx.currentTime, 0.2, 'highpass', 6000, 3500, 0.6, 0.7);
  },
  shieldHit() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.28, this.pan(), 0.4);
    for (const f of [1568, 2349, 3136]) this.tone(d, t, 'sine', f, f * 1.02, 0.35, 0.5, 0.002);
    this.noiseHit(d, t, 0.06, 'highpass', 8000, 5000, 0.5, 0.7);
  },
  bounce() {
    if (!this.ok()) return;
    this.tone(this.out(0.35, this.pan(), 0.15), Sound.ctx.currentTime, 'sine', 420, 240, 0.08, 1, 0.002);
  },
  parachute() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.8, this.pan(), 0.2);
    this.noiseHit(d, t, 0.45, 'bandpass', 1600, 350, 0.9, 1.5);
  },
  chopper() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.5, this.pan(), 0.2);
    for (let i = 0; i < 14; i++) this.noiseHit(d, t + i * 0.075, 0.06, 'lowpass', 500, 120, 0.9, 0.8, true);
  },
  roundOver() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.22, 0, 0.5);
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { this.tone(d, t + i * 0.1, 'triangle', f, f, 0.6, 1, 0.01); this.tone(d, t + i * 0.1, 'sine', f * 2, f * 2, 0.4, 0.25, 0.01); });
  },
  gameOver() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.24, 0, 0.6);
    [392, 311.13, 261.63, 196].forEach((f, i) => this.tone(d, t + i * 0.2, 'triangle', f, f, 0.9, 1, 0.01));
  },
  charge() {
    if (!this.ok()) return;
    const t = Sound.ctx.currentTime, d = this.out(0.25, this.pan(), 0.3);
    this.tone(d, t, 'sine', 300, 1300, 0.3, 1, 0.01);
    this.tone(d, t, 'triangle', 600, 2600, 0.3, 0.3, 0.01);
  },
  // shells in flight: a soft whistle instead of the square wave
  flightSet(freq) {
    if (!this.ok() || Cfg.flightSounds === 'OFF') { this.flightStop(); return; }
    const ctx = Sound.ctx;
    if (!Sound.flight) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; g.gain.value = 0.0001;
      o.connect(g); g.connect(this.bus);
      o.start();
      g.gain.setTargetAtTime(0.05, ctx.currentTime, 0.05);
      Sound.flight = o; Sound.flightGain = g;
    }
    Sound.flight.frequency.setTargetAtTime(clamp(freq * 0.75, 60, 3000), ctx.currentTime, 0.03);
  },
  flightStop() {
    if (Sound.flight) {
      const o = Sound.flight, g = Sound.flightGain;
      Sound.flight = null; Sound.flightGain = null;
      try { g.gain.setTargetAtTime(0.0001, Sound.ctx.currentTime, 0.04); o.stop(Sound.ctx.currentTime + 0.25); } catch (e) { try { o.stop(); } catch (e2) { /* ignore */ } }
    }
  },
  // wind over the battlefield, louder in a gale
  ambience(level) {
    if (!this.ok()) { this.ambienceStop(); return; }
    const ctx = Sound.ctx;
    if (!this.wind) {
      const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = this.brown; src.loop = true;
      f.type = 'lowpass'; f.frequency.value = 500; f.Q.value = 0.8;
      g.gain.value = 0.0001;
      src.connect(f); f.connect(g); g.connect(this.bus);
      src.start();
      this.wind = src; this.windGain = g; this.windFilter = f;
    }
    const tt = ctx.currentTime;
    this.windGain.gain.setTargetAtTime(0.008 + 0.06 * clamp(level, 0, 1), tt, 0.6);
    this.windFilter.frequency.setTargetAtTime(300 + 900 * clamp(level, 0, 1) + Math.sin(tt * 0.7) * 120, tt, 0.5);
  },
  ambienceStop() {
    if (this.wind) {
      const w = this.wind, g = this.windGain;
      this.wind = null;
      try { g.gain.setTargetAtTime(0.0001, Sound.ctx.currentTime, 0.2); w.stop(Sound.ctx.currentTime + 1); } catch (e) { /* ignore */ }
    }
  }
};

/* =====================================================================
   Booms: explosions computed sample by sample into buffers (three takes
   per size, made the first time each is needed) rather than patched
   together from oscillators and filters - smooth noise and exact
   envelopes, so nothing rings or sounds metallic. Sound > Explosions:
     FILM    a deep blast: a punchy crack of noise that darkens fast, a
             low thump, a rolling rumble and a scatter of debris crackle
     ARCADE  the 8-bit kind: a 15-bit noise register whose clock and
             volume step down together, as on the NES noise channel
   ===================================================================== */
const Booms = {
  cache: {},
  // render every take ahead of time, one per idle moment, so no battle hitches on the first blast
  warm(style) {
    let n = 0;
    const next = () => {
      const tier = n % 4;
      if (n++ >= 12 || !Sound.ctx) return;
      const list = this.cache[style + tier] || (this.cache[style + tier] = []);
      if (list.length < 3) list.push(style === 'ARCADE' ? this.arcade(tier) : this.film(tier));
      setTimeout(next, 60);
    };
    setTimeout(next, 200);
  },
  get(style, tier) {
    const list = this.cache[style + tier] || (this.cache[style + tier] = []);
    if (list.length < 3) { list.push(style === 'ARCADE' ? this.arcade(tier) : this.film(tier)); return list[list.length - 1]; }
    return list[Math.floor(Math.random() * list.length)];
  },
  // soft-clip for punch, normalize, fade the very end
  finish(buf, peakTo, drive) {
    const chans = [];
    let peak = 1e-6;
    for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); chans.push(d); for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i])); }
    const k = Math.tanh(drive), fade = Math.floor(buf.sampleRate * 0.05);
    for (const d of chans) {
      for (let i = 0; i < d.length; i++) d[i] = Math.tanh(d[i] / peak * drive) / k * peakTo;
      for (let i = 0; i < fade; i++) d[d.length - 1 - i] *= i / fade;
    }
    return buf;
  },
  film(tier) {
    const ctx = Sound.ctx, sr = ctx.sampleRate, k = [0.45, 0.8, 1.25, 2.3][tier];
    const len = Math.floor(sr * (0.9 + k * 1.1)), buf = ctx.createBuffer(2, len, sr);
    const tauPunch = 0.04 + 0.02 * k, tauBody = 0.16 + 0.2 * k, tauTail = 0.3 + 0.55 * k, tauBright = 0.03 + 0.02 * k;
    const f0 = 50 - k * 7 + Math.random() * 6;    // the thump's pitch, lower for bigger blasts
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      let l1 = 0, l2 = 0, br = 0, rl = 0, ph = 0, crack = 0, prev = 0;
      const ra = 1 - Math.exp(-2 * Math.PI * 150 / sr);
      for (let i = 0; i < len; i++) {
        const t = i / sr, w = Math.random() * 2 - 1;
        // the blast: noise through a two-pole lowpass that closes from bright to dull
        const fc = 90 + 2000 * Math.exp(-t / tauBright) + 250 * Math.exp(-t / tauBody);
        const a = 1 - Math.exp(-2 * Math.PI * fc / sr);
        l1 += a * (w - l1); l2 += a * (l1 - l2);
        const envB = Math.min(1, t / 0.002) * (0.55 * Math.exp(-t / tauPunch) + 0.45 * Math.exp(-t / tauBody));
        // the rumble: brown noise, slower to rise and slower to go
        br = br * 0.997 + 0.02 * w; rl += ra * (br - rl);
        const envR = (1 - Math.exp(-t / 0.03)) * Math.exp(-t / tauTail);
        // the thump: a low sine that drops into place (starting high enough for small speakers to feel)
        ph += 2 * Math.PI * f0 * (1 + 1.8 * Math.exp(-t / 0.03)) / sr;
        const thump = Math.sin(ph) * Math.min(1, t / 0.003) * Math.exp(-t / (0.16 + 0.1 * k));
        // debris: sparse crackles that thin out
        if (t > 0.015 && Math.random() < 700 * Math.exp(-t / (0.12 + 0.18 * k)) / sr) crack = 0.3 + Math.random() * 0.7;
        crack *= 0.9965;
        const tick = (w - prev) * crack * Math.exp(-t / tauTail); prev = w;
        d[i] = l2 * envB * 2.0 + rl * envR * 4.5 + thump * 0.95 + tick * 0.1;
      }
    }
    return this.finish(buf, 0.9, 1.2);
  },
  arcade(tier) {
    const ctx = Sound.ctx, sr = ctx.sampleRate, k = [0.5, 0.8, 1.2, 2.2][tier];
    const dur = 0.4 + 0.45 * k, len = Math.floor(sr * dur), buf = ctx.createBuffer(2, len, sr);
    const L = buf.getChannelData(0), R = buf.getChannelData(1);
    let lfsr = 1, out = 1, acc = 0, lp = 0;
    const la = 1 - Math.exp(-2 * Math.PI * 6000 / sr);
    for (let i = 0; i < len; i++) {
      const p = i / len;
      // both the noise clock and the volume move in steps, like the hardware
      const clock = 9000 * Math.pow(0.07, Math.floor(p * 14) / 14);
      const vol = Math.ceil(15 * Math.pow(1 - p, 1.4)) / 15;
      acc += clock / sr;
      while (acc >= 1) { acc -= 1; const bit = (lfsr ^ (lfsr >> 1)) & 1; lfsr = (lfsr >> 1) | (bit << 14); out = lfsr & 1 ? 1 : -1; }
      lp += la * (out * vol - lp);
      L[i] = R[i] = lp;
    }
    return this.finish(buf, 0.75, 1);
  }
};

// every sound event goes to whichever style is selected
Sound.px = null;
Sound.pos = function (x) { this.px = x; return this; };
Sound.modernOn = function () { return Cfg.soundStyle !== 'CLASSIC'; };
for (const k of Object.keys(SoundClassic)) {
  if (['unlock', 'ok'].includes(k)) continue;
  Sound[k] = function (...a) {
    if (this.modernOn() && SoundModern[k]) return SoundModern[k](...a);
    this.px = null;
    return SoundClassic[k].apply(this, a);
  };
}
Sound.ambience = function (level) { if (this.modernOn() && Cfg.windSound && App.scene === BattleScene) SoundModern.ambience(level); else SoundModern.ambienceStop(); };

/* ---------- js/music.js ---------- */
'use strict';
/* =====================================================================
   Music (Remastered): a light score synthesized as it plays. Nothing is
   loaded from files: one piece (a desert march in D minor) is written a
   bar at a time from its chord progression by a handful of parts - pad,
   bass, snare, timpani, marimba, shaker, a distant bugle - with a little
   chance in the details so it doesn't loop note for note. The music
   never restarts between screens; each screen only changes the mix:
     menus   - the full march, snare cadences and bugle calls
     battle  - thinned right down: pad, scattered notes, a quiet pulse
     shop    - brushes, oom-pah bass and a wandering marimba tune
   Music uses Math.random, never the simulation's generator, so network
   games stay in step. Sound > Sound Style CLASSIC plays it on square
   waves, like a PC speaker that learned to count.

   Also here: the on-screen volume control (music / effects), drawn over
   every screen in the bottom-right corner.
   ===================================================================== */

const midiHz = n => 440 * Math.pow(2, (n - 69) / 12);
const CHORD_Q = { M: [0, 4, 7], m: [0, 3, 7], 7: [0, 4, 7, 10], m7: [0, 3, 7, 10], M7: [0, 4, 7, 11], sus: [0, 5, 7] };
// "D m" -> { root pitch class, intervals }
function chordOf(sym) {
  const [r, q] = sym.split(' ');
  const pc = { C: 0, 'C#': 1, Db: 1, D: 2, Eb: 3, E: 4, F: 5, 'F#': 6, G: 7, Ab: 8, A: 9, Bb: 10, B: 11 }[r];
  return { pc, iv: CHORD_Q[q || 'M'] };
}
// chord tones inside [lo, hi), ascending
function chordTones(ch, lo, hi) {
  const out = [];
  for (let n = lo; n < hi; n++) if (ch.iv.some(i => (n - ch.pc - i) % 12 === 0)) out.push(n);
  return out;
}
// the chord's root inside [lo, lo + 12)
function rootIn(ch, lo) { let n = lo + ((ch.pc - lo) % 12 + 12) % 12; return n; }

// One score plays for the whole game; screens change the arrangement,
// never the song, so the music carries on from menu to battle to shop.
const MUSIC_SCORE = {
  bpm: 92,
  // A: the D minor march; B: a turn to the relative major and back
  prog: ['D m', 'Bb', 'C', 'D m', 'D m', 'Bb', 'G m', 'A 7', 'F', 'C', 'D m', 'Bb', 'G m', 'C', 'F', 'A 7']
};
// how loud each part is on each kind of screen (they fade over a couple of seconds)
const MUSIC_MIX = {
  menu: { pad: 1, bass: 1, drums: 1, timp: 1, arp: 1, bugle: 1, shaker: 0.35, tune: 0 },
  battle: { pad: 0.6, bass: 0.55, drums: 0.3, timp: 0.55, arp: 0.5, bugle: 0.3, shaker: 0.6, tune: 0 },
  shop: { pad: 0.45, bass: 0.9, drums: 0.7, timp: 0.2, arp: 0.3, bugle: 0, shaker: 1, tune: 0.9 }
};
const MUSIC_PARTS = Object.keys(MUSIC_MIX.menu);

const Music = {
  bus: null, dry: null, wet: null, verb: null, noise: null, parts: null,
  style: 'menu', bar: 0, nextT: 0, playing: false, mel: null, part: 'pad', level: {},
  chip() { return Cfg.soundStyle === 'CLASSIC'; },

  setup() {
    const ctx = Sound.ctx;
    if (this.bus || !ctx) return !!this.bus;
    this.bus = ctx.createGain(); this.bus.gain.value = 0;
    this.bus.connect(ctx.destination);
    this.dry = ctx.createGain(); this.dry.connect(this.bus);
    this.wet = ctx.createGain();
    // a wide, soft hall
    const len = Math.floor(ctx.sampleRate * 2.4), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6) * (i < 400 ? i / 400 : 1);
    }
    this.verb = ctx.createConvolver(); this.verb.buffer = ir;
    const vg = ctx.createGain(); vg.gain.value = 0.5;
    this.wet.connect(this.verb); this.verb.connect(vg); vg.connect(this.bus);
    const n = ctx.sampleRate;
    this.noise = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    // a fader per part (its dry signal and reverb send move together)
    this.parts = {};
    for (const k of MUSIC_PARTS) {
      const pd = ctx.createGain(), pw = ctx.createGain(), v = MUSIC_MIX[this.style][k];
      pd.gain.value = v; pw.gain.value = v;
      pd.connect(this.dry); pw.connect(this.wet);
      this.parts[k] = { dry: pd, wet: pw };
      this.level[k] = v;
    }
    return true;
  },
  // which arrangement fits the screen we're on
  want() {
    if (App.scene === BattleScene) return 'battle';
    if (typeof ShopScene !== 'undefined' && App.scene instanceof ShopScene) return 'shop';
    return 'menu';
  },
  audible() { return Cfg.sound && Sound.ctx && Sound.ctx.state === 'running' && Cfg.musicVolume > 0; },

  // every frame: follow the volume and the screen, write the bars coming up
  update() {
    Volume.apply();
    if (!this.audible()) { this.playing = false; return; }
    if (!this.setup()) return;
    if (Sound.modernOn() && Cfg.sound) SoundModern.setup();   // (starts rendering the explosions early)
    const ctx = Sound.ctx, now = ctx.currentTime, want = this.want();
    if (want !== this.style) {
      this.style = want;
      for (const k of MUSIC_PARTS) {
        const v = MUSIC_MIX[want][k];
        this.level[k] = v;
        this.parts[k].dry.gain.setTargetAtTime(v, now, 0.8);
        this.parts[k].wet.gain.setTargetAtTime(v, now, 0.8);
      }
    }
    // (re)starting, or the tab slept: carry on from here, same place in the song
    if (!this.playing || this.nextT < now - 0.25) { this.playing = true; this.nextT = now + 0.08; }
    while (this.nextT < now + 0.35) this.writeBar();
  },
  // pick the part the next notes belong to; false when it's faded right out
  on(part) { this.part = part; return this.level[part] > 0.02; },
  sw(s) { return this.style === 'shop' && s % 4 === 2 ? s + 0.35 : s; },
  writeBar() {
    const st = 60 / MUSIC_SCORE.bpm / 4, b = this.bar, t = this.nextT, P = MUSIC_SCORE.prog;
    const ch = chordOf(P[b % P.length]), next = chordOf(P[(b + 1) % P.length]);
    try { this.arrange(b, ch, next, t, st); } catch (e) { console.error(e); }
    this.bar++;
    this.nextT += st * 16;
  },
  arrange(b, ch, next, t, st) {
    const style = this.style, cyc = b % 8, r = rootIn(ch, 33);
    if (this.on('pad')) this.pad(t, chordTones(ch, style === 'battle' ? 52 : 57, style === 'battle' ? 66 : 70).slice(0, 4), st * 16, 0.05, style === 'battle' ? 700 : 1100);
    // bass: root and fifth; in the shop an oom-pah that walks into the next chord
    if (this.on('bass')) {
      if (style === 'shop') {
        this.bass(t, r + 12, 0.18, st * 3, true);
        this.bass(t + st * 8, r + 7, 0.15, st * 3, true);
        if (chance(0.6)) this.bass(t + st * 14, rootIn(next, 33) + 12 + (chance(0.5) ? -1 : 1), 0.1, st * 1.5, true);
      } else {
        this.bass(t, r, 0.2, st * 5);
        if (style !== 'battle' || chance(0.5)) this.bass(t + st * 8, r + 7, 0.15, st * 4);
        if (style === 'menu' && chance(0.5)) this.bass(t + st * 14, r + (chance(0.5) ? 12 : 10), 0.1, st * 2);
      }
    }
    // drums: a march backbeat and ghost notes (brushes in the shop, only ghosts in battle)
    if (this.on('drums')) {
      for (let s = 0; s < 16; s++) {
        if ((s === 4 || s === 12) && style !== 'battle') this.snare(t + s * st, style === 'shop' ? 0.14 : 0.3, style === 'shop');
        else if ([2, 3, 6, 10, 11, 14].includes(s) && chance(style === 'battle' ? 0.25 : 0.35)) this.snare(t + this.sw(s) * st, 0.08, style === 'shop');
      }
      if (b % 4 === 3 && style !== 'shop') for (let s = 0; s < 8; s++) this.snare(t + (12 + s / 2) * st, 0.07 + s * 0.025);
    }
    if (this.on('timp')) {
      if (b % 4 === 0) this.timp(t, r + 12, 0.45);
      if (cyc === 7) this.timp(t + st * 12, r + 19, 0.3);
    }
    if (this.on('shaker')) for (let s = 0; s < 16; s += 2) if (chance(0.75)) this.tick(t + this.sw(s) * st, s % 4 === 0 ? 0.035 : 0.022);
    // marimba: arpeggios, chord stabs in the shop, a few scattered notes under a battle
    if (this.on('arp')) {
      if (style === 'battle') {
        const hi = chordTones(ch, 69, 88);
        for (let s = 0; s < 16; s += 2) if (chance(0.22)) this.mallet(t + s * st, pick(hi), 0.07, 1.2);
      } else if (style === 'shop') {
        const stab = chordTones(ch, 60, 72).slice(0, 3);
        for (const s of [4, 12]) for (const n of stab) this.mallet(t + s * st, n, 0.05, 0.25);
      } else {
        const arp = chordTones(ch, 62, 82), up = b % 2 === 0;
        for (let s = 0; s < 16; s += 2) {
          if (!chance(0.8)) continue;
          const i = up ? (s / 2) % arp.length : arp.length - 1 - (s / 2) % arp.length;
          this.mallet(t + s * st, arp[i], s % 4 === 0 ? 0.11 : 0.07);
        }
      }
    }
    // the shop's tune: steps around the chord tones, with a breath every other bar
    if (this.on('tune')) {
      const tones = chordTones(ch, 67, 86);
      let n = this.mel && tones.includes(this.mel) ? this.mel : pick(tones);
      for (let s = 0; s < 16; s += 2) {
        if (b % 2 === 1 && s >= 10) break;
        if (!chance(s % 4 === 0 ? 0.8 : 0.5)) continue;
        const i = tones.indexOf(n);
        n = tones[clamp(i + pick([-1, 1, 1, -2, 2, 0]), 0, tones.length - 1)];
        this.mallet(t + this.sw(s) * st, n, s % 4 === 0 ? 0.12 : 0.08);
      }
      this.mel = n;
    }
    // bugle calls, far off: twice every eight bars
    if (this.on('bugle') && (cyc === 2 || cyc === 6)) this.bugleCall(t, st, ch, cyc === 6);
  },

  /* ------------------------------------------------ instruments */
  // a voice: gain node into the dry bus, with some sent to the hall
  out(level, wet) {
    const ctx = Sound.ctx, g = ctx.createGain(), p = this.parts[this.part];
    g.gain.value = level;
    g.connect(p.dry);
    if (wet && !this.chip()) { const s = ctx.createGain(); s.gain.value = wet; g.connect(s); s.connect(p.wet); }
    return g;
  },
  osc(type, f, t, end, dest, detune) {
    const o = Sound.ctx.createOscillator();
    o.type = this.chip() && type !== 'sine' ? 'square' : type;
    o.frequency.setValueAtTime(f, t);
    if (detune) o.detune.value = detune;
    o.connect(dest); o.start(t); o.stop(end + 0.05);
    return o;
  },
  env(g, t, a, peak, hold, rel) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    if (hold) g.gain.setValueAtTime(Math.max(0.0002, peak), t + a + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + (hold || 0) + rel);
  },
  pad(t, notes, dur, level, cutoff) {
    const ctx = Sound.ctx, f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'lowpass'; f.Q.value = 0.5;
    f.frequency.setValueAtTime(cutoff * 0.6, t);
    f.frequency.linearRampToValueAtTime(cutoff, t + dur * 0.5);
    f.frequency.linearRampToValueAtTime(cutoff * 0.7, t + dur);
    f.connect(g); g.connect(this.out(1, 0.6));
    const lv = level * (this.chip() ? 0.35 : 1) / Math.max(1, notes.length) * 2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(lv, t + Math.min(0.8, dur * 0.3));
    g.gain.setValueAtTime(lv, t + dur - 0.2);
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.9);
    for (const n of notes) {
      this.osc('sawtooth', midiHz(n), t, t + dur + 1, f, -7);
      if (!this.chip()) this.osc('triangle', midiHz(n), t, t + dur + 1, f, 6);
    }
  },
  bass(t, n, vel, dur, pluck) {
    const ctx = Sound.ctx, f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'lowpass'; f.frequency.value = pluck ? 900 : 500; f.Q.value = 0.9;
    f.connect(g); g.connect(this.out(1, 0.12));
    this.env(g, t, 0.008, vel, pluck ? 0 : dur * 0.3, pluck ? 0.35 : dur * 0.8);
    this.osc('triangle', midiHz(n), t, t + dur + 0.4, f);
    if (!this.chip()) this.osc('sine', midiHz(n - 12), t, t + dur + 0.4, f);
  },
  // marimba: a sine with a fast-fading bright overtone
  mallet(t, n, vel, decay) {
    const ctx = Sound.ctx, d = this.out(1, 0.35), g = ctx.createGain(), g2 = ctx.createGain();
    decay = decay || 0.7;
    g.connect(d); g2.connect(d);
    this.env(g, t, 0.004, vel, 0, decay);
    this.env(g2, t, 0.002, vel * 0.35, 0, decay * 0.18);
    this.osc(this.chip() ? 'square' : 'sine', midiHz(n), t, t + decay + 0.1, g);
    if (!this.chip()) this.osc('sine', midiHz(n) * 3.98, t, t + decay * 0.3, g2);
  },
  // a bugle across the dunes: soft brass with a scoop and late vibrato
  bugle(t, n, vel, dur) {
    const ctx = Sound.ctx, f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'lowpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(700, t);
    f.frequency.linearRampToValueAtTime(2100, t + 0.06);
    f.frequency.linearRampToValueAtTime(1300, t + dur);
    f.connect(g); g.connect(this.out(1, 0.9));
    this.env(g, t, 0.04, vel * (this.chip() ? 0.5 : 1), dur * 0.7, dur * 0.4 + 0.15);
    const o = this.osc('sawtooth', midiHz(n), t, t + dur + 0.5, f);
    o.detune.setValueAtTime(-35, t); o.detune.linearRampToValueAtTime(0, t + 0.07);
    if (dur > 0.3) {
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.frequency.value = 5.2; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(12, t + dur);
      l.connect(lg); lg.connect(o.detune); l.start(t); l.stop(t + dur + 0.5);
    }
  },
  // a call built on the chord's bugle notes (root, fifth, octave, tenth)
  bugleCall(t, st, ch, answer) {
    const r = rootIn(ch, 62), deg = [r - 5, r, r + (ch.iv[1] || 4), r + 7, r + 12];
    const calls = [
      [[0, 1, 3], [3, 1, 1], [4, 2, 2], [6, 3, 6], [14, 1, 2]],
      [[0, 3, 2], [2, 3, 1], [3, 3, 1], [4, 4, 4], [8, 2, 4], [12, 1, 4]],
      [[0, 1, 1], [1, 2, 1], [2, 3, 2], [4, 4, 3], [7, 3, 1], [8, 1, 8]],
      [[0, 0, 2], [2, 1, 2], [4, 2, 2], [6, 3, 6], [12, 2, 4]]
    ];
    const c = answer ? pick(calls.slice(2)) : pick(calls.slice(0, 2));
    for (const [s, d, len] of c) this.bugle(t + s * st, deg[d], 0.07, len * st * 0.95);
  },
  snare(t, vel, brush) {
    const ctx = Sound.ctx, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = this.noise; src.playbackRate.value = 0.9 + Math.random() * 0.2;
    f.type = 'bandpass'; f.frequency.value = brush ? 3200 : 2400; f.Q.value = brush ? 0.5 : 0.8;
    src.connect(f); f.connect(g); g.connect(this.out(1, 0.25));
    this.env(g, t, 0.002, vel * 0.6, 0, brush ? 0.16 : 0.1);
    src.start(t, Math.random() * 0.5); src.stop(t + 0.3);
    if (!brush && vel > 0.15) {
      const b = ctx.createGain(); b.connect(this.out(1, 0.1));
      this.env(b, t, 0.002, vel * 0.25, 0, 0.07);
      const o = this.osc('triangle', 190, t, t + 0.12, b);
      o.frequency.exponentialRampToValueAtTime(140, t + 0.08);
    }
  },
  tick(t, vel) {
    const ctx = Sound.ctx, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = this.noise;
    f.type = 'highpass'; f.frequency.value = 7000;
    src.connect(f); f.connect(g); g.connect(this.out(1, 0.15));
    this.env(g, t, 0.002, vel, 0, 0.04);
    src.start(t, Math.random() * 0.5); src.stop(t + 0.1);
  },
  // distant artillery drum
  timp(t, n, vel) {
    const ctx = Sound.ctx, g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 400;
    f.connect(g); g.connect(this.out(1, 0.5));
    this.env(g, t, 0.006, vel * 0.7, 0, 1.4);
    const o = this.osc('sine', midiHz(n) * 1.06, t, t + 1.6, f);
    o.frequency.exponentialRampToValueAtTime(midiHz(n), t + 0.12);
    this.osc('sine', midiHz(n) * 1.5, t, t + 0.6, f);
  }
};

/* =====================================================================
   Volume: music and effects levels (0-100, kept with the settings but
   saved straight away and never sent to other players), and the little
   control in the bottom-right corner: click or drag a bar to set it,
   click the icon to mute / unmute.
   ===================================================================== */
const Volume = {
  sfxNode: null, musicLevel: -1, sfxLevel: -1,
  drag: null, hover: false, rects: [], last: { music: 60, sfx: 100 },
  gain(v, max) { return Math.pow(clamp(v, 0, 100) / 100, 1.7) * max; },
  // push the current levels into the mixer when they change
  apply() {
    const ctx = Sound.ctx;
    if (!ctx) return;
    if (this.sfxNode && this.sfxLevel !== Cfg.sfxVolume) {
      this.sfxLevel = Cfg.sfxVolume;
      this.sfxNode.gain.setTargetAtTime(this.gain(Cfg.sfxVolume, 1), ctx.currentTime, 0.03);
    }
    if (Music.bus && this.musicLevel !== Cfg.musicVolume) {
      this.musicLevel = Cfg.musicVolume;
      Music.bus.gain.setTargetAtTime(this.gain(Cfg.musicVolume, 0.6), ctx.currentTime, 0.05);
    }
  },
  // the node every sound effect passes through (both sound styles)
  sfx() {
    const ctx = Sound.ctx;
    if (!this.sfxNode) {
      this.sfxNode = ctx.createGain();
      this.sfxNode.gain.value = this.gain(Cfg.sfxVolume, 1);
      this.sfxLevel = Cfg.sfxVolume;
      this.sfxNode.connect(ctx.destination);
    }
    return this.sfxNode;
  },
  set(which, v) {
    const k = which === 'music' ? 'musicVolume' : 'sfxVolume';
    v = Math.round(clamp(v, 0, 100));
    if (Cfg[k] === v) return;
    Cfg[k] = v;
    if (v > 0) this.last[which] = v;
    this.save();
  },
  save() {
    clearTimeout(this.saveT);
    this.saveT = setTimeout(() => Store.set('scorch.cfg', Object.assign({}, Store.get('scorch.cfg', {}), { musicVolume: Cfg.musicVolume, sfxVolume: Cfg.sfxVolume })), 300);
  },
  toggle(which) {
    const k = which === 'music' ? 'musicVolume' : 'sfxVolume';
    if (Cfg[k] > 0) { this.last[which] = Cfg[k]; this.set(which, 0); }
    else this.set(which, this.last[which] || (which === 'music' ? 60 : 100));
    if (which === 'sfx') Sound.click();
  },

  /* ------------------------------------------------ the on-screen control */
  // rectangles in canvas pixels (Remastered) or UI units (classic)
  layout() {
    const rows = [], modern = Gfx.modern;
    let x, y, s, w, pad;
    if (modern) {
      const d = Gfx.dpr;
      const coarse = (typeof Hud !== 'undefined' && Hud.touch) || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
      s = Math.round(clamp(Math.min(Gfx.cw, Gfx.ch) * 0.03, (coarse ? 22 : 15) * d, (coarse ? 28 : 22) * d));   // finger-sized on phones
      w = Math.round(s * 5.6); pad = Math.round(s * 0.35);
      x = Gfx.cw - w - Math.round(8 * d);
      y = Gfx.ch - (s * 2 + pad * 2) - Math.round(8 * d);
      // keep clear of the touch buttons in battle
      if (App.scene === BattleScene && typeof Hud !== 'undefined' && Hud.touchOn() && Hud.btns.length) {
        const top = Math.min(...Hud.btns.filter(b => b.x + b.w > x).map(b => b.y));
        if (isFinite(top)) y = Math.min(y, top - (s * 2 + pad * 2) - Math.round(8 * d));
      }
    } else {
      s = 8; w = 58; pad = 2;
      x = Screen.UW - w - 2; y = Screen.UH - (s * 2 + pad * 2) - 2;
    }
    const box = { x, y, w, h: s * 2 + pad * 2 };
    for (const [i, which] of ['music', 'sfx'].entries()) {
      const ry = y + pad + i * s;
      const icon = { x: x + pad, y: ry, w: s, h: s };
      const bx = icon.x + s + pad, bw = w - (bx - x) - pad - (modern ? s * 1.5 : 0);
      rows.push({ which, icon, bar: { x: bx, y: ry, w: bw, h: s } });
    }
    return { box, rows, s, modern };
  },
  // the pointer in the same units as layout()
  at(ux, uy) { return Gfx.modern ? { x: Gfx.UXp(ux), y: Gfx.UYp(uy) } : { x: ux, y: uy }; },
  inside(r, p) { return p.x >= r.x && p.x < r.x + r.w && p.y >= r.y && p.y < r.y + r.h; },
  // mouse events come here first; true = handled
  mouse(ev) {
    if (Cfg.pointer === 'None' || !this.L) return false;
    const p = this.at(ev.ux, ev.uy);
    if (ev.kind === 'up' && this.drag) { this.drag = null; return true; }
    if ((ev.kind !== 'down' && ev.kind !== 'dbl') || ev.button) return false;
    if (!this.inside(this.L.box, p)) return false;
    if (ev.kind === 'dbl') return true;
    for (const r of this.L.rows) {
      if (this.inside(r.icon, p)) { this.toggle(r.which); return true; }
      const hit = { x: r.bar.x - r.bar.h * 0.4, y: r.bar.y, w: r.bar.w + r.bar.h * 0.8, h: r.bar.h };
      if (this.inside(hit, p)) { this.drag = r.which; this.dragTo(p); return true; }
    }
    return true;
  },
  dragTo(p) {
    const r = this.L.rows.find(q => q.which === this.drag);
    if (r) this.set(this.drag, Math.round((p.x - r.bar.x) / r.bar.w * 20) * 5);
  },
  update() {
    if (!this.L) return;
    const p = this.at(Input.ux, Input.uy);
    this.hover = !!this.drag || (Input.inside !== false && this.inside(this.L.box, p));
    if (this.drag) { if (Input.buttons & 1) this.dragTo(p); else this.drag = null; }
  },
  draw() {
    this.L = this.layout();
    if (this.L.modern) this.drawModern(Gfx.ctx, this.L);
    else this.drawClassic(Screen.ui, this.L);
  },
  drawModern(ctx, L) {
    const d = Gfx.dpr, { box, s } = L;
    const quiet = App.scene === BattleScene && !this.hover;
    ctx.save();
    ctx.globalAlpha = quiet ? 0.55 : 1;
    Hud.pill(ctx, box.x, box.y, box.w, box.h, { fill: 'rgba(9,12,21,0.72)', edge: this.hover ? 'rgba(255,182,64,0.45)' : 'rgba(170,190,235,0.16)' });
    for (const r of L.rows) {
      const v = r.which === 'music' ? Cfg.musicVolume : Cfg.sfxVolume, on = v > 0 && Cfg.sound;
      const col = on ? '#e6eaf2' : 'rgba(150,160,185,0.6)';
      this.glyph(ctx, r.which, r.icon, col, v > 0);
      // the bar: a track, the level, a knob
      const b = r.bar, cy = b.y + b.h / 2, th = Math.max(2 * d, b.h * 0.2), f = v / 100;
      VUI.rr.call({ ctx }, b.x, cy - th / 2, b.w, th, th / 2); ctx.fillStyle = 'rgba(160,175,210,0.22)'; ctx.fill();
      if (f > 0) { VUI.rr.call({ ctx }, b.x, cy - th / 2, b.w * f, th, th / 2); ctx.fillStyle = on ? (r.which === 'music' ? '#6ac2ff' : '#ffb640') : 'rgba(150,160,185,0.5)'; ctx.fill(); }
      ctx.beginPath(); ctx.arc(b.x + b.w * f, cy, b.h * (this.drag === r.which ? 0.34 : 0.27), 0, Math.PI * 2);
      ctx.fillStyle = on ? '#f4f6fb' : 'rgba(170,180,200,0.8)'; ctx.fill();
      Hud.txt(ctx, String(v), b.x + b.w + s * 1.45, cy, s * 0.52, col, { align: 'right', weight: 600 });
    }
    ctx.restore();
  },
  // a music note or a speaker, crossed out when muted
  glyph(ctx, which, r, col, on) {
    const x = r.x, y = r.y, s = r.w;
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.2, s * 0.09); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (which === 'music') {
      // two beamed eighth notes
      ctx.beginPath(); ctx.ellipse(x + s * 0.3, y + s * 0.72, s * 0.14, s * 0.1, -0.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + s * 0.72, y + s * 0.62, s * 0.14, s * 0.1, -0.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + s * 0.42, y + s * 0.7); ctx.lineTo(x + s * 0.42, y + s * 0.24); ctx.lineTo(x + s * 0.84, y + s * 0.14); ctx.lineTo(x + s * 0.84, y + s * 0.6); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(x + s * 0.12, y + s * 0.38); ctx.lineTo(x + s * 0.3, y + s * 0.38); ctx.lineTo(x + s * 0.52, y + s * 0.18);
      ctx.lineTo(x + s * 0.52, y + s * 0.82); ctx.lineTo(x + s * 0.3, y + s * 0.62); ctx.lineTo(x + s * 0.12, y + s * 0.62); ctx.closePath(); ctx.fill();
      if (on) { ctx.beginPath(); ctx.arc(x + s * 0.56, y + s * 0.5, s * 0.22, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(x + s * 0.56, y + s * 0.5, s * 0.38, -0.9, 0.9); ctx.stroke(); }
    }
    if (!on) { ctx.strokeStyle = '#ff6060'; ctx.beginPath(); ctx.moveTo(x + s * 0.1, y + s * 0.9); ctx.lineTo(x + s * 0.92, y + s * 0.1); ctx.stroke(); }
  },
  drawClassic(u, L) {
    u.fillRect(L.box.x, L.box.y, L.box.w, L.box.h, UIC.face);
    u.rect(L.box.x, L.box.y, L.box.w, L.box.h, this.hover ? UIC.hi : UIC.lo);
    for (const r of L.rows) {
      const v = r.which === 'music' ? Cfg.musicVolume : Cfg.sfxVolume;
      Font.draw(u, r.which === 'music' ? 'M' : 'S', r.icon.x + 1, r.icon.y, v > 0 ? UIC.text : UIC.dis);
      const b = r.bar, n = Math.round(b.w * v / 100);
      u.fillRect(b.x, b.y + 2, b.w, 4, UIC.lo);
      if (n > 0) u.fillRect(b.x, b.y + 2, n, 4, r.which === 'music' ? UIC.wind : UIC.yellow);
    }
  }
};

/* ---------- js/input.js ---------- */
'use strict';
/* =====================================================================
   Input: keyboard (held state + event queue), mouse, and a gamepad used
   as the "Joystick" pointer.
   ===================================================================== */

const Input = {
  held: {},
  events: [],
  x: -1, y: -1, ux: -1, uy: -1, buttons: 0, inside: false,
  lastDown: { t: 0, x: 0, y: 0 },
  joyX: -1, joyY: -1, joyButtons: 0,

  norm(e) {
    if (e.code && e.code.startsWith('Key')) return e.code.slice(3).toLowerCase();
    if (e.code && e.code.startsWith('Digit')) return e.code.slice(5);
    if (e.code && e.code.startsWith('Numpad') && /^[0-9]$/.test(e.key)) return e.key;
    const k = (e.key || '').toLowerCase();
    if (k === ' ' || k === 'spacebar') return 'space';
    if (k === 'esc') return 'escape';
    if (k === 'left') return 'arrowleft';
    if (k === 'right') return 'arrowright';
    if (k === 'up') return 'arrowup';
    if (k === 'down') return 'arrowdown';
    return k;
  },

  // phones and tablets: a hidden text box brings up the on-screen keyboard for text fields
  kb: null,
  initKeyboard() {
    const el = document.createElement('input');
    el.type = 'text'; el.autocomplete = 'off'; el.spellcheck = false;
    el.setAttribute('autocapitalize', 'off'); el.setAttribute('autocorrect', 'off'); el.setAttribute('aria-hidden', 'true');
    el.style.cssText = 'position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:0.01;font-size:16px;border:0;padding:0;margin:0;background:transparent;color:transparent;z-index:-1';
    document.body.appendChild(el);
    const key = (k, ch) => this.events.push({ type: 'key', k, ch: ch || '', shift: false, alt: false, ctrl: false, repeat: false });
    const reset = () => { el.value = ' '; try { el.setSelectionRange(1, 1); } catch (e) { /* ignore */ } };
    el.addEventListener('input', e => {
      if (e.inputType && e.inputType.startsWith('delete')) key('backspace');
      else for (const ch of el.value.slice(1)) if (ch >= ' ' && ch <= '~') key(ch.toLowerCase(), ch);
      reset();
    });
    el.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); key('enter'); }
      else if (e.key === 'Escape') { e.preventDefault(); key('escape'); }
    });
    this.kb = el; this.kbReset = reset;
  },
  showKeyboard() { if (!this.kb) return; this.kbReset(); try { this.kb.focus({ preventScroll: true }); } catch (e) { this.kb.focus(); } },
  hideKeyboard() { if (this.kb && document.activeElement === this.kb) this.kb.blur(); },
  // is there a text field under this touch? (checked inside the tap itself, so the keyboard may open)
  textFieldAt(ux, uy) {
    const d = UI.top();
    if (!d || !d.ctls) return false;
    return d.ctls.some(c => (c.kind === 'text' || (c.def && c.def.type === 'text')) && !(c.hidden && c.hidden()) &&
      ux >= d.x + c.x && uy >= d.y + c.y && ux < d.x + c.x + c.w && uy < d.y + c.y + c.h);
  },

  init(canvas) {
    this.initKeyboard();
    window.addEventListener('keydown', e => {
      Sound.unlock();
      const k = this.norm(e);
      if (e.ctrlKey && !e.altKey && ['r', 'w', 't', 'n', 'l', 'c', 'v', 'x', '+', '-', '=', '0'].includes(k)) return; // leave browser shortcuts alone
      if (e.metaKey) return;
      if (k === 'f5' || k === 'f11' || k === 'f12') return;
      e.preventDefault();
      this.held[k] = true;
      this.events.push({
        type: 'key', k, ch: e.key && e.key.length === 1 ? e.key : '',
        shift: e.shiftKey, alt: e.altKey, ctrl: e.ctrlKey, repeat: e.repeat
      });
    });
    window.addEventListener('keyup', e => {
      const k = this.norm(e);
      this.held[k] = false;
      if (k === 'alt') e.preventDefault();
    });
    window.addEventListener('blur', () => { this.held = {}; this.buttons = 0; });

    const pos = e => {
      const p = Screen.toInternal(e.clientX, e.clientY);
      this.x = p.x; this.y = p.y;
      this.ux = p.x / Screen.UX; this.uy = p.y / Screen.UY;
      this.inside = p.x >= 0 && p.y >= 0 && p.x < Screen.W && p.y < Screen.H;
    };
    canvas.addEventListener('pointerdown', e => {
      Sound.unlock();
      if (Cfg.pointer === 'None') return;
      pos(e);
      const b = e.button === 2 ? 2 : e.button === 1 ? 1 : 0;
      this.buttons |= (1 << b);
      const now = performance.now();
      const dbl = b === 0 && now - this.lastDown.t < 350 && Math.abs(this.x - this.lastDown.x) < 6 && Math.abs(this.y - this.lastDown.y) < 6;
      if (b === 0) this.lastDown = { t: dbl ? 0 : now, x: this.x, y: this.y };
      this.events.push({ type: 'mouse', kind: 'down', button: b, x: this.x, y: this.y, ux: this.ux, uy: this.uy, both: (this.buttons & 5) === 5, pointer: e.pointerType });
      if (dbl) this.events.push({ type: 'mouse', kind: 'dbl', button: 0, x: this.x, y: this.y, ux: this.ux, uy: this.uy });
      if (e.pointerType === 'touch' || e.pointerType === 'pen') {
        if (this.textFieldAt(this.ux, this.uy)) this.showKeyboard();
        else if (typeof Hud !== 'undefined' && Hud.chatTapped && Hud.chatTapped(this.ux, this.uy)) { Chat.open(); this.showKeyboard(); }
      }
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      e.preventDefault();
    });
    canvas.addEventListener('pointerup', e => {
      if (Cfg.pointer === 'None') return;
      pos(e);
      const b = e.button === 2 ? 2 : e.button === 1 ? 1 : 0;
      this.buttons &= ~(1 << b);
      this.events.push({ type: 'mouse', kind: 'up', button: b, x: this.x, y: this.y, ux: this.ux, uy: this.uy });
    });
    canvas.addEventListener('pointermove', e => { if (Cfg.pointer !== 'None') pos(e); });
    canvas.addEventListener('pointerleave', () => { this.inside = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => {
      if (Cfg.pointer === 'None') return;
      this.events.push({ type: 'wheel', dy: Math.sign(e.deltaY), ux: this.ux, uy: this.uy });
      e.preventDefault();
    }, { passive: false });
  },

  // gamepad as a pointer: stick moves a cursor, buttons click
  poll(dt) {
    if (Cfg.pointer !== 'Joystick' || !navigator.getGamepads) return;
    let pad = null;
    try { for (const p of navigator.getGamepads()) if (p) { pad = p; break; } } catch (e) { return; }
    if (!pad) return;
    if (this.joyX < 0) { this.joyX = Screen.W / 2; this.joyY = Screen.H / 2; }
    const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
    const sp = 260 * Cfg.mouseRate * (Screen.W / 360);
    if (Math.abs(ax) > 0.15) this.joyX = clamp(this.joyX + ax * sp * dt, 0, Screen.W - 1);
    if (Math.abs(ay) > 0.15) this.joyY = clamp(this.joyY + ay * sp * dt * Screen.ay, 0, Screen.H - 1);
    this.x = this.joyX; this.y = this.joyY; this.ux = this.x / Screen.UX; this.uy = this.y / Screen.UY; this.inside = true;
    const btn = (pad.buttons[0] && pad.buttons[0].pressed ? 1 : 0) | (pad.buttons[1] && pad.buttons[1].pressed ? 4 : 0);
    for (const [bit, b] of [[1, 0], [4, 2]]) {
      if ((btn & bit) && !(this.joyButtons & bit)) this.events.push({ type: 'mouse', kind: 'down', button: b, x: this.x, y: this.y, ux: this.ux, uy: this.uy });
      if (!(btn & bit) && (this.joyButtons & bit)) this.events.push({ type: 'mouse', kind: 'up', button: b, x: this.x, y: this.y, ux: this.ux, uy: this.uy });
    }
    this.joyButtons = btn; this.buttons = btn;
  },

  take() { const e = this.events; this.events = []; return e; },
  isHeld(k) { return !!this.held[k]; }
};

/* ---------- js/ui.js ---------- */
'use strict';
/* =====================================================================
   UI toolkit: grey 3D-beveled dialogs, buttons with underlined hotkeys,
   counters (left click / key = next, right click / Shift+key = previous),
   toggles, text fields and a modal stack. All in UI-layer coordinates.
   ===================================================================== */

const UIC = {
  face: vga(42, 42, 42), hi: vga(63, 63, 63), lo: vga(21, 21, 21), black: vga(0, 0, 0),
  text: vga(0, 0, 0), hot: vga(44, 0, 0), dis: vga(29, 29, 29), field: vga(63, 63, 63),
  sel: vga(0, 0, 40), selText: vga(63, 63, 63), light: vga(52, 52, 52), dark: vga(32, 32, 32),
  blue: vga(0, 0, 42), title: vga(0, 0, 0), wind: vga(24, 48, 63), white: vga(63, 63, 63),
  yellow: vga(63, 63, 21), red: vga(63, 16, 16), green: vga(16, 60, 16)
};

function bevel(s, x, y, w, h, raised, face) {
  if (s.vector) { s.bevel(x, y, w, h, raised, face); return; }
  if (face !== undefined) s.fillRect(x, y, w, h, face);
  const a = raised ? UIC.hi : UIC.lo, b = raised ? UIC.lo : UIC.hi;
  s.hline(x, x + w - 1, y, a); s.vline(x, y, y + h - 1, a);
  s.hline(x, x + w - 1, y + h - 1, b); s.vline(x + w - 1, y, y + h - 1, b);
}
function frame(s, x, y, w, h, face) {
  if (s.vector) { s.panel(x, y, w, h); return; }
  s.rect(x, y, w, h, UIC.black);
  bevel(s, x + 1, y + 1, w - 2, h - 2, true, face === undefined ? UIC.face : face);
  bevel(s, x + 2, y + 2, w - 4, h - 4, true);
}
function drawButton(s, x, y, w, h, label, o) {
  o = o || {};
  if (s.vector) { s.button(x, y, w, h, label, o); return; }
  const pressed = !!o.pressed;
  bevel(s, x, y, w, h, !pressed, o.face === undefined ? UIC.face : o.face);
  if (!pressed && h > 8) bevel(s, x + 1, y + 1, w - 2, h - 2, true);
  const col = o.disabled ? UIC.dis : (o.color === undefined ? UIC.text : o.color);
  const ty = y + Math.floor((h - 8) / 2) + (pressed ? 1 : 0);
  const off = pressed ? 1 : 0;
  const hc = o.disabled ? UIC.dis : UIC.hot;
  if (o.value !== undefined) {
    Font.draw(s, label, x + 4 + off, ty, col, { hotColor: hc });
    Font.right(s, String(o.value), x + w - 4 + off, ty, col);
  } else if (o.align === 'left') {
    Font.draw(s, label, x + 4 + off, ty, col, { hotColor: hc });
  } else {
    const tw = Font.width(label);
    Font.draw(s, label, x + Math.floor((w - tw) / 2) + off, ty, col, { hotColor: hc });
  }
}
function drawCheck(s, x, y, on, disabled) {
  if (s.vector) { s.check(x, y, on, disabled); return; }
  bevel(s, x, y, 9, 9, false, disabled ? UIC.face : UIC.field);
  if (on) {
    const c = disabled ? UIC.dis : UIC.black;
    s.pset(x + 2, y + 4, c); s.pset(x + 3, y + 5, c); s.pset(x + 4, y + 6, c);
    s.pset(x + 5, y + 5, c); s.pset(x + 6, y + 4, c); s.pset(x + 7, y + 3, c); s.pset(x + 7, y + 2, c);
    s.pset(x + 2, y + 5, c); s.pset(x + 3, y + 6, c); s.pset(x + 4, y + 7, c); s.pset(x + 5, y + 6, c); s.pset(x + 6, y + 5, c);
  }
}
function drawField(s, x, y, w, text, caret, maxShow) {
  if (s.vector) { s.field(x, y, w, text, caret, maxShow); return; }
  bevel(s, x, y, w, 12, false, UIC.field);
  let t = String(text);
  const mc = maxShow || Math.floor((w - 6) / Font.CW);
  if (t.length > mc) t = t.slice(t.length - mc);
  Font.draw(s, t.replace(/&/g, '&&'), x + 3, y + 2, UIC.black);
  if (caret && (Math.floor(performance.now() / 400) & 1)) s.vline(x + 3 + t.length * Font.CW, y + 2, y + 9, UIC.black);
}
// small raised box with centered text lines (used for popups over the battlefield)
function drawBox(s, lines, cx, cy, o) {
  o = o || {};
  const w = Math.max(...lines.map(l => Font.width(l))) + 16;
  const h = lines.length * 10 + 12;
  const x = clamp(Math.floor(cx - w / 2), 0, Screen.UW - w), y = clamp(Math.floor(cy - h / 2), 0, Screen.UH - h);
  frame(s, x, y, w, h);
  lines.forEach((l, i) => Font.center(s, l, x + w / 2, y + 7 + i * 10, o.color || UIC.text));
  return { x, y, w, h };
}

/* ---------------- controls ---------------- */
class Ctl {
  constructor(o) {
    Object.assign(this, o);
    if (this.hot === undefined && this.label) this.hot = Font.hotkeyOf(this.label);
  }
  inside(mx, my) { return mx >= this.x && my >= this.y && mx < this.x + this.w && my < this.y + this.h; }
}

class Dialog {
  constructor(o) {
    o = o || {};
    this.title = o.title || '';
    this.ctls = [];
    this.w = o.w || 200; this.h = o.h || 100;
    this.x = 0; this.y = 0;
    this.closeOnOutside = o.closeOnOutside !== false;
    this.escCloses = o.escCloses !== false;
    this.onClose = o.onClose || null;
    this.onEnter = o.onEnter || null;
    this.pauses = !!o.pauses;
    this.focus = null;      // text control with caret
    this.pressed = null;    // control under a held mouse button
    this.pressBtn = 0;
    this.holdT = 0;
    this.titleColor = o.titleColor;
    this.face = o.face;
    if (o.center !== false) this.center();
  }
  center() {
    this.x = Math.floor((Screen.UW - this.w) / 2);
    this.y = Math.floor((Screen.UH - this.h) / 2);
  }
  add(o) { const c = new Ctl(o); c.dlg = this; this.ctls.push(c); return c; }
  button(label, x, y, w, h, fn, o) {
    return this.add(Object.assign({
      label, x, y, w, h, kind: 'button', fn,
      draw(s, d) {
        const dis = this.disabled && this.disabled();
        drawButton(s, d.x + this.x, d.y + this.y, this.w, this.h, this.label,
          { pressed: d.pressed === this, disabled: dis, value: this.value ? this.value() : undefined, align: this.align });
      },
      click(b) { if (this.disabled && this.disabled()) { Sound.error(); return; } Sound.click(); this.fn(b); }
    }, o || {}));
  }
  // counter / cycle / toggle / text bound to an object property
  option(def, obj, x, y, w, onChange) {
    const d = this;
    const ctl = this.add({
      label: def.label, x, y, w, h: def.type === 'toggle' ? 12 : 13, kind: def.type, def, obj, repeat: def.type === 'num',
      value() {
        const v = obj[def.key];
        if (def.type === 'toggle') return v ? 'ON' : 'OFF';
        if (def.fmt) return def.fmt(v);
        return String(v);
      },
      step(dir) {
        const v = obj[def.key];
        if (def.type === 'toggle') obj[def.key] = !v;
        else if (def.type === 'cycle') {
          const i = def.values.indexOf(v), n = def.values.length;
          obj[def.key] = def.values[((i < 0 ? 0 : i) + dir + n) % n];
        } else if (def.type === 'num') {
          const st = def.steps;
          let i = 0, best = Infinity;
          st.forEach((sv, k) => { const dd = Math.abs(sv - v); if (dd < best) { best = dd; i = k; } });
          obj[def.key] = st[(i + dir + st.length) % st.length];
        }
        if (def.onChange) def.onChange(obj[def.key]);
        if (onChange) onChange(def.key);
      },
      draw(s) {
        const X = d.x + this.x, Y = d.y + this.y;
        if (def.type === 'toggle') {
          drawCheck(s, X + 2, Y + 1, !!obj[def.key]);
          Font.draw(s, def.label, X + 15, Y + 2, UIC.text, { hotColor: UIC.hot });
        } else if (def.type === 'text') {
          Font.draw(s, def.label, X + 2, Y + 3, UIC.text, { hotColor: UIC.hot });
          const lw = Font.width(def.label) + 8;
          drawField(s, X + lw, Y, this.w - lw, obj[def.key], d.focus === this);
        } else {
          drawButton(s, X, Y, this.w, this.h, def.label, { pressed: d.pressed === this, value: this.value() });
        }
      },
      click(b) {
        if (def.type === 'text') { d.focus = this; this.orig = obj[def.key]; return; }
        Sound.click();
        this.step(b === 2 ? -1 : 1);
      },
      typed(ev) {
        let v = String(obj[def.key]);
        if (ev.k === 'enter') { d.focus = null; if (onChange) onChange(def.key); return; }
        if (ev.k === 'escape') { obj[def.key] = this.orig; d.focus = null; return; }
        if (ev.k === 'backspace') v = v.slice(0, -1);
        else if (ev.ch && v.length < 24) v += ev.ch;
        obj[def.key] = v;
      }
    });
