'use strict';
/* =====================================================================
   Buying Equipment screen, selling panel and the free market.
   ===================================================================== */

const Market = {
  mult: Object.assign({}, Store.get('scorch.mkt', {})),
  override: null,     // a network game uses the host's prices
  bought: {},
  m(id) { return Cfg.freeMarket ? ((this.override || this.mult)[id] || 1) : 1; },
  note(id) { this.bought[id] = (this.bought[id] || 0) + 1; },
  // supply and demand: bought items get pricier, ignored ones drift down (with a little bounce)
  settle() {
    if (!Cfg.freeMarket) { this.bought = {}; return; }
    for (const it of Data.items) {
      if (it.id === 'babyMissile') continue;
      let m = this.mult[it.id] || 1;
      const b = this.bought[it.id] || 0;
      m *= 1 + 0.05 * Math.min(b, 6) - 0.02 + rand(-0.025, 0.025);
      this.mult[it.id] = Math.round(clamp(m, 0.5, 2.2) * 1000) / 1000;
    }
    this.bought = {};
    Store.set('scorch.mkt', this.mult);
  }
};

const Shop = {
  useless(p, it) {
    switch (it.id) {
      case 'smokeTracer': return Cfg.tracePaths;
      case 'earthDisrupter': return Cfg.suspendDirt === 0;
      case 'contactTrigger': return !Cfg.tunneling || Cfg.mode === 'SIMULTANEOUS';
      case 'parachute': return !Cfg.tanksFall;
      case 'fuelTank': return Cfg.mode === 'SIMULTANEOUS';
    }
    if (it.kind === 'guidance' && Cfg.mode === 'SIMULTANEOUS') return true;
    return false;
  },
  visible(p, it) {
    if (it.arms > Cfg.armsLevel) return false;
    if (it.ext && !Cfg.extendedArsenal) return false;
    if (it.id === 'fuelTank' && !TankIcons[p.icon].mobile) return false;   // fixed emplacements can't use fuel
    if (it.id === 'autoDefense' && p.autoDefense) return false;
    if (!Cfg.uselessItems && this.useless(p, it)) return false;
    return true;
  },
  price(p, it) {
    // as in 1.5: $1500 for each round left, each later round discounted at the interest rate
    // (10 rounds at 5%: 1500 x (1 + 1/1.05 + ... + 1/1.05^9) = \$12,161)
    if (it.id === 'autoDefense') {
      const n = Math.max(1, Game.rounds - Game.round), r = Cfg.interestRate;
      let f = 0;
      for (let k = 0; k < n; k++) f += Math.pow(1 + r, -k);
      return Math.floor(it.cost * f);
    }
    return Math.round(it.cost * Market.m(it.id));
  },
  owned(p, it) {
    if (it.id === 'babyMissile') return 99;
    if (it.id === 'fuelTank') return Math.ceil((p.fuel || 0) / 10);
    if (it.id === 'autoDefense') return p.autoDefense ? 1 : 0;
    return p.inv[it.id] || 0;
  },
  // what a purchase would cost right now (respecting the 99 cap and its ~20% markup)
  quote(p, it) {
    const have = this.owned(p, it), room = 99 - have;
    if (it.id === 'babyMissile' || room <= 0) return null;
    if (it.id === 'autoDefense') return { qty: 1, cost: this.price(p, it) };
    const qty = Math.min(it.bundle, room);
    let cost = this.price(p, it);
    if (qty < it.bundle) cost = Math.round(cost * qty / it.bundle * 1.2);
    return { qty, cost };
  },
  buy(p, it, silent) {
    const q = this.quote(p, it);
    if (!q || q.cost > Game.cashOf(p)) { if (!silent) Sound.error(); return false; }
    Game.addCash(p, -q.cost);
    if (p.stats) p.stats.spent += q.cost;
    if (it.id === 'fuelTank') p.fuel = (p.fuel || 0) + q.qty * 10;
    else if (it.id === 'autoDefense') p.autoDefense = true;
    else p.inv[it.id] = (p.inv[it.id] || 0) + q.qty;
    Market.note(it.id);
    if (!silent) Sound.buy();
    return true;
  },
  // the computer's offer for `qty` items; stable for the whole round
  offer(p, it, qty) {
    if (qty <= 0) return 0;
    const unit = this.price(p, it) / it.bundle;
    const mood = 0.9 + hash2(Game.round, it.index, Game.seed) * 0.2;
    const base = Cfg.freeMarket ? 0.85 : 0.55;
    const bulk = 1 - 0.18 * (qty / 99);
    return Math.max(1, Math.round(qty * unit * base * bulk * mood));
  },
  sell(p, it, qty, silent) {
    const have = this.owned(p, it);
    qty = Math.min(qty, have);
    if (qty <= 0) return;
    const cash = this.offer(p, it, qty);
    if (it.id === 'fuelTank') p.fuel = Math.max(0, (p.fuel || 0) - qty * 10);
    else p.inv[it.id] -= qty;
    Game.addCash(p, cash);
    if (!silent) Sound.buy();
  }
};

/* ------------------------------------------------ the buying screen (a scene) */
class ShopScene {
  constructor(p, onDone) {
    this.p = p; this.onDone = onDone;
    this.group = 'W'; this.page = 0; this.sel = 0;
    this.layout();
    this.flashRow = -1; this.flashT = 0;
    this.btns = [];
    this.tx = [];   // what was bought and sold, so a network host can replay it
  }
  // list geometry: the classic look follows 1.5's shop, Remastered has its own
  layout() {
    if (!Gfx.modern) { this.listX = 9; this.listW = 187; this.listY = 25; this.rowH = 10; }
    else { this.listX = 4; this.listY = 18; this.rowH = 12; this.listW = Math.min(232, Screen.UW - 106); }
    this.perPage = Math.max(4, Math.floor((Screen.UH - this.listY - (Gfx.modern ? 6 : 4)) / this.rowH));
  }
  enter() { UI.clear(); Sound.seq([[660, 0.05], [880, 0.05]], 0.4); }
  items() {
    const p = this.p, cash = Game.cashOf(p);
    return Data.items.filter(it => it.cat === this.group && Shop.visible(p, it) &&
      (it.id === 'babyMissile' || Shop.price(p, it) <= cash || (Shop.quote(p, it) && Shop.quote(p, it).cost <= cash)));
  }
  pages() { return Math.max(1, Math.ceil(this.items().length / this.perPage)); }
  pageItems() { const all = this.items(); return all.slice(this.page * this.perPage, (this.page + 1) * this.perPage); }
  clampSel() {
    if (this.page >= this.pages()) this.page = this.pages() - 1;
    const n = this.pageItems().length;
    if (this.sel >= n) this.sel = Math.max(0, n - 1);
  }
  buySel() {
    const it = this.pageItems()[this.sel];
    if (!it) return;
    if (it.id === 'babyMissile') { Sound.error(); return; }
    if (Shop.buy(this.p, it)) { this.tx.push({ op: 'b', id: it.id }); this.flashRow = this.sel; this.flashT = 0.25; }
    this.clampSel();
  }
  done() {
    UI.clear();
    this.onDone(this.tx);
  }
  inventory() {
    const p = this.p;
    Panels.inventory(null, { player: p, title: 'Inventory - click to sell', onPick: it => {
      if (it.id === 'babyMissile' || it.id === 'autoDefense') { Sound.error(); return; }
      UI.remove(UI.top());
      this.sellPanel(it);
    } });
  }
  sellPanel(it) {
    const p = this.p;
    const w = 200, h = 96;
    const d = new Dialog({ w, h, title: 'Sell ' + it.name, closeOnOutside: false });
    d.qty = 1;
    const have = () => Shop.owned(p, it);
    d.text(() => 'In stock: ' + have(), 12, 18);
    d.add({ label: '&Quantity: ', x: 12, y: 30, w: 120, h: 12, kind: 'num', repeat: true, draw(s) {
      drawButton(s, d.x + this.x, d.y + this.y, this.w, this.h, this.label, { pressed: d.pressed === this, value: d.qty });
    }, step(dir) { const m = have(); d.qty = ((d.qty - 1 + dir + m) % m) + 1; }, click(b) { Sound.click(); this.step(b === 2 ? -1 : 1); } });
    d.text(() => 'Offer: ' + money(Shop.offer(p, it, d.qty)), 12, 48);
    d.button('&Accept', 20, h - 24, 70, 14, () => { Shop.sell(p, it, d.qty); this.tx.push({ op: 's', id: it.id, q: d.qty }); UI.remove(d); });
    d.button('&Reject', w - 90, h - 24, 70, 14, () => UI.remove(d));
    d.onKey = ev => {
      const m = have();
      if (ev.k === 'arrowup') { d.qty = d.qty >= m ? 1 : d.qty + 1; return true; }
      if (ev.k === 'arrowdown') { d.qty = d.qty <= 1 ? m : d.qty - 1; return true; }
      if (ev.k === 'q') { d.qty = ev.alt || ev.shift ? (d.qty <= 1 ? m : d.qty - 1) : (d.qty >= m ? 1 : d.qty + 1); return true; }
      return false;
    };
    UI.push(d);
  }
  update(dt) {
    if (this.flashT > 0) this.flashT -= dt;
  }
  key(ev) {
    if (UI.top()) { UI.key(ev); return; }
    const n = this.pageItems().length;
    switch (ev.k) {
      case 'pagedown': this.page = (this.page + 1) % this.pages(); this.clampSel(); Sound.click(); break;
      case 'pageup': this.page = (this.page - 1 + this.pages()) % this.pages(); this.clampSel(); Sound.click(); break;
      case 'arrowup': this.sel = (this.sel - 1 + n) % Math.max(1, n); break;
      case 'arrowdown': this.sel = (this.sel + 1) % Math.max(1, n); break;
      case 'home': this.sel = 0; break;
      case 'end': this.sel = Math.max(0, n - 1); break;
      case 'tab': this.group = this.group === 'W' ? 'M' : 'W'; this.page = 0; this.sel = 0; Sound.click(); break;
      case 'space': case 'enter': case 'b': this.buySel(); break;
      case 'i': this.inventory(); break;
      case 'u': Panels.update(); break;
      case 'escape': case 'd': this.done(); break;
      case 'f1': Menus.systemMenu(); break;
      case 's': if (ev.alt) Menus.systemMenu(); break;
    }
  }
  // which list row is under the pointer (-1: none)
  rowAt(mx, my) {
    if (mx < this.listX || mx >= this.listX + this.listW || my < this.listY) return -1;
    const r = Math.floor((my - this.listY) / this.rowH);
    return r >= 0 && r < this.pageItems().length ? r : -1;
  }
  mouse(ev) {
    if (UI.top()) { UI.mouse(ev); return; }
    if (ev.kind !== 'down') return;
    const mx = ev.ux, my = ev.uy;
    for (const b of this.btns) {
      if (mx >= b.x && my >= b.y && mx < b.x + b.w && my < b.y + b.h) { Sound.click(); b.fn(ev.button); return; }
    }
    const r = this.rowAt(mx, my);
    if (r >= 0) {
      if (!Gfx.modern && ev.button === 0) { this.sel = r; this.buySel(); }   // 1.5: a click buys
      else if (r === this.sel && ev.button === 0) this.buySel();
      else { this.sel = r; Sound.click(); }
    }
  }
  drawModern(dt) {
    Gfx.backdrop('menu', dt);
    const ctx = Gfx.ctx, col = c3(this.p.color);
    const g = ctx.createLinearGradient(0, 0, Gfx.cw, Gfx.ch);
    g.addColorStop(0, rgba(col, 0.22)); g.addColorStop(1, rgba(col, 0.05));
    ctx.fillStyle = g; ctx.fillRect(0, 0, Gfx.cw, Gfx.ch);
    this.draw();
  }
  // classic look: laid out like 1.5's shop
  drawClassic() {
    const s = Screen.ui, p = this.p, W = Screen.UW, H = Screen.UH;
    this.btns = [];
    Screen.main.clear(0);
    s.fillRect(0, 0, W, H, UIC.face);
    // top line: who, cash, rounds left
    Font.draw(s, p.name.replace(/&/g, '&&'), 4, 1, p.color);
    Font.draw(s, 'Cash: ' + money(Game.cashOf(p)) + (Cfg.teams === 'CORPORATE' ? ' (team)' : ''), Math.floor(W * 0.3), 1, UIC.text);
    const left = Math.max(0, Game.rounds - Game.round);
    Font.right(s, left === 1 ? '1 round remains' : left + ' rounds remain', W - 4, 1, UIC.text);
    s.hline(0, W - 1, 11, UIC.lo); s.hline(0, W - 1, 12, UIC.hi);
    // the list: a sunken row per slot, filled or not
    const lx = this.listX, lw = this.listW, items = this.pageItems(), np = this.pages();
    Font.draw(s, this.group === 'W' ? 'Weapons' : 'Miscellaneous', lx + 12, 14, UIC.text);   // 1.5 shows no page number
    for (let i = 0; i < this.perPage; i++) {
      const y = this.listY + i * this.rowH, it = items[i];
      const flash = it && i === this.flashRow && this.flashT > 0;
      bevel(s, lx, y, lw, this.rowH - 1, false, flash ? UIC.white : UIC.face);
      if (!it) continue;
      if (i === this.sel) Font.draw(s, '▶', lx - 8, y, UIC.text);
      Font.draw(s, String(Shop.owned(p, it)), lx + 2, y, UIC.text);
      Icons.draw(s, it.id, lx + 16, y);
      Font.draw(s, it.name.replace(/&/g, '&&'), lx + 31, y, UIC.text);
      const q = Shop.quote(p, it);
      Font.draw(s, q ? '$' + q.cost + '/' + q.qty : it.id === 'babyMissile' ? 'free' : 'max', lx + 128, y, UIC.text);
    }
    if (!items.length) Font.draw(s, 'Nothing you can afford', lx + 31, this.listY, UIC.dis);
    // scroll buttons at the top and bottom of the list
    const ax = lx + lw + 14, arrow = (y, up) => {
      bevel(s, ax, y, 15, 8, true, UIC.face);
      for (let k = 0; k < 3; k++) s.hline(ax + 7 - k, ax + 7 + k, up ? y + 2 + k : y + 5 - k, np > 1 ? UIC.text : UIC.dis);
    };
    const yTop = this.listY, yBot = this.listY + (this.perPage - 1) * this.rowH;
    arrow(yTop, true); arrow(yBot, false);
    this.btns.push({ x: ax, y: yTop, w: 15, h: 9, fn: () => this.key({ k: 'pageup' }) });
    this.btns.push({ x: ax, y: yBot, w: 15, h: 9, fn: () => this.key({ k: 'pagedown' }) });
    // Update / Inventory / Done
    const bx = W - 110, bw = 61;
    [['&Update', () => Panels.update()], ['&Inventory', () => this.inventory()], ['&Done', () => this.done()]].forEach(([label, fn], i) => {
      const by = 24 + i * 14;
      drawButton(s, bx, by, bw, 12, label, { align: 'left' });
      this.btns.push({ x: bx, y: by, w: bw, h: 12, fn });
    });
    // weapons / miscellaneous switch: gun and box over a little slider
    const sx = ax - 2, sy = Math.floor(H * 0.45);
    Icons.draw(s, 'gun', sx, sy, { gray: this.group !== 'W' });
    Icons.draw(s, 'box', sx + 20, sy, { gray: this.group !== 'M' });
    bevel(s, sx, sy + 12, 30, 4, false, UIC.dark);
    bevel(s, this.group === 'W' ? sx : sx + 22, sy + 10, 8, 8, true, UIC.face);
    this.btns.push({ x: sx, y: sy, w: 30, h: 19, fn: () => { this.group = this.group === 'W' ? 'M' : 'W'; this.page = 0; this.sel = 0; } });
    // what the item under the pointer (or the selected one) does - quietly, in the empty corner
    const hov = Input.inside ? this.rowAt(Input.ux, Input.uy) : -1;
    const it = this.pageItems()[hov >= 0 ? hov : this.sel];
    if (it) {
      const dx = sx, cols = Math.max(10, Math.floor((W - 4 - dx) / Font.CW));
      let y = sy + 26;
      Font.draw(s, it.name.replace(/&/g, '&&'), dx, y, UIC.text); y += 11;
      const q = Shop.quote(p, it);
      const text = [it.desc || ''];
      if (it.r && it.dmg) text.push('Blast ' + it.r + ', damage ' + it.dmg + '.');
      if (q && q.cost <= Game.cashOf(p) && it.id !== 'babyMissile') text.push('Click to buy.');
      for (const para of text) for (const l of Font.wrap(para, cols)) { if (y > H - 12) break; Font.draw(s, l.replace(/&/g, '&&'), dx, y, UIC.dis); y += 10; }
    }
  }
  draw() {
    this.layout();
    this.clampSel();
    if (!Gfx.modern) return this.drawClassic();
    const s = Screen.ui, p = this.p, modern = !!s.vector;
    const W = Screen.UW, H = Screen.UH;
    if (!modern) {
      // background in shades of the player's color
      Screen.main.clear(vga(0, 0, 0));
      for (let y = 0; y < H; y++) s.hline(0, W - 1, y, scalec(p.color, 0.12 + 0.1 * ((y >> 3) & 1)));
    }
    this.btns = [];
    // item list
    const lx = this.listX, lw = this.listW;
    frame(s, lx - 2, 2, lw + 4, H - 4);
    const np = this.pages();
    Font.center(s, (this.group === 'W' ? 'Weapons' : 'Miscellaneous') + (np > 1 ? '  ' + (this.page + 1) + '/' + np : ''), lx + lw / 2, 6, UIC.text);
    const items = this.pageItems();
    items.forEach((it, i) => {
      const y = this.listY + i * this.rowH;
      const flash = i === this.flashRow && this.flashT > 0;
      if (modern) s.row(lx + 8, y, lw - 10, this.rowH - 1, { sel: i === this.sel, flash, odd: i & 1 });
      else bevel(s, lx + 8, y, lw - 10, this.rowH - 1, true, flash ? UIC.white : UIC.light);
      if (i === this.sel) Font.draw(s, '▶', lx + 1, y + 2, UIC.hot);
      Icons.draw(s, it.id, lx + 10, y + 1);
      Font.draw(s, it.name.replace(/&/g, '&&'), lx + 25, y + 2, UIC.text);
      const q = Shop.quote(p, it);
      const pr = it.id === 'babyMissile' ? 'unlimited' : (q ? money(q.cost) + '/' + q.qty : 'max');
      const own = Shop.owned(p, it);
      Font.right(s, pr, lx + lw - 26, y + 2, it.id === 'babyMissile' ? UIC.dis : UIC.blue);
      Font.right(s, String(own), lx + lw - 4, y + 2, UIC.text);
    });
    if (!items.length) Font.center(s, 'Nothing you can afford', lx + lw / 2, this.listY + 20, UIC.dis);
    // right panel
    const rx = lx + lw + 6, rw = W - rx - 4;
    frame(s, rx, 2, rw, H - 4);
    let y = 8;
    Font.center(s, p.name.replace(/&/g, '&&'), rx + rw / 2, y, modern ? mixc(p.color, rgb(255, 255, 255), 0.3) : scalec(p.color, 0.6)); y += 12;
    Font.center(s, 'Cash ' + money(Game.cashOf(p)), rx + rw / 2, y, UIC.blue); y += 12;
    if (Cfg.teams === 'CORPORATE') { Font.center(s, '(team account)', rx + rw / 2, y, UIC.dis); y += 10; }
    Font.center(s, 'Round ' + Game.round + '/' + Game.rounds, rx + rw / 2, y, UIC.text); y += 14;
    // category slide bar: gun = weapons, box = miscellaneous
    const bx = rx + Math.floor((rw - 52) / 2);
    bevel(s, bx, y, 52, 16, false, UIC.dark);
    const selX = this.group === 'W' ? bx + 2 : bx + 26;
    bevel(s, selX, y + 2, 24, 12, true, UIC.light);
    Icons.draw(s, 'gun', bx + 8, y + 3, { gray: this.group !== 'W' });
    Icons.draw(s, 'box', bx + 32, y + 3, { gray: this.group !== 'M' });
    this.btns.push({ x: bx, y, w: 52, h: 16, fn: () => { this.group = this.group === 'W' ? 'M' : 'W'; this.page = 0; this.sel = 0; } });
    y += 20;
    // page arrows
    const pages = this.pages();
    const ax = rx + Math.floor((rw - 52) / 2);
    drawButton(s, ax, y, 24, 14, '▲', { disabled: pages <= 1 });
    drawButton(s, ax + 28, y, 24, 14, '▼', { disabled: pages <= 1 });
    this.btns.push({ x: ax, y, w: 24, h: 14, fn: () => this.key({ k: 'pageup' }) });
    this.btns.push({ x: ax + 28, y, w: 24, h: 14, fn: () => this.key({ k: 'pagedown' }) });
    y += 20;
    const bw = Math.min(80, rw - 12), bxx = rx + Math.floor((rw - bw) / 2);
    const btn = (label, fn, o) => { drawButton(s, bxx, y, bw, 14, label, o); this.btns.push({ x: bxx, y, w: bw, h: 14, fn }); y += 18; };
    const selIt = this.pageItems()[this.sel], selQ = selIt ? Shop.quote(p, selIt) : null;
    const canBuy = !!selQ && selQ.cost <= Game.cashOf(p);
    btn(selQ ? '&Buy  ' + money(selQ.cost) : '&Buy', () => { if (canBuy) this.buySel(); else Sound.error(); }, { disabled: !canBuy });
    btn('&Inventory', () => this.inventory());
    btn('&Update', () => Panels.update());
    btn('&Done', () => this.done());
    // what the item under the pointer (or the selected one) does
    const hov = Input.inside ? this.rowAt(Input.ux, Input.uy) : -1;
    const it = this.pageItems()[hov >= 0 ? hov : this.sel];
    if (it && y < H - 30) {
      y += 4;
      s.hline(rx + 8, rx + rw - 9, y, UIC.lo);
      y += 5;
      Font.center(s, it.name.replace(/&/g, '&&'), rx + rw / 2, y, UIC.hot); y += 11;
      const cols = Math.max(10, Math.floor((rw - 10) / (modern ? 5 : Font.CW)));
      const lines = Font.wrap(it.desc || '', cols);
      if (it.r && it.dmg) lines.push('Blast ' + it.r + '  Damage ' + it.dmg);
      for (const l of lines) { if (y > H - 14) break; Font.center(s, l.replace(/&/g, '&&'), rx + rw / 2, y, UIC.dis); y += 10; }
      if (y <= H - 14 && it === selIt && canBuy) Font.center(s, 'Click again to buy', rx + rw / 2, y + 2, UIC.hot);
    }
  }
}

// big blocky title letters with a vertical gradient and a hard shadow
function bigText(s, str, x, y, sc, grad, shadow) {
  const draw = (ox, oy, colorFn) => {
    for (let i = 0; i < str.length; i++) {
      const g = Font.glyph(str[i]);
      for (let r = 0; r < 7; r++) {
        const m = g[r];
        if (!m) continue;
        for (let c = 0; c < 5; c++) if (m & (1 << c)) s.fillRect(ox + (i * 6 + c) * sc, oy + r * sc, sc, sc, colorFn(r));
      }
    }
  };
  if (shadow !== undefined) { draw(x + sc, y + sc, () => shadow); draw(x + Math.ceil(sc / 2), y + sc, () => shadow); }
  draw(x, y, grad);
}

const Menus = {
  /* ------------------------------------------------ option sub-menus */
  // the settings that Save Changes stores (volumes and the player list save themselves)

    const o = {};
    for (const k of Object.keys(Data.defaults)) if (k !== 'lastPlayers' && k !== 'musicVolume' && k !== 'sfxVolume') o[k] = Cfg[k];
    return JSON.stringify(o);
  },

    const m = Data.menus[key];

    for (const it of m.items) {
      let vw = 0;

      d.button('&' + ((i + 1) % 10) + ' ' + p.name.replace(/&/g, '&&'), 10, 17 + i * 15, w - 20, 13, () => { p.team = (p.team + 1) % Game.maxTeams(); }, {
        align: 'left', value: () => 'Team ' + (p.team + 1)
      });
    });
    d.button('&Done', w / 2 - 30, h - 20, 60, 14, () => d.close());
    UI.push(d);
  },

  /* ------------------------------------------------ saved games */
  saveGame() {
    const obj = { name: 'scorch' };
    const w = 200, h = 70;
    const d = new Dialog({ w, h, title: 'Save Game', pauses: true });
    d.text('&File:', 10, 21);
    const tf = d.textField(obj, 'name', 44, 18, 146, 20, () => doSave());
    tf.hot = 'f';
    d.focus = tf;
    const doSave = () => {
      const nm = obj.name.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '') || 'scorch';
      const key = 'scorch.save.' + nm;
      const write = () => {
        const ok = Store.set(key, Game.serialize());
        UI.remove(d);
        messageBox([ok ? 'Game saved as "' + nm + '".' : 'Could not save (storage unavailable).'], null, { pauses: true });
      };
      if (Store.get(key, null)) confirmBox(['"' + nm + '" exists. Overwrite it?'], write, null, { pauses: true });
      else write();
    };
    d.button('&Save', w / 2 - 30, h - 22, 60, 14, doSave);

  },
  restoreGame() {
    const keys = Store.keys('scorch.save.').sort();

    const w = 200, h = Math.min(keys.length, 9) * 15 + 40;

    });
    d.button('&Cancel', w / 2 - 30, h - 20, 60, 14, () => d.close());
    UI.push(d);
  }
};

/* ================================================================ main menu */
class MainMenuScene {
  constructor() {
    this.pressed = null; this.art = null;
    this.buttons = [
      { label: '&Start', fn: () => Game.start() },
      { label: '&Network...', fn: () => App.set(new NetScene()) },
      { label: '&Players:', value: () => Cfg.players, step: dir => { Cfg.players = ((Cfg.players - 2 + dir + 9) % 9) + 2; } },
      { label: '&Rounds:', value: () => Cfg.rounds, step: dir => {
        const st = Data.roundSteps; let i = st.indexOf(Cfg.rounds); if (i < 0) i = 9;
        Cfg.rounds = st[(i + dir + st.length) % st.length];
      } },
      { label: 'S&ound...', fn: () => Menus.optionsDialog('sound') },
      { label: '&Hardware...', fn: () => Menus.optionsDialog('hardware', () => applyGraphicsMode()) },
      { label: '&Economics...', fn: () => Menus.optionsDialog('economics') },
      { label: 'Ph&ysics...', fn: () => Menus.optionsDialog('physics') },
      { label: '&Landscape...', fn: () => Menus.optionsDialog('landscape') },
      { label: 'Play Op&tions...', fn: () => Menus.optionsDialog('play') },
      { label: '&Weapons...', fn: () => Menus.optionsDialog('weapons') },
      { label: '&Graphics...', fn: () => Menus.graphicsDialog() },
      { label: 'Save &Changes', disabled: () => !Menus.cfgChanged(), fn: () => {
        const ok = saveConfig();
        if (ok) Menus.cfgBase = Menus.cfgSnapshot();
        messageBox([ok ? 'Changes saved.' : 'Could not save (storage unavailable).']);
      } }
    ];
    // as in 1.5, Save Changes stays grey until something has changed
    if (!Menus.cfgBase) Menus.cfgBase = Menus.cfgSnapshot();
    for (const b of this.buttons) b.hot = Font.hotkeyOf(b.label);
  }
  enter() { UI.clear(); Sound.flightStop(); this.art = null; }
  layout() {
    const H = Screen.UH, n = this.buttons.length;
    if (Gfx.modern) {
      const bh = H >= 230 ? 13 : 12, gap = H >= 230 ? 3 : 2, bw = Math.min(112, Math.floor(Screen.UW * 0.34));
      const total = n * bh + (n - 1) * gap, y0 = Math.floor((H - total) / 2) + 2;
      this.buttons.forEach((b, i) => { b.x = 14; b.y = y0 + i * (bh + gap); b.w = bw; b.h = bh; });
      this.panel = { x: 8, y: y0 - 8, w: bw + 12, h: total + 14 };
      return;
    }
    let bh = H >= 230 ? 15 : 13, gap = H >= 230 ? 4 : 3;
    while (n * bh + (n - 1) * gap > H - 8 && bh > 10) { bh--; if (gap > 2) gap--; }
    const total = n * bh + (n - 1) * gap;
    const y0 = Math.floor((H - total) / 2);
    const bw = 96;
    this.buttons.forEach((b, i) => { b.x = 8; b.y = y0 + i * (bh + gap); b.w = bw; b.h = bh; });
    this.panel = { x: bw + 18, y: 6, w: Screen.UW - bw - 24, h: H - 12 };
  }
  activate(b, dir) {
    if (b.disabled && b.disabled()) { Sound.error(); return; }
    Sound.click();
    if (b.step) b.step(dir); else b.fn();
  }
  update() {}
  key(ev) {
    if (ev.k === 'enter') { this.activate(this.buttons[0], 1); return; }
    for (const b of this.buttons) if (b.hot === ev.k) { this.activate(b, ev.shift || ev.alt ? -1 : 1); return; }
  }
  mouse(ev) {
    this.layout();
    if (ev.kind === 'up') {
      const b = this.pressed; this.pressed = null;
      if (b && !b.step && ev.ux >= b.x && ev.ux < b.x + b.w && ev.uy >= b.y && ev.uy < b.y + b.h) this.activate(b, 1);
      return;
    }
    if (ev.kind !== 'down') return;
    for (const b of this.buttons) {
      if (ev.ux >= b.x && ev.ux < b.x + b.w && ev.uy >= b.y && ev.uy < b.y + b.h) {
        this.pressed = b;
        if (b.step) this.activate(b, ev.button === 2 ? -1 : 1);
        return;
      }
    }
  }
  buildArt(w, h) {
    const a = new Surface(w, h);
    const seed = 1234;
    // sunset sky with VGA banding
    const stops = [vga(2, 0, 10), vga(14, 0, 26), vga(36, 4, 36), vga(58, 12, 22), vga(63, 34, 6), vga(63, 54, 18)];
    const horizon = Math.floor(h * 0.78);
    for (let y = 0; y < h; y++) {
      let t = Math.floor(clamp(y / horizon, 0, 1) * 22) / 21;
      const f = t * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(f));
      a.hline(0, w - 1, y, vgaq(mixc(stops[i], stops[i + 1], f - i)));
    }
    for (let i = 0; i < w * h / 120; i++) {
      const x = Math.floor(hash2(i, 1, seed) * w), y = Math.floor(hash2(i, 2, seed) * h * 0.45);
      const b = 30 + hash2(i, 3, seed) * 33;
      a.pset(x, y, vga(b, b, b));
    }
    // striped retro sun
    const sx = w * 0.72, sy = h * 0.56, sr = h * 0.15;
    for (let y = -sr; y <= sr; y++) {
      if ((Math.floor((y + sr) / 3) & 1) && y > -sr * 0.3) continue;
      const hw = Math.sqrt(Math.max(0, sr * sr - y * y));
      a.hline(sx - hw, sx + hw, sy + y, vga(63, 56 - (y + sr) / sr * 14, 16));
    }
    // two mountain layers
    const ridge = (base, amp, sc, sd, col) => {
      const tops = [];
      for (let x = 0; x < w; x++) {
        const v = fbm2(x / sc, 0.5, sd, 4);
        const top = Math.floor(base - v * amp);
        tops.push(top);
        for (let y = top; y < h; y++) a.pset(x, y, col(y - top, y));
      }
      return tops;
    };
    ridge(horizon + 6, h * 0.55, w * 0.35, seed + 1, (d) => vga(26 - Math.min(20, d * 0.3), 8, 28 - Math.min(20, d * 0.3)));
    const front = ridge(h * 1.02, h * 0.5, w * 0.22, seed + 7, (d) => vga(Math.max(4, 34 - d * 0.5), Math.max(2, 18 - d * 0.35), 4));
    // tanks + a shot in flight + an explosion
    const surf = x => front[clamp(Math.floor(x), 0, w - 1)];
    const tank = (x, col, flip) => {
      const y = surf(x);
      const spr = tankSprite(0, col);
      a.blit(spr, x - 7, y - 7, { flip });
      const ang = flip ? 125 : 55;
      a.line(x, y - 6, x + Math.cos(ang * DEG) * 7, y - 6 - Math.sin(ang * DEG) * 7, mixc(col, vga(63, 63, 63), 0.3));
      return y;
    };
    const x1 = Math.floor(w * 0.16), x2 = Math.floor(w * 0.86);
    const y1 = tank(x1, Data.playerColors[0], false);
    const y2 = tank(x2, Data.playerColors[1], true);
    for (let i = 4; i < 44; i += 2) {
      const t = i / 60;
      const x = x1 + (x2 - x1) * t * 1.05, y = y1 - 10 - Math.sin(t * Math.PI * 1.02) * h * 0.55;
      a.pset(x, y, vga(63, 63, 63));
    }
    const ex = x1 + (x2 - x1) * 0.62, ey = surf(Math.floor(ex));
    for (let r = 11; r >= 1; r--) a.fillEllipse(ex, ey, r, r, FIRE[clamp(Math.floor(8 - r * 0.7), 0, 7)]);
    return a;
  }
  drawModern(dt) {
    this.layout();
    Gfx.backdrop('title', dt);
    const s = Screen.ui, ctx = Gfx.ctx, P = this.panel;
    s.panel(P.x, P.y, P.w, P.h, { top: 'rgba(14,18,30,0.72)', bottom: 'rgba(8,10,18,0.78)' });
    for (const b of this.buttons) {
      const v = b.value ? b.value() : undefined;
      drawButton(s, b.x, b.y, b.w, b.h, b.label, { pressed: this.pressed === b, value: v, align: 'left', disabled: !!(b.disabled && b.disabled()) });
    }
    // the logo sits down in the mountain, just below the lowest ground under it, so it reads against
    // the dark rock and leaves the peaks and sky clear (never lower than the credits allow)
    const cx = Gfx.UXp((P.x + P.w + Screen.UW) / 2);
    const size = Math.min(Gfx.pf.w * 0.085, Gfx.pf.h * 0.12);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = '400 ' + size.toFixed(1) + 'px ' + FONT_DISPLAY;

/* ---------------- end-of-game awards (Remastered) ---------------- */
function gameAwards() {
  const ps = Game.players.filter(p => p.stats);
  const best = (f, ok) => {
    let top = null, v = -Infinity;
    for (const p of ps) { const x = f(p.stats, p); if ((!ok || ok(p.stats)) && x > v) { v = x; top = p; } }
    return top && v > 0 ? { p: top, v } : null;
  };
  const out = [];
  const add = (title, r, fmt) => { if (r) out.push({ title, player: r.p, value: fmt(r.v, r.p.stats) }); };
  add('Demolition Expert', best(s => s.dmg), v => Math.round(v) + ' damage dealt');
  add('Grim Reaper', best(s => s.kills), v => v + (v === 1 ? ' kill' : ' kills'));
  add('Sharpshooter', best(s => s.hits / s.shots, s => s.shots >= 4), (v, s) => Math.round(v * 100) + '% of ' + s.shots + ' shots hit');
  add('Heavy Hitter', best(s => s.bestHit), v => Math.round(v) + ' damage in one blast');
  add('Long Shot', best(s => s.longest), v => 'a kill from ' + Math.round(v) + ' paces');
  add('Survivor', best(s => s.survived), v => 'alive at the end of ' + v + (v === 1 ? ' round' : ' rounds'));
  add('Big Spender', best(s => s.spent), v => money(v) + ' spent');
  add('Friendly Fire', best(s => s.selfDmg), v => Math.round(v) + ' damage to self');
  return out.slice(0, 6);
}

/* ================================================================ round standings */
class StandingsScene {
  constructor(o) { this.o = o; this.t = 0; }
  enter() { UI.clear(); if (this.o.final) Sound.gameOver(); else Sound.roundOver(); }
  update(dt) { this.t += dt; }
  // in a network game the host decides when the next round starts
  canContinue() { return !this.o.online || this.o.final || Net.isHost(); }
  key(ev) { if (this.t > 0.4 && this.canContinue()) this.o.onContinue(); }
  mouse(ev) { if (ev.kind === 'down' && this.t > 0.4 && this.canContinue()) this.o.onContinue(); }
  drawModern(dt) {
    const ctx = Gfx.ctx, o = this.o;
    if (!o.final && Battle.tanks && Battle.tanks.length && World.W === Screen.W) Fx.drawWorld(ctx, dt, { world: World, battle: Battle, dim: 0.55 });
    else Gfx.backdrop('menu', dt);
    const ps = Game.players.slice().sort((a, b) => Game.rankValue(b) - Game.rankValue(a));
    const greedy = Cfg.scoringMode === 'GREEDY';
    const fs = worldFont(1.05), rowH = fs * 1.9;

/* ---------- js/net.js ---------- */
'use strict';
/* =====================================================================
   Network play: host-authoritative deterministic lockstep.

   The host runs the game (turn order, computer players, weather, shop
   phases) and broadcasts a numbered stream of commands. Every machine
   applies the same commands to the same seeded, fixed-tick simulation, so
   every screen shows the same battle. Checksums at turn boundaries catch
   drift; a machine that drifts is sent a snapshot.

   Transports all look like "a room": broadcast messages plus a small
   presence object per participant.
     WsTransport    - server/server.js relay, rooms by code
     PeerTransport  - browser to browser (WebRTC), rooms by code, no server
     LocalTransport - BroadcastChannel between tabs of one browser
   ===================================================================== */

const NET_V = 34;   // Remastered: new weapons and rules make it a different game from Classic (v1); v3 Power Limit, v4 1.5-sized tanks and terrain, v5 varied terrain + power 200, v6 random death blasts, v7 1.5 damage pay, v8 1.5 bundle sizes, v9 dirt geyser deaths, v10 death beam, v11 deeper cavern roofs, v12 blasts cool before they go, v13 double-blast deaths, v14 Triple needs the Extended Arsenal, v15 1.5 auto defense price, v16 FIT SCREEN + shells gone off the side, v17 mag deflectors push shells aside, v18 mag shields have no bubble, v19 1.5 dirt charge cone + plasma disc, v20 1.5 dirt balls, liquid dirt, diggers, v21 1.5 sandhogs, v22 measured sizes at Normal scale, v23 1.5 riot weapons + zigzag sandhogs, v24 1.5 fireball timing + rolling, v25 1.5 leapfrog + napalm, v26 fireball volleys pulse together, v27 1.5 nukes + funky bomb, v28 fireball growth capped at 3s, v29 funky bomblets once a second, v30 funky bomblets start from the surface, v31 sky gates, v32 portal gun, v33 gates work across their whole frame, v34 multiplier gates split shells
const GAME_CMDS = new Set(['start', 'shop', 'shopwait', 'round', 'roundover', 'gameover', 'setai', 'msg']);
// options that shape the shared game (sound, pointer and the like stay personal)
const SYNC_KEYS = ['rounds', 'graphicsMode', 'firingDelay', 'fallingDelay', 'interestRate', 'cashAtStart', 'computersBuy',
  'freeMarket', 'scoringMode', 'airViscosity', 'gravity', 'suspendDirt', 'tanksFall', 'bordersExtend', 'effectOfWalls',
  'sky', 'maxWind', 'changingWind', 'hostileEnvironment', 'bumpiness', 'slope', 'flattenPeaks', 'randomLand',
  'scannedMountains', 'mode', 'teams', 'statusBar', 'playOrder', 'fastComputers', 'talkingTanks', 'talkProbability',
  'attackFile', 'dieFile', 'armsLevel', 'bombIcon', 'tunneling', 'scale', 'tracePaths', 'extraDirt', 'uselessItems', 'impactDamage', 'extendedArsenal', 'powerLimit', 'skyGates', 'gateMotion'];
function syncedCfg() {
  const o = {};
  for (const k of SYNC_KEYS) o[k] = Cfg[k];
  // FIT SCREEN depends on the window: everyone plays the host's exact battlefield
  if (o.graphicsMode === 'FIT SCREEN') o.graphicsMode = Screen.W + 'x' + Screen.H + ' FIT';
  return o;
}

/* ------------------------------------------------ transports */
// tabs of this browser (BroadcastChannel); presence rides on heartbeats
class LocalTransport {
  constructor(code) { this.code = code; this.me = 'L' + rid(10); this.map = new Map(); this.pres = {}; this.maxMsg = 1e7; }
  connect() {
    try { this.ch = new BroadcastChannel('scorched-opus-' + this.code); } catch (e) { return Promise.reject(new Error('This browser cannot link tabs here.')); }
    this.ch.onmessage = e => this.recv(e.data);
    this.hb = setInterval(() => this.beat(), 800);
    this.beat();
    return new Promise(r => setTimeout(r, 300));
  }
  beat() {
    this.post({ op: 'hb', p: this.pres });
    const now = Date.now();
    let changed = false;
    for (const [id, v] of this.map) if (now - v.seen > 3500) { this.map.delete(id); changed = true; }
    if (changed) this.fire();
  }
  post(d) { d.from = this.me; try { this.ch.postMessage(d); } catch (e) { /* closed */ } }
  recv(d) {
    if (!d || d.from === this.me) return;
    const had = this.map.get(d.from);
    if (d.op === 'bye') { this.map.delete(d.from); this.fire(); return; }
    if (d.op === 'hb' || d.op === 'pres') {
      this.map.set(d.from, { peer: d.from, presence: d.p || {}, seen: Date.now() });
      if (!had || d.op === 'pres') this.fire();
      return;
    }
    if (!had) { this.map.set(d.from, { peer: d.from, presence: {}, seen: Date.now() }); this.fire(); }
    else had.seen = Date.now();
    if (d.op === 'msg' && this.onmessage) this.onmessage(d.data, d.from);
  }
  fire() { if (this.onpeers) this.onpeers(); }
  peers() { return [...this.map.values()].map(v => ({ peer: v.peer, presence: v.presence })); }
  emit(data) { this.post({ op: 'msg', data }); }
  presence(patch, full) { this.pres = full; this.post({ op: 'pres', p: full }); }
  close() { this.post({ op: 'bye' }); clearInterval(this.hb); try { this.ch.close(); } catch (e) { /* ignore */ } }
}

// the Node relay in server/server.js
class WsTransport {
  constructor(url, code) { this.url = url; this.code = code; this.map = new Map(); this.me = null; this.maxMsg = 400000; }
  connect() {
    return new Promise((resolve, reject) => {
      let ws;
      const u = this.url + (this.url.indexOf('?') >= 0 ? '&' : '?') + 'room=' + encodeURIComponent(this.code);
      try { ws = new WebSocket(u); } catch (e) { reject(new Error('That server address is not valid.')); return; }
      this.ws = ws;
      let done = false;
      const timer = setTimeout(() => { if (!done) { done = true; reject(new Error('The server did not answer.')); try { ws.close(); } catch (e) { /* ignore */ } } }, 8000);
      ws.onmessage = e => {
        let d;
        try { d = JSON.parse(e.data); } catch (err) { return; }
        switch (d.op) {
          case 'welcome':
            this.me = d.me;
            clearInterval(this.ka);
            this.ka = setInterval(() => this.send({ op: 'ping' }), 25000);
            for (const p of d.peers || []) this.map.set(p.peer, { peer: p.peer, presence: p.presence || {} });
            if (!done) { done = true; clearTimeout(timer); resolve(); }
            this.fire();
            break;
          case 'joined': this.map.set(d.peer, { peer: d.peer, presence: {} }); this.fire(); break;
          case 'left': this.map.delete(d.peer); this.fire(); break;
          case 'presence': {
            const p = this.map.get(d.peer);
            if (p) p.presence = d.data || {}; else this.map.set(d.peer, { peer: d.peer, presence: d.data || {} });
            this.fire();
            break;
          }
          case 'msg': if (this.onmessage) this.onmessage(d.data, d.from); break;
          case 'error': if (!done) { done = true; clearTimeout(timer); reject(new Error(d.msg || 'The server refused.')); } break;
        }
      };
      ws.onclose = () => {
        clearInterval(this.ka);
        if (!done) { done = true; clearTimeout(timer); reject(new Error('Could not connect to the server.')); }
        if (this.onstatus) this.onstatus(false);
      };
      ws.onerror = () => { /* onclose follows */ };
    });
  }
  fire() { if (this.onpeers) this.onpeers(); }
  peers() { return [...this.map.values()]; }
  send(o) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); }
  emit(data) { this.send({ op: 'emit', data }); }
  presence(patch, full) { this.send({ op: 'presence', data: full }); }
  close() { clearInterval(this.ka); try { this.ws.close(); } catch (e) { /* ignore */ } }
}

// peer to peer (WebRTC through PeerJS, bundled in vendor/): no game server at all. The free public
// PeerJS service only introduces the players (it also lends a relay to players on strict networks);
// game messages then go browser to browser. The first browser in a room code becomes its hub:
// everyone else connects to it, and it passes messages and presence on, so the room behaves like
// the server's.
function loadPeerJs() {
  return window.Peer ? Promise.resolve() : Promise.reject(new Error('Peer to peer is missing from this copy of the game.'));
}
class PeerTransport {
  constructor(code) {
    this.code = code; this.map = new Map(); this.me = null; this.pres = {};
    this.maxMsg = 60000; this.conns = new Map(); this.hubConn = null; this.isHub = false;
  }
  hubId() { return 'scorched-opus-room-' + String(this.code).toLowerCase(); }
  async connect() {
    await loadPeerJs();
    try {
      this.peer = await this.start(this.hubId());
      this.isHub = true;
      this.peer.on('connection', c => this.addMember(c));
    } catch (e) {
      if (!e || e.type !== 'unavailable-id') throw this.nice(e);
      // someone already holds the room: join them
      this.peer = await this.start(undefined);
      await this.join();
    }
    this.me = this.peer.id;
    // losing the introduction service doesn't break open connections; get it back for newcomers
    this.peer.on('disconnected', () => { try { if (!this.peer.destroyed) this.peer.reconnect(); } catch (e) { /* ignore */ } });
  }
  nice(e) {
    const t = e && e.type;
    if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') return new Error('Could not reach the peer to peer service (are you online?).');
    if (t === 'browser-incompatible') return new Error('This browser cannot play peer to peer.');
    return new Error((e && e.message) || 'Peer to peer failed.');
  }
  start(id) {
    return new Promise((resolve, reject) => {
      const p = id ? new window.Peer(id, { debug: 0 }) : new window.Peer({ debug: 0 });
      let done = false;
      const timer = setTimeout(() => { if (!done) { done = true; try { p.destroy(); } catch (e) { /* ignore */ } reject(new Error('The peer to peer service did not answer.')); } }, 10000);
      p.on('open', () => { if (!done) { done = true; clearTimeout(timer); resolve(p); } });
      p.on('error', e => {
        if (!done) { done = true; clearTimeout(timer); try { p.destroy(); } catch (x) { /* ignore */ } reject(e); return; }
        if (e && e.type === 'peer-unavailable') return;   // someone we tried to reach left
      });
    });
  }
  join() {
    return new Promise((resolve, reject) => {
      const c = this.peer.connect(this.hubId(), { reliable: true, serialization: 'json' });
      let done = false;
      const timer = setTimeout(() => { if (!done) { done = true; reject(new Error('Could not reach the other players. Your network may block direct connections.')); } }, 15000);
      c.on('data', d => {
        if (d && d.op === 'welcome' && !done) {
          done = true; clearTimeout(timer);
          this.hubConn = c;
          for (const p of d.peers || []) if (p.peer !== this.peer.id) this.map.set(p.peer, { peer: p.peer, presence: p.presence || {} });
          resolve(); this.fire();
          return;
        }
        this.fromHub(d);
      });
      c.on('close', () => { this.map.clear(); this.fire(); if (this.onstatus) this.onstatus(false); });
      c.on('error', () => { if (!done) { done = true; clearTimeout(timer); reject(new Error('Could not reach the other players.')); } });
    });
  }
  // ---- the hub's side
  addMember(c) {
    c.on('open', () => {
      this.conns.set(c.peer, c);
      this.map.set(c.peer, { peer: c.peer, presence: {} });
      const peers = [{ peer: this.peer.id, presence: this.pres }].concat([...this.map.values()].filter(p => p.peer !== c.peer));
      this.send(c, { op: 'welcome', peers });
      this.toMembers({ op: 'joined', peer: c.peer }, c.peer);
      this.fire();
    });
    c.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (d.op === 'emit') {
        if (this.onmessage) this.onmessage(d.data, c.peer);
        this.toMembers({ op: 'msg', from: c.peer, data: d.data }, c.peer);
      } else if (d.op === 'presence') {
        const p = this.map.get(c.peer);
        if (p) p.presence = d.data || {};
        this.toMembers({ op: 'presence', peer: c.peer, data: d.data || {} }, c.peer);
        this.fire();
      }
    });
    const gone = () => {
      if (!this.conns.has(c.peer)) return;
      this.conns.delete(c.peer); this.map.delete(c.peer);
      this.toMembers({ op: 'left', peer: c.peer });
      this.fire();
    };
    c.on('close', gone); c.on('error', gone);
  }
  toMembers(o, except) { for (const [id, c] of this.conns) if (id !== except) this.send(c, o); }
  send(c, o) { try { if (c.open) c.send(o); } catch (e) { /* closing */ } }
  // ---- everyone else's side
  fromHub(d) {
    if (!d || typeof d !== 'object') return;
    switch (d.op) {
      case 'joined': if (d.peer !== this.me) { this.map.set(d.peer, { peer: d.peer, presence: {} }); this.fire(); } break;
      case 'left': this.map.delete(d.peer); this.fire(); break;
      case 'presence': {
        if (d.peer === this.me) break;
        const p = this.map.get(d.peer);
        if (p) p.presence = d.data || {}; else this.map.set(d.peer, { peer: d.peer, presence: d.data || {} });
        this.fire();
        break;
      }
      case 'msg': if (d.from !== this.me && this.onmessage) this.onmessage(d.data, d.from); break;
    }
  }
  fire() { if (this.onpeers) this.onpeers(); }
  peers() { return [...this.map.values()]; }
  emit(data) {
    if (this.isHub) this.toMembers({ op: 'msg', from: this.me, data });
    else if (this.hubConn) this.send(this.hubConn, { op: 'emit', data });
  }
  presence(patch, full) {
    this.pres = full;
    if (this.isHub) this.toMembers({ op: 'presence', peer: this.me, data: full });
    else if (this.hubConn) this.send(this.hubConn, { op: 'presence', data: full });
  }
  close() {
    for (const c of this.conns.values()) { try { c.close(); } catch (e) { /* ignore */ } }
    try { if (this.hubConn) this.hubConn.close(); } catch (e) { /* ignore */ }
    try { if (this.peer) this.peer.destroy(); } catch (e) { /* ignore */ }
  }
}

/* ------------------------------------------------ the protocol */
const Net = {

  gid: null, hostPeer: null, lobby: null, myName: '', myIcon: 0,
  // host
  seq: 0, log: [], out: [], flushQ: false, flushLater: false, lastFlush: 0, seenReq: {}, hbT: 0, lobbyT: 0, snapTo: new Set(), goneT: {},
  // client
  expect: 1, pend: new Map(), queue: [], lastK: -1, horizon: 0, acc: 0, nackT: 0, reqId: 0,
  pendingReq: null, snapWanted: false, snapT: 0, joinT: 0, seated: false, hostSeenT: 0,
  parts: {}, partId: 0, pres: {}, aimWant: undefined, aimKey: '', aimT: 0, savedCfg: null,
