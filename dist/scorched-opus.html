    return k === 'ws' ? 'game server' : k === 'peer' ? 'peer to peer' : 'this browser';
  },
  // ways to connect from here
  available() {
    // a site with our relay behind it offers that first; a plain static copy (GitHub Pages, a file)
    // has no server, so peer to peer comes first there
    const k = this.relayHere() ? ['ws', 'peer'] : ['peer', 'ws'];
    // tabs of one browser: only offered when testing locally - on a real website it only
    // strands friends in a room nobody else can reach
    if (!this.hosted()) k.push('local');
    return k;
  },
  // is this page served by a game server (server/server.js or the Cloudflare Worker)? Static hosts
  // like GitHub Pages and files opened from disk have no relay
  relayHere() {
    return /^https?:$/.test(location.protocol) && !/\.github\.io$/i.test(location.hostname);
  },
  // served from a real website (not a file on disk or this computer's own dev server)?
  hosted() {
    return /^https?:$/.test(location.protocol) && !/^(localhost|127\.|\[::1\]|0\.0\.0\.0|.*\.localhost$)/.test(location.hostname);
  },
  defaultServer() {
    if (location.protocol === 'http:' || location.protocol === 'https:') return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    return '';
  },

  async open(kind, o) {
    this.close();
    const tr = kind === 'ws' ? new WsTransport(o.url, o.code) : kind === 'peer' ? new PeerTransport(o.code) : new LocalTransport(o.code);
    tr.onmessage = (m, from) => { try { this.onMessage(m, from); } catch (e) { console.error(e); } };
    tr.onpeers = () => {};
    tr.onstatus = up => { this.connected = up; };
    await tr.connect();
    this.tr = tr; this.kind = kind; this.code = o.code || null; this.me = tr.me; this.connected = true;
    this.myName = o.name; this.myIcon = o.icon | 0;
    this.pres = {};
    this.setPresence({ v: NET_V, name: o.name });
  },
  close() {
    if (this.tr) { try { this.tr.close(); } catch (e) { /* ignore */ } }
    this.tr = null; this.online = false; this.role = null; this.me = null; this.gid = null; this.hostPeer = null; this.lobby = null;
    this.seq = 0; this.log = []; this.out = []; this.flushQ = false; this.flushLater = false; this.seenReq = {}; this.snapTo = new Set(); this.goneT = {};
    this.expect = 1; this.pend = new Map(); this.queue = []; this.lastK = -1; this.horizon = 0; this.acc = 0;
    this.pendingReq = null; this.snapWanted = false; this.seated = false; this.parts = {}; this.aimWant = undefined; this.aimKey = '';
    this.connected = false;
  },
  setPresence(patch) {
    const send = {};
    for (const k in patch) {
      const v = patch[k];
      if (v === null || v === undefined) { delete this.pres[k]; send[k] = null; }
      else { this.pres[k] = v; send[k] = v; }
    }
    if (this.tr) this.tr.presence(send, Object.assign({}, this.pres));
  },
  peers() { return this.tr ? this.tr.peers() : []; },
  peer(id) { return this.peers().find(p => p.peer === id) || null; },
  aimOf(peer) { const p = this.peer(peer); return (p && p.presence && p.presence.aim) || null; },
  publishAim(a) { if (this.online) this.aimWant = a; },
  games() {
    return this.peers()
      .filter(p => p.presence && p.presence.v === NET_V && p.presence.game)
      .map(p => Object.assign({ peer: p.peer }, p.presence.game));
  },
  myPlayer() { return Game.players.find(p => !p.ai && p.owner === this.me) || null; },

  /* ---------- sending ---------- */
  emit(m) {
    if (!this.tr) return;
    const s = JSON.stringify(m), max = this.tr.maxMsg || 3500;
    if (s.length <= max) { this.tr.emit(m); return; }
    // too big for the transport in one go: send it in parts (quoting can double a part's size)
    const size = Math.floor((max - 300) / 2), id = (++this.partId) + '.' + Math.floor(Math.random() * 1e6), n = Math.ceil(s.length / size);
    for (let i = 0; i < n; i++) this.tr.emit({ t: 'part', id, i, n, to: m.to, s: s.slice(i * size, (i + 1) * size) });
  },

  /* ---------- receiving ---------- */
  onMessage(m, from) {
    if (!m || typeof m !== 'object' || typeof from !== 'string') return;
    if (m.to && m.to !== this.me) return;
    if (m.t === 'part') {
      const key = from + '/' + m.id;
      let p = this.parts[key];
      if (!p) {
        const n = m.n | 0;
        if (n <= 0 || n > 1000) return;
        p = this.parts[key] = { n, got: 0, s: [], t: performance.now() };
      }
      if (typeof m.s === 'string' && p.s[m.i | 0] === undefined) { p.s[m.i | 0] = m.s; p.got++; }
      if (p.got >= p.n) {
        delete this.parts[key];
        let full;
        try { full = JSON.parse(p.s.join('')); } catch (e) { return; }
        this.onMessage(full, from);
      }
      return;
    }
    if (m.gid && this.gid && m.gid !== this.gid) return;
    switch (m.t) {
      case 'join': if (this.isHost() && m.gid === this.gid) this.onJoin(from, m); break;
      case 'seat': if (this.isHost()) this.onSeat(from, m); break;
      case 'leave': if (this.isHost()) this.peerGone(from); break;
      case 'req': if (this.isHost()) this.onReq(from, m); break;
      case 'nack': if (this.isHost()) this.resend(from, m.from | 0); break;
      case 'snapreq': if (this.isHost()) this.snapTo.add(from); break;
      case 'lobby': if (this.isClient() && from === this.hostPeer) this.onLobby(m); break;
      case 'kick': if (this.isClient() && from === this.hostPeer) this.hostGone(String(m.reason || 'The host turned you away.')); break;
      case 'bye': if (this.isClient() && from === this.hostPeer) this.hostGone('The host ended the game.'); break;
      case 'cmd': if (this.isClient() && from === this.hostPeer) this.onCmd(m); break;
      case 'cmds':
        if (this.isClient() && from === this.hostPeer && Array.isArray(m.ms)) for (const x of m.ms) if (x && typeof x === 'object') this.onCmd(x);
        break;
      case 'hb': if (this.isClient() && from === this.hostPeer) { this.hostSeenT = performance.now(); if ((m.seq | 0) >= this.expect) this.nack(true); } break;
      case 'snap': if (this.isClient() && from === this.hostPeer) this.onSnap(m); break;
      case 'chat': Chat.receive(from, m); break;
    }
  },

  /* ---------- host: lobby ---------- */
  host() {
    this.role = 'host'; this.online = true; this.gid = rid(8); this.hostPeer = this.me;
    this.lobby = { open: true, seats: [{ human: true, owner: this.me, name: this.myName, icon: this.myIcon, team: 0 }] };
    this.publishLobby();
  },
  publishLobby() {
    if (!this.isHost() || !this.lobby) return;
    this.lobby.cfg = syncedCfg();
    this.emit({ t: 'lobby', gid: this.gid, lobby: this.lobby });
    this.setPresence({ game: { gid: this.gid, name: this.myName, open: this.lobby.open, n: this.lobby.seats.length } });
    this.lobbyT = performance.now();
  },
  uniqueName(n, self) {
    n = String(n || '').replace(/[^\x20-\x7e]/g, '').trim().slice(0, 16) || 'Player';
    let name = n, k = 2;
    while (this.lobby.seats.some(s => s !== self && s.name === name)) name = n.slice(0, 13) + ' ' + (k++);
    return name;
  },
  onJoin(from, m) {
    if (!this.lobby.open) {
      if (!Game.players.some(p => p.owner === from)) this.emit({ t: 'kick', gid: this.gid, to: from, reason: 'That game has already started.' });
      return;
    }
    const seats = this.lobby.seats;
    let s = seats.find(x => x.owner === from);
    if (!s) {
      if (seats.length >= 10) { this.emit({ t: 'kick', gid: this.gid, to: from, reason: 'That game is full.' }); return; }
      s = { human: true, owner: from, name: '', icon: clamp(m.icon | 0, 0, TankIcons.length - 1), team: seats.length % 2 };
      seats.push(s);
      Sound.seq([[660, 0.05], [990, 0.06]], 0.3);
    }
    s.name = this.uniqueName(m.name, s);
    this.publishLobby();
  },
  onSeat(from, m) {
    if (!this.lobby || !this.lobby.open) return;
    const s = this.lobby.seats.find(x => x.owner === from);
    if (!s) return;
    if (m.icon !== undefined) s.icon = clamp(m.icon | 0, 0, TankIcons.length - 1);
    this.publishLobby();
  },
  addComputer() {
    if (this.lobby.seats.length >= 10) { Sound.error(); return; }
    const taken = new Set(this.lobby.seats.map(s => s.name));
    const names = Data.computerNames.filter(n => !taken.has(n));
    this.lobby.seats.push({ human: false, owner: null, ai: 'Tosser', name: pick(names.length ? names : Data.computerNames), icon: 0, team: this.lobby.seats.length % 2 });
    this.publishLobby();
  },
  removeSeat(i) {
    const s = this.lobby.seats[i];
    if (!s || s.owner === this.me) { Sound.error(); return; }
    if (s.human) this.emit({ t: 'kick', gid: this.gid, to: s.owner, reason: 'The host removed you from the game.' });
    this.lobby.seats.splice(i, 1);
    this.publishLobby();
  },
  startGame() {
    const seats = this.lobby.seats;
    if (seats.length < 2) { Sound.error(); return false; }
    this.lobby.open = false;
    this.publishLobby();
    const players = seats.map((s, i) => {
      const p = Game.newPlayer(i);
      Object.assign(p, { name: s.name, ai: s.human ? null : s.ai, icon: s.icon | 0, team: s.team | 0, owner: s.human ? s.owner : null, cash: Cfg.cashAtStart, inv: {}, fuel: 0 });
      return Game.netPlayer(p);
    });
    this.hostCommand({ c: 'start', players, cfg: syncedCfg(), seed: irand(1, 1e6) });
    return true;
  },

  /* ---------- host: the command stream ---------- */
  // Commands issued during one task (a frame, or one incoming request) leave together, so a
  // follower always gets a same-moment batch (a synchronous volley) whole.
  hostCommand(c) {
    c.k = Battle.tick;
    const m = { t: 'cmd', gid: this.gid, seq: ++this.seq, c };
    this.log.push(m);
    this.out.push(m);
    if (!this.flushQ) { this.flushQ = true; queueMicrotask(() => this.flush()); }
    this.dispatch(c);
  },
  flush(now) {
    this.flushQ = false;
    const gap = (this.tr && this.tr.minGap) || 0;
    if (!now && gap && performance.now() - this.lastFlush < gap) { this.flushLater = true; return; }   // Net.update sends it
    this.flushLater = false;
    const ms = this.out;
    if (!ms.length) return;
    this.out = [];
    this.lastFlush = performance.now();
    if (ms.length === 1) this.emit(ms[0]);
    else this.emit({ t: 'cmds', gid: this.gid, ms });
  },
  dispatch(c) {
    if (GAME_CMDS.has(c.c)) Game.exec(c);
    else if (c.c !== 'tk') Battle.exec(c);
  },
  resend(to, from) {
    if (from < 1 || from > this.seq) return;
    this.flush(true);
    // everything from there on, in one message (split into parts if it is big)
    let end = Math.min(this.seq, from + 399);
    while (end < this.seq && this.log[end].c.k === this.log[end - 1].c.k) end++;   // never split a same-moment batch
    this.emit({ t: 'cmds', gid: this.gid, to, ms: this.log.slice(from - 1, end) });
  },
  onReq(from, m) {
    const c = m.c;
    if (!c || typeof c !== 'object' || typeof c.c !== 'string') return;
    const seen = this.seenReq[from] || (this.seenReq[from] = []);
    const id = m.id | 0;
    if (seen.includes(id)) return;
    seen.push(id);
    if (seen.length > 200) seen.shift();
    if (c.c === 'shopdone') { Game.onShopDone(from, c); return; }
    if (App.scene === BattleScene) Battle.onRequest(from, c);
  },
  // send snapshots to machines that drifted, at a quiet moment
  serveSnaps() {
    if (!this.snapTo.size) return;
    const inB = this.inBattle();
    if (inB && !Battle.settled()) return;
    const snap = { t: 'snap', gid: this.gid, seq: this.seq, game: Game.netState(), battle: inB ? Battle.snapshot() : null };
    for (const to of this.snapTo) this.emit(Object.assign({}, snap, { to }));
    this.snapTo.clear();
  },
  checkPeers(now) {
    const here = new Set(this.peers().map(p => p.peer));
    const owners = this.lobby && this.lobby.open
      ? this.lobby.seats.filter(s => s.human && s.owner !== this.me).map(s => s.owner)
      : Game.players.filter(p => !p.ai && p.owner && p.owner !== this.me).map(p => p.owner);
    for (const o of new Set(owners)) {
      if (here.has(o)) { delete this.goneT[o]; continue; }
      if (!this.goneT[o]) this.goneT[o] = now;
      else if (now - this.goneT[o] > 4000) { delete this.goneT[o]; this.peerGone(o); }
    }
  },
  peerGone(peer) {
    if (!this.isHost()) return;
    if (this.lobby && this.lobby.open) {
      const before = this.lobby.seats.length;
      this.lobby.seats = this.lobby.seats.filter(s => s.owner !== peer);
      if (this.lobby.seats.length !== before) this.publishLobby();
      return;
    }
    for (const p of Game.players) if (!p.ai && p.owner === peer) { p.owner = null; Game.onPlayerLeft(p); }
  },

  /* ---------- client ---------- */
  join(game) {
    this.role = 'client'; this.online = true; this.gid = game.gid; this.hostPeer = game.peer;
    this.seated = false; this.lobby = null; this.hostSeenT = performance.now();
    this.expect = 1; this.pend = new Map(); this.queue = [];
    this.sendJoin();
  },
  sendJoin() {
    this.emit({ t: 'join', gid: this.gid, to: this.hostPeer, name: this.myName, icon: this.myIcon });
    this.joinT = performance.now();
  },
  setIcon(i) {
    this.myIcon = i;
    if (this.isClient()) this.emit({ t: 'seat', gid: this.gid, to: this.hostPeer, icon: i });
    else if (this.isHost() && this.lobby) { const s = this.lobby.seats.find(x => x.owner === this.me); if (s) s.icon = i; this.publishLobby(); }
  },
  onLobby(m) {
    if (!m.lobby || !Array.isArray(m.lobby.seats)) return;
    this.lobby = m.lobby; this.hostSeenT = performance.now();
    this.seated = this.lobby.seats.some(s => s.owner === this.me);
  },
  request(c, important) {
    const m = { t: 'req', gid: this.gid, to: this.hostPeer, id: ++this.reqId, c };
    this.emit(m);
    if (important) this.pendingReq = { m, t: performance.now() };
  },
  onCmd(m) {
    this.hostSeenT = performance.now();
    const seq = m.seq | 0;
    if (!m.c || seq < this.expect || this.pend.has(seq)) return;
    this.pend.set(seq, m);
    while (this.pend.has(this.expect)) {
      const x = this.pend.get(this.expect);
      this.pend.delete(this.expect);
      this.expect++;
      // any command says the host got that far (after a round ends no more 'tk' markers come)
      this.horizon = Math.max(this.horizon, x.c.k | 0);
      if (x.c.c !== 'tk' || x.c.sum !== undefined) this.queue.push(x);
    }
    if (this.pend.size) this.nack();
  },
  nack(force) {
    const now = performance.now();
    if (!force && now - this.nackT < 600) return;
    if (now - this.nackT < 250) return;
    this.nackT = now;
    this.emit({ t: 'nack', gid: this.gid, to: this.hostPeer, from: this.expect });
  },
  inBattle() { return App.scene === BattleScene && Battle.tanks.length > 0; },
  canApply(m, lock) {
    if (!this.inBattle()) return true;
    const c = m.c;
    if (lock) return c.k <= Battle.tick;
    if (c.k === this.lastK) return true;    // same-moment batch (a synchronous volley)
    return Battle.settled();
  },
  applyNext(lock) {
    const m = this.queue.shift(), c = m.c;
    if (c.c === 'round') Battle.tick = c.k;
    else if (this.inBattle() && !lock && c.k > Battle.tick && Battle.settled()) Battle.tick = c.k;   // idle ticks change nothing
    if ((c.c === 'turn' || c.c === 'syncaim' || c.c === 'tk') && c.sum !== undefined && this.inBattle() && Battle.checksum() !== c.sum) this.requestSnap();
    this.lastK = c.k;
    this.clearPending(c);
    this.dispatch(c);
  },
  clearPending(c) {
    const p = this.pendingReq;
    if (!p) return;
    const pc = p.m.c;
    if (['turn', 'syncaim', 'round', 'roundover', 'shop', 'gameover'].includes(c.c) ||
      (c.tank !== undefined && c.tank === pc.tank && (c.c === pc.c || c.c === 'ready' || c.c === 'fire'))) this.pendingReq = null;
  },
  // run the shared simulation on a client: follow the host's commands (called from Battle.update)
  clientPump(dt) {
    const lock = Battle.mode === 'SIMULTANEOUS';
    this.acc += dt * Battle.speed();
    let budget = Math.floor(this.acc / TICK);
    this.acc -= budget * TICK;
    if (budget > 8) budget = 8;
    if (lock) {
      // keep about a tenth of a second behind the host: enough to ride out jitter
      const lag = this.horizon - Battle.tick;
      if (lag > 12) budget = Math.max(budget, lag - 6);
    }
    let guard = 0;
    while (guard++ < 8000) {
      while (this.queue.length && this.canApply(this.queue[0], lock)) {
        this.applyNext(lock);
        if (!this.inBattle()) { Sound.muted = false; return; }
      }
      if (lock) { if (Battle.tick >= this.horizon) break; }
      else if (Battle.settled() || this.pend.size) break;   // a gap: what is missing may belong to this moment
      const behind = !lock && this.queue.length > 0;
      if (budget <= 0 && !behind) break;
      if (budget > 0) budget--; else Sound.muted = true;
      Battle.simTick();
    }
    Sound.muted = false;
  },
  requestSnap() {
    if (this.snapWanted) return;
    this.snapWanted = true; this.snapT = performance.now();
    this.emit({ t: 'snapreq', gid: this.gid, to: this.hostPeer });
  },
  onSnap(m) {
    this.snapWanted = false;
    const seq = m.seq | 0;
    this.queue = this.queue.filter(x => x.seq > seq);
    for (const s of [...this.pend.keys()]) if (s <= seq) this.pend.delete(s);
    if (this.expect <= seq) this.expect = seq + 1;
    if (m.game) Game.applyNetState(m.game);
    if (m.battle) {
      Battle.loadSnapshot(m.battle);
      if (App.scene !== BattleScene) App.set(BattleScene);
      this.lastK = m.battle.k;
      this.horizon = Math.max(this.horizon, m.battle.k);
    }
  },
  hostGone(msg) {
    const quiet = Game.finished;
    this.leave(false);
    if (!quiet) messageBox([msg]);
  },

  /* ---------- both ---------- */
  leave(notify) {
    if (this.isHost()) this.flush(true);
    if (notify !== false && this.tr) {
      if (this.isHost()) this.emit({ t: 'bye', gid: this.gid });
      else if (this.isClient()) this.emit({ t: 'leave', gid: this.gid, to: this.hostPeer });
    }
    this.close();
    this.restoreCfg();
    Market.override = null;
    Game.active = false; Game.online = false;
    UI.clear();
    Sound.flightStop();
    App.set(new MainMenuScene());
  },
  saveCfg() { if (!this.savedCfg) this.savedCfg = JSON.parse(JSON.stringify(Cfg)); },
  restoreCfg() {
    if (!this.savedCfg) return;
    for (const k of SYNC_KEYS) Cfg[k] = this.savedCfg[k];
    this.savedCfg = null;
    applyGraphicsMode();
  },
  // every frame
  update(dt) {
    if (!this.tr) return;
    const now = performance.now();
    if (this.aimWant !== undefined && now - this.aimT > 60) {
      const a = this.aimWant, key = a ? [a.i, a.a, a.p, a.w].join(':') : '';
      if (key !== this.aimKey) { this.aimKey = key; this.aimT = now; this.setPresence({ aim: a }); }
    }
    for (const k in this.parts) if (now - this.parts[k].t > 20000) delete this.parts[k];
    if (this.isHost()) {
      if (this.lobby && this.lobby.open && now - this.lobbyT > 2500) this.publishLobby();
      if (this.flushLater && now - this.lastFlush >= ((this.tr && this.tr.minGap) || 0)) this.flush();
      // (commands still waiting to go out don't count yet, or followers would ask for them)
      if (this.lobby && !this.lobby.open && now - this.hbT > 1500) { this.hbT = now; this.emit({ t: 'hb', gid: this.gid, seq: this.seq - this.out.length }); }
      this.serveSnaps();
      this.checkPeers(now);
    } else if (this.isClient()) {
      if (!this.seated && (!this.lobby || this.lobby.open) && now - this.joinT > 2000) this.sendJoin();
      if (this.pendingReq && now - this.pendingReq.t > 2000) { this.emit(this.pendingReq.m); this.pendingReq.t = now; }
      if (this.snapWanted && now - this.snapT > 3000) { this.snapT = now; this.emit({ t: 'snapreq', gid: this.gid, to: this.hostPeer }); }
      if (this.pend.size) this.nack();
      if (!this.inBattle()) {
        let n = 0;
        while (this.queue.length && !this.inBattle() && n++ < 200) this.applyNext(false);
      }
      const hostHere = this.peer(this.hostPeer);
      if (hostHere) this.hostSeenT = Math.max(this.hostSeenT, now - 1);
      if (now - this.hostSeenT > 6000 && !hostHere) this.hostGone('Lost contact with the host.');
    }
  },
  // connection status in the corner of every screen during a network game
  drawOverlay(u) {
    if (!this.online) return;
    if (!this.connected) Font.draw(u, 'Connection lost...', 3, Screen.UH - 11, UIC.red, { shadow: UIC.black });
    else if (this.snapWanted) Font.draw(u, 'Resynchronizing...', 3, Screen.UH - 11, UIC.yellow, { shadow: UIC.black });
  }
};

/* ---------- js/lobby.js ---------- */
'use strict';
/* =====================================================================
   Network screens: connect (host or join), game browser, lobby, and a
   waiting screen used between phases of a network game.
   ===================================================================== */

function netBackground() {
  const s = Screen.ui, W = Screen.UW, H = Screen.UH;
  if (s.vector) return;   // Remastered: the title landscape is already behind the dialog
  Screen.main.clear(0);
  for (let y = 0; y < H; y++) {
    const band = Math.floor(y / 6) & 1;
    s.hline(0, W - 1, y, vga(4 + band, 6 + band, 14 + band * 2));
  }
  for (let y = 5; y < H; y += 12) for (let x = (y * 7) % 16; x < W; x += 16) s.pset(x, y, vga(18, 20, 34));
}
function cleanName(n) { return String(n || '').replace(/[^\x20-\x7e]/g, '').trim().slice(0, 16); }
function cleanCode(c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8); }

/* ------------------------------------------------ connect: host or join */
class NetScene {
  constructor() {
    const kinds = Net.available();
    const saved = Store.get('scorch.net', {}) || {};
    const last = (Cfg.lastPlayers && Cfg.lastPlayers[0]) || {};
    this.form = {
      name: cleanName(saved.name || (last.ai ? '' : last.name) || 'Player'),
      kind: kinds.includes(saved.kind) ? saved.kind : kinds[0],
      url: Net.hosted() && Net.relayHere() ? Net.defaultServer() : saved.url || Net.defaultServer(),
      code: cleanCode(saved.code) || rid(4),
      icon: saved.icon | 0
    };
    this.kinds = kinds;
    this.status = ''; this.busy = false;
  }
  enter() {
    UI.clear();
    if (Net.online) Net.close();
    const f = this.form, W = Math.min(Screen.UW - 8, 300), H = Math.min(Screen.UH - 8, 186);
    const d = new Dialog({ w: W, h: H, title: 'Network Game', closeOnOutside: false, onClose: () => App.set(new MainMenuScene()) });
    this.d = d;
    const fx = 70, fw = W - fx - 10;
    d.text('&Name:', 10, 21);
    const nameF = d.textField(f, 'name', fx, 18, fw, 16);
    nameF.hot = 'n';
    d.option({ key: 'kind', label: 'Play &via', type: 'cycle', values: this.kinds, fmt: k => Net.kindLabel(k) }, f, 10, 34, W - 20);
    const srvL = d.text('&Server:', 10, 55);
    const srvF = d.textField(f, 'url', fx, 52, fw, 80);
    srvF.hot = 's';
    // on the real website the server is the site itself: nothing to type (and no address to mistake for a link)
    srvL.hidden = srvF.hidden = () => f.kind !== 'ws' || (Net.hosted() && Net.relayHere());
    const roomL = d.text('&Room code:', 10, 71);
    const roomF = d.textField(f, 'code', fx, 68, 60, 8, () => { f.code = cleanCode(f.code); });
    roomF.hot = 'r';
    d.button('Ne&w', fx + 64, 68, 36, 12, () => { f.code = rid(4); });
    d.add({ x: 10, y: 86, w: 0, h: 0, kind: 'label', draw: s => {
      const help = {
        ws: Net.hosted() && Net.relayHere()
          ? 'Host: press Host Game and tell your friends the room code. Friends: open this same site, type that room code, then press Join Game.'
          : 'Everyone connects to the same game server and room code. Run server/server.js (npm start) somewhere your friends can reach.',
        peer: 'No server needed: browsers connect directly. Host: press Host Game and tell your friends the room code. Friends: pick peer to peer, type that code, then Join Game.',
        local: 'Links tabs of this browser on this computer - handy for trying it out. Use the same room code in each tab.'
      }[f.kind];
      Font.wrap(help, Math.floor((W - 20) / Font.CW)).forEach((l, i) => Font.draw(s, l, d.x + 10, d.y + 86 + i * 10, UIC.dis));
    } });
    d.add({ x: 10, y: H - 34, w: 0, h: 0, kind: 'label', draw: s => {
      if (this.status) Font.center(s, this.status.replace(/&/g, '&&'), d.x + W / 2, d.y + H - 34, this.busy ? UIC.blue : UIC.hot);
    } });
    const bw = Math.floor((W - 32) / 3);
    d.button('&Host Game', 10, H - 21, bw, 14, () => this.go(true));
    d.button('&Join Game', 16 + bw, H - 21, bw, 14, () => this.go(false));
    d.button('&Back', 22 + bw * 2, H - 21, bw, 14, () => d.close());
    if (!f.name) d.focus = nameF;
    UI.push(d);
  }
  async go(hosting) {
    if (this.busy) return;
    const f = this.form;
    f.name = cleanName(f.name);
    f.code = cleanCode(f.code);
    if (!f.name) { this.status = 'Type your name first.'; Sound.error(); return; }
    if (f.code.length < 3) { this.status = 'The room code needs at least 3 letters.'; Sound.error(); return; }
    if (f.kind === 'ws' && !/^wss?:\/\/.+/i.test(f.url)) { this.status = 'The server address starts with ws:// or wss://'; Sound.error(); return; }
    Store.set('scorch.net', f);
    this.busy = true; this.status = 'Connecting...';
    try {
      await Net.open(f.kind, { url: f.url.trim(), code: f.code, name: f.name, icon: f.icon });
      UI.clear();
      if (hosting) { Net.host(); App.set(new LobbyScene()); }
      else App.set(new JoinScene());
    } catch (e) {
      Net.close();
      this.status = (e && e.message) || 'Could not connect.';
      Sound.error();
    }
    this.busy = false;
  }
  update() {}
  key(ev) { UI.key(ev); }
  mouse(ev) { UI.mouse(ev); }
  draw() { netBackground(); }
}

/* ------------------------------------------------ find a game to join */
class JoinScene {
  constructor() { this.btns = []; this.t = 0; this.auto = true; }
  enter() { UI.clear(); }
  update(dt) {
    this.t += dt;
    const open = Net.games().filter(g => g.open);
    // with a room code there is usually exactly one game: join it straight away
    if (this.auto && this.t > 0.6 && open.length === 1) { this.auto = false; this.pick(open[0]); }
  }
  pick(g) {
    Net.join(g);
    App.set(new LobbyScene());
  }
  back() { Net.close(); App.set(new NetScene()); }
  key(ev) {
    if (ev.k === 'escape' || ev.k === 'b') { this.back(); return; }
    if (/^[1-9]$/.test(ev.k)) { const g = Net.games().filter(x => x.open)[+ev.k - 1]; if (g) this.pick(g); }
  }
  mouse(ev) {
    if (ev.kind !== 'down') return;
    for (const b of this.btns) if (ev.ux >= b.x && ev.uy >= b.y && ev.ux < b.x + b.w && ev.uy < b.y + b.h) { Sound.click(); b.fn(); return; }
  }
  draw() {
    netBackground();
    const s = Screen.ui, W = Math.min(Screen.UW - 8, 280), H = Math.min(Screen.UH - 8, 170);
    const x = Math.floor((Screen.UW - W) / 2), y = Math.floor((Screen.UH - H) / 2);
    frame(s, x, y, W, H);
    Font.center(s, 'Join a Network Game', x + W / 2, y + 6, UIC.text);
    Font.center(s, 'Room ' + Net.code + ' (' + Net.kindLabel() + ')', x + W / 2, y + 18, UIC.dis);
    this.btns = [];
    const games = Net.games();
    const open = games.filter(g => g.open);
    if (!open.length) {
      const lines = games.length ? ['The games here have already started.', 'Wait for the next one, or host your own.']
        : ['Looking for games' + '...'.slice(0, 1 + Math.floor(this.t * 2) % 3), 'Ask the host for the room code.']
          .concat(Net.kind === 'ws' && this.t > 6 ? ['', 'Nothing yet in room ' + Net.code + '.', 'Check the host pressed Host Game with this', 'same room code, on this same website.'] : [])
          .concat(Net.kind === 'peer' && this.t > 6 ? ['', 'Nothing yet in room ' + Net.code + '.', 'Check the host picked peer to peer and', 'pressed Host Game with this same room code.'] : [])
          .concat(Net.kind === 'local' && this.t > 4 ? ['', '"This browser" only finds tabs on this computer.', 'To play a friend, go Back and pick game server.'] : []);
      lines.forEach((l, i) => Font.center(s, l, x + W / 2, y + 44 + i * 11, UIC.text));
    }
    open.slice(0, 8).forEach((g, i) => {
      const by = y + 34 + i * 16, bx = x + 12, bw = W - 24;
      const label = '&' + (i + 1) + ' ' + String(g.name).replace(/&/g, '&&') + "'s game (" + g.n + ' player' + (g.n === 1 ? '' : 's') + ')';
      drawButton(s, bx, by, bw, 14, label, { align: 'left' });
      this.btns.push({ x: bx, y: by, w: bw, h: 14, fn: () => this.pick(g) });
    });
    const bx = x + W / 2 - 30, by = y + H - 20;
    drawButton(s, bx, by, 60, 14, '&Back');
    this.btns.push({ x: bx, y: by, w: 60, h: 14, fn: () => this.back() });
  }
}

/* ------------------------------------------------ the lobby */
class LobbyScene {
  constructor() { this.btns = []; this.t = 0; }
  enter() { UI.clear(); }
  update(dt) {
    this.t += dt;
    if (Net.isClient() && !Net.seated && this.t > 15) {
      Net.hostGone(Net.tr && Net.tr.denied ? 'You need interact access to this page to play online.' : 'The host did not answer.');
    }
  }
  seats() { return (Net.lobby && Net.lobby.seats) || []; }
  cfg() { return Net.isHost() ? syncedCfg() : ((Net.lobby && Net.lobby.cfg) || {}); }
  key(ev) {
    if (UI.top()) { UI.key(ev); return; }
    const host = Net.isHost();
    switch (ev.k) {
      case 'escape': case 'l': this.leave(); break;
      case 'a': if (host) { Sound.click(); Net.addComputer(); } break;
      case 'o': if (host) this.options(); break;
      case 's': if (host) this.start(); break;
      case 'arrowleft': case 'arrowright': this.cycleMyIcon(ev.k === 'arrowleft' ? -1 : 1); break;
      case 't': this.cycleMyIcon(ev.shift ? -1 : 1); break;
    }
  }
  mouse(ev) {
    if (UI.top()) { UI.mouse(ev); return; }
    if (ev.kind !== 'down') return;
    for (const b of this.btns) {
      if (ev.ux >= b.x && ev.uy >= b.y && ev.ux < b.x + b.w && ev.uy < b.y + b.h) { Sound.click(); b.fn(ev.button === 2 ? -1 : 1); return; }
    }
  }
  leave() {
    confirmBox([Net.isHost() ? 'Close this game?' : 'Leave this game?'], () => Net.leave());
  }
  start() {
    if (this.seats().length < 2) { Toast.show('Add a computer or wait for a friend to join.'); return; }
    if (!Net.startGame()) Sound.error();
  }
  cycleMyIcon(dir) {
    const s = this.seats().find(x => x.owner === Net.me);
    if (!s) return;
    const ch = tankChoices(!Gfx.modern), n = ch.length, k = Math.max(0, ch.indexOf(s.icon | 0));
    Net.setIcon(ch[((k + dir) % n + n) % n]);
    Sound.click();
  }
  options() {
    const w = 200, items = [
      ['&Economics...', () => Menus.optionsDialog('economics')],
      ['&Physics...', () => Menus.optionsDialog('physics')],
      ['&Landscape...', () => Menus.optionsDialog('landscape')],
      ['Play Op&tions...', () => Menus.optionsDialog('play')],
      ['&Weapons...', () => Menus.optionsDialog('weapons')]
    ];
    const h = items.length * 16 + 64;
    const d = new Dialog({ w, h, title: 'Game Options', onClose: () => Net.publishLobby() });
    d.option({ key: 'rounds', label: '&Rounds', type: 'num', steps: Data.roundSteps }, Cfg, 10, 17, w - 20, () => Net.publishLobby());
    d.option({ key: 'graphicsMode', label: '&Graphics Mode', type: 'cycle', values: Data.graphicsModes }, Cfg, 10, 32, w - 20, () => { applyGraphicsMode(); d.center(); Net.publishLobby(); });
    items.forEach(([label, fn], i) => d.button(label, 10, 49 + i * 16, w - 20, 14, fn, { align: 'left' }));
    d.button('&Done', w / 2 - 30, h - 20, 60, 14, () => d.close());
    UI.push(d);
  }
  draw() {
    netBackground();
    const s = Screen.ui, W = Screen.UW - 8, H = Screen.UH - 8, x = 4, y = 4;
    const host = Net.isHost(), seats = this.seats(), cfg = this.cfg();
    frame(s, x, y, W, H);
    Font.center(s, 'Network Game Lobby', x + W / 2, y + 6, UIC.text);
    const where = 'Room ' + Net.code + ' - ' + Net.kindLabel();
    Font.center(s, where, x + W / 2, y + 17, UIC.blue);
    this.btns = [];
    const teams = cfg.teams && cfg.teams !== 'NONE';
    const cName = x + 22, cType = x + Math.floor(W * 0.46), cTeam = x + Math.floor(W * 0.7), cTank = x + W - 44, cX = x + W - 16;
    const hy = y + 30;
    Font.draw(s, 'Player', cName, hy, UIC.text);
    Font.draw(s, 'Plays as', cType, hy, UIC.text);
    if (teams) Font.draw(s, 'Team', cTeam, hy, UIC.text);
    Font.draw(s, 'Tank', cTank, hy, UIC.text);
    s.hline(x + 6, x + W - 7, hy + 9, UIC.lo);
    const sy = y + H - 69;   // options summary (and your tank)
    const rowH = clamp(Math.floor((sy - 3 - (hy + 12)) / Math.max(1, seats.length)), 9, 13);
    seats.forEach((st, i) => {
      const ry = hy + 12 + i * rowH;
      s.fillRect(x + 8, ry, 9, 8, Data.playerColors[i]);
      const me = st.owner === Net.me;
      Font.draw(s, (String(st.name) + (me ? ' (you)' : '')).replace(/&/g, '&&').slice(0, 22), cName, ry, me ? UIC.hot : UIC.black);
      const type = st.human ? (i === 0 ? 'Human (host)' : 'Human') : st.ai;
      Font.draw(s, type, cType, ry, st.human ? UIC.text : UIC.blue);
      if (host && !st.human) this.btns.push({ x: cType, y: ry - 1, w: cTeam - cType - 4, h: rowH, fn: dir => {
        const ts = Data.aiTypes, k = ts.indexOf(st.ai);
        st.ai = ts[((k + dir) % ts.length + ts.length) % ts.length]; Net.publishLobby();
      } });
      if (teams) {
        Font.draw(s, String((st.team | 0) + 1), cTeam + 8, ry, UIC.text);
        if (host) this.btns.push({ x: cTeam, y: ry - 1, w: 30, h: rowH, fn: dir => {
          const n = clamp(Math.ceil(seats.length / 2), 2, 5);
          st.team = (((st.team | 0) + dir) % n + n) % n; Net.publishLobby();
        } });
      }
      const spr = tankSprite(st.icon | 0, Data.playerColors[i]);
      s.blit(spr, cTank, ry + 8 - spr.h);
      if (me || (host && !st.human)) this.btns.push({ x: cTank - 2, y: ry - 1, w: 20, h: rowH, fn: dir => {
        if (me) this.cycleMyIcon(dir);
        else { const ch = tankChoices(!Gfx.modern), n = ch.length, k = Math.max(0, ch.indexOf(st.icon | 0)); st.icon = ch[((k + dir) % n + n) % n]; Net.publishLobby(); }
      } });
      if (host && !me) {
        Font.draw(s, 'x', cX, ry, UIC.hot);
        this.btns.push({ x: cX - 2, y: ry - 1, w: 10, h: rowH, fn: () => Net.removeSeat(i) });
      }
    });
    const cap = v => String(v || '').charAt(0) + String(v || '').slice(1).toLowerCase();
    Font.draw(s, (cfg.rounds || '?') + ' rounds, ' + cap(cfg.mode) + ' play, ' + (teams ? cap(cfg.teams) + ' teams' : 'no teams'), x + 8, sy, UIC.text);
    Font.draw(s, 'Arms level ' + cfg.armsLevel + ', cash at start ' + money(cfg.cashAtStart || 0) + ', walls ' + cap(cfg.effectOfWalls), x + 8, sy + 11, UIC.text);
    // your tank, spelled out: clicking the little tank in the list was easy to miss
    const mine = seats.find(q => q.owner === Net.me);
    if (mine) {
      const ic = TankIcons[mine.icon | 0], ty = sy + 23;
      const note = ic.triple ? ' - fires 3 missiles at once' : !ic.mobile ? " - fixed, can't move" : '';
      let tx = x + 8;
      Font.draw(s, 'Your tank:', tx, ty, UIC.text); tx += Font.width('Your tank:') + 6;
      drawButton(s, tx, ty - 2, 12, 11, '<'); this.btns.push({ x: tx, y: ty - 2, w: 12, h: 11, fn: () => this.cycleMyIcon(-1) }); tx += 16;
      Font.draw(s, ic.name, tx, ty, UIC.hot); tx += Font.width(ic.name) + 4;
      drawButton(s, tx, ty - 2, 12, 11, '>'); this.btns.push({ x: tx, y: ty - 2, w: 12, h: 11, fn: () => this.cycleMyIcon(1) }); tx += 16;
      Font.draw(s, (note + '   (or press T)').replace(/&/g, '&&'), tx, ty, UIC.dis);
    }
    // status + buttons
    let status;
    if (host) status = seats.length < 2 ? 'Add computers or wait for friends to join.' : 'Friends join with room code ' + Net.code + '.';
    else if (!Net.lobby) status = 'Contacting the host...';
    else if (!Net.seated) status = 'Joining...';
    else status = 'Waiting for ' + String(seats[0] ? seats[0].name : 'the host').replace(/&/g, '&&') + ' to start the game.';
    Font.center(s, status, x + W / 2, y + H - 34, UIC.dis);
    const labels = host ? [['&Add Computer', () => Net.addComputer()], ['&Options...', () => this.options()], ['&Start Game', () => this.start()], ['&Leave', () => this.leave()]]
      : [['&Leave', () => this.leave()]];
    const bw = Math.min(80, Math.floor((W - 16 - (labels.length - 1) * 4) / labels.length));
    const total = labels.length * bw + (labels.length - 1) * 4;
    labels.forEach(([label, fn], i) => {
      const bx = x + Math.floor((W - total) / 2) + i * (bw + 4), by = y + H - 20;
      drawButton(s, bx, by, bw, 14, label);
      this.btns.push({ x: bx, y: by, w: bw, h: 14, fn });
    });
  }
}

/* ------------------------------------------------ waiting between phases */
class WaitScene {
  constructor(lines, more) { this.lines = lines || []; this.more = more || null; this.btns = []; this.t = 0; }
  enter() { UI.clear(); }
  update(dt) { this.t += dt; }
  key(ev) {
    if (UI.top()) { UI.key(ev); return; }
    if (ev.k === 'escape') confirmBox(['Leave this network game?'], () => Net.leave());
  }
  mouse(ev) {
    if (UI.top()) { UI.mouse(ev); return; }
    if (ev.kind !== 'down') return;
    for (const b of this.btns) if (ev.ux >= b.x && ev.uy >= b.y && ev.ux < b.x + b.w && ev.uy < b.y + b.h) { Sound.click(); b.fn(); }
  }
  draw() {
    netBackground();
    const s = Screen.ui;
    const lines = this.lines.concat(this.more ? this.more() : []);
    const W = Math.min(Screen.UW - 8, Math.max(160, ...lines.map(l => Font.width(l) + 24)));
    const H = lines.length * 11 + 44, x = Math.floor((Screen.UW - W) / 2), y = Math.floor((Screen.UH - H) / 2);
    frame(s, x, y, W, H);
    lines.forEach((l, i) => Font.center(s, l.replace(/&/g, '&&'), x + W / 2, y + 8 + i * 11, i < this.lines.length ? UIC.text : UIC.blue));
    const dots = '.'.repeat(1 + Math.floor(this.t * 2) % 3);
    Font.center(s, dots, x + W / 2, y + H - 34, UIC.dis);
    const bx = x + W / 2 - 40, by = y + H - 20;
    drawButton(s, bx, by, 80, 14, 'Leave Game');
    this.btns = [{ x: bx, y: by, w: 80, h: 14, fn: () => confirmBox(['Leave this network game?'], () => Net.leave()) }];
  }
}

/* ---------- js/chat.js ---------- */
'use strict';
/* =====================================================================
   Chat for network games (Remastered): press Y, type, Enter. Messages go
   to everyone in the game, show in a log at the bottom left and as a
   speech balloon over the sender's tank. Chat never touches the shared
   simulation, so it travels outside the host's command stream.
   ===================================================================== */

const Chat = {
  log: [], sentT: 0, rate: {},
  clean(s) { return String(s || '').replace(/[^\x20-\x7e]/g, '').replace(/\s+/g, ' ').trim().slice(0, 80); },
  open() {
    if (!Net.online || UI.stack.some(d => d.isChat)) return;
    const obj = { text: '' }, w = Math.min(Screen.UW - 16, 260), h = 36;
    const d = new Dialog({ w, h, title: 'Say', closeOnOutside: true });
    d.isChat = true;
    d.y = Screen.UH - h - 6;
    const f = d.textField(obj, 'text', 8, 17, w - 16, 60, () => { UI.remove(d); this.send(obj.text); });
    d.focus = f;
    UI.push(d);
  },
  send(text) {
    text = this.clean(text);
    if (!text || !Net.online) return;
    const now = performance.now();
    if (now - this.sentT < 800) { Sound.error(); return; }
    this.sentT = now;
    Net.emit({ t: 'chat', gid: Net.gid, text });
    this.show(Net.me, text);
  },
  // who is this peer in the current game?
  who(peer) {
    if (Net.lobby && Net.lobby.open) {
      const i = Net.lobby.seats.findIndex(s => s.owner === peer);
      if (i >= 0) return { name: Net.lobby.seats[i].name, color: Data.playerColors[i], idx: -1 };
    }
    const p = Game.players.find(q => !q.ai && q.owner === peer);
    return p ? { name: p.name, color: p.color, idx: p.idx } : null;
  },
  receive(from, m) {
    const text = this.clean(m.text);
    if (!text) return;
    const now = performance.now();
    if (now - (this.rate[from] || 0) < 500) return;
    this.rate[from] = now;
    this.show(from, text);
    Sound.beep(1320, 0.04, 0.25);
  },
  show(peer, text) {
    const w = this.who(peer);
    if (!w) return;
    this.log.push({ name: w.name, color: w.color, text, t: 0 });
    if (this.log.length > 6) this.log.shift();
    if (App.scene === BattleScene && w.idx >= 0) {
      const t = Battle.tanks[w.idx];
      if (t && t.alive) Battle.say(t, text, 4);
    }
  },
  update(dt) { this.log = this.log.filter(l => (l.t += dt) < 12); },
  draw(s) {
    if (!Net.online) { this.log = []; return; }
    if (s.vector) return this.drawModern();
    let y = Screen.UH - 14;
    for (let i = this.log.length - 1; i >= 0; i--) {
      const l = this.log[i];
      const name = l.name.replace(/&/g, '&&') + ': ';
      Font.draw(s, name, 3, y, l.color, { shadow: UIC.black });
      Font.draw(s, l.text.replace(/&/g, '&&'), 3 + Font.width(name), y, UIC.white, { shadow: UIC.black });
      y -= 10;
    }
    if (!this.log.length && App.scene === BattleScene) Font.draw(s, 'Y: chat', 3, Screen.UH - 11, UIC.dis, { shadow: UIC.black });
  },
  drawModern() {
    const ctx = Gfx.ctx, fs = worldFont(0.85), h = fs * 1.7;
    let y = Gfx.pf.y + Gfx.pf.h - h - 6 * Gfx.dpr;
    ctx.font = '600 ' + fs.toFixed(1) + 'px ' + FONT_UI;
    for (let i = this.log.length - 1; i >= 0; i--) {
      const l = this.log[i], a = l.t < 0.2 ? l.t / 0.2 : l.t > 10 ? (12 - l.t) / 2 : 1;
      const name = l.name + ':', nw = ctx.measureText(name).width, tw = ctx.measureText(l.text).width;
      const x = Gfx.pf.x + 6 * Gfx.dpr;
      ctx.globalAlpha = clamp(a, 0, 1);
      Hud.pill(ctx, x, y, nw + tw + fs * 1.6, h, { fill: 'rgba(8,11,20,0.75)' });
      Hud.txt(ctx, name, x + fs * 0.6, y + h / 2, fs, rgba(mix3(c3(l.color), WHITE3, 0.3), 1), { weight: 700 });
      Hud.txt(ctx, l.text, x + fs * 1.0 + nw, y + h / 2, fs, '#e6eaf2');
      y -= h + 4 * Gfx.dpr;
    }
    ctx.globalAlpha = 1;

'use strict';
/* =====================================================================
   Remastered renderer: the same battlefield, drawn at the display's own
   resolution. Sky and terrain come from a WebGL shader that reads the
   simulation's land bitmap (smooth, lit edges); tanks, weapons, particles
   and the interface are drawn on top with Canvas 2D (fx.js, vui.js).
   Nothing here changes the simulation. F2 switches back to the original
   pixel renderer at any time.
   ===================================================================== */

const Gfx = {
  modern: true,      // Remastered renderer on (false: the original VGA look)
  ok: null,          // WebGL2 available (null: not probed yet)
  canvas: null, ctx: null,
  dpr: 1, cw: 1, ch: 1,                     // display canvas size in device pixels
  pf: { x: 0, y: 0, w: 1, h: 1 },           // 4:3 playfield inside it
  sx: 1, sy: 1,                             // device pixels per sim column / row
  ux: 1, uy: 1,                             // device pixels per UI unit
  t: 0,                                     // animation clock (seconds)
  shake: 0, shakeX: 0, shakeY: 0,

  init(canvas) {
    this.canvas = canvas;
    this.ctx = Screen.ctx;
    const saved = Store.get('scorch.gfx', null);
    if (saved && saved.modern === false) this.modern = false;
    if (this.modern && !this.available()) this.modern = false;
    window.addEventListener('resize', () => this.resize());
    this.apply();
  },
  available() {
    if (this.ok === null) this.ok = Terra.init();
    return this.ok;
  },

  setModern(on) {
    if (on && !this.available()) { Toast.show('Remastered graphics need WebGL 2.'); return; }
    this.modern = !!on;
    Store.set('scorch.gfx', { modern: this.modern });
    this.apply();
  },
  apply() {
    Theme.use(this.modern);
    const c = this.canvas;

      c.style.imageRendering = 'auto';
      c.style.cursor = 'default';
      this.resize();
    } else {
      c.style.imageRendering = '';
      c.width = Screen.W; c.height = Screen.H;
      Screen.ui = Screen.pixelUi || Screen.ui;
      installCursor(c);

  resize() {
    if (!this.modern || !this.canvas) return;
    const ww = window.innerWidth, wh = window.innerHeight;
    this.dpr = clamp(window.devicePixelRatio || 1, 1, 3);
    this.cw = Math.max(1, Math.round(ww * this.dpr));
    this.ch = Math.max(1, Math.round(wh * this.dpr));

    if (c.width !== this.cw || c.height !== this.ch) { c.width = this.cw; c.height = this.ch; }

  },
  layout() {
    let pw = this.cw, ph = pw / Screen.aspect;
    if (ph > this.ch) { ph = this.ch; pw = ph * Screen.aspect; }
    pw = Math.floor(pw); ph = Math.floor(ph);
    this.pf = { x: Math.floor((this.cw - pw) / 2), y: Math.floor((this.ch - ph) / 2), w: pw, h: ph };
    this.sx = pw / Screen.W; this.sy = ph / Screen.H;
    this.ux = pw / Screen.UW; this.uy = ph / Screen.UH;
  },
  // sim / UI coordinates -> device pixels
  X(x) { return this.pf.x + x * this.sx; },
  Y(y) { return this.pf.y + y * this.sy; },
  UXp(u) { return this.pf.x + u * this.ux; },
  UYp(u) { return this.pf.y + u * this.uy; },
  // client (CSS) coordinates -> sim coordinates
  toInternal(cx, cy) {
    const r = this.canvas.getBoundingClientRect();
    const dx = (cx - r.left) / r.width * this.cw, dy = (cy - r.top) / r.height * this.ch;
    return { x: (dx - this.pf.x) / this.sx, y: (dy - this.pf.y) / this.sy };
  },
  css(c) { return Theme.css(c); },

  /* ------------------------------------------------ the frame */
  frame(dt) {
    if (this.canvas.width !== this.cw || this.canvas.height !== this.ch || Math.round((window.devicePixelRatio || 1) * 100) !== Math.round(this.dpr * 100)) this.resize();
    if (this.pf.w / Screen.W !== this.sx || this.pf.h / Screen.H !== this.sy) this.layout();
    this.t += dt;
    const ctx = this.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    Screen.ui = VUI.begin();
    const sc = App.scene;
    if (sc.drawModern) sc.drawModern(dt);
    else { this.backdrop('menu', dt); sc.draw(); }
    UI.draw(Screen.ui);
    Toast.draw(Screen.ui);
    Chat.draw(Screen.ui);
    Net.drawOverlay(Screen.ui);
    EventLog.draw(Screen.ui);
    Fx.drawOverlay(ctx, dt);
    Volume.draw();
    if (Cfg.pointer === 'Joystick' && Input.x >= 0) this.drawCursor(ctx);
    VUI.end();
  },
  // gamepad pointer
  drawCursor(ctx) {
    const x = this.X(Input.x), y = this.Y(Input.y), s = 7 * this.dpr;
    ctx.lineWidth = Math.max(2, 2 * this.dpr); ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.moveTo(x - s, y); ctx.lineTo(x + s, y); ctx.moveTo(x, y - s); ctx.lineTo(x, y + s); ctx.stroke();
    ctx.lineWidth = Math.max(1, this.dpr); ctx.strokeStyle = '#ffb640';
    ctx.beginPath(); ctx.moveTo(x - s, y); ctx.lineTo(x + s, y); ctx.moveTo(x, y - s); ctx.lineTo(x, y + s); ctx.stroke();
  },
  // what sits behind a menu screen: the title landscape, dimmed
  backdrop(kind, dt) {
    const ctx = this.ctx;
    ctx.fillStyle = '#05070d';
    ctx.fillRect(0, 0, this.cw, this.ch);
    Title.draw(ctx, dt, kind);
  },
  // shake the battlefield (explosions); decays by itself
  kick(amount) {
    if (!Cfg.screenShake) return;
    this.shake = Math.min(1.2, this.shake + amount);
  },
  updateShake(dt) {
    this.shake = Math.max(0, this.shake - dt * 1.6);
    const s = this.shake * this.shake * this.pf.w * 0.012;
    this.shakeX = (Math.random() * 2 - 1) * s;
    this.shakeY = (Math.random() * 2 - 1) * s;
  }
};

/* =====================================================================
   Terra: WebGL2 sky + terrain. The land bitmap (palette indexes) is
   uploaded as a texture, blurred twice at simulation resolution (a fine
   blur for smooth anti-aliased edges, a coarse one for the relief
   normals), then shaded per display pixel.
   ===================================================================== */
const SKY_TYPES = ['PLAIN', 'STORMY', 'STARS', 'SHADED', 'SUNSET', 'CAVERN', 'BLACK'];
// four gradient stops per sky, top to horizon (sRGB 0..1)
const SKY_STOPS = {
  PLAIN: ['#1d4f9c', '#3f7fcf', '#86b9ec', '#c9e3f7'],
  STORMY: ['#07090e', '#141821', '#262c38', '#3b4250'],
  STARS: ['#010208', '#050a1a', '#0b1330', '#16204a'],
  SHADED: ['#02030a', '#0a1440', '#1d3a8a', '#4d74c4'],
  SUNSET: ['#12051f', '#4a1152', '#c02e5c', '#ff9a42'],
  CAVERN: ['#050302', '#0f0906', '#1a110b', '#26190f'],
  BLACK: ['#000000', '#000000', '#020203', '#050507']
};
function hexVec(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }

const Terra = {
  gl: null, canvas: null, progs: {}, vao: null, tex: {}, fbo: {}, W: 0, H: 0,
  src: null, landVer: -1, palVer: -1, scorchVer: -1, dirty: true, lost: false,

  init() {
    try {
      const c = document.createElement('canvas');
      c.width = 4; c.height = 4;
      const gl = c.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
      if (!gl) return false;
      this.gl = gl; this.canvas = c;
      c.addEventListener('webglcontextlost', e => { e.preventDefault(); this.lost = true; });
      c.addEventListener('webglcontextrestored', () => { this.lost = false; this.setup(); });
      return this.setup();
    } catch (e) { console.warn('WebGL unavailable', e); return false; }
  },
  setup() {
    const gl = this.gl;
    this.progs.blur = this.program(TERRA_VS, TERRA_BLUR_FS);
    this.progs.main = this.program(TERRA_VS, TERRA_MAIN_FS);
    if (!this.progs.blur || !this.progs.main) return false;
    this.vao = gl.createVertexArray();   // the vertex shader makes a full-screen triangle from gl_VertexID
    this.tex = {}; this.fbo = {}; this.W = 0; this.H = 0; this.src = null; this.landVer = this.palVer = this.scorchVer = -1;
    this.uniforms = {};
    for (const k in this.progs) {
      const p = this.progs[k], u = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) {
        const info = gl.getActiveUniform(p, i);
        const name = info.name.replace(/\[0\]$/, '');
        u[name] = gl.getUniformLocation(p, info.name);
      }
      this.uniforms[k] = u;
    }
    return true;
  },
  program(vs, fs) {
    const gl = this.gl;
    const sh = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
      return s;
    };
    const v = sh(gl.VERTEX_SHADER, vs), f = sh(gl.FRAGMENT_SHADER, fs);
    if (!v || !f) return null;
    const p = gl.createProgram();
    gl.attachShader(p, v); gl.attachShader(p, f); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); return null; }
    return p;
  },
  makeTex(w, h, fmt, filter) {
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    if (fmt === 'r8') gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, w, h, 0, gl.RED, gl.UNSIGNED_BYTE, null);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  },
  alloc(W, H) {
    const gl = this.gl;
    for (const k in this.tex) gl.deleteTexture(this.tex[k]);
    for (const k in this.fbo) gl.deleteFramebuffer(this.fbo[k]);
    this.tex = {
      land: this.makeTex(W, H, 'r8', gl.NEAREST),
      scorch: this.makeTex(W, H, 'r8', gl.LINEAR),
      tmp: this.makeTex(W, H, 'rgba', gl.NEAREST),
      cov: this.makeTex(W, H, 'rgba', gl.LINEAR),
      pal: this.makeTex(256, 1, 'rgba', gl.LINEAR)
    };
    this.fbo = {};
    for (const k of ['tmp', 'cov']) {
      const f = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, f);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.tex[k], 0);
      this.fbo[k] = f;
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.W = W; this.H = H;
    this.landVer = this.palVer = this.scorchVer = -1;
  },
  // bring the GPU copy of a world (World or the title landscape) up to date
  sync(src) {
    const gl = this.gl;
    if (src.W !== this.W || src.H !== this.H || !this.tex.land) this.alloc(src.W, src.H);
    if (src !== this.src) { this.src = src; this.landVer = this.palVer = this.scorchVer = -1; }
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    if (src.ver !== this.landVer) {
      gl.bindTexture(gl.TEXTURE_2D, this.tex.land);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, src.W, src.H, gl.RED, gl.UNSIGNED_BYTE, src.land);
      this.landVer = src.ver; this.dirty = true;
    }
    if (src.palVer !== this.palVer) {
      gl.bindTexture(gl.TEXTURE_2D, this.tex.pal);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 256, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(src.pal.buffer, src.pal.byteOffset, 1024));
      this.palVer = src.palVer;
    }
    if (src.scorchMask && src.scorchVer !== this.scorchVer) {
      gl.bindTexture(gl.TEXTURE_2D, this.tex.scorch);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, src.W, src.H, gl.RED, gl.UNSIGNED_BYTE, src.scorchMask);
      this.scorchVer = src.scorchVer;
    }
  },
  blur() {
    const gl = this.gl, p = this.progs.blur, u = this.uniforms.blur, src = this.src;
    gl.useProgram(p);
    gl.bindVertexArray(this.vao);
    gl.viewport(0, 0, this.W, this.H);
    gl.disable(gl.BLEND);
    gl.uniform1i(u.uSrc, 0);
    gl.activeTexture(gl.TEXTURE0);
    // horizontal: read the land itself
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo.tmp);
    gl.bindTexture(gl.TEXTURE_2D, this.tex.land);
    gl.uniform1i(u.uPass, 0);
    gl.uniform2f(u.uSig, 1.1, 3.2);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    // vertical: rows are denser than columns by the pixel aspect
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo.cov);
    gl.bindTexture(gl.TEXTURE_2D, this.tex.tmp);
    gl.uniform1i(u.uPass, 1);
    gl.uniform2f(u.uSig, 1.1 * src.ay, 3.2 * src.ay);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.dirty = false;
  },
  /* draw sky + terrain for world `src` into this.canvas (w x h device pixels),
     o: {pf (playfield in those pixels), sky, sun, wind, lights, flash, flashColor, fog, time} */
  render(src, w, h, o) {
    if (this.lost) return false;
    const gl = this.gl, c = this.canvas;
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    this.sync(src);
    if (this.dirty) this.blur();
    const p = this.progs.main, u = this.uniforms.main;
    gl.useProgram(p);
    gl.bindVertexArray(this.vao);
    gl.viewport(0, 0, w, h);
    const bind = (unit, tex, name) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(u[name], unit); };
    bind(0, this.tex.cov, 'uCov'); bind(1, this.tex.land, 'uLand'); bind(2, this.tex.pal, 'uPal'); bind(3, this.tex.scorch, 'uScorch');
    const pf = o.pf;
    gl.uniform2f(u.uRes, w, h);
    gl.uniform4f(u.uPF, pf.x, pf.y, pf.w, pf.h);
    gl.uniform2f(u.uWorld, src.W, src.H);
    gl.uniform1f(u.uAy, src.ay);
    gl.uniform1f(u.uTop, src.top);
    gl.uniform1f(u.uLandTop, src.landTop || src.H * 0.5);
    gl.uniform1f(u.uScanned, src.scanned ? 1 : 0);
    gl.uniform1f(u.uTime, o.time);
    gl.uniform1f(u.uWind, o.wind || 0);
    gl.uniform1f(u.uSeed, (src.seed % 997) + 0.5);
    const sky = SKY_TYPES.indexOf(o.sky);
    gl.uniform1i(u.uSky, sky < 0 ? 4 : sky);
    const st = SKY_STOPS[o.sky] || SKY_STOPS.SUNSET;
    gl.uniform3fv(u.uStops, new Float32Array([].concat(...st.map(hexVec))));
    const sun = o.sun || { x: src.W * 0.7, y: src.H * 0.6, r: src.W * 0.08 };
    gl.uniform4f(u.uSun, sun.x, sun.y, sun.r, o.sky === 'SUNSET' ? 1 : 0);
    gl.uniform1f(u.uFlash, o.flash || 0);
    const fc = o.flashColor || [1, 1, 1];
    gl.uniform3f(u.uFlashCol, fc[0], fc[1], fc[2]);
    gl.uniform1f(u.uFog, o.fog || 0);
    gl.uniform1f(u.uWalls, o.walls || 0);
    const L = o.lights || [], n = Math.min(16, L.length);
    const lp = new Float32Array(64), lc = new Float32Array(48);
    for (let i = 0; i < n; i++) {
      const l = L[i];
      lp[i * 4] = l.x; lp[i * 4 + 1] = l.y; lp[i * 4 + 2] = l.r; lp[i * 4 + 3] = l.i;
      lc[i * 3] = l.c[0]; lc[i * 3 + 1] = l.c[1]; lc[i * 3 + 2] = l.c[2];
    }
    gl.uniform1i(u.uNL, n);
    gl.uniform4fv(u.uL, lp);
    gl.uniform3fv(u.uLC, lc);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    return true;
  }
};

const TERRA_VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// separable gaussian: pass 0 reads the land (solid = index > 0) along x, pass 1 blurs that along y.
// R = fine (edges), G = coarse (relief)
const TERRA_BLUR_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc;
uniform int uPass;
uniform vec2 uSig;
out vec4 frag;
void main() {
  ivec2 p = ivec2(gl_FragCoord.xy);
  ivec2 sz = textureSize(uSrc, 0);
  ivec2 dir = uPass == 0 ? ivec2(1, 0) : ivec2(0, 1);
  float s0 = max(uSig.x, 0.3), s1 = max(uSig.y, 0.3);
  int r0 = int(ceil(s0 * 2.5)), r1 = min(int(ceil(s1 * 2.5)), 40);
  float a0 = 0.0, w0 = 0.0, a1 = 0.0, w1 = 0.0;
  for (int k = -40; k <= 40; k++) {
    if (k < -r1 || k > r1) continue;
    ivec2 q = clamp(p + dir * k, ivec2(0), sz - 1);
    vec2 v;
    if (uPass == 0) { float s = texelFetch(uSrc, q, 0).r > 0.0 ? 1.0 : 0.0; v = vec2(s); }
    else v = texelFetch(uSrc, q, 0).rg;
    // below the bottom edge is solid ground
    if (uPass == 1 && p.y + k >= sz.y) v = vec2(1.0);
    float fk = float(k);
    float g1 = exp(-fk * fk / (2.0 * s1 * s1));
    a1 += v.y * g1; w1 += g1;
    if (k >= -r0 && k <= r0) { float g0 = exp(-fk * fk / (2.0 * s0 * s0)); a0 += v.x * g0; w0 += g0; }
  }
  frag = vec4(a0 / w0, a1 / w1, 0.0, 1.0);
}`;

const TERRA_MAIN_FS = `#version 300 es
precision highp float;
uniform sampler2D uCov, uLand, uPal, uScorch;
uniform vec2 uRes, uWorld;
uniform vec4 uPF;
uniform float uAy, uTop, uLandTop, uScanned, uTime, uWind, uSeed, uFlash, uFog, uWalls;
uniform int uSky;
uniform vec3 uStops[4];
uniform vec4 uSun;
uniform vec3 uFlashCol;
uniform vec4 uL[16];
uniform vec3 uLC[16];
uniform int uNL;
out vec4 frag;

uint hu(uvec2 p) {
  p = p * 1664525u + 1013904223u;
  p.x += p.y * 1664525u; p.y += p.x * 1664525u;
  p ^= p >> 16u;
  p.x += p.y * 1664525u; p.y += p.x * 1664525u;
  p ^= p >> 16u;
  return p.x ^ p.y;
}
float hash(vec2 p) { return float(hu(uvec2(ivec2(floor(p)) + 65536))) / 4294967295.0; }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; }
  return s;
}
float fbm1(float x) { return fbm(vec2(x, uSeed * 1.7)); }
vec3 srgb2lin(vec3 c) { return pow(c, vec3(2.2)); }
vec3 lin2srgb(vec3 c) { return pow(max(c, 0.0), vec3(1.0 / 2.2)); }

vec3 gradient(float v) {
  v = clamp(v, 0.0, 1.0);
  if (v < 0.34) return mix(uStops[0], uStops[1], smoothstep(0.0, 0.34, v));
  if (v < 0.68) return mix(uStops[1], uStops[2], smoothstep(0.34, 0.68, v));
  return mix(uStops[2], uStops[3], smoothstep(0.68, 1.0, v));
}

// p: sim coordinates (columns, rows); yc = rows scaled to columns
vec3 sky(vec2 p) {
  float v = p.y / uWorld.y;
  vec3 c = gradient(v);
  float yc = p.y / uAy;
  // stars
  if (uSky == 2 || uSky == 3 || uSky == 4) {
    float amt = uSky == 2 ? 1.0 : uSky == 3 ? 0.6 * (1.0 - smoothstep(0.1, 0.55, v)) : 0.5 * (1.0 - smoothstep(0.05, 0.35, v));
    vec2 g = vec2(p.x, yc) / 2.6;
    vec2 cell = floor(g);
    float h = hash(cell + 91.0);
    if (h > 0.93) {
      vec2 sp = cell + vec2(hash(cell + 7.0), hash(cell + 13.0));
      float d = length(g - sp) * 2.6;
      float tw = 0.65 + 0.35 * sin(uTime * (1.0 + h * 4.0) + h * 60.0);
      float b = smoothstep(0.55, 0.0, d) * (h - 0.93) / 0.07 * tw;
      c += vec3(0.85, 0.9, 1.0) * b * amt * 1.6;
    }
    if (uSky == 2) {
      // a faint band of distant stars
      float band = exp(-pow((yc - p.x * 0.35 - uWorld.x * 0.1) / (uWorld.x * 0.22), 2.0));
      float neb = fbm(vec2(p.x, yc) * 0.012 + uSeed);
      c += vec3(0.20, 0.12, 0.35) * band * neb * 0.55 + vec3(0.05, 0.12, 0.25) * neb * neb * 0.35;
    }
  }
  // sun
  if (uSun.w > 0.5) {
    vec2 d2 = vec2(p.x - uSun.x, (p.y - uSun.y) / uAy);
    float d = length(d2), r = uSun.z;
    vec3 sc = vec3(1.0, 0.86, 0.45);
    c += sc * exp(-d / (r * 2.2)) * 0.55 + vec3(1.0, 0.45, 0.35) * exp(-d / (r * 7.0)) * 0.25;
    float disc = smoothstep(r + 0.8, r - 0.8, d);
    // the classic striped sunset sun, done smooth
    if (d2.y > r * 0.05) {
      float band = (d2.y) / r;
      float stripe = smoothstep(0.0, 0.08, abs(fract(band * 4.5 + 0.1) - 0.5) - 0.12 * band - 0.05);
      disc *= mix(1.0, stripe, smoothstep(0.05, 0.25, band));
    }
    vec3 top = vec3(1.0, 0.95, 0.62), bot = vec3(1.0, 0.42, 0.28);
    c = mix(c, mix(top, bot, clamp(d2.y / r * 0.5 + 0.5, 0.0, 1.0)), disc);
  }
  // clouds drift with the wind
  if (uSky == 0 || uSky == 1 || uSky == 4) {
    float drift = uTime * (uWind * 0.045 + 1.5);
    vec2 q = vec2((p.x - drift) * 0.011, yc * 0.03 + uSeed);
    float n = fbm(q) + 0.5 * fbm(q * 2.3 + 5.0) - 0.25;
    float lo = uSky == 1 ? 0.28 : 0.48, amt = uSky == 1 ? 1.0 : 0.85;
    float mask = uSky == 1 ? (1.0 - smoothstep(0.3, 0.75, v)) : (1.0 - smoothstep(0.08, 0.6, v)) * smoothstep(0.0, 0.08, v);
    float d = smoothstep(lo, lo + 0.35, n) * mask * amt;
    vec3 cc = uSky == 1 ? vec3(0.22, 0.24, 0.29) : uSky == 4 ? mix(vec3(0.95, 0.45, 0.45), vec3(0.35, 0.12, 0.35), smoothstep(0.1, 0.5, v)) : vec3(0.97, 0.98, 1.0);
    float shade = 0.75 + 0.35 * fbm(q * 1.7 + 3.0);
    c = mix(c, cc * shade + uFlash * uFlashCol * (uSky == 1 ? 0.8 : 0.2), d * 0.9);
  }
  // distant ridges (not part of the battlefield)
  if (uSky != 5 && uSky != 6) {
    float ph = uWorld.y - uTop;
    float h1 = uTop + ph * 0.60 + ph * 0.14 * (fbm1(p.x * 0.004) - 0.5) * 2.0;
    float h2 = uTop + ph * 0.70 + ph * 0.10 * (fbm1(p.x * 0.007 + 40.0) - 0.5) * 2.0;
    vec3 haze = gradient(0.9);
    vec3 r1 = mix(uStops[1] * 0.55, haze, 0.55), r2 = mix(uStops[1] * 0.4, haze, 0.35);
    if (uSky == 2 || uSky == 3) { r1 = vec3(0.03, 0.05, 0.10); r2 = vec3(0.02, 0.03, 0.07); }
    c = mix(c, r1, smoothstep(h1 - 0.8, h1 + 0.8, p.y) * 0.85);
    c = mix(c, r2, smoothstep(h2 - 0.8, h2 + 0.8, p.y) * 0.92);
  }
  if (uSky == 5) {
    // cave wall
    float n = fbm(vec2(p.x, yc) * 0.03 + uSeed);
    c *= 0.6 + 0.8 * n;
    c += vec3(0.10, 0.05, 0.02) * smoothstep(0.55, 0.9, n);
  }
  // flash (lightning, nukes)
  c += uFlashCol * uFlash * 0.55;
  return c;
}

vec3 palAt(float idx) { return texture(uPal, vec2((idx + 0.5) / 256.0, 0.5)).rgb; }

void main() {
  vec2 frag2 = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);          // top-down pixel position
  vec2 p = (frag2 - uPF.xy) * uWorld / uPF.zw;                          // sim coordinates
  vec3 col = sky(p);
  // outside the walls the ground carries on at the edge column's height and fades into haze
  // (it used to be mirrored, which showed craters near an edge a second time)
  float out_ = 0.0;
  vec2 q = p;
  if (q.x < 0.0) { out_ = -q.x; q.x = 0.5; }
  if (q.x > uWorld.x) { out_ = q.x - uWorld.x; q.x = uWorld.x - 0.5; }
  vec2 texel = 1.0 / uWorld;
  vec2 uv = (q + 0.0) * texel;
  if (q.y > uTop - 2.0 && q.x >= 0.0 && q.x <= uWorld.x && q.y <= uWorld.y + 2.0) {
    vec2 cv = texture(uCov, uv).rg;
    float fw = fwidth(cv.r);
    float a = smoothstep(0.5 - fw * 0.9 - 0.02, 0.5 + fw * 0.9 + 0.02, cv.r);
    if (q.y >= uWorld.y) a = 1.0;
    // a needle or crust one pixel thin vanishes in the blur, yet tanks stand on it: show it as it is
    if (a < 0.5 && q.y < uWorld.y) {
      ivec2 mx = ivec2(uWorld) - 1, ip0 = clamp(ivec2(q), ivec2(0), mx);
      if (texelFetch(uLand, ip0, 0).r > 0.0) {
        bool nl = texelFetch(uLand, clamp(ip0 + ivec2(-1, 0), ivec2(0), mx), 0).r > 0.0;
        bool nr = texelFetch(uLand, clamp(ip0 + ivec2(1, 0), ivec2(0), mx), 0).r > 0.0;
        bool nu = texelFetch(uLand, clamp(ip0 + ivec2(0, -1), ivec2(0), mx), 0).r > 0.0;
        bool nd = texelFetch(uLand, clamp(ip0 + ivec2(0, 1), ivec2(0), mx), 0).r > 0.0;
        if ((!nl && !nr) || (!nu && !nd)) a = 1.0;
      }
    }
    if (a > 0.001) {
      // albedo from the palette: a smooth ramp by depth, or the scanned rock texture
      vec3 alb;
      if (uScanned > 0.5) {
        ivec2 ip = ivec2(clamp(q, vec2(0.0), uWorld - 1.0));
        float idx = texelFetch(uLand, ip, 0).r * 255.0;
        if (idx < 0.5) idx = max(max(texelFetch(uLand, ip + ivec2(1, 0), 0).r, texelFetch(uLand, ip - ivec2(1, 0), 0).r),
                                 max(texelFetch(uLand, ip + ivec2(0, 1), 0).r, texelFetch(uLand, ip - ivec2(0, 1), 0).r)) * 255.0;
        if (idx < 0.5) idx = 120.0;
        alb = palAt(idx);
      } else {
        float t = clamp((q.y - uLandTop) / max(1.0, uWorld.y - uLandTop), 0.0, 1.0);
        float n0 = fbm(vec2(q.x * 0.05, q.y / uAy * 0.05) + uSeed);
        alb = palAt(1.0 + clamp(t + (n0 - 0.5) * 0.08, 0.0, 1.0) * 254.0);
      }
      alb = srgb2lin(alb);
      // grain and strata
      float gr = fbm(vec2(q.x * 0.55, q.y / uAy * 0.55) + uSeed * 3.0);
      float strata = 0.5 + 0.5 * sin(q.y / uAy * 0.55 + fbm(vec2(q.x * 0.02, q.y * 0.01) + uSeed) * 9.0);
      alb *= 0.78 + 0.34 * gr;
      alb *= 0.92 + 0.1 * strata;
      // scorch marks
      alb *= 1.0 - texture(uScorch, uv).r * 0.8;
      // relief normal from the coarse coverage
      vec2 tx = vec2(texel.x * 1.5, 0.0), ty = vec2(0.0, texel.y * 1.5 * uAy);
      float dx = texture(uCov, uv + tx).g - texture(uCov, uv - tx).g;
      float dy = texture(uCov, uv + ty).g - texture(uCov, uv - ty).g;
      vec3 n = normalize(vec3(-dx * 2.4, dy * 2.4, 1.0));
      vec3 L = normalize(vec3(-0.45, 0.75, 0.55));
      float diff = clamp(dot(n, L), 0.0, 1.0);
      vec3 skyAmb = srgb2lin(gradient(0.2));
      vec3 horiz = srgb2lin(gradient(0.95));
      float ao = mix(1.0, 0.62, smoothstep(0.55, 1.0, cv.g));
      vec3 lit = alb * (vec3(0.30) + skyAmb * 0.35 + horiz * 0.55 * diff) * ao;
      // top surfaces catch the sky: a bright lip along every edge that faces up
      float above = texture(uCov, uv - vec2(0.0, texel.y * 2.2 * uAy)).r;
      float lip = (1.0 - smoothstep(0.25, 0.6, above)) * smoothstep(0.1, 0.6, n.y + 0.3);
      lit += (horiz * 0.35 + alb * 0.6) * lip * 0.55;
      // a thin dark outline where land meets air
      lit *= mix(0.55, 1.0, smoothstep(0.5, 0.72, cv.r));
      // dynamic lights (explosions, fire, lasers)
      for (int i = 0; i < 16; i++) {
        if (i >= uNL) break;
        vec2 d = vec2(uL[i].x - q.x, (uL[i].y - q.y) / uAy);
        float dist = length(d);
        float f = clamp(1.0 - dist / uL[i].z, 0.0, 1.0);
        f *= f;
        vec3 ld = normalize(vec3(d.x, -d.y, uL[i].z * 0.35));
        lit += srgb2lin(uLC[i]) * uL[i].w * f * (0.25 + 0.75 * clamp(dot(n, ld), 0.0, 1.0)) * (alb + 0.08);
      }
      lit += srgb2lin(uFlashCol) * uFlash * 0.35 * alb;
      vec3 land = lin2srgb(lit);
      // beyond the walls
      if (out_ > 0.0) land = mix(land, land * 0.5 + gradient(0.9) * 0.12, clamp(out_ / (uWorld.x * 0.05), 0.0, 1.0));
      col = mix(col, land, a);
    }
  }
  // dithering keeps smooth gradients free of bands
  col += (hash(gl_FragCoord.xy + fract(uTime) * 100.0) - 0.5) / 255.0;
  frag = vec4(col, 1.0);
}`;

/* ---------- js/fx.js ---------- */
'use strict';
/* =====================================================================
   Remastered battlefield: vector tanks, projectiles, explosions,
   particles, shields, lights, traces, damage numbers and the kill feed.
   Everything here only looks at the simulation (Battle, World); the
   particles are cosmetic and use Math.random freely.
   ===================================================================== */

const QUALITY = { HIGH: { gl: 1, parts: 1800, spawn: 1 }, MEDIUM: { gl: 0.75, parts: 1000, spawn: 0.65 }, LOW: { gl: 0.5, parts: 450, spawn: 0.35 } };
function quality() { return QUALITY[Cfg.quality] || QUALITY.HIGH; }
function c3(c) { return [cR(c), cG(c), cB(c)]; }
function rgba(a, al) { return 'rgba(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ',' + al + ')'; }
function mix3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function mul3(a, f) { return [a[0] * f, a[1] * f, a[2] * f]; }
const WHITE3 = [255, 255, 255];
const FIRE3 = [[255, 250, 220], [255, 220, 120], [255, 160, 50], [240, 90, 30], [170, 40, 20], [60, 20, 14]];
function fireAt(t) {       // 0 = white hot .. 1 = dark red
  const f = clamp(t, 0, 1) * (FIRE3.length - 1), i = Math.min(FIRE3.length - 2, Math.floor(f));
  return mix3(FIRE3[i], FIRE3[i + 1], f - i);
}

// text over the battlefield, sized to the playfield rather than the UI grid
function worldFont(k) { return clamp(Gfx.pf.h * 0.021, 10 * Gfx.dpr, 24 * Gfx.dpr) * (k || 1); }

const Fx = {
  parts: [], seen: new WeakSet(), st: new WeakMap(), lights: [], floaters: [], feed: [],
  tankInfo: new Map(), tanksRef: null, glowCache: new Map(),
  trace: { pts: [], canvas: null, ctx: null, drawn: 0, w: 0, h: 0 },

  /* ------------------------------------------------ particles */
  add(p) {
    const q = quality();
    if (this.parts.length >= q.parts) this.parts.splice(0, this.parts.length - q.parts + 1);
    p.age = 0; p.max = p.life;
    this.parts.push(p);
    return p;
  },
  n(count) { return Math.max(1, Math.round(count * quality().spawn)); },
  update(dt) {
    const g = World.W ? Phys.g() : 100;
    const wind = App.scene === BattleScene && World.W ? Phys.windAcc(Battle.wind) : 0;
    const out = [];
    for (const p of this.parts) {
      p.age += dt;
      if (p.age >= p.life) continue;
      const drag = p.drag || 0;
      p.vx += ((p.windy ? wind * p.windy : 0) - drag * p.vx) * dt;
      p.vy += ((p.grav || 0) * g - drag * p.vy) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.rot !== undefined) p.rot += (p.spin || 0) * dt;
      if (p.bounce && World.W && p.vy > 0 && World.isLand(p.x, p.y)) {
        p.y -= p.vy * dt; p.vy *= -0.35; p.vx *= 0.6;
        if (Math.abs(p.vy) < 8) { p.vy = 0; p.grav = 0; p.vx = 0; p.life = Math.min(p.life, p.age + 0.5); }
      }
      out.push(p);
    }
    this.parts = out;
    this.floaters = this.floaters.filter(f => (f.t += dt) < f.dur);
    this.feed = this.feed.filter(f => (f.t += dt) < 7);
  },

  // soft round glow, cached per color
  glow(col) {
    const key = ((col[0] >> 3) << 10) | ((col[1] >> 3) << 5) | (col[2] >> 3);
    let c = this.glowCache.get(key);
    if (!c) {
      c = document.createElement('canvas'); c.width = c.height = 64;
      const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, rgba(col, 1)); gr.addColorStop(0.25, rgba(col, 0.55)); gr.addColorStop(0.6, rgba(col, 0.14)); gr.addColorStop(1, rgba(col, 0));
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      if (this.glowCache.size > 300) this.glowCache.clear();
      this.glowCache.set(key, c);
    }
    return c;
  },
  // soft-edged puff for smoke and dust (normal blending)
  soft(col) {
    const key = 'S' + (((col[0] >> 3) << 10) | ((col[1] >> 3) << 5) | (col[2] >> 3));
    let c = this.glowCache.get(key);
    if (!c) {
      c = document.createElement('canvas'); c.width = c.height = 64;
      const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, rgba(col, 0.9)); gr.addColorStop(0.45, rgba(col, 0.6)); gr.addColorStop(0.8, rgba(col, 0.18)); gr.addColorStop(1, rgba(col, 0));
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);

      this.glowCache.set(key, c);
    }

  },
  drawGlow(ctx, x, y, r, col, a) {
    if (r < 0.5 || a <= 0.003) return;
    ctx.globalAlpha = Math.min(1, a);
    ctx.drawImage(this.glow(col), x - r, y - r, r * 2, r * 2);
  },
  drawParts(ctx, layer) {
    const sx = Gfx.sx;
    for (const p of this.parts) {
      if ((p.front ? 1 : 0) !== layer) continue;
      const t = p.age / p.life, X = Gfx.X(p.x), Y = Gfx.Y(p.y);
      switch (p.k) {
        case 'smoke': {
          const r = (p.size + p.grow * t) * sx * 1.35, a = (p.alpha || 0.35) * 1.3 * (t < 0.15 ? t / 0.15 : 1 - (t - 0.15) / 0.85);

          ctx.globalAlpha = Math.min(1, a);
          ctx.drawImage(this.soft(p.c), X - r, Y - r, r * 2, r * 2);
          break;
        }
        case 'debris': {
          const s = p.size * sx;
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = t > 0.8 ? (1 - t) / 0.2 : 1;
          ctx.fillStyle = rgba(p.c, 1);
          ctx.save(); ctx.translate(X, Y); ctx.rotate(p.rot || 0); ctx.fillRect(-s / 2, -s / 2, s, s * 0.75); ctx.restore();
          break;
        }
        case 'spark': {
          ctx.globalCompositeOperation = 'lighter';
          const a = 1 - t, len = p.len || 0.05;
          ctx.globalAlpha = a;
          ctx.strokeStyle = rgba(mix3(p.c, WHITE3, 0.4 * a), 1);
          ctx.lineWidth = Math.max(1, p.size * sx);
          ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(X - p.vx * len * sx, Y - p.vy * len * Gfx.sy); ctx.stroke();
          break;
        }
        case 'ember': case 'glow': {
          ctx.globalCompositeOperation = 'lighter';
          const r = (p.size + (p.grow || 0) * t) * sx;
          const a = (p.alpha || 1) * (p.k === 'glow' ? (1 - t) * (1 - t) : 1 - t);
          this.drawGlow(ctx, X, Y, r, p.c, a);
          break;
        }
        case 'ring': {
          ctx.globalCompositeOperation = 'lighter';
          const r = (p.size + p.grow * Math.sqrt(t)) * sx;
          ctx.globalAlpha = (p.alpha || 0.8) * (1 - t);
          ctx.strokeStyle = rgba(p.c, 1);
          ctx.lineWidth = Math.max(1, (p.width || 1.2) * sx * (1 - t * 0.7));
          ctx.beginPath(); ctx.arc(X, Y, r, 0, TAU); ctx.stroke();
          break;
        }
        case 'dot': {
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = t > 0.7 ? (1 - t) / 0.3 : 1;
          ctx.fillStyle = rgba(p.c, 1);
          ctx.beginPath(); ctx.arc(X, Y, Math.max(0.8, p.size * sx), 0, TAU); ctx.fill();
          break;
        }
      }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  },

  /* ------------------------------------------------ effect spawners (cosmetic) */
  burst(x, y, r, o) {
    o = o || {};
    const col = o.col || [255, 190, 90];
    for (let i = 0, n = this.n(o.sparks !== undefined ? o.sparks : 10 + r * 1.4); i < n; i++) {
      const a = rand(0, TAU), v = rand(0.4, 1.6) * (40 + r * 5);
      this.add({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * World.ay - rand(0, 40), life: rand(0.25, 0.7), size: rand(0.25, 0.5), c: mix3(col, WHITE3, rand(0, 0.5)), grav: 0.25, drag: 1.2, len: 0.035, front: 1 });
    }
    for (let i = 0, n = this.n(o.embers !== undefined ? o.embers : 4 + r * 0.5); i < n; i++) {
      const a = rand(0, TAU), v = rand(10, 30 + r * 2.2);
      this.add({ k: 'ember', x: x + rand(-r, r) * 0.3, y: y + rand(-r, r) * 0.3 * World.ay, vx: Math.cos(a) * v, vy: Math.sin(a) * v * World.ay - rand(10, 40), life: rand(0.6, 1.6), size: rand(0.6, 1.4), c: fireAt(rand(0.1, 0.5)), grav: 0.08, drag: 1.5, front: 1 });
    }
    if (o.smoke !== false) {
      for (let i = 0, n = this.n(3 + r * 0.35); i < n; i++) {
        const sc = rand(28, 52);
        this.add({ k: 'smoke', x: x + rand(-r, r) * 0.45, y: y + rand(-r, r) * 0.35 * World.ay, vx: rand(-6, 6), vy: -rand(8, 22) * World.ay, life: rand(1.6, 3.4), size: r * rand(0.25, 0.45), grow: r * rand(0.35, 0.8), c: o.smokeCol || [sc, sc * 0.95, sc * 0.9], alpha: o.smokeAlpha || 0.32, drag: 0.6, windy: 0.35 });
      }
    }
    if (o.ring !== false) this.add({ k: 'ring', x, y, vx: 0, vy: 0, life: 0.45 + r * 0.004, size: r * 0.4, grow: r * 1.35, c: o.ring || [255, 220, 170], alpha: 0.45, width: 0.9, front: 1 });
  },
  debris(x, y, r, col, n) {
    for (let i = 0, m = this.n(n); i < m; i++) {
      const a = rand(-Math.PI * 0.95, -Math.PI * 0.05), v = rand(20, 70 + r * 3);
      this.add({ k: 'debris', x: x + rand(-r, r) * 0.5, y: y + rand(-0.4, 0.3) * r * World.ay, vx: Math.cos(a) * v, vy: Math.sin(a) * v * World.ay, life: rand(0.8, 2.2), size: rand(0.5, 1.3), c: mix3(col, [0, 0, 0], rand(0, 0.35)), grav: 0.55, drag: 0.3, rot: rand(0, TAU), spin: rand(-12, 12), bounce: true, front: 1 });
    }
  },
  landColorAt(x, y) {
    const W = World.W, H = World.H;
    for (let d = 0; d < 6; d++) {
      for (const [dx, dy] of [[0, d], [d, 0], [-d, 0], [0, -d]]) {
        const xx = Math.floor(x + dx), yy = Math.floor(y + dy);
        if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
        const i = World.land[yy * W + xx];
        if (i) return c3(World.pal[i]);
      }
    }
    return c3(World.pal[Math.floor(World.pal.length * 0.3)] || rgb(120, 90, 60));
  },
  shock(amount) { Gfx.kick(amount); },

  /* ------------------------------------------------ entity hooks */
  state(e) { let s = this.st.get(e); if (!s) { s = {}; this.st.set(e, s); } return s; },
  onSpawn(e) {
    const q = quality();

      const r = e.r, type = e.type;
      const col = type === 'riot' ? [140, 200, 255] : type === 'dirt' ? [170, 120, 70] : type === 'funky' ? c3(e.o.color || rgb(255, 120, 255)) : [255, 190, 90];
      if (type === 'dirt') {
        this.burst(e.x, e.y, r * 0.6, { col, sparks: 0, embers: 0, smokeCol: [110, 80, 50], smokeAlpha: 0.3, ring: false });
        this.debris(e.x, e.y, r * 0.7, this.landColorAt(e.x, e.y + 2), 10 + r * 0.6);
      } else if (type === 'riot') {
        this.burst(e.x, e.y, r, { col, embers: 0, smoke: false, ring: [150, 210, 255] });
      } else {
        this.burst(e.x, e.y, r, { col, ring: type === 'nuke' ? [255, 240, 200] : [255, 220, 170] });
        if (type === 'nuke' && !e.o.small) {
          for (let i = 0, n = this.n(10 + r * 0.25); i < n; i++) {
            this.add({ k: 'smoke', x: e.x + rand(-r, r) * 0.25, y: e.y - rand(0, r) * World.ay, vx: rand(-4, 4), vy: -rand(18, 40) * World.ay, life: rand(3, 5.5), size: r * rand(0.18, 0.3), grow: r * rand(0.35, 0.7), c: [70, 55, 60], alpha: 0.3, drag: 0.35, windy: 0.3 });
          }
